put('stl-unordered-family',
 '如果只关心某个值是否出现、出现几次、同一个键对应哪些记录，而不需要排序边界，可以选择无序关联容器家族。名称中的set/map区分是否带映射值，multi区分是否允许重复。本节用同样的输入建立三种结构，观察不同键数、重复次数和同键记录数，避免只凭unordered前缀就把它们当成一种容器。',
 [['unordered_set','元素本身就是键，等价键只保留一份，适合判断是否出现过。'],['unordered_multiset','元素本身是键，但保留每次重复出现，适合保留重复的集合。'],['unordered_multimap','每个元素是一对键值，允许多个相同键对应不同值；没有唯一的operator[]访问。'],['哈希一致性','自定义相等关系认为两个键相等时，哈希值也必须相同。否则容器可能把本应相同的键分到不同查找路径。']],
 [['先决定需要保存什么信息','输入4、4、9。如果只问出现过哪些数，unordered_set保留4和9两种键，size为2；如果还要保留4重复出现两次，unordered_multiset有三个元素，count(4)为2。这不是某种容器更“正确”，而是两种需求保留的信息量不同。'],['键值结构用于附带更多数据','建立unordered_multimap，把(4,\"x\")和(4,\"y\")都放入。两条记录的键相同但值不同，需要同时保留，因此map的唯一键规则不合适。count(4)得到2，表明存在两条记录，而不是把x与y的字符串长度相加。要读取两个值，应遍历equal_range得到的范围。'],['不要把桶位置解释成排序位置','无序容器按哈希组织，遍历可能先看到9也可能先看到4，程序不能依赖某种偶然次序。因此本节输出的是确定的计数2、2、2，而不是断言遍历顺序。它们也不提供有序容器那样的lower_bound成员；如果需求是第一个不小于5的键，应考虑set/map或有序序列。'],['区分计数表示与逐项存储','Python Counter用键到次数表示重复出现，defaultdict(list)把同键值收集到列表；它们表达同一任务，但存储模型不同。Counter的len统计不同键数，不能用来代替multiset的总元素数；需要sum(counter.values())。掌握这些差异能避免跨语言照抄接口后得到错误结果。']],
 [['unordered_set<int> a','等价键唯一，输入中的重复4被合并。'],['b.count(4)','在unordered_multiset里返回重复出现次数，而不是0或1限定值。'],['c.count(4)','统计unordered_multimap中键4对应的记录数量，不检查映射值是否相同。']],
 [['要求遍历时由小到大，应直接选unordered_set吗？','不应依赖其遍历顺序。可使用set，或把元素复制到vector再排序。'],['Counter([4,4,9])的len为什么不是3？','Counter把重复出现压缩成次数，只有两个不同键。要得到总出现次数应对values求和。']],
 [['insert / emplace','按家族规则插入','set传键，map家族传键值对。','唯一键版本返回位置与成功标志；multi版本返回位置。','std::unordered_multimap<int,std::string> m;\nm.emplace(4,"x");\nm.emplace(4,"y");','需要对应<unordered_map>/<unordered_set>及<string>。','from collections import defaultdict\nm=defaultdict(list)\nm[4].extend(["x","y"])'],
 ['find / count','精确查询或计数','键值。','位置/end或出现次数。','std::unordered_multiset<int> s{4,4,9};\nauto n=s.count(4);','count在multi版本可以大于1；哈希操作最坏可线性。','from collections import Counter\nCounter([4,4,9])[4]'],
 ['equal_range(key)','枚举全部同键项','键值。','等价项半开区间。','std::unordered_multimap<int,char> m{{4,\'x\'},{4,\'y\'}};\nauto [a,b]=m.equal_range(4);\nfor(auto it=a;it!=b;++it) std::cout << it->second;','不能假定不同键整体按大小排序。','m={4:["x","y"]}\nfor value in m.get(4,[]): print(value)'],
 ['erase(key) / erase(it)','删全部同键项或仅一项','键或有效元素迭代器。','删除数或后继迭代器。','std::unordered_multiset<int> s{4,4,9};\nauto it=s.find(4);\nif(it!=s.end()) s.erase(it);','erase(4)会删所有4，erase(it)只删一个。','s=[4,4,9]\ns.remove(4) # 删除一次出现'],
 ['reserve / rehash / load_factor','规划与观察哈希桶','reserve是预计元素数，rehash是桶数要求。','void或浮点负载。','std::unordered_set<int> s;\ns.reserve(100);\nauto load=s.load_factor();','重新散列会使迭代器失效，但不会自动增加元素。','Python内置哈希容器无相同公开容量接口。'],
 ['size / empty / clear','计数、判空与清空','无参数。','数量/bool/void。','std::unordered_multiset<int> s{4,4,9};\nauto n=s.size(); // 3\ns.clear();','multi版本size包含重复次数。','from collections import Counter\ns=Counter([4,4,9])\nsum(s.values())\ns.clear()']],['unordered-map','stl-multi-associative']);
put('stl-node-handle',
 'set和map的键不能原地修改，因为键决定元素在结构中的位置。C++17提供节点句柄：先把节点从容器取出，脱离排序或哈希结构后修改键，再插回去。它也允许在相容容器间转移节点。本节把键2改成20，再合并另一张表，重点观察重复键为什么留在来源表里，而不是悄悄覆盖目标值。',
 [['节点句柄','extract返回的对象拥有被取出的节点；它不是普通迭代器。节点暂时不属于任何容器，句柄负责其资源生命周期。'],['extract','从容器取出节点。成功后原容器size减少，节点中的键和值仍由句柄保存。'],['键冲突','目标map已经有键1时，再合并另一条键1不会覆盖原值；唯一键规则仍然生效。']],
 [['先看清两张表的初始记录','目标a包含1:A和2:B，来源b包含1:X和3:C。a中键1的值A与b中键1的值X不同，但map是否冲突取决于键，不取决于映射值。理解这一点后就能预测merge不会同时保留a中两个键1，更不会因为值不同就自动认为它们是两种键。'],['取出2之后再修改成20','a.extract(2)成功后a只剩1:A，句柄里仍保存2:B。先检查句柄非空，再通过key()把2改成20，然后将句柄移动交给a.insert。插入后a中是1:A和20:B。这个顺序的必要性在于：只有节点脱离容器时才能安全修改键，不能对仍在map中的键直接赋值。'],['合并时只转移能接受的节点','执行a.merge(b)时，键3在a中不存在，所以3:C转移过去；键1已存在，1:X留在b。合并之后a按键遍历为1:A、3:C、20:B，b的大小为1。merge不是“用b更新a”，也不是无条件复制所有记录；需要覆盖值时应明确使用赋值或insert_or_assign。'],['把失败路径和所有权一起考虑','如果把取出的键改为一个已存在的键，insert可能失败。应检查返回的insert_return_type，它包含成功标志与未插入的节点，避免忽略数据去向。节点转移还要求分配器相容等前提。Python例子用pop、赋值和删除模拟记录移动，不承诺实现C++的节点零拷贝资源转移。']],
 [['a.extract(2)','把键2对应节点取出；查不到时返回空句柄，不能直接访问key。'],['node.key() = 20','只有非空句柄才能访问；这里改的是暂时脱离容器的键。'],['a.merge(b)','只转移a能接受的节点；冲突的键1仍在b中。']],
 [['merge后b为什么不是空表？','键1与a现有记录冲突，不能进入唯一键map，因此保留在b，size为1。'],['extract不存在的键后能立即调用key()吗？','不可以，必须先检查句柄非空。空句柄没有可供修改的元素。']],
 [['extract(key) / extract(it)','取出节点（C++17）','键或有效元素迭代器。','node_type句柄，按键查不到则为空。','std::map<int,char> m{{2,\'B\'}};\nauto node=m.extract(2);','按迭代器版本不能传end；原指向被取出元素的迭代器失效。','m={2:"B"}\nvalue=m.pop(2,None) # 不是节点句柄'],
 ['empty() / operator bool','确认句柄是否持有节点','无参数。','bool。','std::map<int,char> m;\nauto node=m.extract(7);\nif(!node.empty()) std::cout << node.key();','访问key/mapped之前先检查。','用成员判断或自定义哨兵区分缺失。'],
 ['key() / mapped()','读取或修改map句柄的键和值','无参数。','可修改引用。','std::map<int,char> m{{2,\'B\'}};\nauto node=m.extract(2);\nnode.key()=20; node.mapped()=\'C\';','仅适用于非空map节点；set节点用value()。','m={2:"B"}\nm[20]=m.pop(2)'],
 ['insert(std::move(node))','重新插入独占节点句柄','非空或空句柄；必须转移所有权。','唯一键容器返回含position、inserted、node的结果。','std::map<int,char> m{{2,\'B\'}};\nauto node=m.extract(2);\nnode.key()=20;\nauto r=m.insert(std::move(node));','需<utility>；冲突时检查返回结果中的node。','普通dict赋值不是节点所有权转移。'],
 ['merge(source)','从相容来源转移可接受的节点','来源关联容器。','void。','std::map<int,char> a{{1,\'A\'}},b{{1,\'X\'},{3,\'C\'}};\na.merge(b); // b保留1:X','不覆盖冲突键；分配器须相容。','a,b={1:"A"},{1:"X",3:"C"}\nfor k in list(b):\n    if k not in a: a[k]=b.pop(k)']],['stl-map','set']);
put('priority-queue',
 '需要反复取出当前最大或最小的任务时，不必每次把全部数据重新排序。priority_queue维护一个堆，让最高优先级元素随时位于top。本节要求从5、1、9、3、7中找到第2大值，会使用一个只保留两个候选的小根堆。先理解默认大根堆与小根堆的区别，再理解为什么求第k大反而常用小根堆。',
 [['堆顶','top能看到当前优先级最高的元素。默认整数priority_queue把最大值放在顶部；不是让遍历中的所有元素都排好序。'],['小根堆','使用greater<int>比较器后，最小值在顶部。Python heapq通常也是小根堆。'],['候选集合','为了找第k大，只需保留目前见过的最大的k个数；其中最小的那个就是当前第k大候选。']],
 [['先定义k与合法输入','本节k=2，数据有5个，所以需求有意义。若k=0或大于数据长度，根本不存在这种排名，必须先拒绝。重复数值按出现次数参与排名，例如[9,9,7]的第2大是9，而不是去重后的7。这里求的是排序位置，不是不同数值种类的第2大。'],['为什么选择小根堆保留大数','堆里最多放k个候选，当新数进入导致数量超过k时，要移除候选里最小的数。小根堆恰好把最小候选放在top，pop就能删掉它。若误用默认大根堆，则会把最大的候选淘汰，方向恰好反了。因此堆顶方向由“需要淘汰什么”决定，而不只是由题目里出现“大”字决定。'],['跟着五个数手算候选变化','读5得到{5}，读1得到{1,5}；读9暂时三个数，删最小1，留下{5,9}；读3后删3，仍为{5,9}；读7后删5，留下{7,9}。大括号这里只表示候选值，不代表底层数组的排列顺序。最终top是候选中最小的7，也就是全部输入第2大的数。'],['读取和弹出是两个不同动作','top返回堆顶的只读引用，不删除；pop删除堆顶但返回void。若要取出并使用某个值，先保存top，再pop，并确保堆非空。priority_queue没有begin/end供你像vector一样遍历，也不能修改top后期待结构自动修复；需要更新任务优先级时要设计额外策略。']],
 [['greater<int>','需<functional>，使此适配器使用小根堆；默认less产生大根堆。'],['if (heap.size() > k) heap.pop()','每轮只在候选超额时淘汰一个最小值，从而始终保留当前最大的k个数。'],['heap.top()','处理全部输入后返回当前候选最小值；这个值就是第k大，而不是最大值。']],
 [['为什么求第2大要删除最小候选？','因为只需要保存最大的两项；每次删掉超出的最小值，就不会淘汰有希望进入前两名的大数。'],['top后不pop，再调用top会怎样？','如果中间没有其他修改，会得到同一个元素。读取操作不代表取走元素。']],
 [['priority_queue<T>','创建默认大根堆','T为元素类型。','适配器对象。','std::priority_queue<int> q; // 需<queue>','默认最大值在top，不是最小值。','import heapq\nq=[] # 默认小根堆；模拟大根堆可存负数'],
 ['priority_queue<T,vector<T>,greater<T>>','创建小根堆','元素类型、底层容器、比较器。','适配器对象。','std::priority_queue<int,std::vector<int>,std::greater<int>> q;','需<queue>、<vector>、<functional>。','import heapq\nq=[]'],
 ['push(x) / emplace(args...)','插入并维护堆性质','值或元素构造参数。','void。','std::priority_queue<int> q;\nq.push(3); q.push(8);','通常O(log n)；emplace不是任意位置插入。','heapq.heappush(q,3)\nheapq.heappush(q,8)'],
 ['top()','只读查看堆顶','无参数。','const_reference。','std::priority_queue<int> q;\nq.push(3); q.push(8);\nstd::cout << q.top(); // 8','必须非空；不能通过top直接修改排序值。','q[0] # 小根堆最小值'],
 ['pop()','删除当前堆顶','无参数。','void。','std::priority_queue<int> q;\nq.push(8);\nint value=q.top(); q.pop();','不能在空堆弹出；通常O(log n)。','value=heapq.heappop(q)'],
 ['size() / empty()','查看候选数量和空状态','无参数。','数量或bool。','std::priority_queue<int> q;\nif(!q.empty()) std::cout << q.top();','size包括重复元素。','len(q),not q'],
 ['swap(other)','交换两个堆','相容适配器。','void。','std::priority_queue<int> a,b;\na.push(1); b.push(9); a.swap(b);','没有clear成员；可通过与空适配器交换清空。','a,b=b,a']],['vector','set']);
put('stl-stack-queue',
 '同样把1、2、3放进一个结构，取出的顺序可以完全不同：撤销操作希望最近加入的先出来，排队办理业务希望最早加入的先出来。stack和queue就是把这两种规则包装成受限接口。它们不是让你任意访问所有下标的容器，本节通过完整弹出过程比较后进先出与先进先出。',
 [['适配器','在底层容器上只暴露特定操作的包装。限制接口能让调用者遵守栈或队列规则，而不随意在中间增删。'],['LIFO','Last In First Out，后进先出。最后压入3，第一次取出的就是3，常用于调用栈与撤销。'],['FIFO','First In First Out，先进先出。最先加入1，第一次取出的就是1，常用于任务排队和BFS。']],
 [['先按相同顺序加入三项','对栈和队列都依次push(1)、push(2)、push(3)。两者的size都是3，但“下一项是谁”不同。栈只让你看top，当前为3；队列让你看front和back，当前分别为1和3。不要把相同的push函数名误解为相同的取出规则，规则由适配器类型决定。'],['栈每次只处理最近加入的项','读取top得到3，pop后剩下1、2，新的top是2，再弹出后top是1。最终输出3 2 1，正好与加入顺序相反。top只是读取，只有pop才移除；因此循环必须同时包含读取和删除，否则while(!empty())可能一直重复输出同一个值。'],['队列每次处理等待最久的项','读取front得到1，pop后剩下2、3；接着读取2并移除，最后读取3。输出1 2 3与加入顺序一致。虽然queue也有back读取尾部，它的pop仍然删头部，不能因为刚刚读取back就以为pop会删除尾部。接口名与规则要一起记。'],['把空状态与返回值纳入流程','标准写法是先判断!empty，再读top或front，然后pop。C++的两种pop都返回void；Python列表pop与deque.popleft会直接返回被删除项。queue和stack都没有通用迭代器，不应该写begin/end遍历；如果必须保留原结构，可以复制适配器后逐项弹出副本。']],
 [['while (!s.empty())','每轮先确保栈中还有元素，之后才能读取top。'],['s.top(); s.pop();','先取得最后加入的值再删除。若要在pop后继续使用该值，应先复制，不要保留悬空引用。'],['q.front(); q.pop();','读取与删除的都是队头，符合先进先出。']],
 [['queue先back读取3再pop，会删除3吗？','不会。back只读队尾，queue.pop始终删队头，初始[1,2,3]会删除1。'],['为什么不能直接遍历stack.begin()？','适配器没有公开begin/end。需要遍历顺序内容时可选其他容器，或复制栈后弹出副本。']],
 [['stack<T> / queue<T>','创建空栈或队列','T为元素类型。','适配器对象。','std::stack<int> s; // <stack>\nstd::queue<int> q; // <queue>','默认底层通常为deque，但适配器不暴露所有deque操作。','from collections import deque\ns=[]\nq=deque()'],
 ['push(x) / emplace(args...)','在规则允许的一端新增','值或元素构造参数。','push为void；C++17 emplace可返回元素引用。','std::stack<int> s;\ns.push(1); s.push(2);\nstd::queue<int> q;\nq.push(1); q.push(2);','栈加入到栈顶，队列加入到队尾。','s.append(1)\nq.append(1)'],
 ['stack::top()','读取栈顶','无参数。','元素引用。','std::stack<int> s;\ns.push(1); s.push(2);\nstd::cout << s.top(); // 2','必须非空，读取不删除。','s[-1]'],
 ['queue::front() / back()','读取队头/队尾','无参数。','元素引用。','std::queue<int> q;\nq.push(1); q.push(2);\nstd::cout << q.front() << q.back();','必须非空；pop只删除front。','q[0],q[-1]'],
 ['pop()','删除栈顶或队头','无参数。','void。','std::stack<int> s;\ns.push(1);\nint value=s.top(); s.pop();','没有返回值，先读再删。','s.pop() # 返回栈顶\nq.popleft() # 返回队头'],
 ['size() / empty()','计数与判空','无参数。','数量/bool。','std::queue<int> q;\nwhile(!q.empty()) { q.pop(); }','空容器读写两端违反前置条件。','len(q),not q'],
 ['swap(other)','交换内容','相容适配器。','void。','std::stack<int> s,blank;\ns.push(1); s.swap(blank);','适配器没有clear成员，可交换或循环弹出。','s=[] # 重新绑定，非同一对象清空']],['stl-deque']);
put('stl-iterator-categories',
 '标准算法之所以能处理多种容器，是因为它们通过迭代器访问数据。先把迭代器看成“当前位置”，再学习移动与解引用，不要一上来就把它等同于整数下标。不同容器的当前位置能做的事情不同：链表只能逐步走，vector还能直接跳转。本节在同一组四个数字上比较next、advance和distance。',
 [['解引用*it','读取迭代器指向的元素。迭代器本身是位置，*it才是该位置的值；end不指向可读元素。'],['半开区间[first,last)','包含first指向的元素，不包含last。空范围用first==last表达，长度无需额外的特殊哨兵值。'],['迭代器类别','输入/输出用于读取/写入；前向可多遍扫描；双向可前后走；随机访问可直接按距离跳转。连续迭代器还提供存储连续性保证。'],['移动与计算距离','next返回移动后的新位置；advance修改传入位置；distance计算从起点走到终点的距离。它们的成本取决于迭代器能力。']],
 [['先确定四个值的位置','序列是10、20、30、40。begin指向10，前进一次指向20，再前进一次指向30。end在40之后，不是40本身；把begin到end理解为四个可访问位置就能解释为什么distance为4。空序列中begin与end相等，不需要假装存在一个值为0的第一个元素。'],['next建立新位置但不改变原位置','调用next(a.begin(),2)取得第三个元素的位置，解引用得到30。参数2表示从当前位置向前走两步，不是“读取值2”。如果把begin保存到变量it，再调用next(it,2)，it本身仍然指向10。这个性质适合在不影响当前循环位置时临时查看后面的元素。'],['advance原地移动位置变量','把链表迭代器it初始化为begin，然后advance(it,2)，it本身就改为指向30。链表需要经过20再到30，因此走k步需要O(k)；vector随机访问迭代器可以用常数时间偏移。通用接口写法相似，但不能仅看函数名字就断言所有容器成本相同。'],['算法要求与范围合法性都要满足','std::sort要求随机访问迭代器，list不能直接使用这个版本。任何移动都必须留在允许范围内，不能从begin向前退到不存在的位置，也不能越过end后继续走。distance的两个位置必须属于兼容范围；把两个不同容器的begin拼在一起，不会自动得到有意义的距离。']],
 [['next(a.begin(),2)','需<iterator>；返回新迭代器，可解引用得到30，原位置不变。'],['advance(it,2)','直接修改it；对于链表可能逐步递增，不能假定常数时间。'],['distance(begin,end)','计算范围长度；对于非随机访问迭代器可能遍历整个范围。']],
 [['next(it,2)后it一定移动两格吗？','不会。next返回移动后的副本，需要接收返回值；advance(it,2)才直接改变it。'],['list迭代器能写it+2吗？','不能，它没有随机访问加法。可以用next(it,2)，但这通常需要逐步前进。']],
 [['begin / end / cbegin / cend','取得可读写或只读范围','容器对象。','迭代器。','std::vector<int> v{10,20};\nauto first=v.begin(),last=v.end();','const_iterator不能用来修改元素。','v=[10,20]\nit=iter(v)'],
 ['operator* / operator->','读取当前位置的值或成员','有效、可解引用位置。','值引用或成员访问结果。','std::vector<int> v{10};\nauto it=v.begin();\nstd::cout << *it;','先排除end，不把位置本身当成值。','it=iter([10])\nvalue=next(it) # Python还会推进'],
 ['std::next(it,n)','返回向前移动后的副本','it为起点，n默认1。','新迭代器。','std::vector<int> v{10,20,30};\nauto p=std::next(v.begin(),2);','移动范围须有效；不能假定所有类型都支持负n。','v=[10,20,30]\nv[2] # 表达同一位置'],
 ['std::prev(it,n)','返回向后移动后的副本','双向或更强迭代器，n默认1。','新迭代器。','std::list<int> l{10,20};\nauto p=std::prev(l.end()); // 20','空容器end不能向前退得到元素。','v=[10,20]\nv[-1]'],
 ['std::advance(it,n)','原地移动迭代器','it是可修改的迭代器变量，n为步数。','void。','std::list<int> l{10,20,30};\nauto it=l.begin();\nstd::advance(it,2);','链表移动线性；输入迭代器不能随意后退。','it=iter([10,20,30])\nnext(it); next(it)\nvalue=next(it)'],
 ['std::distance(first,last)','取得范围距离','有效同一范围的起终点。','有符号difference_type。','std::vector<int> v{10,20,30,40};\nauto n=std::distance(v.begin(),v.end());','非随机访问范围通常线性，单遍输入流需注意消费语义。','len([10,20,30,40])']],['vector','stl-linked-containers']);
put('stl-iterator-adapters',
 '算法不一定只从前向后读取，也不一定只写进已经存在的格子。迭代器适配器把“读取方向”或“写入动作”包装起来，供copy等算法使用。本节把[1,2,3]反向复制到空vector。要理解为什么这样不会越界，需要同时分清反向迭代器与后插入迭代器这两种不同职责。',
 [['反向迭代器','rbegin先指向最后一个元素，递增后向原序列前方移动。rend表示反向范围的结束，不能解引用。'],['输出迭代器','提供写入目的地，未必能读取。back_inserter的写入动作被解释为容器push_back。'],['算法与容器责任','copy负责逐个复制，普通目的迭代器要求目标已有空间；插入迭代器则在每次写入时负责扩展容器。']],
 [['先画出反向读取的顺序','原始vector为[1,2,3]，rbegin解引用为3，递增后是2，再递增为1，之后到rend。反向迭代器的++不是把原下标加1，而是按照其自身的遍历方向前进。原vector内容没有改变，反向遍历与调用reverse直接修改原序列是不同操作。'],['空目标没有可写入的普通位置','另一个vector b初始为空，b.begin等于b.end，并不存在可以写入3的第一个元素。直接copy到b.begin不会自动增长b，即使先reserve也没建立元素。可以先resize(3)再用普通迭代器，也可以选择本节的back_inserter，让每次输出都变成尾部追加。'],['把一次输出翻译成一次push_back','copy从反向范围先读3，写给back_inserter(b)，它执行相当于b.push_back(3)的动作；再读2并追加，得到[3,2]；最后追加1得到[3,2,1]。这样算法无需知道b当前大小如何变化，也不用手写每次扩容的过程，容器与适配器分工完成任务。'],['理解base位置与适配器限制','反向迭代器的base对应正向位置时位于当前反向元素之后，所以rbegin().base()==end()。不能直接把base解引用当成当前反向值。front_inserter需要目标支持push_front，因此不能用于vector；inserter则在指定插入位置工作。选适配器之前先检查底层容器是否有相应成员函数。']],
 [['copy(a.rbegin(),a.rend(),back_inserter(b))','<algorithm>负责copy，<iterator>负责back_inserter。反向读a，逐项追加到b。'],['a.rbegin()','读取最后元素，但不改变a的存储顺序。'],['back_inserter(b)','每次赋值转换成push_back，不要求b事先有足够size。']],
 [['只reserve(3)后copy到b.begin安全么？','不安全。reserve只预留存储，size仍为0，没有可写入元素。先resize，或使用back_inserter。'],['vector能用front_inserter吗？','不能，vector没有push_front成员。可使用支持头部插入的deque或list。']],
 [['rbegin() / rend()','反向遍历','无参数。','反向迭代器。','std::vector<int> a{1,2,3};\nfor(auto it=a.rbegin();it!=a.rend();++it) std::cout << *it;','rend不可解引用，不会改动原顺序。','for x in reversed([1,2,3]): print(x)'],
 ['std::back_inserter(c)','把输出写入转为尾部追加','支持push_back的容器c。','后插入迭代器。','std::vector<int> a{1,2},b;\nstd::copy(a.begin(),a.end(),std::back_inserter(b));','需<iterator>；不等同于b.begin。','b=[]\nb.extend([1,2])'],
 ['std::front_inserter(c)','把输出写入转为头部追加','支持push_front的容器。','前插入迭代器。','std::vector<int> a{1,2};\nstd::list<int> b;\nstd::copy(a.begin(),a.end(),std::front_inserter(b));','每项都从头部插入，最终b为[2,1]，顺序会反转。','from collections import deque\nb=deque()\nfor x in [1,2]: b.appendleft(x)'],
 ['std::inserter(c,pos)','在指定位置连续插入','容器及有效插入位置。','插入迭代器。','std::set<int> s;\nstd::vector<int> a{3,1,3};\nstd::copy(a.begin(),a.end(),std::inserter(s,s.end()));','最终顺序和重复规则仍由容器决定。','s=set()\ns.update([3,1,3])'],
 ['reverse_iterator::base()','得到对应正向基位置','无参数。','正向迭代器。','std::vector<int> a{1,2,3};\nauto base=a.rbegin().base(); // 等于a.end()','base位于当前反向元素之后，不可据此直接读取同一元素。','Python反向迭代器没有等价base接口。']],['stl-iterator-categories']);
put('stl-iterator-invalidation',
 '遍历容器时删除元素，最容易出现“跳过一项”或使用已经失效的位置。本节从[1,2,4,3,6]删除所有偶数，目的是学会安全的循环结构，而不只是记住一个erase调用。关键问题是：删除当前项以后，下一次应该从哪里继续？答案由erase返回的新迭代器提供，不能继续递增旧位置。',
 [['失效','某个原来可用的迭代器、引用或指针在修改后不再可用。它看起来仍保存某个地址，也不代表使用它是合法的。'],['后继','删除区域后面紧接着的元素。vector删除时后面的值前移，erase返回的新位置正是应该继续检查的位置。'],['单次递进','每一轮要么删除并接收后继，要么保留并递增。不能在删除分支之后又无条件递增一次。']],
 [['先处理第一个奇数并前进','迭代器从值1开始，1%2不为0，不应删除，执行++it来到2。此时容器仍为[1,2,4,3,6]。取模表达式x%2==0判断偶数，是删除条件而不是遍历条件。把“是否删除”和“是否还有元素”分开，循环的逻辑会清楚得多。'],['删除2后必须再次检查移来的4','erase(it)删除2，vector变成[1,4,3,6]，函数返回指向4的新迭代器。把返回值赋给it，下一轮就会检查4。如果删除后又++it，会越过4直接到3，从而漏删连续的偶数。使用it=erase(it)不是写法偏好，而是为了保留正确的下一个检查位置。'],['连续删除直到遇到要保留的元素','4也为偶数，删除后得到[1,3,6]，返回位置指向3。3不删除，才执行++it到6。6删除后容器为[1,3]，返回end。下一轮while条件发现it==end便退出，不能在这个位置再解引用。这个流程自然处理删除尾部与连续删除。'],['不要把一个容器的失效规则推广给全部容器','vector删除点及之后的旧迭代器会失效，扩容还可能使所有位置失效；list删除通常只使被删元素的位置失效；unordered容器重新散列会使迭代器失效。即便某次运行似乎没有崩溃，也不能作为旧位置仍合法的证据。先查具体操作的保证，再决定能否保留引用或迭代器。']],
 [['it = a.erase(it)','使用删除操作返回的新有效位置，不能再使用原来的失效迭代器。'],['else ++it','仅在保留当前元素时移动到下一项；删除分支已经完成了位置更新。'],['it != a.end()','每轮重新取得当前end，避免把修改之前的结束位置一直保存下来。']],
 [['[2,4]用erase后再++it会有什么问题？','删除2后4移到前面，再++可能直接越过4，甚至对结束位置进行非法移动。正确做法是接收erase返回值后立即进入下一轮判断。'],['reserve是否保证未来所有迭代器永远有效？','不保证。超过预留容量仍可能重新分配，中间插入或删除也有自己的失效规则，必须按具体操作判断。']],
 [['erase(it)','删除当前位置并返回后继','it必须指向元素。','新的有效后继迭代器。','std::vector<int> a{1,2,4,3};\nfor(auto it=a.begin();it!=a.end();) {\n    if(*it%2==0) it=a.erase(it);\n    else ++it;\n}','不能用it++后继续依赖已失效位置。','a=[1,2,4,3]\na[:]=[x for x in a if x%2!=0]'],
 ['erase(first,last)','删除整个半开范围','同容器内有效[first,last)。','范围之后的新位置。','std::vector<int> a{1,2,3,4};\nauto next=a.erase(a.begin()+1,a.begin()+3); // [1,4]','不包含last指向的4。','a=[1,2,3,4]\ndel a[1:3]'],
 ['reserve(n)','在批量追加前减少重新分配机会','预计容量n。','void。','std::vector<int> a;\na.reserve(100);\nfor(int i=0;i<100;++i) a.push_back(i);','reserve本身可能使旧位置失效；先预留再取得迭代器。','Python列表无对应公开接口。'],
 ['std::erase_if(container,pred)','按条件安全删除（C++20）','容器及删除谓词。','删除数量。','// C++20\nstd::vector<int> a{1,2,4,3};\nauto n=std::erase_if(a,[](int x){return x%2==0;});','C++17用erase-remove或显式循环；别忽略标准版本。','a=[1,2,4,3]\na[:]=[x for x in a if x%2!=0]']],['vector','stl-iterator-categories']);
put('stl-sorting',
 '排序不仅要问升序还是降序，还要问“相同关键字的记录是否保持原先顺序”“只需要前几项还是全体顺序”。本节按分数排列Ana、Bo、Cy，其中Ana和Cy同分，用stable_sort演示稳定性。先明确比较的字段，再学习sort、stable_sort、partial_sort和nth_element分别解决哪一种需求。',
 [['比较器','一个接收两个元素、返回bool的函数。返回true表示第一个应该排在第二个之前，而不是表示两个元素相等。'],['稳定排序','关键字相等的元素保持原先相对顺序。它不表示“输出永远相同”或“不会失败”，而是对同键记录顺序的具体保证。'],['部分排序与选择','partial_sort让前k项有序且是最小的k项；nth_element只保证第k位置及两侧分区关系，不保证两侧内部排序。']],
 [['列出记录与排序字段','初始记录为Ana:80、Bo:70、Cy:80。我们要按分数从低到高，而不是按姓名字典顺序。比较器应该读取分数字段并使用严格小于，不能把姓名也偷偷放进规则。如果目标改变为同分按姓名排序，则应明确加入第二关键字，而不是把它与稳定性混为一谈。'],['先确定不同分数之间的顺序','Bo的70小于80，所以Bo排在最前。Ana与Cy都是80，比较器既不认为Ana应在Cy前，也不认为Cy应在Ana前，它们在这个比较规则下等价。稳定排序会保留它们原来的相对位置，Ana原先在Cy之前，因此最终是Bo、Ana、Cy。'],['不要把普通sort的偶然结果当保证','std::sort可能在某次测试也得到Bo、Ana、Cy，但它没有保留同键相对顺序的保证。若业务依赖先来先后，例如同分保留报名顺序，应选择stable_sort或明确的第二排序键。比较器不能使用<=，因为相等元素上必须不返回true，否则破坏算法需要的严格弱序。'],['按需要决定是否全排序','只需要最小的前k项并按序输出时，可用partial_sort；只想知道第k小的值，可用nth_element。这里k若按人类习惯从1开始，位置是begin()+k-1。nth_element完成后不要直接把整个vector当成已排序结果。list不支持这些要求随机访问迭代器的通用排序接口，应使用其成员sort。']],
 [['stable_sort','保证等价关键字记录的原始相对顺序，示例中Ana在Cy之前。'],['return a.second < b.second','只按分数比较，严格小于而非小于等于。'],['sorted(a,key=lambda x:x[1])','Python内置排序是稳定的，key返回每条记录的分数。']],
 [['把比较器改成<=为什么有问题？','相同记录与自身比较也会返回true，违反严格排序关系要求，算法行为不能依赖。应使用<并按需要增加第二关键字。'],['nth_element之后能否直接输出前半段作为有序列表？','不能。它只建立分区和目标位置保证，区间内部可能乱序；若需要前k项有序，另排序该区间或使用partial_sort。']],
 [['std::sort(first,last,comp)','把整个范围排序','随机访问范围；comp可省略为默认小于。','void。','std::vector<int> a{3,1,2};\nstd::sort(a.begin(),a.end());','需<algorithm>；不保证稳定，通常O(n log n)比较。','a=[3,1,2]\na.sort() # Python稳定'],
 ['std::stable_sort(first,last,comp)','排序且保持同键相对顺序','随机访问范围与严格比较器。','void。','std::vector<std::pair<char,int>> a{{\'A\',80},{\'B\',70},{\'C\',80}};\nstd::stable_sort(a.begin(),a.end(),[](auto x,auto y){return x.second<y.second;});','可能使用额外内存；稳定性针对比较等价项。','a=[("A",80),("B",70),("C",80)]\na.sort(key=lambda x:x[1])'],
 ['std::partial_sort(first,middle,last)','把最小前k项排好','middle为前k项之后。','void。','std::vector<int> a{9,1,5,3};\nstd::partial_sort(a.begin(),a.begin()+2,a.end());','前两项为1、3，其余部分不保证有序。','import heapq\nsmall=heapq.nsmallest(2,[9,1,5,3])'],
 ['std::nth_element(first,nth,last)','把指定排名放到正确位置','nth为目标迭代器。','void。','std::vector<int> a{9,1,5,3};\nstd::nth_element(a.begin(),a.begin()+1,a.end());\nstd::cout << a[1]; // 第2小是3','其余部分不是完整排序。选择前检查排名范围。','a=[9,1,5,3]\nsorted(a)[1] # 此写法是全排序'],
 ['std::is_sorted(first,last)','判断是否已按规则排序','范围及可选比较器。','bool。','std::vector<int> a{1,2,2};\nbool ok=std::is_sorted(a.begin(),a.end());','默认升序允许相等邻项。','a=[1,2,2]\nall(a[i]<=a[i+1] for i in range(len(a)-1))'],
 ['std::is_sorted_until(first,last)','找到破坏有序性的第一处','范围及可选比较器。','第一个使范围不再有序的位置，全有序则end。','std::vector<int> a{1,4,3};\nauto it=std::is_sorted_until(a.begin(),a.end()); // 指向3','返回的是出问题的后一个元素，不是4的位置。','a=[1,4,3]\nnext((i for i in range(1,len(a)) if a[i]<a[i-1]),len(a))']],['vector','stl-iterator-categories']);
put('stl-partition',
 '有时你只想把满足条件的元素放到前面，并不需要整体升序。比如把偶数放前、奇数放后，用partition即可表达；如果还要保留各组内部原来的顺序，就用stable_partition。本节在[3,2,4,1]上分组，理解谓词、分界点和稳定性的含义，避免把“分组完成”误当成“已经排序”。',
 [['谓词','接受一个元素并返回true/false的函数。这里x%2==0在偶数上返回true，true组被放在前面。'],['分界点','返回指向第一个false组元素的迭代器。它之前全部满足条件，它及之后全部不满足条件。'],['稳定分组','stable_partition保留true组内部和false组内部原来的相对顺序；partition不保证这种组内顺序。']],
 [['逐项计算条件而不是比较大小','输入3、2、4、1分别得到false、true、true、false。这里判断的是是否偶数，不是数值是否较小；4虽然比3大，却仍应被放到true组。因此分组与排序是不同问题，不需要为了把偶数放前就先做一遍升序排序。'],['把两组按原有相对顺序写下来','true组依次收集2、4，false组依次收集3、1。stable_partition把它们拼成[2,4,3,1]。如果调用非稳定partition，2、4之间或3、1之间的顺序可能变化，但只要前组全为偶数、后组全为奇数，仍符合分组要求。不能给不稳定算法写死稳定的预期排列。'],['返回位置表达的是边界不是计数','此例返回的迭代器指向3，也就是下标2。用distance(begin,boundary)才得到前面有2个元素。若全部满足条件，边界等于end；若全部不满足，边界等于begin。无论哪种情况，都不能为了查看“边界值”而不加判断地解引用end。'],['使用分界点之前检查必要前提','partition_point是在已经按某个谓词分好组的范围中寻找边界，不会帮你分组，也不要求普通升序。必须保证前半true、后半false，且使用与分组一致的谓词。若把原始[3,2,4,1]直接交给它，前提不成立，不能期待有效结果。Python列表推导式分两组再拼接表达了稳定结果，但使用额外列表。']],
 [['stable_partition(..., [](int x){return x%2==0;})','Lambda为每个元素返回是否偶数，决定它属于前组还是后组。'],['distance(a.begin(),boundary)','把返回的边界位置转换成true组元素数量，此例为2。'],['left + right','Python把两次稳定筛选得到的列表拼接；它不是就地分组，也会额外分配存储。']],
 [['如果所有元素都为偶数，返回边界在哪里？','等于end，因为没有false组元素。前组数量为size，不能解引用这个边界。'],['分组后的[2,4,3,1]为什么不是排序结果？','分组只保证偶数在前、奇数在后，不保证组内或整体数值单调。排序与分组的目标不同。']],
 [['std::partition(first,last,pred)','把true项放前面','前向可修改范围与谓词。','第一个false项的位置。','std::vector<int> a{3,2,4,1};\nauto b=std::partition(a.begin(),a.end(),[](int x){return x%2==0;});','不保证组内顺序；需<algorithm>。','a=[3,2,4,1]\na=[x for x in a if x%2==0]+[x for x in a if x%2!=0] # 此Python写法稳定'],
 ['std::stable_partition(first,last,pred)','稳定地把true项放前','双向可修改范围与谓词。','分界迭代器。','std::vector<int> a{3,2,4,1};\nauto b=std::stable_partition(a.begin(),a.end(),[](int x){return x%2==0;});','结果[2,4,3,1]；可能需要辅助内存。','a=[3,2,4,1]\nleft=[x for x in a if x%2==0]\nright=[x for x in a if x%2!=0]\na=left+right'],
 ['std::is_partitioned(first,last,pred)','检查是否已经按条件分组','范围及相同谓词。','bool。','std::vector<int> a{2,4,3,1};\nbool ok=std::is_partitioned(a.begin(),a.end(),[](int x){return x%2==0;});','不是检查是否升序。','a=[2,4,3,1]\nflags=[x%2==0 for x in a]\nall(flags[i]>=flags[i+1] for i in range(len(flags)-1))'],
 ['std::partition_point(first,last,pred)','在已分组范围寻找边界','已满足分组前提的范围及谓词。','第一个false位置。','std::vector<int> a{2,4,3,1};\nauto b=std::partition_point(a.begin(),a.end(),[](int x){return x%2==0;});','不会进行分组；前提不成立时不可使用。','a=[2,4,3,1]\ni=next((i for i,x in enumerate(a) if x%2!=0),len(a))'],
 ['std::partition_copy(first,last,outTrue,outFalse,pred)','不修改原输入，分别输出两组','输入范围、两个有足够空间的输出或插入迭代器、谓词。','两个输出范围结束位置组成的pair。','std::vector<int> a{3,2,4,1},yes,no;\nstd::partition_copy(a.begin(),a.end(),std::back_inserter(yes),std::back_inserter(no),[](int x){return x%2==0;});','需<iterator>；输出目标不可无意与输入重叠。','a=[3,2,4,1]\nyes=[x for x in a if x%2==0]\nno=[x for x in a if x%2!=0]']],['stl-sorting','stl-iterator-categories']);
})();
</script><script>/* 原创初学者导读。逐课依据现有可运行示例展开；高级结构的演示边界明确保留。 */
(()=>{
const pairs=text=>text.trim().split('\n').map(line=>{const i=line.indexOf('｜');return [line.slice(0,i),line.slice(i+1)];});
function g(id,why,terms,steps,notes,checks,prerequisites=[]){BEGINNER_GUIDES[id]={why,terms:pairs(terms),steps:pairs(steps),notes:pairs(notes),checks:pairs(checks),prerequisites};}
g('ds-adt','同样是保存一批数据，为什么有时用栈、有时用队列？先把“允许哪些操作”与“内部怎么存”分开，才能比较不同实现。本节再用五个元素之间的成对比较，教你实际数出操作次数，而不是看见两层循环就背一个复杂度。',
`抽象数据类型｜先规定行为的接口，例如栈只要求后进先出；接口本身不指定数组还是链表。
输入规模 n｜衡量问题大小的量。本例n=5表示有五个位置，不表示循环已经执行五次。
渐近上界 O｜描述规模变大时增长速度的上界。O(n²)忽略常数，不等于运行n²秒。`,
`先写出要数什么｜例程的c只在最内层执行一次++c时增加。把i理解为正在考虑的位置，把j理解为它前面的某个位置，循环实际枚举“前一个位置、后一个位置”这样的配对。还没进入循环时没有枚举任何配对，所以c初始化为0才有清楚的含义。
逐轮列出次数｜i从0到4。当i=0时没有更早位置，内层执行0次；i=1时j只有0，执行1次；随后分别执行2、3、4次。把这些数相加得到0+1+2+3+4=10。这样做能看见内层长度不是固定5，而是跟着外层变化。
把手算推广成公式｜n个位置形成的不同配对数为n(n−1)/2：先数有顺序的n(n−1)对，再除去每一对被正反重复计算的两次。此公式和循环累计的c应相等，程序打印10 10正是让两条独立思路互相核对，而不是重复打印同一个变量。
最后才讨论增长速度｜当n翻倍，主导项n²/2大约增长到四倍，所以称二次增长。n和常数项在大规模时相对不重要。若换成内层每轮翻倍的循环，次数就需要重新数；复杂度来自操作如何增长，而不是代码视觉上嵌套了几层。`,
`j<i｜只枚举前面的下标，既避免自己与自己配对，也避免同时数(i,j)和(j,i)。
1LL*n*(n-1)/2｜1LL先把乘法提升到long long，防止先在int中算出溢出结果再转换。
range(i)｜Python生成0到i−1；i为0时范围为空，与C++内层循环的行为对应。`,
`如果n=1，循环和公式分别是什么？｜没有两个不同位置可配成一对，内层一次也不执行，c=0；公式1×0÷2也为0。
O(n²)与“恰好n²次”一样吗？｜不一样。本例精确次数为n(n−1)/2，增长上界可写O(n²)；上界没有承诺精确常数或秒数。`);
g('ds-dynamic-array','想保存用户不断输入的数字，事先不知道总数。如果每追加一个元素都重新申请刚好够用的空间，旧数据就会被反复搬家。本节自己实现一个很小的扩容模型，看见容量、元素数量和搬移次数如何分别变化，从而理解vector的尾部追加为什么通常很快。',
`size｜当前真正存了多少个元素，只有下标0到size−1能当作已有元素访问。
capacity｜已经准备好的存储位置数，空着的位置也占容量，但不等于已有数据。
均摊成本｜把一串操作的总成本分给每次操作；允许某一次很慢，不是说每次都一样快。`,
`从没有空间开始｜初始size=0、cap=0，因此第一次追加0时发现size==cap，必须扩容。模型把第一次容量定为1，随后将0写到下标0并把size加1。注意cap是分配策略控制的数，size则只在成功保存一个新元素之后变化。
容量用完才搬家｜追加1时原容量1已经用满，申请长度2的新数组，把原来的0复制过去，再写1。追加2时又扩到4，复制0和1。追加3时长度4的空间仍有空位，直接写入即可，没有必要仅因为来了一项就再次申请空间。
追踪九次追加｜容量依次走过1、2、4、8、16；发生搬移时的旧元素数分别是0、1、2、4、8，总计15。加入0到8后共有9个元素，因此程序输出9 16 15。最后7个空位置是为未来追加预留的，不应作为已有元素参加求和或遍历。
解释为什么均摊快｜复制次数是1+2+4+…这样的等比数列，总和与最终元素数处于同一数量级。再加上每个新元素本身的一次写入，n次追加总工作仍为O(n)，平均到每次为O(1)。这里翻倍只是教学策略，C++标准没有规定vector必须按两倍扩容。`,
`if(size==cap)｜只有已用位置占满容量才创建更大数组；这道判断决定哪些追加需要付出搬移成本。
make_unique<int[]>(nc)｜申请新数组并交给智能指针管理；它不会自动帮你复制旧元素，后面的循环才做复制。
a=move(b)｜把新数组的所有权交给a，旧数组随原所有权释放；Python的a=b则重新绑定列表引用。`,
`追加第10个元素时会复制多少旧元素？｜当前size=9、capacity=16，仍有空位，所以无需复制旧元素，只写入新位置并增大size。
每次容量只加1会怎样？｜n次追加可能复制0+1+…+(n−1)个旧元素，总成本变成O(n²)，失去本例的均摊常数保证。`,['ds-adt','vector']);
g('linked-list','数组靠下标找下一个元素，链表则让每个节点记住下一个节点的位置。想把1→2→3变成3→2→1，不必搬动数字，只要改变连接方向。本节把每条连接何时保存、何时修改讲清楚，避免第一次学指针时最常见的“改完就找不到后半段”。',
`节点 Node｜把一个数据值和一个next连接放在一起的小对象；节点在内存中不要求紧挨着。
头指针 head｜找到整条链的入口。head为空表示没有节点，不是一个值为0的普通节点。
nullptr / None｜表示没有下一个节点；沿next走到这里时，遍历应停止。`,
`先画出原链｜例程中a存1并连接b，b存2并连接c，c存3且next为空。reverse的head最初指向a，prev为空。可以把head看成尚未处理部分的入口，把prev看成已经反转部分的入口；最初后者没有任何节点，所以为空。
只处理第一个节点｜先把head->next保存到next，于是仍能找到b；再将a.next改为prev，也就是空。现在a已成为一条只有1的反向链。接着prev=head让prev指向a，head=next让head移到b。若先改a.next再读取后继，就会把原来通往b的路丢掉。
重复同样动作｜处理b时先保存c，再令b.next指向a，已完成部分变成2→1；处理c时保存空，再令c.next指向b，得到3→2→1。每轮都只改变当前节点的一条连接，其余已完成节点的连接保持不变，因此不需要额外数组保存所有值。
确定新入口与结束条件｜处理最后一个节点之后head为空，说明未处理部分已经耗尽。此时prev才是新头，必须返回prev而不是已经为空的head。调用处从返回值开始沿next输出，依次得到3 2 1。输入本来为空时循环不进入，返回空仍然正确。`,
`Node* next = head->next｜这里next是临时指针，用来保存旧后继；变量名与节点成员同名，但属于不同位置。
head->next = prev｜箭头访问指针所指对象的成员；此赋值真正改变链表连接，不是移动节点里的整数。
prev, head = head, nxt｜Python先求右侧旧值，再一起赋给左侧，等效于C++中按安全顺序更新两个游标。`,
`只有一个节点7时会变成什么？｜先保存空后继，把7.next仍设为空，prev指向7后结束。新链仍然只有7，没有特殊分支也能正确工作。
为什么额外空间为O(1)？｜无论链长多少，都只保留prev、head、next几个引用。节点原本就存在，并没有为反转再创建n个节点。`,['ds-adt']);
g('stack','判断([]){}是否正确嵌套，不能只比较左右括号数量。例如([)]数量相同却配错层次。栈恰好能保存“最后打开但还没关闭的括号”，因为最内层必须最先结束。本节用具体扫描过程理解后进先出，而不是先背栈的定义。',
`栈顶｜最后放入、下一次最先取出的元素。本例用动态数组尾部作为栈顶。
后进先出｜后打开的括号先等待关闭，像叠盘子时最后放上的盘子最先拿走。
匹配关系｜右括号必须与当前栈顶的左括号属于同一类型，不只是碰到任意左括号即可。`,
`开始时没有未闭合括号｜创建空stack，随后从左到右读字符串。遇到左括号就压到数组尾部。读完(后栈为[(]，再读[后栈为[(,[]，其中[位于栈顶。栈里保存的不是所有历史字符，而是仍然需要被匹配的左括号，这决定了它的实际含义。
让右括号只检查最内层｜读到]时，需要的左括号是[。当前栈顶正是[，所以删除它；读到)时栈顶是(，再次删除。这样内部括号完成以后，外部括号才有机会被关闭。若读到的是)，但栈顶仍是[，应该立即失败，不能跳过[去找更早的(。
理解两种提前失败｜右括号到来时栈为空，表示根本没有对应的左括号；栈非空但类型不同，表示嵌套顺序错误。C++用||把这两种情况连在一起，并先检查empty，依靠短路求值避免在空栈调用back。Python的not stack承担同样的保护。
扫描结束仍要检查｜处理完([])后栈为空；接着{入栈，}匹配并出栈，最后得到空栈，所以输出true。若输入只有((，扫描过程中没有碰到错误右括号，但还有两项未关闭，最终仍应返回false。本例忽略非括号字符，实际使用时应先决定是否接受它们。`,
`stack.push_back(c)｜把当前左括号记为最新待匹配项；Python相应操作是append。
left[i]｜right中右括号的下标与left中对应左括号的下标一致，例如]的下标1对应[。
return stack.empty()｜结束时检查有没有遗留任务；只确认过程中没出错还不足以宣布整体有效。`,
`([)]在什么时候被拒绝？｜前两个字符使栈顶为[，第三个字符)要求(，类型不一致，因此立即拒绝。
为什么不直接统计三种括号的数量？｜数量不知道先后层次；)(与()的数量一样，但前者第一个右括号没有可匹配对象。`,['vector']);
g('queue','服务台按到达顺序处理任务，这就是队列。若每删除第一个元素都把后面所有元素往前搬，处理大量请求会浪费时间。本节把固定数组首尾想象成一个环，用两个数字记录入口和数量，让被腾出的旧位置可以重新利用。',
`先进先出｜最早加入且尚未取出的元素最先离开；与栈的顺序相反。
head｜当前队首所在数组下标。它可以向后移动再绕回0，不必总是0。
count / size｜当前队列里有几个元素；本例用数量区分空和满，全部容量都可以使用。`,
`先分清逻辑顺序与物理位置｜容量为2的数组只有下标0、1。初始head=0、count=0，队列为空。push(10)写到(head+count)%2=0，再把count变为1；push(20)写到下标1，count变为2。此时逻辑顺序为10、20，数组也暂时按这个顺序排列。
删除不需要搬移｜第一次pop先读a[head]得到10，再令head=(head+1)%2=1，count减为1。数组下标0可能仍残留10，但它已经不属于有效队列；有效数据只由head与count界定。避免把“物理内存里还有旧数”误认为“队列还保存旧元素”。
让新元素绕回空位｜加入30时写入位置为(1+1)%2=0，正好复用先前腾出的槽位。数组看上去是[30,20]，但队首仍在下标1，逻辑顺序是20、30。下一次pop读20并把head绕回0，再下一次读30，最终输出10 20 30。
把边界写进接口｜count等于容量时push返回false，调用方知道没有加入成功；count为0时pop抛异常，防止读取无意义的槽位。容量0在构造时就被拒绝，否则后面的取模会除以0。每次操作只读写少量位置，因此时间为O(1)，不随队列长度增加。`,
`(head+count)%a.size()｜从队首向后数已有元素数量得到尾部空位，再取模绕回数组范围。
explicit Ring(size_t cap)｜构造函数准备固定容量；explicit避免把一个整数在意外位置自动当成Ring对象。
throw std::out_of_range("empty")｜空队列取值没有合法结果，用明确错误报告给调用者，而不是返回一个可能与真实数据混淆的数。`,
`容量2且已有两个元素，再push会覆盖旧值吗？｜不会。本例先检查count==容量并返回false，数组与逻辑队列都保持原状。
为什么只看head不能判断队列是否为空？｜同一个head既可能对应空队列，也可能对应非空甚至满队列。还需要数量或其他独立状态来区分。`,['vector']);
g('ds-doubly-circular','单链表知道下一项，却不直接知道上一项。想频繁删除指定节点、向前向后移动，可以给每个节点再加一个前驱连接。本节用数组下标代替真实指针，演示删除中间节点只需重连相邻关系，并用一个哨兵统一首尾边界。',
`前驱 pre｜pre[x]是x前面的节点编号，和nxt[x]表示的后继互相配合。
哨兵节点｜不存业务数据的固定节点。本例编号0只负责把链首和链尾接起来。
循环链表｜沿后继最终回到哨兵，没有以空指针结束的链尾；遍历要使用正确的停止条件。`,
`读懂初始连接表｜nxt=[1,2,3,0]表示0→1→2→3→0；pre=[3,0,1,2]表示反向连接。编号0是哨兵，业务节点是1、2、3。不要把数组中的值看成要输出的数据列表：每个数字实际上是另一节点的位置，顺序要沿连接追踪才知道。
找到要删除节点的邻居｜本例x=2，因此pre[2]=1，nxt[2]=3。想让节点2离开链，保留节点1和3并让它们直接互相连接。可以先在纸上画1↔2↔3，再划掉2；删除操作的任务是修复两侧箭头，而不是把数组里所有编号往前移动。
完成两个方向的重连｜先令nxt[pre[x]]=nxt[x]，也就是nxt[1]=3；再令pre[nxt[x]]=pre[x]，也就是pre[3]=1。只做第一步时正向遍历看似正确，但反向仍会经过2，因此两步都不能漏。模型没有释放节点2的存储，只把它从有效链中摘除。
验证结构是否还成立｜从nxt[0]开始走到1，再到3，随后回到0而停止，输出1 3。再打印pre[3]得到1，确认反向关系也已修好。若删的是第一个或最后一个业务节点，哨兵仍能充当邻居，所以同样的公式可以成立，但不能把哨兵本身当普通节点删除。`,
`nxt[pre[x]]｜先查x的前驱编号，再修改那个节点的后继；两层下标分别有不同含义。
for(int p=nxt[0];p!=0;p=nxt[p])｜从首个业务节点开始，在回到哨兵前输出，避免把0输出为数据。
pre[nxt[x]]=pre[x]｜修复右邻居的反向连接；删除节点后应保持相邻节点互为前驱和后继。`,
`若删除节点1，哨兵的后继应变成谁？｜节点1的后继是2，因此nxt[0]改为2，同时pre[2]改为0，首节点自然更新。
为什么不能用p不为空作为本例停止条件？｜这里是整数编号构成的环，不会产生空指针；业务遍历必须在重新遇到哨兵0时停止。`,['linked-list']);
g('ds-monotonic-stack','对每一天的温度，想知道右侧第一个更高温度，可以逐项向后查，但重复比较很多。本节把尚未找到答案的位置暂存起来；当一个新值足够大时，它一次解决一批等待者。例程输出下一个更大值本身，不输出距离。',
`单调栈｜按某种大小顺序保存候选项的栈；本例栈中位置对应的值从底到顶不递增。
下标｜元素所在位置。保存下标才能把求得答案写回原位置，即使多个值相同也能区分。
严格更大｜要求新值>旧值，相等不能算答案，因此本例比较使用<而不是<=。`,
`先给所有位置设置未知答案｜数组为[2,1,2,4,3]，ans初始全为−1，表示还没有找到右侧更大值。扫描到下标0的2，把位置0压栈；到下标1的1，1不能解决2的等待，只把位置1继续压栈。栈保存的是“仍待回答的位置”，不是已经完成的结果。
新值解决栈顶的等待｜扫描下标2的2时，栈顶位置1的值为1，比2小，因此ans[1]=2并弹出1。此时栈顶位置0的值也是2，相等不满足严格更大，所以停止弹出。随后把位置2压入。这个细节决定第一个2的答案不会错误地变成另一个2。
更大的值可连续解决多项｜扫描到4时，栈顶位置2的2先被解决，接着位置0的2也被解决，两项答案都为4。为什么4一定是它们右侧第一个更大值？因为此前扫描过的数如果足够大，早就会把这些位置弹出；它们能留到现在就说明还没有更早的有效答案。
结束后保留未解决项｜最后的3不能解决4，把位置4压入后扫描结束。4和3右边都没有更大值，因此对应答案保留−1，得到4 2 4 −1 −1。每个下标最多入栈一次、出栈一次，即使有嵌套while，总处理量仍为O(n)，这正是均摊分析的用处。`,
`a[s.back()]<a[i]｜用栈顶保存的下标回到原数组取值；直接比较s.back()会变成比较位置大小。
ans[s.back()]=a[i]｜答案写给等待者的位置，而不是写给当前新值的位置。
s.push_back(i)｜当前元素在帮助别人之后，也可能需要等待自己的更大值，所以仍要入栈。`,
`数组[2,2]的答案是什么？｜两项都为−1，因为相等不满足严格更大；若题目问大于等于，比较和结果都会改变。
while一次弹出很多元素会导致平方时间吗？｜不会，同一个元素弹出后不再重新入栈。把所有轮次的弹出次数合起来最多n次。`,['stack','ds-adt']);
g('ds-monotonic-queue','连续三天的最高温度、最近十秒的最大流量，都属于滑动窗口最大值。窗口每前进一步只新增一项、失效一项，没必要重新扫描全部数据。本节维护按值递减的候选位置，让窗口内最大值一直位于队首。',
`滑动窗口｜连续的一段下标范围，本例长度k=3，右端每轮向右移动一格。
候选淘汰｜一个较旧且不更大的元素被较新的大值压过后，未来也不再可能成为窗口最大值。
过期位置｜下标已经小于窗口左端的元素；值再大也不能参与当前窗口答案。`,
`建立第一个窗口｜输入[1,3,−1,−3,5,3,6,7]。读到1先保存位置0；读到3时，旧的1比3小且更早过期，所以把位置0从队尾淘汰，再存位置1。读到−1时保留3并追加位置2。首个完整窗口[1,3,−1]的最大值由队首位置1给出，为3。
先处理离开窗口的位置｜第i轮窗口左端为i−k+1，所以所有下标≤i−k的候选都已过期。本例i=3时位置0已经不在窗口内；候选队列里即使还有它，也必须从队首删除。使用下标而不是只保存值，才能判断同一个值究竟是哪一次出现、何时过期。
再删除被当前值压过的队尾｜读到5时，队尾的−3、−1和3都不大于5，于是依次删除。它们更旧、数值也不占优，在任何还包含它们的未来窗口中，较新的5都同样存在，因此保留它们没有意义。条件使用<=会保留较新的相等值，使相同最大值尽可能晚过期。
只对完整窗口输出｜i达到k−1以后才形成长度3的窗口，因此前两轮不输出。每轮整理完队列后读取a[q.front()]，最终得到3 3 5 5 6 7。队列并不保存窗口全部元素，而只保留有机会获胜的候选；每个位置进出各一次，总时间O(n)。`,
`q.front()<=i-k｜按下标移除过期候选，必须在取当前答案之前执行。
a[q.back()]<=a[i]｜从队尾移除被当前元素支配的候选；这和队首的过期删除解决不同问题。
if(i>=k-1)｜保证窗口已有k项；否则输出的是不足长度的前缀最大值，不符合题意。`,
`窗口长度为1时输出什么？｜每个窗口只有当前元素，旧位置会立即过期，因此输出应与输入逐项一致。
为什么可以删除一个尚未过期的小值？｜新值更大且位置更靠后，旧值未来仍在窗口时新值也在，旧值不会再成为最大值。`,['queue','ds-monotonic-stack']);
g('ds-hash-chain','按学号查学生时，不想每次从头比较所有记录。散列函数把键映射到一个桶，再只在那个桶里寻找。本节故意让1、6、11落入同一个桶，帮助你理解碰撞是正常现象，以及为什么“散列查找很快”不等于永远只比较一次。',
`键 key｜用于识别记录的值。本例直接使用整数本身，没有另外保存姓名等数据。
桶 bucket｜散列后的分组。本例有5个桶，下标0到4，每个桶里还可以放多个键。
碰撞｜不同键得到相同桶编号。例如1%5、6%5、11%5均为1，但三个键并不相等。`,
`先准备每个桶的容器｜b是长度5的数组，每项又是一份可增长的整数列表。初始五份列表都为空。C++的vector<vector<int>>可以读成“里面装着多个整数vector的外层vector”；Python用列表推导建立五个独立列表，避免多个桶意外指向同一个列表。
按散列结果插入｜把1放入b[1]，6的余数也是1，所以追加到同一桶；11同样如此。最终桶1包含[1,6,11]，其他桶为空。这里称链地址法，是因为碰撞项被组织在桶内的一个集合中；本教学实现用动态数组表示桶，不要求必须用指针链表。
查找仍需要比较真实键｜查找6先计算6%5=1，再在b[1]中寻找等于6的元素。find返回匹配位置的迭代器，若没有找到则返回桶尾end。程序输出桶1的长度3和是否找到6的布尔值1。只看到桶1非空就判定6存在，会把同桶的任何其他键也误判为存在。
理解速度的适用条件｜负载因子是元素数除以桶数，本例为3/5，但三个元素全部拥挤在一个桶里。因此平均负载小也不保证每个桶均匀。散列函数合适、桶数足够时通常查找很快；所有键碰撞时仍可能逐一比较n项，最坏时间退化为O(n)。`,
`b[x%5].push_back(x)｜先定位桶，再将真实键保存在桶内；散列值不能代替原键。
find(... )!=...end()｜通过是否到达尾后位置判断找到与否，不对end进行解引用。
[[] for _ in range(5)]｜每一轮创建新列表；[[]]*5会让五个位置共享同一个可变列表，不能正确表示独立桶。`,
`查找16时应返回存在吗？｜16也落在桶1，但桶里没有16，因此必须返回不存在，不能仅比较散列余数。
把桶数从5改为10一定无碰撞吗？｜不会，1和11仍可能同桶。扩容通常改善分布，但不能消除所有可能碰撞。`,['vector','ds-adt']);
g('ds-hash-open','散列表也可以把全部键直接放在一张固定表里，冲突时向后寻找空槽。问题是删除中间元素后，查找还能否继续走到后面的碰撞项？本节通过删除1后继续查找6，解释为什么开放寻址需要区分“从没使用过”和“曾经用过但已删除”。',
`线性探测｜散列位置被占用时，依次尝试下一个槽位，走到末尾后绕回开头。
空槽状态0｜此前没有插入经过这里继续向后放置的键，可作为一次失败查找的停止证据。
删除标记状态2｜这个槽位曾经有键，后来被删除；查找必须越过它，不能当作全新的空槽。`,
`还原碰撞后的存放过程｜表长5，键1首先占用槽1。键6的散列位置也是1，发现那里有人，于是向后放到槽2。数组key保存键，state保存槽位状态，这两份信息必须一起看；key里残留的整数不能单独说明该位置仍然有效。
删除时保留历史痕迹｜删除键1后，把state[1]从1改成2。即使key[1]仍然是1，查找也不会把它当成有效数据。保留删除标记的目的是告诉后续查询：这里以前发生过占用，某些碰撞项可能已经被放到更后面的槽位，不能在此停止。
逐步查找键6｜循环t=0时计算p=(6%5+0)%5=1，状态为2，继续；t=1时p=2，状态为1且key[2]=6，因此找到并退出。程序输出1。若删除时错误设置state[1]=0，查询会在第一步提前停止，从而报告6不存在，尽管它明明仍在槽2。
给探测过程设上限｜最多探测表长5次，保证表已满或者全是删除标记时也会终止。完整实现还要处理插入、重复键、扩容以及删除标记清理，本节只演示查找为什么不能被删除位置截断。随着表越来越拥挤，连续探测通常变长，不能把它当作永远常数步。`,
`if(state[p]==0)break｜真正空槽才允许断定后面不可能有本次查找链上的键。
state[p]==1&&key[p]==k｜只有有效占用状态下才比较并接受键，删除槽残值不算记录。
(k%5+t)%5｜t表示已经向后探测几格，外层取模确保跨过末尾时回到槽0。`,
`整张表都没有状态0时，查找会无限循环吗？｜不会，例程用t<5限制最多遍历一圈。这是正确终止条件的一部分。
删除标记能直接当作查找命中吗？｜不能。它只保留探测路径信息，原来的键已经逻辑删除，不再属于集合。`,['ds-hash-chain']);
g('ds-bloom','大量查询中，很多键根本不存在。若先用很小的位数组排除明显不存在的键，就能减少访问较慢数据库的次数。Bloom Filter只负责做这个前置筛选：它的“可能存在”还需要后续确认。本例故意构造误报，让你看到空间节省付出的代价。',
`位数组｜一组只记录0或1的位置，不直接保存原始键。
误报｜查询一个从未加入的键，却得到可能存在；不是返回了那个键的真实记录。
假阴性｜把已加入且未被错误删除的键判断为不存在；标准插入型Bloom过滤器应避免这种情况。`,
`先计算一个键留下的痕迹｜数组有8位，两个位置函数为x%8与(3*x+1)%8。加入1时得到位置1和4，于是这两位设为1，其余位仍为0。这里没有把整数1完整存进数组，只记录两个位置，因此不能从位数组恢复原集合。
查询已加入的键｜查询1也计算位置1和4，两个位置都为1，结果为可能存在。程序用all或循环中的逻辑与，要求所有对应位都已被设置。如果其中任何一个为0，就说明这个键插入时必定会设置的痕迹缺失，可以直接判定不存在。
观察误报如何出现｜查询9时，9%8也是1，(3*9+1)%8也是4。虽然从未加入9，它检查的两位已经被1设置，于是同样输出1。查询2对应位置2和7，存在0位，所以输出0。最终1 1 0里，第二个1不是实现错误，而是过滤器允许的误报。
把结果放回实际流程｜结果为0时可以跳过数据库；结果为1时继续访问真实集合确认。不能把过滤器当作完整字典，更不能直接把某个位清零来删除键，因为其他键也可能依赖这一位。位数、散列个数和元素数量共同影响误报率，本例小数组只用于看清机制。`,
`positions(x)｜同一键在插入和查询时必须使用同一组位置函数，否则会制造本不应出现的漏判。
b[p]=1｜多次设置同一位不会保存出现次数，位数组只记录是否曾有键使用这个位置。
yes=yes&&b[p]｜把每个位置的证据汇总；一项为0就足以否定，全部为1仍只是候选。`,
`过滤器说不存在时还需要查原集合吗？｜在正确插入、未错误删除且配置一致的前提下，可以直接排除；真实系统仍需保证更新同步。
为什么不能删除1时把位置1和4清零？｜其他已插入键可能共享这些位，清零会让它们被误判不存在，破坏过滤器保证。`,['ds-hash-chain']);
g('ds-lru','缓存容量有限，放入新内容时必须决定淘汰谁。LRU选择最久没有被使用的项，所以不仅写入会影响顺序，读取也会让对象变成最近使用。本节用容量2和三个键，跟踪键为何被留下或淘汰。',
`缓存命中｜要找的键仍在缓存中，可以直接返回保存的值。
最近使用顺序｜按最后一次访问时间排序，本例C++把最新放链首，Python把最新放末尾。
迭代器索引｜散列表保存键到链表节点的位置，使按键找到节点后不再遍历整条链。`,
`先把两种职责拆开｜链表q管理新旧顺序，散列表m负责按键快速定位。只用链表，查找某个键需要扫描；只用散列表，又不方便找最久未用者。二者一起保存同一批项目，因此插入或淘汰时必须同步更新，不能让散列表指向已经删除的节点。
追踪第一次读取｜先put(1,10)，再put(2,20)，此时键2最新、键1较旧。get(1)返回10，并把键1移动到最近使用端。读取也是一次使用，因此顺序变成键1最新、键2最旧；如果只返回值不调整顺序，就不再是LRU策略。
容量超限时淘汰｜put(3,30)先插入新项，缓存暂时有三个键。容量只有2，于是删除最旧的键2，并同时移除m中的键2索引。之后get(2)返回−1表示未命中，get(3)返回30；结合第一次读取结果，最终输出10 −1 30。
分清实现细节与策略｜C++使用splice移动已有节点，不重新复制整个缓存；Python OrderedDict用move_to_end维护同样的策略，但新旧方向相反。例程用−1表示不存在，只适合能够区分真实值的练习；实际接口可使用可选值或单独的命中标志，以免真实数据恰好也是−1。`,
`q.splice(q.begin(),q,m[k])｜把同一链表中的节点移到最前面，节点本身仍有效，散列表里的迭代器无需重新查找。
m.erase(q.back().first)｜删除链尾前先取出它的键，再同步删除索引，防止留下悬空位置。
popitem(last=False)｜Python删除最前面的最旧项；不要机械照搬C++链首最新的方向约定。`,
`若put(1,99)更新已有键，会新增第三个节点吗？｜不会，应修改原节点值并把它变为最新项，缓存键的数量保持不变。
访问顺序1、2、1后插入3，淘汰谁？｜淘汰2。最后一次对1的读取刷新了它的使用时间，不能只看最早插入时间。`,['ds-doubly-circular','unordered-map']);
g('tree','树适合表达有层次的关系，例如目录和表达式。二叉树规定每个节点最多有左右两个孩子，但没有自动保证数值大小顺序。本节用根2、左孩子1、右孩子3，逐次展开递归调用，理解中序遍历如何从局部规则覆盖整棵树。',
`根节点｜一棵树的入口，本例为保存2的节点；从它能沿孩子连接到其余节点。
子树｜把某个孩子当作新根后看到的完整部分，它本身也可以用同样规则遍历。
中序遍历｜先完整访问左子树，再访问当前节点，最后完整访问右子树。`,
`先读懂树的连接｜例程创建a保存1、c保存3、b保存2，再令b.left指向a、b.right指向c。a和c的左右孩子都为空。调用inorder(&b)时不是立即输出2，因为中序规则的第一步要求先处理左子树，这正是输出顺序与创建顺序不同的原因。
展开左侧递归｜处理b先调用inorder(a)。处理a又先访问它的空左孩子，发现为空立即返回；随后才输出1，再访问空右孩子并返回。此时a这一整棵子树已经处理完毕，程序回到先前暂停的b调用，而不是重新从整棵树的开头执行。
回到当前节点再转向右侧｜b的左子树结束后输出2，再调用inorder(c)。c用相同方式先处理空左侧、输出3、处理空右侧。因此最终输出1 2 3。每个递归调用只负责自己这一棵子树，通过返回把控制权交回父调用，不需要全局记录“现在走到哪里”。
理解边界和成本｜空节点分支是终止条件，否则会尝试访问不存在的孩子。每个实际节点访问一次，时间O(n)；递归栈深度取决于树高h，为O(h)。例子刚好是搜索树所以输出有序，一般二叉树的中序输出不保证递增；不要把遍历顺序误认为排序算法。`,
`if (!p) return｜C++先检查空指针，之后访问p->left等成员才安全。
yield from inorder(p.left)｜Python把左子树生成器产生的值逐个转交给外部，不是把整个生成器对象当作一个值。
std::cout << p->x｜这行位于左右递归之间，因此决定了中序；挪到前面或后面会形成不同遍历。`,
`把根值改成0，左右仍为1和3，会输出什么？｜仍按左、根、右输出1 0 3，说明遍历本身不会帮任意树排序。
为什么一条长链形的树可能递归很深？｜每次调用只能继续进入唯一孩子，尚未返回的调用数可达到节点数，栈空间最坏为O(n)。`,['linked-list']);
g('ds-bst','在普通二叉树里找一个数，可能必须检查所有节点。二叉搜索树为每个节点增加大小规则：左边全部更小，右边全部更大，于是一次比较就能排除一整侧。本例依次插入5、2、8、1、3，再比较查找成功和失败的路径。',
`搜索树不变量｜每个节点的整棵左子树都比它小，整棵右子树都比它大，不只是两个直接孩子。
节点编号｜本例用vector中的下标表示连接，−1表示没有孩子，避免先接触动态指针分配。
树高 h｜从根到最深节点的层数数量级；查找耗时取决于路径长度，而不直接取决于节点总数。`,
`从第一项建立入口｜初始root=−1，表示空树。插入5时新建编号0的节点并把root设为0。随后插入2，因2<5走左边，发现没有左孩子，就建立新节点并接上。插入8同理接到右边，因此比较方向真正决定了树的形状。
继续保持全局大小关系｜插入1时先与5比较走左，再与2比较仍走左；插入3先走到2，再因3>2转右。这个过程保证3既小于祖先5、又大于父节点2。不能只在最后找到一个空位置就随意插入，之前经过的每次比较都在维护祖先的范围约束。
分别追踪两次查询｜查找3从5走左到2，再走右到3，输出1。查找7从5走右到8，再走左，但8没有左孩子，于是编号变为−1，输出0。失败不是因为扫描完所有节点，而是因为符合大小约束的唯一路径已经走到空位置。
观察复杂度的前提｜若树形比较平衡，每次可以排除大量节点，高度约log n；若按1、2、3、4顺序插入，可能退化成只有右孩子的链，高度变成n。本例没有旋转或平衡机制，也忽略重复键，因此不能把这个插入函数直接称为保证对数时间的平衡树。`,
`if(x==t[p].k)return｜本例选择不保存重复键；若需要计数或多重集合，必须另行设计规则。
next=left?t[p].l:t[p].r｜条件表达式按比较结果选择一个孩子，另一侧整棵子树不必访问。
int z=t.size()｜新节点将追加到当前位置；先记录编号再push_back，避免依赖可能因扩容失效的引用。`,
`根5的左子树里能出现6吗？｜不能，即便6大于它的直接父节点，也违反左子树所有键都小于祖先5的范围约束。
为什么有序输入可能是坏输入？｜朴素插入每次都向同一侧走，树退化为链；平衡树需要额外调整才能避免这种情况。`,['tree']);
g('ds-avl','二叉搜索树太偏时会像链表一样慢。AVL树在保持大小顺序的同时，要求左右子树高度相差不超过1。本节只演示最容易画清楚的一次右旋：把30→20→10的左链改成以20为根的树，理解旋转为何不会破坏排序关系。',
`高度｜从当前节点到最深叶子的层数，本例空树高度0、单个节点高度1。
平衡因子｜左子树高度减右子树高度；AVL要求每个节点的绝对值不超过1。
右旋｜把当前根的左孩子提上来成为新根，旧根下降为它的右孩子。`,
`先计算哪里失衡｜节点10是叶子，高度1；20只有左孩子10，所以高度2；30只有左子树20，所以高度3。对30而言左高2、右高0，差值2超出允许范围。当前较重的方向是左孩子的左侧，因此这是一种可用单次右旋修复的形状。
给连接起名字再修改｜right函数把旧根叫y=30，把左孩子叫x=20。x原来的右子树必须先接到y的左侧，因为其中的值大于20却小于30，恰好适合这个位置。本例该子树为空，但代码仍执行y->l=x->r，让同一动作也能表达一般旋转的连接关系。
把中间节点提升为根｜设置x->r=y后，20成为新根，30成为它的右孩子，10仍在20左侧。中序顺序仍为10、20、30，因此搜索树大小规则保持不变。旋转没有改变节点的键，也不是把整棵树重新排序，而是局部重连少数几条边。
由下往上更新高度｜旧根30现在是较低节点，必须先fix(y)得到高度1；再fix(x)用新的两个孩子高度得到2。若先更新x，它会读到y的旧高度3而得到错误结果。例程输出20 10 30 2，分别验证新根、左右孩子和高度；完整AVL还需要其他旋转类型与插入回溯。`,
`return x?x->h:0｜条件表达式把空节点高度统一为0，使高度公式不必在每个分支重复判断。
fix(y);fix(x)｜更新顺序对应依赖关系：父节点高度依赖已经更新的孩子高度。
return x｜旋转后根改变了，调用方必须接收返回的新根，否则仍从旧根出发会漏掉一部分树。`,
`右旋后，原来20的右子树应放在哪里？｜放到30的左侧，其中所有键应位于20和30之间，因此两边大小约束都能成立。
例程能处理任意AVL插入吗？｜不能，它只实现并演示一次右旋。完整插入还要识别LL、LR、RR、RL情况并沿祖先更新高度。`,['ds-bst']);
g('ds-red-black','红黑树也是为了防止搜索树变得过长，但它用颜色规则间接限制高度，而不是要求左右高度几乎相同。本节暂不写复杂插入删除，只实现颜色与黑高检查，让你能对一棵小树说清楚“哪里不合法、为什么不合法”。',
`红节点与黑节点｜颜色是额外维护的信息，不表示键大或键小；搜索树的大小规则仍是另一项要求。
黑高｜从一个节点向下到空叶路径上的黑节点计数；本例把空叶计作1。
连续红色｜红节点不能有红孩子，否则违反红黑树颜色约束。`,
`先确认示例检查的范围｜结构N只保存red和左右孩子，没有键，所以本例只检查颜色与黑高，不检查二叉搜索树的排序关系。初始根为黑色，左右两个孩子都为红色。每个空孩子返回黑高1，提供所有路径共同的基础计数。
从叶子向上计算｜红色叶子不增加黑节点数量，因此左右孩子各返回1；黑色根把孩子返回值再加1，得到2。左右结果相同、没有连续红色，而且根为黑色，于是第一次检查输出1。递归返回值既传递高度信息，也为父节点提供判断依据。
只改变一个颜色看后果｜把左孩子改成黑色后，左侧路径比右侧多一个黑节点。左孩子返回2，右孩子仍返回1，根发现两边不相等便返回−1。第二次检查输出0。这说明“黑色越多越好”是错误想法，关键是各路径的黑节点数量一致。
理解规则如何限制高度｜任一路径不能连续出现两个红节点，所以红节点数受到黑节点数限制；各根到空叶路径黑高又相同，最长路径就不会比最短路径任意长。这里只用规则认识平衡原因，完整红黑树的插入、删除需要旋转与重新着色，不能从检查器直接推导为完整容器。`,
`if(!x)return 1｜把空叶当作黑色边界统一计数；也可以采用别的计数约定，但整套检查必须一致。
if(a<0||a!=b)return -1｜子树已经失败或左右黑高不同，都向上传递非法标记。
!root.red&&check(&root)>0｜根必须为黑色是单独检查项；仅比较子树黑高还不能覆盖全部颜色规则。`,
`左右孩子同时改成黑色会怎样？｜两边黑高同步增加，且没有红红相连，颜色与黑高检查仍可通过；树的排序还需另外确认。
检查通过就证明是一棵完整合法搜索树吗？｜不证明。本例没有键，无法验证左小右大，也没有实现插入删除或资源管理。`,['ds-bst','ds-avl']);
g('ds-btree','在磁盘上寻找数据时，读取一个页面往往比在页内比较几个整数昂贵。B树让一个节点保存多个有序键，并分出多条路径，从而降低树高。本节只把一个装满的节点拆成两半，理解中间键上移后怎样把左右范围隔开。',
`多路节点｜一个节点有多个键；键把数轴切成区间，对应不同孩子路径。
最小度数 t｜一种常见B树参数约定；节点最多有2t−1个键，本例t=2因此最多3个。
分裂｜满节点拆成左右两个节点，中间键提升到父节点，避免继续塞入造成超限。`,
`先看节点里面的顺序｜例程的keys=[10,20,30]已经升序排列，t=2。这个节点的最大允许键数为2t−1=3，所以它正好满了。若它不是叶子，三个键还会把孩子分成小于10、10到20、20到30、大于30四段，本例为了聚焦只演示键的划分。
选出中间键｜数组下标从0开始，中间位置t−1=1，对应20。把20记为mid，准备交给父节点作为新的分隔键。不能任意选择10提升，因为左右键的数量约束与范围分布都与分裂位置有关，标准算法会按度数参数选出规定的中间项。
把剩余键分给两侧｜左侧取中间位置之前的元素，只剩10；右侧取中间位置之后的元素，只剩30。左右都保存t−1=1个键，且左键都小于20、右键都大于20。注意在这个B树分裂模型中，中间键被移到父节点，不再保留在两份子节点键数组里。
区分局部操作与完整插入｜输出三行20、10、30验证提升键与两侧内容。完整B树还要把新节点连接到父节点、处理孩子指针，并可能继续分裂父节点；根分裂时还会增加一层。本节没有这些步骤，因此应当把代码理解成“分裂中键的分配示例”，不是一个可直接存储任意数据的B树。`,
`keys[t-1]｜把数学里的第t个键换成从0开始的数组下标，避免常见的偏一错误。
keys[:t-1]｜Python切片不包含右端点，所以不把即将上移的中间键复制到左侧。
keys.begin()+t｜右半从中间键后一个位置开始；t与t−1承担不同边界作用。`,
`若t=3且键为10、20、30、40、50，提升谁？｜提升下标2的30，左侧10、20，右侧40、50，各保留t−1=2个键。
为什么多存几个键可能减少磁盘读取？｜单个节点分支更多，同样数量记录所需层数可能更少；但实际效果还取决于页面大小和实现布局。`,['ds-bst']);
g('ds-bplus','数据库经常需要“找出价格在某个范围内的所有记录”，而不只是查一个键。B+树把叶子按顺序连起来，找到起点后便能顺着叶链扫描。本节直接给出已经定位好的起始叶页，练习范围边界和提前停止条件。',
`叶页｜保存实际键或记录入口的底层页面，本例每页用一个有序列表表示。
叶链｜相邻叶页之间按键序连接；扫描一页后可以进入下一页，不必每次重新从根查找。
闭区间查询｜本例[low,high]包含两个端点，键等于下限或上限都应保留。`,
`先读懂给定的三页｜pages=[[1,3],[5,7],[9,11]]，nxt=[1,2,−1]。意思是第0页后接第1页，再接第2页，最后没有下一页。页编号不是键值；起始页start=1表示从第二页开始，而不是从数值1开始搜索。实际B+树还需要内部索引来找到这个起始页。
在起始页检查范围｜目标为[4,9]，第二页中的5和7都满足key>=4且key<=9，所以依次交付。若起始页里有比下限更小的键，应跳过它，但继续检查后面的键，因为页内已经排序，小键不代表整页都无效。
沿叶链继续而非重启查找｜第二页完成后用nxt[1]=2进入第三页，9位于上边界，仍然要输出；下一个11大于9，函数立即结束。由于所有后续页的键也不会更小，所以此时继续扫描没有意义，这个提前停止依赖的是整体叶链有序。
理解示例的简化｜最终输出5 7 9。代码没有建立内部节点、没有维护插入删除后的叶链，也没有真正读磁盘。它只实现已经找到起始页后的扫描阶段；完整范围查询通常包含一次定位成本和按命中记录数量增长的扫描成本，不能把大量结果也描述成常数时间。`,
`if key > high: return｜超上界后结束整个扫描函数，不只是跳过当前键，因为后面都更大。
if key >= low: yield key｜先过滤下界，yield逐项产生结果；不要求把整个范围结果一次性存进内存。
p=nxt[p]｜从当前页走到下一页，−1作为结束标记，不应继续当数组下标访问。`,
`如果上限改成7，会输出什么？｜只输出5和7；进入下一页看到9已超上界，立即停止。
为什么不能随意把叶页顺序打乱？｜提前停止正确性依赖后续键不会更小；乱序时遇到11停止可能漏掉后面的合法键5。`,['ds-btree','linked-list']);
g('ds-skiplist','有序链表可以按大小查找，却常要一项一项走。跳表在底层完整链上增加较稀疏的上层捷径，先走大步，再落到底层补最后几步。本节提供固定两层连接，重点学习查找路径，不涉及随机生成层数或动态插入。',
`层 level｜底层包含全部键，上层只保留部分节点作为快捷路径。
前驱候选｜查找时停在目标之前的最后一个较小节点，最后检查它的底层后继。
哨兵｜本例编号0的键−1只是起点标记，不作为真实查找结果。`,
`先把表当成多条有序链｜keys=[−1,1,3,5,7]保存节点的键，nxt[p][level]保存某层的下一个节点编号。底层连接所有业务键，上层跳过某些节点。向右移动时使用键值比较，向下时只是换一条更细的链，不改变当前节点所处位置。
从最高层找目标5｜起点为哨兵，先看上层下一项3。因为3<5，可以跳到3；再看上层下一项7，7已经不小于5，所以不能继续向右，而应下降到底层。此时已经跨过1而无需逐一比较，体现了上层捷径的作用。
在底层确认是否真正存在｜从3沿底层看到5，因为条件要求严格小于目标，循环停在3，随后取底层后继q，检查keys[q]==5，得到存在。查6时可从3在底层走到5，但后继是7，不等于6，因此输出不存在，最终结果1 0。
理解停止规则和概率界｜每层都停在不超过目标前驱的位置，保证下降后不会跨过答案。完整跳表通常随机决定节点层数，合理随机分布下期望查找O(log n)，但本例固定两层不能证明对任意规模都对数时间，也没有实现插入、删除或随机平衡。`,
`keys[nxt[p][level]] < target｜先找到下一节点，再比较它的键；严格小于使p保留为前驱。
q=nxt[p][0]｜各层扫描结束后，真正候选是底层后继，而不是当前停留的前驱p。
q!=-1&&keys[q]==target｜先排除不存在后继，再访问键；避免把结束标记当合法节点。`,
`查找比所有键都大的10会怎样？｜沿各层走到最后一个键7，底层后继为−1，报告不存在，不越界读取。
上层少一个节点会改变底层集合吗？｜不会，所有真实键仍在底层；上层影响速度与路径，不改变集合内容。`,['linked-list','ds-bst']);
g('ds-binary-heap','若只关心当前最小任务，不必把所有任务完整排序。小根堆只要求每个父节点不大于孩子，因此根一定最小。本节用数组存树并逐个加入5、2、7、1，观察新元素如何沿父链上浮到正确位置。',
`小根堆｜每个父节点的值≤孩子值，因此数组根位置0是全局最小值，但整个数组不一定有序。
完全二叉树｜按层从左到右填满位置的树形，能紧凑地放在数组中，不必保存指针。
上浮｜新元素若比父节点小，就与父节点交换，继续向上直到满足堆序。`,
`用下标定位亲属｜数组下标从0开始，位置i的父亲为(i−1)/2向下取整，孩子为2i+1、2i+2。加入5时它就是根，无需比较；加入2时位于下标1，父亲为0且值5更大，于是交换，数组变成[2,5]。
只修复可能被破坏的路径｜加入7放到数组末尾，下标2的父亲是2，父值不大于7，直接停止。此前所有旧节点关系都合法，新插入只可能违反自己与祖先的关系，所以不需要扫描整棵树，沿父链检查足够。
追踪连续两次上浮｜加入1后数组暂为[2,5,7,1]。1的父亲是下标1的5，先交换为[2,1,7,5]；随后1与根2比较，再交换为[1,2,7,5]。到根位置后停止，最终输出正是这个数组顺序，而不是完整排序后的1 2 5 7。
把局部性质与全局用途联系起来｜任意节点沿祖先走都不会变小，所以根不大于所有元素。一次插入最多走树高O(log n)层；读取根O(1)。删除最小值通常要用末尾元素填根再下沉，本例只实现插入上浮，并未提供完整优先队列接口。`,
`h.push_back(x)｜先放到最后一个空位，保持完全二叉树形状；之后才修复大小关系。
(i-1)/2｜只在i>0时计算父节点，根没有父亲；整数除法在非负下标上完成向下取整。
if(h[p]<=h[i])break｜父亲已不大于当前元素，继续往上不会有新的违规，所以可以提前结束。`,
`[1,4,2,7,5]是否可能是小根堆？｜可以，1≤4、2且4≤7、5；虽然4在数组中位于2前面，堆不要求整体升序。
插入一个比全部旧值都大的数会交换吗？｜通常不会，末尾父节点已经不大于它，一次比较即可结束。`,['tree','vector']);
g('ds-huffman','给高频字符使用短编码可以节省总长度，但不同编码还必须能无歧义解码。Huffman算法不断把最小的两个频率合并。本节暂不生成具体0/1编码，而是计算这种合并形成的最小加权路径长度，用四个频率看懂每次费用从哪里来。',
`频率或权重｜字符出现次数，例如权重9的字符比权重2的字符对总编码长度影响更大。
前缀编码｜任一完整编码都不是另一个编码的前缀，逐位读取时能明确判断一个字符何时结束。
合并代价｜把两棵树放到同一个新父节点下，它们所有叶子深度都增加1，总费用增加两树权重之和。`,
`先让最小频率容易取出｜把[2,3,7,9]放进小根优先队列。第一次取最小的2和3，合成权重5的新节点，累计cost=5。队列现在代表三棵尚未合并的树，权重为5、7、9；合成的5代表原来两个字符，不是出现了一种新原始字符。
重复选择当前最小两项｜第二轮选5和7合成12，累计费用5+12=17。第三轮只剩9和12，合成21，总费用17+21=38。每次选择的是当前所有树中最小的两项，不能只按最初频率排一次后固定相邻配对，因为新合成权重也必须参加下一次竞争。
用最终深度核对总费用｜在这棵树里频率9位于深度1，7位于深度2，2和3位于深度3。加权长度为9×1+7×2+2×3+3×3=38，与逐轮合并费用相同。原理是每次合并都让相关叶子多走一层，累计后恰好按每个叶子的最终深度计费。
分清本例输出与真实编码｜程序只打印38，没有记录左右孩子，因此无法直接输出每个字符的二进制码。完整编码还需保存树、选择左右边的0/1并处理解码；相同权重可能形成不同但同样最优的编码。单字符输入的码字约定也要另行说明，不能只看合并循环。`,
`heapify(q)｜把已有频率列表整理成堆，之后每次heappop才能取得当前最小值。
cost += x｜x是本轮合成树的总权重，也就是所有相关叶子深度加1带来的总新增费用。
while len(q)>1｜只剩一棵树时已完成；再取两项会越界，也没有新的合并需求。`,
`为何不能总先合并最大的两个频率？｜大权重若在早期合并，会在之后多次被整体加深，增加大量加权长度；小权重更适合承担较深位置。
结果38是压缩文件最终字节数吗？｜不是。它是给定频率下的编码位数模型，还未计算码表、文件头、字节填充等额外成本。`,['ds-binary-heap','priority-queue']);
g('ds-dsu','朋友关系不断合并，想知道两个人是否已经属于同一群体，不一定需要保存每条连接路径。并查集只维护分组关系：查找代表、合并两组。本节用五个元素形成两个群，理解为什么比较根节点就能判断连通。',
`代表元或根｜某一集合选出的标记节点；具体是哪一个不重要，重要的是同组最终找到同一个根。
父数组 p｜p[x]表示x向上指向谁，根满足p[x]=x。
路径压缩｜查找时顺便让沿途节点直接指向根，使后续查找少绕弯。`,
`每个元素先独立成组｜初始p=[0,1,2,3,4]，每个位置指向自己，size都为1。unite(0,1)先分别find得到根0、1，再把一棵树接到另一棵树下。此后0和1属于同一组，即使它们的直接父指针不必处处完全相同。
合并的是根而非任意节点｜unite(1,2)先找到1所在组的根，再找到2的根，连接两个根并更新组大小。若直接把某个非根节点改指向另一组，可能只移动原集合的一部分，甚至形成错误结构，因此合并前先find是操作正确性的核心。
让树尽量矮｜若两组大小不同，让较小组的根指向较大组的根，减少大批节点深度增加的机会。find又递归走到根，并在返回时执行p[x]=根完成路径压缩。两种优化共同使长操作序列非常高效，但不能简单把任意单次递归都说成只执行一步。
验证两种关系｜前两次合并得到{0,1,2}，第三次unite(3,4)得到{3,4}。find(0)==find(2)为真，find(0)==find(4)为假，因此输出1 0。该结构只回答分组连通性，不保留具体路径，也不直接支持任意删除一条连接后重新拆组。`,
`if(p[x]!=x)｜根节点不再递归；这是find最终能够停止的条件。
p[x]=find(p[x])｜先求祖先的根，再更新当前父指针，查询过程也在优化结构。
if(size[a]<size[b])swap(a,b)｜交换的是根编号，使接下来统一把小树b挂到大树a下。`,
`再次合并0与2会增加组大小吗？｜不会，两者find结果相同，函数立即返回，否则会把同一组重复计数。
能从并查集直接还原0到2的原图路径吗？｜不能，父指针只是集合管理结构，路径压缩后更不代表原图边，需要另存图来还原路径。`,['tree']);
g('ds-trie','查找字典中的单词时，很多词拥有共同前缀，例如cat和car共享ca。Trie让每条边代表一个字符，沿路径拼出前缀。本节同时查询car、ca和cow，说明“路径存在”和“完整单词存在”为什么必须分开判断。',
`前缀｜从字符串开头连续取出的部分，例如ca是cat的前缀，at不是。
字符边｜从当前节点沿某个字符进入下一节点，多字符单词对应多步路径。
终止标记｜说明某条路径到这里恰好构成一个已插入单词，本例Python用特殊键#记录。`,
`插入第一个单词｜从空根开始插入cat：没有c分支就创建，再在c节点下创建a，最后创建t。到达t以后设置终止标记。三个字符决定三条边，根本身不代表字母；把每个字符与走到的节点对应起来，有助于避免多算或少算一个字符。
让共同前缀复用节点｜插入car时已有c和a，所以沿原路径走，只在a下面新增r分支。插入dog从根新建d、o、g。这样cat与car不会重复保存完整ca路径；但每个完整词仍有自己的结束位置，不能因为共享前缀而混成同一个词。
查询时逐字符验证｜查询car能依次找到c、a、r，且r有终止标记，所以返回存在。查询ca能走完字符，但a没有终止标记，因此返回不存在。查询cow在c之后寻找o失败，立即返回不存在，不必继续处理剩余的w。
明确接口的语义｜输出1 0 0表示完整词匹配。若另写“是否有某个前缀”的接口，ca则应该成功，因为不要求结束标记。本例固定使用不含#的普通单词，完整应用需避免结束标记与真实字符冲突；Trie空间还取决于节点分支表示，而不只是单词个数。`,
`p=p.setdefault(c,{})｜Python在字符分支不存在时创建空字典，并把p移到该分支对应的节点。
p['#']=True｜标记当前路径可作为完整单词结束；没有它就无法区分ca与cat。
if c not in p: return False｜任一字符路径缺失即失败，后面字符无需继续检查。`,
`再插入ca后，会破坏cat和car吗？｜不会，只需在现有a节点加终止标记，已有t、r孩子继续保留，三个单词都能存在。
Trie适合仅问整数大小顺序吗？｜通常不是首选。Trie擅长按组成符号共享前缀，整数有序查询可能更适合搜索树等结构。`,['tree','unordered-map']);
g('ds-graph-storage','城市与道路、课程与先修关系都能表示成图。选择邻接表、矩阵还是边列表，会影响后续算法访问数据的成本。本节建立四个顶点的无向图，并计算每个点连接几条边，让“顶点编号”和“边的两端”变成具体数据。',
`顶点 vertex｜图中的对象，本例用0、1、2、3表示四个对象。
边 edge｜连接两个顶点的关系；无向边(u,v)允许从u到v也允许从v到u。
邻接表｜每个顶点保存一份邻居列表，g[u]就是从u直接能到达的点。`,
`先给每个点留一个邻居列表｜g包含四个空列表，即使某个顶点最后没有边，也应保留它的位置。输入边为(0,1)、(0,2)、(1,3)。边列表适合逐条处理全部边，而邻接表适合从某个点出发遍历邻居，二者描述的是同一张图的不同访问方式。
无向边需要两次记录｜处理(0,1)时，在g[0]加入1，也在g[1]加入0。第二条边让0和2互相记录，第三条让1和3互相记录。若只写一个方向，存出的就不再是本题的无向图，从反方向进行BFS或DFS时会误认为道路不存在。
把结构与结果逐项对照｜构建后g[0]=[1,2]，g[1]=[0,3]，g[2]=[0]，g[3]=[1]。各列表长度为2、2、1、1，也就是各点的度数。总和6等于边数3的两倍，因为每条无向边在两个端点各贡献一次；这是检查构图是否漏方向的一种办法。
比较其他表示的代价｜邻接矩阵用V×V个位置表示是否有边，判断某一对点是否相连很直接，但稀疏图也要占平方空间。邻接表空间通常为O(V+E)，遍历某点邻居只访问实际边。本例不含自环和重复边，遇到它们时还需先规定度数和存储计数约定。`,
`g[u].append(v)｜把v加入u的邻居，不是把整条边对象塞进一个全局列表。
g[v].append(u)｜无向图的对称记录；若任务明确是有向图，才只保存规定方向。
len(adj)｜统计某个顶点邻接表长度，本例对应无向无重边图中的度数。`,
`若再增加一个没有道路的顶点4，度数是什么？｜它的邻居列表为空，度数0；必须在图的数据结构里保留该顶点，不能只从边推断所有顶点。
图很稀疏时矩阵有什么浪费？｜大量不存在的边也占位置，空间仍为V²；邻接表只保存实际连接和顶点列表。`,['vector']);
g('ds-fenwick','数组经常修改一个数，又要查询某段的和，单纯前缀和就不够方便，因为修改后很多前缀都要更新。树状数组把前缀拆成若干长度为二的幂的小块，让单点增量和前缀求和都只访问少量位置。',
`一基下标｜树状数组内部位置从1开始，原数组第一个元素对应位置1；位置0仅作终止边界。
lowbit｜i&−i取得二进制最低位的1所代表的值，例如6的lowbit为2。
前缀和 prefix(i)｜内部位置1到i的总和，prefix(0)=0，因此可用两个前缀相减得到区间和。`,
`先知道每个节点管哪段｜t[i]保存以i结尾、长度为lowbit(i)的一段。例如t[4]管1到4，t[3]只管3，t[2]管1到2。初学时可以列出1到8的二进制，观察最低位1决定区间长度；这样i+=lowbit与i−=lowbit就不是需要硬背的符号。
建立数组并做增量修改｜原数组为[2,1,3,4,5]，依次add(1,2)、add(2,1)等把每个值加入相关块。随后add(3,2)表示第三项增加2，从3变5，并非把它直接改成2。更新访问位置3，再到4，最后超过n停止，只修改包含第三项的那些块。
用前缀拆解得到查询｜prefix(4)直接读取覆盖1到4的t[4]，现在为2+1+5+4=12；prefix(1)=2。两者相减得到位置2到4之和1+5+4=10。若查询闭区间[l,r]，通用表达式是prefix(r)−prefix(l−1)，下界减一不能遗漏。
理解边界与成本｜更新从i向上跳到负责更大区间的节点，查询从i减掉已处理块的长度，两者都与二进制位数相关，耗时O(log n)。add(0,d)会因为lowbit(0)=0而无法前进，所以例程明确拒绝非法更新位置。它支持的是加法，不是任意操作都能原样套用。`,
`i += i & -i｜更新跳到下一个包含当前位置的更大负责区间。
i -= i & -i｜查询移除已累计的末尾区间，继续处理剩余前缀。
enumerate(a,1)｜Python从1开始给元素编号，使输入数组和内部一基下标对应。`,
`若想把第三项从3改为9，应传给add多少？｜传差值6，而不是9。add表示增量；若当前值已变成5，则改到9应加4。
为什么prefix(4)−prefix(1)不包含第一项？｜两个前缀都包含位置1，它在相减时抵消，剩下的正是位置2到4。`,['algo-prefix-difference','ds-adt']);
g('ds-segment-tree','想在不断修改数组的同时查询区间总和，可以把数组切成左右两半，预先保存每半的汇总，再递归细分。线段树查询时只取完全落在目标范围里的块。本节使用紧凑迭代数组实现，演示一次赋值更新和一次半开区间查询。',
`区间节点｜一个节点代表一段连续元素，父节点汇总左右孩子负责的两段。
半开区间 [l,r)｜包含l，不包含r，例如[1,4)表示下标1、2、3。
合并操作｜本例使用加法把左右区间总和合起来；换成最小值时合并和初始值也需同步改变。`,
`先搭出树形汇总｜输入a=[2,1,3,4]，n=4，叶子放在t[4]到t[7]。自底向上计算t[3]=3+4=7、t[2]=2+1=3、t[1]=10。数组下标1是根，0不用；叶子的逻辑下标要加n才能变成树数组位置，别把两套下标混为一谈。
更新一项并修复祖先｜把原下标1的值从1设为5，对应叶子位置n+1=5。写入后向上取整除2，到父节点2重新计算2+5=7，再到根1重新计算7+7=14。其他不包含这个叶子的区间没有变化，因此不必重建所有节点。
拆解目标区间｜查询原下标[1,4)，对应树位置l=5、r=8。l是右孩子，无法与左兄弟一起上移，所以先单独累加t[5]=5，再令l到6；随后l、r一起除2变为3、4。此时t[3]整段落入范围，再累加7，得到12。
理解为什么不会多算｜左右端点都按半开区间维护，若r是右孩子，应先r减1再取其左邻节点，保证不包含右端之外的数据。已单独取出的块会从剩余区间剔除，因此不会重复累计。构建O(n)，更新和查询O(log n)；本例没有实现整段加法所需的懒标记。`,
`t=[0]*n+a｜前半预留内部节点，后半按原顺序放叶子；不是两份原数组。
if l & 1｜奇数位置是右孩子，当前左边界无法携带其左兄弟一起上移。
r -= 1; ans += t[r]｜半开右端先退一步再取值，与先取r会产生不同结果。`,
`只查询[2,3)应包含几项？｜只包含原下标2这一项，右端3不包含；本例更新后它仍为3。
父节点为什么要重新从两个孩子计算？｜本例操作是把叶子赋成新值，重算可保持汇总一致；不能只把新值直接加给所有祖先。`,['tree','ds-fenwick']);
g('ds-sparse-table','如果数组不会再改，却要做很多区间最小值查询，可以提前保存所有常用长度的区间答案。稀疏表存储长度为1、2、4、8等的块，再用两个块覆盖查询范围。本节重点解释为什么两个块允许重叠，而求和不能照搬。',
`静态查询｜建立结构后原数组保持不变；修改一个元素可能影响许多预处理结果。
st[k][i]｜从下标i开始、长度为2^k的区间最小值；k表示长度层数，不是元素下标。
幂等性｜同一个值参与两次取最小仍不改变答案，min(x,x)=x，因此重叠覆盖可以安全使用。`,
`先存最短区间｜数组[8,6,7,3,9]的长度1答案就是每个元素本身，因此st[0]复制原数组。长度2的每段由左右两个长度1块取min得到，例如从下标1开始的[6,7]答案为6，从下标2开始的[7,3]答案为3。预处理只生成实际不越界的块。
用两个较短块拼长块｜长度4的块由两个相邻长度2的块合并。一般公式用st[k−1][i]与st[k−1][i+2^(k−1)]取min，前者管左半、后者管右半。两半长度相同且首尾相接，因此刚好覆盖目标2^k长度，没有漏掉或额外加入元素。
定位查询所需层数｜本例查询闭区间下标[1,4]，长度4，k=floor(log2(4))=2。取从l开始的长度4块以及在r结束的长度4块，这次两块完全重合，都覆盖[6,7,3,9]，最小值为3。长度不是二的幂时，两块会部分重叠，但仍覆盖完整查询区间。
理解适用操作的限制｜最小值重复计算同一个位置不会改变结果，因此只需两次表查询就能O(1)回答。若换成和，重叠部分会被重复相加，答案就错了。预处理需要O(n log n)时间和空间，适合静态高频查询；动态修改更多时应考虑线段树等结构。`,
`lg[i]=lg[i//2]+1｜用递推预存向下取整的二进制对数，查询时无需浮点log运算。
r-(1<<k)+1｜计算右块的起点，使长度2^k的块恰好以闭区间右端r结束。
range(n-(1<<k)+1)｜只枚举足够长且仍在数组内的区间起点，避免访问不存在的元素。`,
`长度5的查询用哪种长度的块？｜取长度4的左右两块，它们重叠3项，但min允许重叠，因此仍正确。
把min全部替换成加法就能查和吗？｜不能，两个块的重叠会重复计数；区间和可用前缀和或不同的分解方式。`,['algo-prefix-difference','ds-segment-tree']);
g('ds-persistent','编辑器撤销、历史快照等需求要求新修改完成后，旧版本仍能查询。可持久化数据结构不把旧节点改掉，而只复制被修改路径上的少量节点，其余不变部分由多个版本共享。本节用线段树总和演示两个版本同时存在。',
`版本根｜每个历史版本保存自己的根入口，沿该根访问到的节点决定该版本数据。
路径复制｜只为从根到修改叶子的这条路径建立新节点，未改变的子树继续复用。
不可变节点｜创建后不再修改已有字段；这是旧版本不会被新操作意外影响的前提。`,
`建立初始版本｜build对[1,2,3,4]不断二分，叶子分别保存单项值，内部节点保存左右总和，根a.total=10。此时每个节点对应一个固定区间。所谓持久化在这里是保留可访问的历史版本，并不自动意味着数据已经写入硬盘或能在程序退出后恢复。
沿修改路径创建新对象｜要把原下标1从2改为9，change从根负责的[0,4)开始，目标落在左半[0,2)，继续向左半递归；再进入目标叶子[1,2)，新建值9的节点。旧叶子值2从未被赋值覆盖，所以旧版本a依然可以沿原路径读到2。
重新计算新路径汇总｜返回上一层时，新的左半总和为1+9=10，再与未修改右半[3,4]的总和7合并，得到新根b.total=17。右半子树的指针可以直接共享，因为里面没有任何值需要变化。这样新版本既有自己的入口，也避免整棵树复制。
用两个根验证历史｜最后分别读a.total和b.total，输出10 17。一次更新只创建树高数量的新节点，平衡线段树通常为O(log n)；旧版本越多，占用的总内存也会增加。实际系统还需管理不再需要的版本和资源回收，不能因为节点共享就认为保存无限历史没有代价。`,
`@dataclass(frozen=True)｜Python限制已建节点字段被直接重新赋值，帮助维持版本共享所需的不可变约定。
x,y=old.left,old.right｜先复用两边旧子树，只把包含修改位置的那一侧替换为递归返回的新节点。
return Node(x.total+y.total,x,y)｜构造新父节点而非修改old.total，所以旧根指向的结构保持原样。`,
`新版本创建后再读取旧版本，会得到9还是2？｜旧版对应位置仍为2，因为修改过程创建新节点，未覆盖原叶子。
为什么不能在change中直接写old.total？｜old可能同时被旧根和其他版本引用，原地修改会让历史版本也跟着变化，破坏版本隔离。`,['ds-segment-tree']);
g('algo-proof','程序在一个例子上输出正确，不等于对所有输入都正确。学习算法时，应能说明每轮开始保留了什么事实、更新后为何仍成立。本节通过寻找[3,1,7,2]最大值，练习最基本的循环不变量证明，同时实际统计比较次数。',
`循环不变量｜每轮开始时都成立的事实，用它连接已经处理的部分与尚未处理的部分。
初始化｜进入循环前先建立不变量，例如先把第一项当成当前已知最大值。
终止推论｜循环结束时全部输入已处理，此时不变量应恰好推出需要的答案。`,
`先给变量明确含义｜best表示已经看过的元素中的最大值，不表示最终答案已经确定。先令best=a[0]=3，再从第二项开始扫描，因为只看过第一项时它当然最大。count从0开始，只统计后面实际比较的次数，初始化赋值不算一次与新元素比较。
逐轮保持正确事实｜读到1时，max(3,1)=3，所以前两项最大值仍为3；读到7时更新为7；读到2时保持7。每轮都把“旧前缀的最大值”和“新来的唯一元素”比较，已经处理过的其他元素不可能超过旧best，因此没有必要重新扫描它们。
写出证明的三部分｜初始化时一个元素的前缀最大值是它自己；保持时，把旧前缀和新元素合并，取两者最大得到新前缀最大值；终止时，前缀已经扩展到整个数组，所以best就是全局最大值。这种解释比“看起来每次都在取max”更明确地说明了为什么不会漏掉答案。
再数成本与前提｜n个非空元素需要n−1次新旧比较，例程输出7 3。额外只保存best和count，空间O(1)。Python示例的a[1:]会创建切片，实际代码还会产生O(n)临时空间；若要保持严格常数辅助空间，可以改为按下标或迭代器跳过第一项。空输入要先定义错误或返回约定。`,
`best,count=a[0],0｜读取第一个元素要求数组非空；这个前提应在函数接口或调用处明确。
best=max(best,x)｜把已处理部分压缩成一个充分信息：最大值，不需要保留之前每次比较的过程。
count+=1｜把抽象的时间分析变成可观察次数，但不应把它误当成真实运行时间计时器。`,
`如果所有数都是负数，初值best=0合适吗？｜不合适，0可能根本不在输入中。用第一个元素初始化，或使用明确的负无穷边界，才能正确处理全负数。
不变量是否必须在循环中完全不变化？｜不是，变化的是已处理前缀范围；不变的是“best等于这个前缀最大值”这一关系。`,['ds-adt']);
g('algo-backtracking','从若干物品中选一些，让总和等于目标，是很多搜索问题的原型。每个物品都有“选”和“不选”两个决定，递归把大选择拆成下一项的小选择。本节计算[1,2,3]有多少个子集和为3，先理解完整搜索，再谈剪枝。',
`搜索状态｜描述当前做到哪一步的信息，本例为位置i和已选总和total。
分支｜从一个状态作出的不同决定；本例每个元素分别尝试选与不选。
递归终点｜所有元素都已决定后，检查当前总和是否满足目标，并返回本方案的贡献。`,
`先定义函数的承诺｜count(a,i,total)回答：前i项已经决定、总和为total时，后面的选择还有多少种能使最终和为3。开始调用i=0、total=0，表示尚未处理任何元素。函数返回的是方案数量，不是一个布尔值，也不是选中的元素列表。
展开第一层选择｜面对元素1，不选时进入count(a,1,0)，选时进入count(a,1,1)。两边接下来都要继续决定2和3，分别处理各自状态。传递整数参数让两个分支互不影响；如果改为共享可变路径列表，就需要在递归回来后撤销追加，这才是典型回溯的“恢复现场”。
到叶子检查完整方案｜三个元素总共有2³=8种选择。满足总和3的是只选3，以及选1和2，因此两片合法叶子各返回1，其余返回0。父调用把两个分支的数量相加，最终得到2。不能一发现total==3就无条件结束，否则含0或负数的输入可能还有其他合法后续选择。
认识穷举成本与剪枝条件｜每项两种选择，最坏状态树指数增长。若已知所有数为正且只问达到固定正目标，可在总和过大时剪枝；但有负数时未来可能把总和降回来，不能照搬。本例不剪枝，完整枚举结构最清晰，也便于和之后的动态规划比较重复状态。`,
`if i==len(a)｜所有元素都决定后才检查结果，避免把未完成选择当成完整方案。
int(total==3)｜Python把True转为1、False转为0，统一用计数方式向上累加。
count(...total)+count(...total+a[i])｜两边分别对应不选与选当前项，位置都前进一步，保证不会无限处理同一项。`,
`若输入是[1,1]、目标1，按位置选有几种？｜有2种，选择第一个1或第二个1。若题目把相同值组合视为一种，需要另加去重规则。
为什么不能总在total>目标时剪枝？｜若后面还有负数，总和可能再次下降达到目标；剪枝必须由输入约束证明安全。`,['algo-proof']);
g('algo-greedy-interval','安排会议时，希望选出最多个互不冲突的时间段。局部规则不能凭直觉随便定：最早开始的长会议可能占满全天。本节采用最早结束优先，并解释为什么保留更多后续时间能证明这种选择不会减少最优会议数量。',
`半开时间段｜把会议理解为[start,end)，结束时刻不再占用资源，因此下一场可以恰好在end开始。
贪心选择｜每一步按某条规则直接选定当前决策，不回头枚举所有组合。
交换论证｜把某个最优方案的第一步换成贪心选择，证明不会变差，以此建立正确性。`,
`先按结束时间排列｜原会议为(0,3)、(1,2)、(2,4)、(3,5)、(4,6)，按右端排序后最先考虑(1,2)。last记录上一场已选会议的结束时刻，初始为负无穷，表示还没有占用。排序依据是结束时间，而不是区间长度或开始时间。
逐项决定是否冲突｜先选(1,2)，令last=2；(0,3)开始0<2，跳过；(2,4)开始恰好等于2，可选并令last=4；(3,5)冲突，跳过；(4,6)可选。最终选到三场。每次跳过只代表它与当前方案不兼容，并不是把原区间从输入删除。
说明第一场为何安全｜设某个最优方案第一场是X。最早结束的会议G结束时间不晚于X，把X替换成G后，原方案中X之后能开始的会议仍然能开始，因此会议数量不减少。于是至少有一个最优方案以G开头，接下来在剩余时间里重复同样论证即可。
分清目标变化后的边界｜这个证明针对每场价值相同、只最大化数量的区间调度。若不同会议有不同收益，最早结束可能舍弃一场很高收益会议，需要加权区间动态规划等方法。排序O(n log n)，扫描O(n)；不能因为扫描只走一遍就漏算排序成本。`,
`sorted(a,key=lambda x:x[1])｜lambda取出结束时刻作为排序键，原列表中的二元组不需要改写。
if l>=last｜允许首尾相接；若业务要求中间留休息时间，兼容条件也要相应修改。
last=r｜只有真正选择了会议才更新last，跳过冲突会议不能延长已占用时间。`,
`先选最早开始的(0,100)一定好吗？｜不好，它可能阻挡很多短会议；本题保证来自结束最早而不是开始最早。
两场会议结束时间相同会影响最优数量吗？｜任选其中与当前已选部分兼容的一场通常不损失后续空间；若还有额外收益或资源条件，就需重新分析。`,['algo-proof']);
g('binary-search','在有序数组中寻找某个值时，每次比较都可以排除一半范围。本节寻找的是第一个大于等于目标的位置，称为下界；即使目标重复或不存在，也有清楚答案。先确定这个接口，再推导边界更新，能避免靠记忆拼凑二分模板。',
`有序前提｜数组按非递减顺序排列，相等允许重复；若无序，比较中点无法推断整半边。
下界 lower bound｜最早满足a[i]>=target的位置；所有值都更小时返回数组长度。
半开搜索区间｜待检查元素位于[lo,hi)，hi本身不被当作当前有效元素读取。`,
`初始化可能范围｜a=[1,2,2,4]，target=2，lo=0、hi=4。答案允许等于4，所以右边界可以设成长度；但访问中点时mid始终小于hi，不会读取a[4]。循环保持lo左侧元素已知小于目标，hi及其右侧已知不需要成为更早答案。
先检查中间位置｜第一次mid=2，a[2]=2满足大于等于目标，但左边可能还有更早的2，因此不能马上返回2，而是令hi=2。第二次mid=1也满足条件，再令hi=1。这两步都是把当前中点保留为可能的边界，同时继续向左找更早位置。
排除明确不满足的部分｜第三次mid=0，a[0]=1<2。因为数组有序，0及其左侧都不可能满足，令lo=mid+1=1。此时lo==hi，区间为空，返回1。更新成mid+1是因为mid已经确认不可能是答案，不应把它再次留在搜索范围里。
用极端情况检查模板｜空数组初始lo=hi=0，直接返回0；目标小于全部元素时不断移动hi，返回0；目标大于全部元素时lo最终到n。每轮区间长度缩小，因此O(log n)终止。返回位置并不自动说明值等于目标，调用方若要确认存在，还需检查位置<n且a[position]==target。`,
`mid=lo+(hi-lo)//2｜按当前区间计算中点，C++写法也避免直接lo+hi可能产生的大整数溢出。
if a[mid]<target｜不满足下界条件才排除中点及左半；相等时继续找更靠左的位置。
return lo｜结束时左右边界会合，表示第一个可能满足条件的位置，而不是最后读取的mid。`,
`目标3在[1,2,2,4]中的下界是多少？｜下标3，那里是4。下界返回插入位置，不要求数组中存在3。
为什么遇到2不能立刻返回？｜题目要第一个满足位置，当前2左边可能还有2；直接返回任意命中点会破坏接口含义。`,['vector','algo-proof']);
g('merge-sort','把一长串数字直接排好很困难，但两份已经有序的列表容易合并。归并排序不断把数组分半，先解决较小部分，再合并。本节从[4,1,3,1]展开调用树，并解释为什么相等时先取左边可以保留原先的相对顺序。',
`分治｜把问题拆成更小的同类问题，分别解决后再组合答案。
归并｜从两个已排序序列的头部不断取较小者，得到一个更长的有序序列。
稳定排序｜键相等的记录在排序后保持原先相对顺序，不表示结果在多次运行之间随机变化。`,
`拆到无需再排序的规模｜[4,1,3,1]分成[4,1]和[3,1]，两边再各分成单元素。长度0或1已经有序，直接返回副本。递归不是突然知道最终答案，而是把“排序长度4”转成“排序两个长度2”，直到所有最小问题都容易回答。
先合并左右小组｜合并[4]和[1]时比较头部，先取1再接剩余4，得到[1,4]；另一组[3]和[1]得到[1,3]。每次取走一个头部元素，那个序列的游标前进一格，已放入结果的部分始终有序，这是归并过程的核心不变量。
处理相等元素的先后｜合并[1,4]与[1,3]时，两边都是1，条件<=让左边的1先进入结果；随后取右边1，再取3，最后接4。假如两个1附带不同姓名，这个规则保留了原输入里左侧那条记录先出现的顺序，因此排序稳定。
算总工作而不是只数递归层｜每层合并处理总共n个元素，层数约log n，总时间O(n log n)。Python示例使用切片与新列表，便于阅读但会分配额外空间；C++也要保存合并结果。归并排序不是原地交换几个元素就完成，讲空间时不能忽略临时数组和递归栈。`,
`if len(a)<2｜基线条件保证递归终止，也处理空输入。
left[i]<=right[j]｜相等时先取左半记录是稳定性的关键；换成<通常仍能排数值，但不保持原相对次序。
result+left[i:]+right[j:]｜某一边用完以后，另一边剩余部分已整体有序，可以直接接到尾部。`,
`为什么归并时只看两边头部就足够？｜各自内部已经有序，任何更靠后的元素都不小于该边头部，因此全局下一项必在两个头部中。
已经排好序的输入是否让这份实现变成O(n)？｜不会，这份代码仍执行分裂和各层合并；专门加入有序检测后才可能改变最佳情况表现。`,['algo-backtracking','vector']);
g('algo-elementary-sort','把手里已经排好的牌插入一张新牌，是理解插入排序的自然方式。它维护一个有序前缀，每次只把当前值放到这个前缀的正确位置。本节追踪[4,2,3,2]，同时说明为什么移动较大的值、遇到相等停止能保持稳定性。',
`有序前缀｜数组前面已经排好的连续部分；第i轮开始时，下标0到i−1有序。
暂存 key｜当前等待插入的值。右移旧元素会覆盖位置，因此要先保存它。
稳定性｜相同键记录不交换原先顺序，本例严格大于才移动，保留已有相等项在前。`,
`从一张牌开始｜初始单个4构成有序前缀。i=1时取key=2，j指向4；4>2，把4右移到下标1，j减到−1，再把key放到j+1=0，数组成为[2,4,3,2]。暂存key保证原来的2不会被右移的4覆盖后丢失。
逐步扩大前缀｜i=2时key=3，先把4右移一格，接着发现前面的2不大于3，停止移动，把3放到它后面，得到[2,3,4,2]。此时前面三项有序，最后一项仍未处理；算法不要求整个数组在中间每一刻都有序。
观察第二个2的插入｜最后key=2，将4、3依次右移，遇到前面的第一个2时，因为比较条件是a[j]>key而不是>=，停止。新2放在旧2后面，结果为[2,2,3,4]。给两个2加上来源标签，就能看见它们的先后顺序没有被颠倒。
理解何时好用｜原本接近有序时，需要搬移的元素很少，插入排序可能很实用；逆序时每次都要越过整个前缀，总移动量近似1+2+…+(n−1)，最坏O(n²)。标题还介绍选择排序，但本节代码实现的是插入排序，不能把它的稳定性直接套给交换式选择排序。`,
`key,j=a[i],i-1｜先保存当前项，再从前缀末端向左找位置，避免比较尚未排序的后半段。
a[j+1]=a[j]｜把较大项向右挪出空位，不是立刻交换当前key和每个旧元素。
a[j+1]=key｜循环停止后，j指向最后一个不大于key的位置，空位恰好在它右边。`,
`若把>改为>=，数值结果会错吗？｜数值通常仍有序，但后来的相等项会越过先前相等项，稳定性被破坏。
输入已升序时内层会移动多少项？｜每轮比较发现前项不大于key就结束，基本不移动，最佳时间为O(n)。`,['algo-proof','vector']);
g('algo-quickselect','只想知道第3小的数时，完整排序可能做了多余工作。快速选择先让一个枢轴落到排序后应该在的位置，然后只继续包含目标排名的一侧。本节使用[7,2,5,1,4]，解释分区如何在不排好两侧内部顺序的情况下确定答案4。',
`第k小｜按升序并计入重复元素后的第k个值，本例k从1开始，下标目标则为k−1。
枢轴 pivot｜本轮用来划分大小的参考值，本例取当前区间最后一项。
分区边界 p｜p之前已收集不大于枢轴的项，扫描结束后p成为枢轴最终位置。`,
`把目标排名变成下标｜k=3表示排序后下标2。当前搜索区间lo=0、hi=4，pivot=a[4]=4，p从lo开始。扫描j时，只要a[j]<=4，就把它交换到p位置并让p前进；大于4的值暂时留在右侧等待后续处理。
逐项完成这次分区｜7>4不移动；2<=4，与位置0的7交换，得到[2,7,5,1,4]，p=1；5>4跳过；1<=4，与位置1交换，得到[2,1,5,7,4]，p=2。最后交换a[p]与末尾枢轴，数组成为[2,1,4,7,5]。
判断还需不需要递归｜枢轴现在位于下标2，左侧两项都不大于4，右侧都大于4，因此第3小就是4。左侧[2,1]和右侧[7,5]都没有完全排序，但这不妨碍确定枢轴排名。如果p太小，只去右侧；p太大，只去左侧，目标不可能落在被丢弃的一侧。
注意效率与修改行为｜函数直接交换传入数组，会改变其顺序。随机或平均良好的分区下，快速选择期望线性时间；本例固定末项枢轴，在某些有序或重复输入上可能连续产生极不均衡分区，最坏O(n²)。接口先拒绝越界k，避免第0小或超过元素数的排名没有定义。`,
`if not 1<=k<=len(a)｜调用前检查排名范围，空数组也会在这里被拒绝。
p+=1｜只有成功把一个不大于pivot的元素放入左区时才推进边界。
lo=p+1 / hi=p-1｜枢轴排名已经确定，后续搜索排除它，只保留目标可能所在半边。`,
`分区结束后数组一定全有序吗？｜不一定，只保证相对枢轴的左右大小关系；快速排序还要处理两侧，快速选择只处理一侧。
重复值是否只算一个排名？｜不是，本例按元素出现次数计入排名。例如[2,2,5]第2小仍是2。`,['binary-search','algo-elementary-sort']);
g('algo-heapsort','堆能快速找到极值，把最大值一次次放到数组末尾，就能得到升序结果。堆排序把“尚未排好”的前缀维护为大根堆，后缀则逐步变成最终有序区。本节重点跟踪这两个区域的边界，避免把已排好的最大值又放回堆中。',
`大根堆｜父值不小于孩子，根保存当前堆中的最大值。
有效堆长 n｜只有下标0到n−1参加堆操作，数组后面的已排序项不再参与。
下沉｜父节点比某个孩子小时，与较大的孩子交换，继续修复下一层。`,
`从内部节点自底向上建堆｜输入[5,1,4,2]。最后一个有孩子的位置是len(a)//2−1=1，它的孩子2大于1，交换后变成[5,2,4,1]；再检查根5，已经不小于两个孩子，建堆结束。叶子没有孩子，天然满足堆序，不必单独下沉。
把当前最大值送到终点｜交换根5与末尾1，数组成为[1,2,4,5]。5已在最终位置，接下来有效堆长度只剩3。对根1下沉时，应选择两个孩子中较大的4交换，得到[4,2,1,5]，这样根再次成为剩余元素中的最大值。
不断缩小未排序区域｜把4与有效堆末尾1交换，得到[1,2,4,5]，堆长缩为2，下沉得到[2,1,4,5]；再交换2与1，最终[1,2,4,5]。后缀[4,5]一旦形成就不应再参与比较，否则可能把已固定的结果重新扰乱。
解释成本和稳定性｜自底向上建堆总成本O(n)，之后n次以内的删除式调整各至多O(log n)，总时间O(n log n)。数组内交换只需常数辅助位置，但远距离交换可能颠倒相等记录的原顺序，因此普通堆排序不稳定。它与使用额外优先队列逐项取出的写法在空间上也有差别。`,
`if j+1<n and a[j+1]>a[j]｜先确定较大孩子，再与父比较，否则交换较小孩子后可能仍违反另一边堆序。
down(a,n,0)｜n传入的是缩短后的有效长度，不是原数组总长度。
range(len(a)//2-1,-1,-1)｜从最后一个内部节点逆序处理，使孩子子树先成为堆，父节点才能正确下沉。`,
`为什么升序堆排序用大根堆？｜每次把最大值送到当前末尾，随后从右往左固定次大值，最终整数组升序。
下沉时总选左孩子可以吗？｜不可以，右孩子可能更大；必须选较大孩子才能保证交换后的父节点不小于另一个孩子。`,['ds-binary-heap']);
g('algo-counting-radix','当所有分数都落在0到9这样的很小整数范围内，逐对比较并不是唯一排序方法。可以先统计每个值出现几次，再按值的顺序输出。本节用简单计数排序建立直觉，并区分这种频率重建与基数排序所需要的稳定计数步骤。',
`值域 K｜可能出现的不同整数范围大小，本例为0到9共10种。
频率数组｜count[x]记录数值x出现次数，下标本身具有数值含义。
基数排序｜按个位、十位等组成部分多轮排序，每轮必须保持前轮相同组的相对顺序。`,
`先检查输入是否满足限制｜输入[3,1,3,0,2]都在0到9内，因此可以建立长度10的count。这里不能直接加入−1或100：负下标在Python可能意外访问尾部，过大下标则越界。若值域不同，应先调整偏移与范围，并评估是否值得分配这么多计数槽。
把元素逐个变成频率｜第一个3使count[3]=1，随后1使count[1]=1，第二个3让count[3]=2，再记录0和2。最终0、1、2各出现一次，3出现两次，其他值出现零次。统计过程中不交换原数组，也不需要比较3与1哪个更小。
按下标顺序还原结果｜依次枚举x=0到9，对每个x重复输出count[x]次，于是得到0 1 2 3 3。结果有序来自枚举计数下标的顺序，而不是统计时的输入顺序。元素个数保持不变，因为每个输入恰好增加一个计数，重建也恰好消费这些频率次数。
分清相关算法的不同需求｜本例只排序裸整数，频率重建没有保存每项附带的其他信息。若排序带姓名的记录并要求稳定，需要累计位置并按正确方向安放记录；LSD基数排序每轮依赖这种稳定性。计数排序成本O(n+K)，当K远大于n时，内存和遍历值域可能比比较排序更差。`,
`count=[0]*10｜创建十个频率槽，初值0表示还没有见过任何对应值。
count[x]+=1｜用输入值作为下标，这正是必须限制值域的原因。
for _ in range(count[x])｜按频率重复产生当前值；下划线表示循环次数有用但循环编号本身不用。`,
`输入只有两个数0和十亿时，直接计数合适吗？｜通常不合适，建立十亿量级计数槽代价太大；可用比较排序或其他适合稀疏值域的方法。
为什么LSD基数排序每轮要求稳定？｜高位排序时要保留已经排好的低位顺序，否则最终同高位的元素可能被低位打乱。`,['algo-elementary-sort']);
g('algo-two-pointers','有序数组里找两个不同位置的数使和等于目标，可以从最小与最大值向中间靠拢。每次移动哪一边，都能由有序性证明不会错过答案。本节寻找[1,2,4,7,11]中和为9的一对，结果是两个下标而非两个数值。',
`左右指针｜l与r是数组下标，不是内存指针；分别控制当前候选范围的最小和最大端。
单调性｜有序数组中向右值不会变小，因此比较和之后能推断一整组组合的大小。
不同位置约束｜循环要求l<r，避免把同一个元素使用两次。`,
`从两端开始比较｜初始l=0指向1，r=4指向11，总和12大于目标9。对于固定的右端11，其他左侧数都不小于1，因此与11组成的任何合法候选和都不可能更小到9。可以安全排除当前右端，令r减1，而不是随意选择一边移动。
用较小的和排除左端｜现在1+7=8，小于9。固定左端1，范围内其余右端都不大于7，所以所有这些和至多8，无法达到9。于是排除左端1，令l加1。这个理由与前一轮正好对称，都依赖输入已排序，不能对无序数组照用。
定位答案并解释输出｜l=1指向2，r=3指向7，总和正好9，因此输出1 3。若题目需要数值，应输出a[l]与a[r]；若需要原输入下标而你曾经排序，还必须在排序时保留原下标映射。本例数组本来有序，所以不存在重排后的编号转换。
证明终止与成本｜每轮至少让l右移或r左移，候选范围严格缩小，最多移动线性次数，因此O(n)时间、O(1)额外空间。l与r相遇时没有两个不同位置可选，输出NONE。它适合找到一对；若要求所有不重复数对或统计重复出现次数，还需增加去重与计数逻辑。`,
`while l<r｜确保两项来自不同位置，也让指针相遇成为明确停止条件。
if total<target:l+=1｜当前左端无法与剩余任何右端达到目标，所以排除它，而不是说小了就随便增大某个数。
while ... else｜Python循环没有经break退出时执行else，因此只有始终没找到答案才输出NONE。`,
`无序数组[7,1,2]能直接使用这套移动规则吗？｜不能，移动下标不再保证值增减，排除某一端的证明失效；应先排序或使用哈希等方法。
目标等于某个元素的两倍就一定有解吗？｜不一定，需要两个不同位置；数组只有一个4时，目标8仍没有合法数对。`,['binary-search']);
g('algo-window','寻找最长不含重复字符的连续子串，暴力方法会反复检查许多相同片段。滑动窗口维护一个当前合法区间，只在重复出现时推进左端。本节用abba展示一个关键细节：某字符上次出现已经在窗口外时，左端不能倒退。',
`连续子串｜原字符串中相邻的一段字符，不能跳着选；与子序列不同。
last字典｜记录每个字符最近一次出现的下标，不仅记录当前窗口里的字符。
合法窗口｜从left到right的区间内，每种字符最多出现一次。`,
`逐个扩展右端｜开始left=0、best=0，读下标0的a，之前没有a，窗口为a，长度1；读下标1的b，窗口ab无重复，长度2。last保存a→0、b→1，使之后遇到相同字符时可以直接知道它上次在哪里，而无需在窗口中重新扫描。
重复时跨过旧位置｜读下标2的b，上次b在1，当前窗口若仍从0开始会包含两个b。因此把left移动到1+1=2，窗口变成单独一个b，再把last[b]更新为2。左端一步跳到冲突之后，不必每次只前进一格做无用比较。
处理已经过期的历史记录｜读下标3的a，上次a在0，但当前位置窗口从2开始，旧a早已不在窗口中。若直接left=last[a]+1，会错误地退回1，把重复的两个b重新放入窗口。使用max(left,last[a]+1)后left仍为2，窗口ba合法，长度2。
保存历史最好答案｜当前窗口可能变短，因此不能只在结束时输出right−left+1；每轮用best保存见过的最大合法长度，最终得到2。每个右端只扫描一次，字典查询平均常数成本，总体平均O(n)。本例按Python字符或C++字节处理，Unicode语义要在实际需求中统一。`,
`last.get(c,-1)+1｜从未出现的字符使用−1，得到候选左端0，不会无端缩短窗口。
left=max(left,...)｜左端只允许向右，保证已经排除的旧位置不会重新进入。
right-left+1｜两端都包含时长度要加1，例如left=right时窗口仍有一个字符。`,
`字符串aaaa的答案为何是1？｜每读一个新a都必须跨过上一个a，合法窗口始终只有当前字符，best保持1。
last里必须删除窗口外的字符吗？｜本例不必，max保护左端不倒退；若换成计数窗口写法，维护规则会不同。`,['unordered-map','algo-two-pointers']);
g('algo-prefix-difference','对一长段元素统一加一个值，逐项修改会重复做大量工作。差分数组只记录“从哪里开始增加、从哪里停止增加”，最后通过前缀累加恢复每个位置的值。本节给零数组做两次区间加法，看见区间重叠如何自动叠加。',
`差分 d｜相邻值的变化量。给原数组求前缀累加可以从变化量还原实际值。
半开更新 [l,r)｜从l开始受影响，到r之前结束；位置r需要抵消先前增加。
前缀累计 cur｜扫描到当前位置时，将此前所有变化量相加，得到当前原数组值。`,
`把第一段增加写成两个事件｜原数组长度5且全为0，创建长度6的d，额外末位允许记录在数组末端停止的事件。更新[1,4)加3，只需d[1]+=3、d[4]−=3：扫描到1时开始多3，扫描到4时撤销这份增加，位置1、2、3因此受影响。
叠加第二段而不逐项访问｜更新[2,5)加2，执行d[2]+=2、d[5]−=2。两次操作之后d=[0,3,2,0,−3,−2]。位置2到3属于两段重叠区，自然同时受到+3和+2；无需专门写一个“判断两个区间是否相交”的分支。
用一次前缀扫描还原｜cur初始0。依次读前五项差分，得到0、3、5、5、2，所以最终数组为[0,3,5,5,2]。第5号额外槽保存−2只是为了表达更新到末尾时的停止事件，不属于长度5的结果，因此恢复时只扫描d[:n]。
联系前缀和的另一种用途｜若已有静态数组且频繁查区间和，可以预先保存前缀总和，再用两项相减回答。差分则是反过来优化大量区间增量，最后一次性还原。两者不是完全相同的接口；若每次修改后马上要查询动态区间答案，通常需要树状数组或线段树配合。`,
`d[l]+=v;d[r]-=v｜两个端点分别记录生效与抵消，r不包含在更新范围内。
cur+=x｜把变化量累加成当前实际值，不能直接把d当作更新后的原数组输出。
[0]*(n+1)｜为r==n的合法半开区间预留停止槽，避免最后一次更新写越界。`,
`把[0,5)全部加1，要改几处？｜只改d[0]+=1与d[5]−=1，最后恢复时每个实际位置都会增加1。
若误在d[r-1]减v会怎样？｜增量会提前一项结束，原本应该包含的最后一个位置r−1得不到增加。`,['vector','algo-proof']);

</script><script>/* 初学者逐步教程：与现有课程的真实示例对照阅读。 */
Object.assign(BEGINNER_GUIDES,{
'compiler-pipeline':{
why:'你写下a+b，处理器并不会直接理解这几个字符。编译器逐步识别符号、检查结构与含义，再把它变成更适合执行的表示。本节先看最小的中间表示t0=a+b，建立各阶段之间传递什么信息的整体地图，后面的词法、语法和优化才有明确位置。',
terms:[['前端','理解源语言的部分，通常完成词法、语法和语义分析，确定程序是否合法并建立内部表示。'],['IR','Intermediate Representation，中间表示，是编译阶段之间约定的数据形式，不一定是机器码，也不一定是可执行文本。'],['后端','根据目标机器选择指令、分配寄存器等，生成接近或属于目标平台的代码。']],
steps:[['从字符区分出有意义的单位','对于源代码a+b，词法阶段先识别标识符a、加号、标识符b。字符流本身没有“左操作数”标签，编译器需要先切分。正式语言还要处理空白、注释、字符串和错误位置，本例已经直接提供left、op、right，省略了真实扫描过程。'],['把符号组织成结构并检查含义','语法阶段把三个符号组织成一个加法节点，左孩子a、右孩子b；语义阶段还要确认a、b是否声明以及类型能否相加。程序不能因为形状像a+b就自动合法，例如对某种语言中不支持相加的类型仍需报错，这与括号配对等语法问题不同。'],['用临时结果名字降低表达式','示例输出t0 = a + b，t0表示这次加法产生的临时结果。把复杂表达式拆成小操作后，优化器更容易记录某个值在哪里定义、在哪里使用。t0不是要求用户在源代码里写的新变量，而是编译器内部生成的名称。'],['认识本例完成的范围','代码只格式化一条IR文本，没有真正实现词法器、类型检查器或机器指令生成。读懂它的价值是认识阶段接口：同一个IR可供不同优化继续处理，也可能被不同机器后端翻译。后续课程会分别实现某个局部机制，不应把一条打印语句当成完整编译器。']],
notes:[['left, op, right','三个变量直接提供已经识别好的操作结构，因此输入中不包含需要解析的任意源程序。'],['t0','人为选择的临时变量名；真实编译器需确保不同计算的名字不会发生意外冲突。'],['print(f\'t0 = ...\')','打印的是中间代码的文本表示，Python不会因此执行a+b，因为这里a、b是字符串名称。']],
checks:[['语法正确但变量未声明，应由哪个层面发现？','属于名字解析或语义检查问题。词法器能认出名字，语法器能认出表达式结构，并不意味着名字已经有合法定义。'],['IR必须与某一种CPU寄存器一一对应吗？','不必。很多IR刻意保留目标无关结构，真正的寄存器选择留给后端阶段。']],prerequisites:[]},
'lexer':{
why:'计算器输入12 + 34时，后续程序希望看到“数字12、加号、数字34”，而不是五个数字与符号混在一起的字符。词法分析负责完成这次分组。本节用一个不断向前移动的下标i，跟踪如何跳过空白、收集连续数字、识别加号，并拒绝不认识的字符。',
terms:[['Token','词法单元，包含类别及可能的文本或值，例如NUM:12中的NUM是类别，12是原始字面内容。'],['字素 lexeme','组成一个Token的原始字符片段，例如连续字符1和2组成字素12。'],['扫描位置','下标i指向尚未处理的当前字符，每次处理后必须推进，否则扫描可能永远停在同一位置。']],
steps:[['从下标0开始检查字符','字符串s为12 + 34，i=0时字符是1，满足数字范围判断。此时不能立刻输出NUM:1，因为后面紧接着的2也属于同一个数字。程序先记录start=0，再进入内层循环，一直推进到不再是数字的位置。'],['截取完整数字而非单个字符','内层循环先越过1，再越过2，i停在第一个空格。s[start:i]取得下标0到i之前的片段12，因此输出NUM:12。半开区间让i同时作为“下一次要处理的位置”，不需要为了截取数字再把i退回去。'],['分别跳过空白和识别符号','遇到空格时只增加i，不输出Token，因为本例语言把空白视作分隔。遇到+时输出PLUS:+并前进一位；随后跳过另一个空格，再以同样方式收集34，输出NUM:34。每个分支都要确保消费字符或明确报错。'],['把扫描成功与表达式合法区分','词法器能把12++34切成数字、加号、加号、数字，但它未必负责判断两个加号是否构成合法表达式。括号嵌套和操作数组合通常交给语法分析。本例只支持非负整数、加号与空白，负号、小数或变量需要增加规则，不能默认已经支持。']],
notes:[['start=i','保存当前数字的起点，在i继续前进后仍能截取完整字素；若不保存起点，只知道终点无法恢复原片段。'],['s[start:i]','Python切片包含start不包含i，正好对应已扫描的数字范围；C++版本使用相应子串操作。'],['isspace()','识别空白并跳过，本例中空白不形成Token；真实语言也可能把换行或缩进作为有意义符号。']],
checks:[['输入007，本例会输出几个数字Token？','一个NUM:007，因为三个连续数字构成一个字素；之后如何解释数值或前导零属于进一步的语言规则。'],['扫描器遇到未知字符却不前进也不报错，会怎样？','外层循环会反复检查同一个字符，可能无限循环；每条路径必须消费输入或终止。']],prerequisites:['compiler-pipeline']},
'compiler-regex':{
why:'变量名通常不能以数字开头，但可以含字母、数字和下划线。与其逐个例子硬编码，可以用正则表达式描述这类字符模式。本节拆开[A-Za-z_][A-Za-z0-9_]*，解释首字符规则为什么要单独写，以及为什么验证整个名字要使用完整匹配。',
terms:[['字符类','方括号表示允许的单个字符集合，如[A-Za-z_]允许英文字母或下划线，不表示一次匹配整段字母表。'],['重复运算符*','表示前一个模式可以出现零次或多次，因此名字可以只有首字符，没有后续字符。'],['完整匹配','要求整个输入字符串都满足模式；只找到一个合法子串不足以证明整个变量名合法。']],
steps:[['先单独检查第一个字符','模式开头[A-Za-z_]只允许字母或下划线，所以alpha_2和_x的首字符合法，2alpha的首字符2不合法。把首字符限制单独写出，是因为语言规则往往允许数字出现在后面，却不允许数字成为名字的开头。'],['再检查后续字符是否全部属于允许集合','第二部分[A-Za-z0-9_]*加入了数字0到9，并允许重复任意多次。alpha_2中的l、p、h、a、_、2都可接受，_x中的x也可接受。单独一个_也符合该正则，因为后续部分可以出现零次，但是否作为可用标识符还取决于语言其他约束。'],['使用fullmatch得到整体判断','Python的re.fullmatch要求从头到尾匹配成功，返回匹配对象，否则返回None。代码用is not None变成布尔结果，再int转换为1或0。因此打印alpha_2 1、2alpha 0、_x 1，不会把2alpha中合法的后缀alpha当作整体成功。'],['区分字符模式与完整语言规则','这个模式只覆盖ASCII风格名字。关键字如if即使符合字符模式，也可能不能作为普通变量名；Unicode标识符、保留名字和作用域规则也未处理。词法器通常先识别名字形状，再查询关键字表，而不是指望一条简单正则解决所有语义问题。']],
notes:[['re.fullmatch','验证整个输入，而不是在任意位置搜索一段匹配内容；验证器和搜索器的目标不同。'],['[A-Za-z0-9_]*','星号作用于前面的字符类，允许每个后续位置从这个集合中选择一个字符。'],['is not None','显式判断是否匹配成功，不应把返回对象误认为程序已经获得了变量的类型或声明。']],
checks:[['abc-1能通过本例验证吗？','不能，减号不在后续字符集合中；即使abc是合法前缀，fullmatch也要求剩余内容合法。'],['if能通过正则，是否说明它能作为所有语言的变量名？','不能。关键字限制是额外规则，正则这里只识别字符形状。']],prerequisites:['lexer']},
'compiler-nfa':{
why:'某些词法规则允许多种可能路径，例如同一前缀可能继续成为不同Token。NFA用“当前可能处于哪些状态”表达这种选择，不必每一步只保留一个状态。本节先用ε跳转到可处理字符的位置，再读取a和b，理解状态集合如何推进，以及它怎样对应DFA的集合状态。',
terms:[['NFA','非确定有限自动机，给定当前状态与字符时可能有多个下一状态，运行时可同时跟踪所有可能性。'],['ε边','不消耗输入字符就可以走的边；ε不是输入中的一个普通字母。'],['ε闭包','从一组状态出发，沿零条或多条ε边能到达的全部状态，必须包括起始状态自身。']],
steps:[['先画出示例的三种转换','eps中0可以不读字符到1；tr中状态1读a仍在1，读b到2，状态2作为接受状态。这个小自动机识别若干个a后接一个b的形式。代码没有为任意字符自动添加转换，不认识的字符会让可能状态集合失去可继续的路径。'],['读取字符前先展开ε闭包','起始集合{0}经过closure变成{0,1}，因为0本身可达，且有ε边到1。工作列表记录还需要展开的状态，集合用于避免重复加入；若ε边形成循环，也不应无限重复访问，因为已见状态会被跳过。'],['逐个字符计算下一组可能状态','读a时，只有状态1有相应边，得到{1}；再次读a仍得到{1}。读b时从1到2，得到{2}。每次字符转移后再次求ε闭包，才能包含不消耗更多字符的后续可能性。不能只在程序开头求一次闭包便永远忽略ε边。'],['用接受状态判断并连接到子集构造','所有输入读完后，只要当前集合含接受状态2，就判accept。DFA子集构造把这样的NFA状态集合视作一个DFA状态，从而把多条可能路径汇总成确定转移。本例直接模拟集合，不是完整地枚举并最小化所有DFA状态。']],
notes:[['eps={0:[1]}','把不消耗字符的转换单独保存，避免误当成必须读取一个名为epsilon的字符。'],['states=set(states)','闭包函数复制并使用集合，保证原有状态保留且重复路径不会无限增加元素。'],['work.pop()','逐个展开尚未处理的状态，属于图可达性搜索；集合与工作列表职责不同。']],
checks:[['求{0}的ε闭包时，能只返回{1}吗？','不能。允许走零条ε边，所以0自身也必须包含，正确结果是{0,1}。'],['在读完前缀时到过接受状态，就一定接受整个输入吗？','不一定。通常要在输入全部消费后检查当前状态集合，后续字符可能让所有路径失败。']],prerequisites:['compiler-regex','algo-dfs']},
'compiler-dfa-min':{
why:'两个状态看起来编号不同，但如果对所有未来输入的接受行为完全相同，就没有必要分别保存。DFA最小化寻找这种等价状态。本节用三个状态、两个输入符号的小转换表，逐轮比较“当前分组及下一步落入哪个分组”，理解为什么最终只需要两个状态组。',
terms:[['等价状态','无论再读什么后缀，都无法通过接受与拒绝结果区分的状态；不是只看当前名字或编号是否相近。'],['划分','把状态分成若干组，同组暂时认为可能等价，之后发现行为差异再拆开。'],['划分细化','依据每个字符转移到的目标组重新区分状态，反复执行直到分组不再变化。']],
steps:[['先按接受性建立不能混合的两类','示例groups=[0,1,1]表示状态0在一组，状态1与2在另一组，对应非接受与接受的初始区分。即使转换目标完全一样，接受状态与非接受状态也不能合并，因为空输入后缀就能区分它们是否接受。'],['读取转换表中的每一行','trans=[[1,2],[1,2],[1,2]]表示每个状态面对两个输入符号时，分别转到状态1和2。列代表符号，行代表出发状态，数字代表目标状态。最小化比较的不是目标编号本身，而是目标属于哪个当前等价组。'],['为每个状态构造行为签名','key把状态当前组与两种转移目标组组合起来。状态1与2的签名完全相同，因此可以保留在同一新组；状态0虽然转移行为相同，但当前接受性组不同，签名仍不同。这样避免错误合并接受与非接受状态。'],['重复到稳定并解释输出','新分组与旧分组相同后停止，最终不同组数为2，打印2。更复杂的自动机可能要多轮，因为某个远处的差异会逐步传播回来。本课没有输出重建后的完整最小DFA表，也没有处理所有工程格式，它只实现划分稳定这一核心机制。']],
notes:[['groups=[0,1,1]','初始接受性划分是算法正确性的基础，不能为了减少组数而随意把所有状态先当成完全相同。'],['key=(groups[i],...)','签名同时保留当前组和目标组信息，避免细化过程把已区分的状态重新混合。'],['if new==groups','检测固定点，表示本轮没有发现更多可区分状态；并非只运行固定两轮。']],
checks:[['两个状态转移一样，但一个接受一个不接受，能合并吗？','不能。什么都不再读取时，它们的接受结果已经不同。'],['只比较一步转移就能完成所有DFA最小化吗？','不一定。远处差异可能需要多轮传播，因此需要细化到稳定。']],prerequisites:['compiler-nfa']},
'parser':{
why:'词法分析能认出左右括号，但要判断整个括号结构是否成对嵌套，需要语法规则。递归下降把每个非终结符写成函数，通过函数调用反映文法展开。本节针对S→(S)S或空串，解释为何一个函数既能识别嵌套，也能识别前后并列的多组括号。',
terms:[['非终结符','代表一种尚待展开的语法结构，如S；它不是输入中必须出现的字母S。'],['产生式','描述一种结构可怎样组成，本例S可为左括号、一个S、右括号、另一个S，也可为空。'],['递归下降','由函数自顶向下识别语法结构，需要在递归中维护共享输入位置，并避免不消费输入的无限递归。']],
steps:[['先用文法解释两类括号组合','(S)中的S允许内部继续嵌套，因此能识别(() )去掉空格后的结构；后面的第二个S允许接另一组括号，因此能识别()()。空产生式提供递归停止点。文法同时描述“里面还有”和“后面还有”，两个递归位置不能随意删掉。'],['遇到左括号就开始识别一组','parse_s看到当前字符是(时，先让i前进，再递归识别内部S。内部可以为空，也可以继续包含括号。函数返回后，当前位置必须是对应的)，否则这一组失败；只统计左右括号数量相等并不足以保证顺序合法。'],['消费右括号后继续识别剩余部分','确认右括号后再次推进i，然后调用parse_s识别后面的S。这样第一组结束并不表示整个输入结束，还可以接受下一组。若当前没有左括号，函数按照空产生式返回，由上层决定这个位置是否确实允许结束。'],['在最外层检查是否消费完整输入','局部parse_s返回成功不一定说明整串合法，例如前缀()后面还可能有多余的)。valid必须再检查i等于字符串长度，确保没有未消费字符。本例只处理定义中的括号语言，不自动跳过所有空白或支持其他表达式符号。']],
notes:[['nonlocal i','Python内部函数共享外部扫描位置，递归消费的字符会影响调用者，不能各自使用互不相关的i副本。'],['parse_s()','函数对应非终结符S；两个调用分别处理括号内部与括号之后的结构。'],['i == len(s)','最终完整消费检查可拒绝只匹配合法前缀的输入，是整个验证器必要的一部分。']],
checks:[['左右括号数量相等的)(是否合法？','不合法。第一个右括号没有对应的已打开左括号，语法顺序比数量相等要求更强。'],['为什么()后面再跟一个)不能算成功？','即使前缀()可解析，最后还有未消费字符，最外层完整消费检查会拒绝它。']],prerequisites:['lexer','compiler-pipeline']},
'expression':{
why:'2+3*4的结果应是14，而不是先算2+3得到20。表达式解析需要把优先级写进语法结构，不能简单从左到右看到运算符就计算。本节把表达式分为加法层、乘法层和基本项层，利用函数嵌套实现“乘法先结合，括号可以改变顺序”。',
terms:[['优先级','决定不同运算符怎样组成语法树，例如乘法比加法更紧密地结合。'],['结合性','决定同级连续运算怎样分组；对减法等运算，左结合与右结合可能产生不同结果。'],['基本项 factor','数字或括号包围的完整表达式，是上层乘法、加法组合的基础。']],
steps:[['先把2+3*4画成树','正确结构的根是加号，左边数字2，右边是乘法节点3*4。这样先计算右子树12，再与2相加得到14。若根画成乘号、左子树2+3，就会得到20，所以优先级首先决定结构，而不是仅在求值时临时补一个判断。'],['让加法层调用乘法层取得完整操作数','解析加法时，不能只读取一个数字就立刻处理后面的加号，而应先调用乘法层读完一个term。term会把3*4作为整体返回12，因此加法层看到的是2与12。函数调用顺序把高优先级工作放在更深一层完成。'],['让括号重新进入完整表达式','基本项遇到(时，递归调用表达式解析，并要求最后匹配)。因此(2+3)*4中，括号内部先算出5，作为一个完整基本项参加外层乘法，得到20。括号不是普通字符忽略掉，而是改变了语法分组边界。'],['处理空白、错误与剩余字符','spaces负责在需要时跳过空白，take尝试消费指定符号；缺少操作数、右括号不匹配或最后仍有字符都应拒绝。示例只实现自己的小型表达式语言，除法、变量、函数调用等功能不能仅因C++或Python本身支持就认为解析器也支持。']],
notes:[['spaces()','统一处理允许忽略的空白，避免每层重复书写不同的跳过规则而出现不一致。'],['take(c)','检测当前位置是否为目标字符并在成功时推进，失败时不应错误吞掉无关输入。'],['evaluate(s)','最外层负责解析与完整消费检查，不能只返回某个合法前缀的结果。']],
checks:[['2*(3+4)为何不是10？','括号先组成一个基本项，内部3+4=7，再乘2得到14；括号改变的是结构分组。'],['输入2+后缺少右操作数，应返回2吗？','不应。加号已经要求后面存在一个合法操作数，静默忽略错误会把非法程序误判为合法。']],prerequisites:['parser']},
'compiler-cfg-ambiguity':{
why:'同一串符号可能被同一套文法解释成两棵不同语法树，这会让执行含义或编译选择不明确。本节用三个操作数的二元表达式计算分组数量，看到(a+a)+a与a+(a+a)是两种结构。加法数值碰巧相同，也不能证明文法没有二义性。',
terms:[['上下文无关文法','用非终结符到符号序列的产生式描述结构，每次替换只由被替换的非终结符决定。'],['二义性','同一输入串存在不同语法树或不同最左推导；不是简单指语句难读。'],['分组结构','二元运算需要明确左右子表达式，括号展示树形结构，即使原字符串没有显式括号。']],
steps:[['从一个操作数的基本情况开始','ways[1]=1表示单独一个a只有一种结构，不需要选择左右分组。ways[0]没有被当成一个合法操作数表达式。本例只计具有固定操作数顺序的二元分组数量，并未把任意文法交给一个通用二义性判定器。'],['把k个操作数按根分成左右两边','对k=2，唯一拆法是左1个、右1个，数量为ways[1]*ways[1]=1。乘法来自组合：每种左结构都能与每种右结构配对。这个“按最后一个根运算划分”的思路也常用于区间动态规划。'],['手工计算三个操作数的两种拆法','k=3时，左1右2贡献1×1，左2右1贡献1×1，总数2。对应a+(a+a)和(a+a)+a，原始不带括号串a+a+a相同，但结构不同。程序最终打印2，展示该小模型中的多种解析分组。'],['用结构规则解决而不是靠数值巧合','若运算换为减法，两棵树可能得到不同值，即使加法例子看起来无差别也存在结构二义。实际语言可通过优先级、结合性或改写文法消除不想要的选择。本程序只计固定形式的树，不证明一般文法是否二义，也不解决所有冲突。']],
notes:[['ways[1]=1','提供可组成更大结构的基本情况；若设为0，后面所有组合计数都会错误归零。'],['ways[left]*ways[k-left]','左右子结构独立选择，数量相乘；不同根拆分再相加。'],['for left in range(1,k)','两边都至少有一个操作数，避免产生不合法的空操作数子树。']],
checks:[['两个不同语法树算出同一个值，就不算二义吗？','仍可能二义。定义依据是结构或推导是否唯一，而不是某组样例数值是否碰巧相同。'],['四个操作数的本模型分组数是多少？','按左1右3、左2右2、左3右1相加，为1×2+1×1+2×1=5。']],prerequisites:['expression']}
});
Object.assign(BEGINNER_GUIDES,{
'sql-trigger':{
why:'假设每次插入订单明细都要求金额等于单价乘数量，若不同应用忘记计算，数据就可能不一致。触发器能在表的写入事件发生时执行统一逻辑。本节使用单价7、数量3的简单记录，观察BEFORE INSERT如何填写NEW.amount，同时提醒你写操作背后可能还有隐含工作。',
terms:[['触发器','与特定表及事件关联的程序，由INSERT、UPDATE、DELETE等操作触发，而不是应用直接按函数名调用。'],['BEFORE与AFTER','表示在行事件之前或之后执行。本例在插入前设置即将保存的派生字段。'],['NEW与OLD','表示新行值与旧行值，可用范围随事件变化；INSERT有新行，DELETE关注旧行，UPDATE通常两者都有。']],
steps:[['先看表中哪几项是输入','demo_line记录id、price、qty和amount。应用提供编号、单价和数量，而amount应根据规则计算，不应让不同调用方各自随意填写。示例用整数便于手算，真实金额通常要考虑DECIMAL精度、舍入以及优惠等额外规则。'],['把触发条件与计算语句对应起来','初始化创建BEFORE INSERT触发器，表示每次准备插入一行时运行。SET NEW.amount=NEW.price*NEW.qty读取当前新行的单价和数量，写回这条新行的金额。NEW不是另一张数据库表，也不表示所有尚未提交的全表记录。'],['跟踪这一行进入数据库的过程','插入id=1、price=7、qty=3时，触发器先算7×3=21，再让该行继续完成插入。于是查询id,amount得到1 21。客户端代码只是查询最后状态；触发器定义和插入操作已经包含在初始化SQL中，需要先完成准备。'],['认识统一规则带来的隐性成本','触发器让写入入口保持一致，但也会让一条简单INSERT背后执行更多逻辑。多行插入会针对相关行执行行级触发操作，不能只按“外面只有一条SQL”估算成本。循环依赖、权限与错误传播需要谨慎设计，本例只演示单行派生值。']],
notes:[['BEFORE INSERT','先于该行最终写入执行，所以适合在允许范围内调整NEW中的派生字段。'],['NEW.price*NEW.qty','读取的是本次准备插入行的字段，不是扫描其他订单求总额；若允许NULL还要考虑乘法结果可能为空。'],['SELECT id,amount FROM demo_line','验证触发后的最终状态；不能仅看到客户端没有显式计算金额就认为金额是数据库自动猜出来的。']],
checks:[['插入price=4、qty=5，本规则得到多少？','得到20。规则逐行使用该行自己的输入，不受前一行7和3影响。'],['只定义INSERT触发器后，UPDATE数量时金额一定同步改变吗？','不一定。UPDATE是另一种事件，必须另行设计对应维护规则或采用其他一致性方案。']],prerequisites:['sql-crud','sql-routine']},
'sql-partition':{
why:'当表很大且数据有明确范围，例如按日期归档时，可以把数据按规则分到不同分区。分区裁剪允许某些查询跳过不可能包含答案的分区。本节按id范围分区，观察id>=10为何只需考虑对应范围，同时区分“减少要看哪些分区”和“在分区内如何找行”。',
terms:[['分区表','逻辑上仍是一张表，内部按分区表达式组织数据；应用通常不需要把每个分区当独立业务表查询。'],['RANGE分区','根据范围边界选择分区，VALUES LESS THAN表达严格小于上界，边界值不会落入前一段。'],['分区裁剪','根据查询条件排除不可能匹配的分区；它是访问范围优化，不是自动给所有条件建立索引。']],
steps:[['先把分区边界画在数轴上','初始化为id设置范围分区，小于10的一段与后续范围分开。理解LESS THAN时要特别看等号：id=9属于前段，id=10不属于“小于10”。如果边界理解错误，后续分析某条记录存在哪个分区就会全部偏移。'],['把样例行放到对应区间','本例插入的记录中，有id小于10的行，也有id=12、amount=30的行。数据虽然分散在不同物理组织部分，SELECT仍从demo_partition这一张逻辑表读取。分区不是要求用户手动把结果从多张同名表UNION起来。'],['利用条件排除不可能的区域','WHERE id>=10意味着所有id<10的分区不可能提供结果，因此优化器有机会进行裁剪。然后仍需在保留分区中执行行筛选，不能因为裁剪成功就假定只读取一条记录。索引、数据量和条件形式仍会影响真实执行成本。'],['核对结果并理解设计约束','SELECT id,amount ORDER BY id最终输出12 30。真实设计还需检查分区键与唯一键、主键之间的约束，以及维护分区时的锁和数据生命周期。分区适合某些范围访问与管理需求，不是表越大就一定应该随意分区。']],
notes:[['PARTITION BY RANGE','使用范围规则分配记录，规则是表定义的一部分，不能在查询时随意假装每行属于别的范围。'],['WHERE id>=10','与分区键相关，能为裁剪提供信息；对无关字段的条件不一定能排除分区。'],['ORDER BY id','定义跨保留分区的最终结果顺序，分区编号顺序不等于任意查询都自动排序。']],
checks:[['上界写VALUES LESS THAN(10)，id=10属于这一分区吗？','不属于，因为条件是严格小于10，边界值进入后续适合的分区。'],['裁剪到一个分区就不需要索引了吗？','不是。这个分区本身仍可能有大量行，如何定位匹配记录仍是独立问题。']],prerequisites:['sql-index','sql-ddl']},
'sql-security':{
why:'搜索框输入的内容应该只是一个查询值，不能变成新的SQL语法。参数化查询把结构与数据分开，权限控制则限制连接能做哪些事。本节让金额阈值通过参数进入查询，解释为何不能用字符串拼接代替绑定，也不能因为用了绑定就忽略最小权限。',
terms:[['SQL注入','不可信输入被拼进SQL结构，导致实际执行含义偏离原设计；根源是混淆数据与指令。'],['预处理与绑定','SQL保留占位符，值通过驱动接口单独提交，驱动按值处理，而不是把内容重新当作SQL关键字。'],['最小权限','应用账号只获得业务所需权限和对象范围，避免一个普通查询接口同时拥有建库、删表等无关能力。']],
steps:[['先固定查询结构','本例SQL为SELECT id,amount FROM demo_sales WHERE amount>=? ORDER BY id。表名、列名、比较符和排序都由程序固定，只有金额阈值允许变化。这样用户能表达“最低金额20”，却不应能借这个输入改变查询对象或添加另一条语句。'],['把20作为整数参数绑定','C++使用setInt把20绑定到第一个问号，Python连接器使用%s占位并传入参数元组。占位符语法由驱动规定，不能把两种版本机械混写。绑定值不是手工给字符串加引号，它由驱动按类型与协议处理。'],['按已有数据手工预测结果','金额20、30满足amount>=20，金额10不满足，NULL比较不是TRUE，因此输出id=1金额20和id=2金额30。这与普通筛选语义相同，安全参数化并不会改变合法查询的业务结果；它改变的是不可信值进入语句的方式。'],['把参数化放在完整权限边界中','参数一般不能替代任意表名或ORDER BY列名，动态标识符需要受控白名单等设计。教学连接器为方便配置使用本地账号示例，真实应用应换成最小权限账号，并管理凭据、传输和审计。参数化解决一个重要入口，但不是所有安全问题的总开关。']],
notes:[['amount>=?','问号是C++ JDBC接口的值占位符，不是SQL通配符，也不是让用户输入一段任意条件表达式。'],['stmt->setInt','以整数类型绑定参数；用固定类型可以明确接口允许的输入范围，仍要做业务上的范围校验。'],['MYSQL_PASSWORD','密码由环境读取而非直接写进示例源码；环境变量只是配置方式，不能替代账号权限与凭据保护。']],
checks:[['用户想选择按id或amount排序，能把列名绑定到一个普通值占位符吗？','通常不能。标识符不是普通值，应在允许的列名中选择固定SQL片段，避免直接拼接任意输入。'],['参数化后应用账号还需要限制DELETE权限吗？','需要。权限限制控制账号可执行的操作范围，与单个查询是否正确绑定参数是不同防线。']],prerequisites:['select','sql-crud']},
'sql-recovery':{
why:'备份只能把你带回某个备份时刻；如果之后发生误删除，还需要重放备份之后、事故之前的正确变化。时间点恢复把这两部分结合起来。本节从值100的备份开始，按时间重放+5和-3，在错误的-100之前停下，直观看到恢复目标怎样影响结果。',
terms:[['备份基线','可以恢复的某一时刻数据副本，是重放后续变化的起点；没有可靠基线，单独一段后续日志未必足够。'],['PITR','Point-in-Time Recovery，时间点恢复，目标是恢复到指定时间或日志位置附近的正确状态。'],['重放边界','规定哪些事件应应用、哪些不应应用；真实恢复要考虑事务提交边界，不能把一个事务任意切成两半。']],
steps:[['把备份状态与日志事件分开','value=100代表备份中的数据。events保存三个已知事件：(10,+5)、(20,-3)、(30,-100)，括号里的第一个数是教学时间标记，第二个是变化量。它们不是完整binlog格式，只是用可读方式说明恢复过程。'],['确定事故前的恢复目标','target=20表示只恢复到时间20为止，因此时间30的破坏性变化不应进入结果。目标不是“尽量执行最多日志”，而是业务确认的正确时间边界。现实中需要核对时区、日志位置、事务提交时间和操作记录，不能只凭一个模糊时刻执行。'],['从基线依次重放允许事件','首先100加5变成105，再减3变成102。第三个事件时间30大于目标20，所以跳过。程序最终输出102。重放必须基于正确起点，若从已经包含前两次修改的数据再重放一次，就会重复应用，得到错误结果。'],['把可计算模型转成恢复流程意识','真实MySQL恢复需要可用备份、连续日志、匹配的服务器与配置条件，并在隔离环境验证。备份文件存在不等于一定可恢复，定期演练才能检验链条是否完整。本代码没有连接数据库，也没有执行恢复命令，它只演示事件选择与状态推进。']],
notes:[['value=100','明确恢复起点，不能把当前已经损坏的值不加判断地当作备份基线。'],['if time<=target','本模型把等于20的事件包含在目标内；真实系统应明确恢复边界对应的事务语义。'],['value+=delta','按事件推进状态，说明重复应用日志可能产生错误；真实工具需要正确定位与恢复控制。']],
checks:[['目标改为10，恢复值是多少？','只应用+5，得到105；时间20和30的事件均不包含。'],['为什么不能直接从当前损坏值2开始再执行+5、-3？','因为当前值不是备份基线，里面已包含其他变化。重放必须从与日志起点匹配的正确状态开始。']],prerequisites:['sql-logs']},
'sql-replication':{
why:'主库发生的变化可以传播到副本，以支持读取扩展和故障恢复。但“已经收到日志”不等于“已经执行到数据里”，副本也可能落后。本节用两个事务编号集合，计算收到却尚未执行的事务，让你先分清复制链路中的不同进度。',
terms:[['源库与副本','源库产生变化，副本接收并应用变化；复制方向和拓扑需要明确，不能假设所有节点永远完全同步。'],['GTID','全局事务标识，用于识别事务。真实MySQL GTID含服务器身份与事务序号，不只是本例的单个整数。'],['复制延迟','副本在接收或执行进度上落后于源库的现象，读取副本可能暂时看不到刚提交的数据。']],
steps:[['先分别记录两个进度集合','received={1,2,3,4}表示副本已收到四个事务标识，executed={1,2}表示只完成了前两个。集合只表达是否包含，不保存事务内容或执行依赖。把收到与执行分开，是理解日志传输和数据可见性差异的第一步。'],['计算尚未应用的差集','received-executed保留已收到但不在已执行集合里的编号，因此得到{3,4}。如果只看网络传输已经结束，就可能误以为副本数据已经完整更新；这个差集提醒我们，还存在应用阶段的待办工作。'],['排序只是为了让输出可重复','Python集合本身不提供本课需要的显示顺序，sorted把结果排成3、4，再打印。真实复制是否必须严格按这一简单数字顺序执行，取决于事务依赖与并行复制机制；本模型没有推导提交依赖，也没有实现多源GTID集合。'],['把进度判断用于高可用设计','故障切换前需要判断候选副本拥有并应用了哪些事务，以及是否可能丢失已确认写入。主从复制本身不自动解决选主、旧主隔离、客户端重连等问题。理解差集后，应继续区分复制能力与完整高可用系统的职责范围。']],
notes:[['received={1,2,3,4}','整数集合是简化标识模型，没有表示真实GTID中的服务器UUID。'],['received-executed','集合差集只留下待执行项，不是对两个序列逐位置相减。'],['sorted(...)','用于稳定输出，避免集合枚举顺序干扰学习；不代表已实现真实事务调度器。']],
checks:[['若executed变成{1,2,4}，待执行结果是什么？','差集为{3}。但真实系统是否允许这种执行状态，需要结合依赖与并行复制规则判断。'],['副本已收到事务4，就一定能在查询中看到事务4的修改吗？','不一定。还要确认该事务已执行并满足相应可见性条件，接收进度不能代替应用进度。']],prerequisites:['sql-logs','transaction']},
'sql-pool':{
why:'每个请求都新建数据库连接会有握手和资源开销，连接池把有限连接重复借给请求使用。但连接不是借出后就可以忘记归还的普通数字：事务、会话变量和错误状态也可能残留。本节先用两个令牌演示借还，再解释真实池为何还要超时和清理。',
terms:[['连接池','维护有限数量可复用数据库连接的组件，请求借用、使用后归还，而不是无上限创建连接。'],['资源耗尽','所有连接正在使用，新的请求暂时无法取得资源，需要明确等待、超时或失败策略。'],['会话状态','连接上可能保留事务、临时设置等状态，归还前后需要按照池的协议清理，避免影响下一位使用者。']],
steps:[['用两个编号表示两个可借连接','free={0,1}表示编号0和1空闲。acquire先检查集合是否为空，再取最小编号并移出空闲集合。移出很重要，否则同一个连接可能被两个请求同时当成独占资源使用。这里的编号只是令牌，没有创建真正的数据库连接。'],['连续借用直到资源耗尽','第一次借到0，free变成{1}；第二次借到1，free为空；第三次无法取得资源，返回-1。于是a、b、c分别为0、1、-1。-1是本模型约定的失败标记，不是数据库真实连接ID，也不是让调用方继续对它执行查询的许可。'],['归还一份资源后再次借用','free.add(a)把0重新放回空闲集合，随后acquire又能得到0，最终输出0 1 -1 0。实际代码必须保证只归还真正借到且尚未归还的连接，并防止异常路径漏还；通常使用上下文管理或finally来维护生命周期。'],['理解真实连接回收前的检查','如果上个请求开启事务却没有提交或回滚，直接归还可能让下个请求继承错误状态。真实池还需处理失效连接、等待队列、借用超时和健康检查。这个集合模型只说明容量与借还关系，不具备并发原子性，也不是真正可部署的连接池。']],
notes:[['if not free: return -1','先处理空池，避免直接对空集合取最小值导致异常；调用方必须检查失败结果。'],['free.remove(token)','借出意味着空闲资源减少，不能只返回编号而不更新池状态。'],['free.add(a)','模拟归还，但真实实现应检查所有权和重复归还，还要重置连接状态。']],
checks:[['容量2却同时来了3个长请求，第三个一定应立即新建连接吗？','不一定。应遵循池容量与等待超时策略，无限制新建会破坏保护数据库的目的。'],['业务抛异常后直接把未回滚连接放回池有什么风险？','后续请求可能继承未结束事务或锁等状态，应按照池协议回滚、重置或丢弃异常连接。']],prerequisites:['transaction']},
'sql-migration':{
why:'网站升级时，数据库结构也会变化，而旧版与新版应用可能短时间同时运行。直接删除旧列容易让仍在运行的旧程序报错。迁移管理需要记录已经执行的版本，并采用兼容的扩展、过渡、收缩顺序。本节先用版本集合说明如何避免重复执行同一迁移。',
terms:[['迁移','按版本管理数据库结构或必要数据变化的过程，使不同环境能够沿同样的步骤升级。'],['版本记录','保存哪些迁移已成功执行的表或状态，用于判断本次还有哪些步骤要运行。'],['扩展/收缩','先增加兼容结构并迁移使用方式，确认旧依赖退出后再删除旧结构，降低部署切换风险。']],
