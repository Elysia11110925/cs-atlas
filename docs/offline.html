steps:[['把当前状态与计划分开','applied={1,2}表示迁移1、2已经完成，计划列表为[1,2,3,4]。计划描述希望达到的历史路径，已执行集合描述当前环境实际完成的工作。不能仅凭应用版本号猜测数据库一定已经升级到同一状态。'],['按计划顺序跳过已完成步骤','遍历版本1时发现已在applied中，跳过；版本2同样跳过。版本3尚未执行，因此加入已执行集合，并记录到本次executed列表。顺序重要，因为迁移4可能依赖迁移3创建的列或表，不应把计划当成任意排列。'],['继续完成新步骤并验证幂等入口','版本4也未执行，按同样方式记录。最后只输出3 4。如果沿用更新后的applied再次遍历，同一批计划没有新步骤。这里演示的是调度层避免重复，而不表示任意SQL脚本本身天然可重复执行；两种幂等性需要区分。'],['把版本模型放进真实部署流程','真实迁移要在成功完成后可靠记录状态，失败时能够诊断和恢复，并处理并发执行锁。许多MySQL DDL有隐式提交等行为，不能假定所有结构修改都能像普通DML一样整体回滚。兼容部署还需旧新应用共同可用的过渡阶段，代码示例没有自动实现这些工作。']],
notes:[['if version not in applied','根据实际记录判断是否需要执行，不依赖当前循环走到第几次。'],['applied.add(version)','本模型立即标记成功；真实执行器必须在迁移确实完成且状态记录策略正确时才确认版本。'],['executed.append(version)','记录本次新增完成的步骤，方便输出审计；它不是全部历史版本列表。']],
checks:[['计划是1、2、3、4，已执行只有1、3，输出会是什么？','此模型输出2、4，但真实系统还应检查为何出现依赖顺序空洞，不能把集合过滤当成完整一致性验证。'],['新版不再使用旧列，就可以部署前立刻删旧列吗？','不一定。仍运行的旧实例、后台任务或回滚版本可能依赖它，应完成兼容过渡后再收缩。']],prerequisites:['sql-ddl','transaction']}
});
Object.assign(BEGINNER_GUIDES,{
'transaction':{
why:'转账不能只完成一半：如果付款账户扣了100，收款账户却没有加100，资金就不一致。事务把相关操作放进一个共同的成功或失败边界。本节不只执行两条UPDATE，还检查每一步是否真的修改到目标账户，再决定提交还是回滚。',
terms:[['事务','一组需要作为整体处理的数据库操作，成功时提交，失败时撤销尚未提交的变化。'],['原子性','强调事务中的变化不能只留下任意一部分；它不表示每条语句内部没有多个步骤。'],['提交与回滚','COMMIT确认本事务的修改，ROLLBACK撤销未提交修改。连接自动提交设置会影响这些操作如何组合。']],
steps:[['先写下正确的前后状态','初始化账户1余额500、账户2余额100，总额600。预期转账后分别400和200，总额仍600。这个不变量比单独看程序有没有异常更重要：即使两条SQL都能执行，如果第二条没有找到收款账户，也不能认定转账完整成功。'],['扣款时把余额条件放进UPDATE','第一条UPDATE只对id=1且balance>=100的记录扣100。如果余额不足或账户不存在，受影响行数不是预期的1，程序应报告失败并回滚。把检查条件放进实际更新语句，比先在应用读取余额再毫无保护地扣款更能表达并发下的写入要求。'],['入账后再次核对目标是否存在','第二条UPDATE给id=2加100，同样要求影响一行。若收款账户不存在，数据库不一定抛异常，可能只是修改0行；所以代码显式检查行数。此时第一步扣款还在同一事务内，ROLLBACK能够撤销它，避免只扣不加。'],['所有条件满足才提交并清理连接','两步都成功才调用commit，正常输出committed；异常路径调用rollback，最后关闭游标和连接。示例初始余额只在准备阶段确定，重复运行会再次转账，因此第二次成功后余额会变为300与300，而不是每次都自动回到400与200。']],
notes:[['autocommit=False','Python连接关闭逐语句自动提交，让两次UPDATE能处在共同事务中；C++版本通过相应连接接口控制。'],['balance=balance-100','在数据库中对当前余额做减法，结合WHERE余额条件与受影响行数检查表达操作是否成功。'],['con.rollback()','异常处理中的回滚针对当前未提交事务；已经COMMIT的变化不能靠后来随意调用ROLLBACK撤销。']],
checks:[['收款账户不存在但扣款已执行，应如何处理？','检查第二次更新影响0行后回滚整个事务，撤销第一步扣款，并向调用方报告失败。'],['只把两条UPDATE写在同一个函数里就具有事务原子性吗？','没有保证。必须确认连接事务设置、提交边界、失败回滚以及所用存储引擎等条件。']],prerequisites:['sql-crud']},
'sql-innodb':{
why:'数据库文件放在磁盘上，但每次查询都直接读取磁盘会很慢。InnoDB把常用页放进内存中的缓冲池，重复访问时有机会直接命中。本节用容量只有两页的小缓存，逐次跟踪访问1、2、1、3后的状态，建立“页、命中、淘汰”的直觉。',
terms:[['页','数据库组织数据和I/O的基本块之一。一页通常容纳多个记录，不等于一条业务行。'],['缓冲池','保存数据页、索引页等内容的内存区域，用于减少访问磁盘的次数。'],['缓存命中','请求的数据页已经在内存中，能复用现有副本；未命中才需要从更低层获取。']],
steps:[['认识演示列表的方向','cache初始为空，列表头表示最近使用的页，尾表示较久未使用的页，最多保留两个页号。程序保存的是整数页标识，不是真实磁盘页内容。它用简化LRU解释局部性，实际InnoDB缓冲池管理还包含更细的策略，不能直接等同。'],['读取页1和页2','第一次访问1时缓存为空，未命中，将1放到头部，得到[1]。接着访问2，同样未命中，放到头部后是[2,1]。虽然已读取两次数据，但命中次数仍为0，因为两次都是第一次把页面带入这个缓存。'],['再次访问1体现重用价值','第三次请求1，发现1已在缓存中，hits加1。先从原位置删除1，再放到头部，状态变成[1,2]，表示1刚刚被使用。若只加计数而不调整顺序，后续淘汰可能把刚访问的1错误地当成最旧页面。'],['加入3并淘汰较旧页','第四次访问3未命中，插入后暂为[3,1,2]，超过容量2，于是删除尾部2，最终[3,1]。程序打印命中数1和缓存内容3、1，得到1 3 1。真实缓冲池遇到脏页淘汰还要考虑写回与日志顺序，本例未实现这些步骤。']],
notes:[['if x in cache','判断页是否已缓存；这里列表查找是线性的，生产缓存通常需要更高效的定位结构。'],['cache.insert(0,x)','把刚使用的页放到最近端，无论原来命中还是刚加载，都更新使用顺序。'],['cache.pop()','容量超限时删掉尾端页号；示例没有真正删除数据库磁盘中的数据。']],
checks:[['访问序列1、1、1时命中几次？','第一次未命中，后两次都命中，共2次。命中次数与请求次数不是相同指标。'],['缓存被淘汰是否意味着业务数据丢失？','不是。缓存副本被移除，持久数据仍应保存在存储中；若内存页已修改，必须遵循正确写回机制。']],prerequisites:['sql-index','ds-lru']},
'sql-isolation':{
why:'两个人同时读写同一份数据时，一次事务中的两次查询未必看到相同结果。隔离级别规定了并发事务之间可观察到哪些变化。本节通过一个值从10被别人提交为20的时间线，比较RC和RR的快照读直觉，同时明确这不是完整MySQL并发实验。',
terms:[['已提交值','其他事务已经完成提交的版本。未提交的中间修改与正式可见版本需要区别。'],['Read Committed','读已提交，常见理解是每次一致性读使用当时可见的已提交数据，因此同一事务两次读取可能不同。'],['Repeatable Read','可重复读；InnoDB普通一致性读通常复用事务内建立的读视图，但锁定读、自己写入等情况要另外分析。']],
steps:[['建立第一次读取时的状态','committed=10表示当前已提交值为10。程序让first和snapshot都保存10：first记录第一次读取结果，snapshot代表教学模型中的固定快照。两个名字虽然值相同，却承担不同角色，一个描述历史结果，一个用于之后的可见性选择。'],['在两次读取之间插入另一个事务','committed=20模拟另一个事务已经把数据改为20并提交。它不是当前读事务自己更新该行，也不是未提交脏数据。理解并发问题时应把“谁操作、是否提交、操作发生顺序”同时写出来，只看最终数值容易混淆隔离现象。'],['比较RC的第二次读取','RC这一行打印first与最新committed，所以得到10、20。第一次结果没有被倒改成20，而是第二次查询看到了新提交版本。这展示不可重复读：同一事务两次读取同一逻辑数据，结果可以因别人的已提交修改而变化。'],['比较RR模型并说明边界','RR这一行两次使用snapshot，输出10、10，展示复用同一快照的效果。真实InnoDB读视图建立时机与语句类型相关，SELECT FOR UPDATE不是普通快照读，事务也通常能看见自己的写入。因此不能把这一模型扩展成“RR下所有SQL永远只看事务开始时的数据”。']],
notes:[['snapshot=first=committed','把初始整数值保存下来；整数重新赋值不会让snapshot自动跟着committed变化。'],['committed=20','模拟其他事务已提交的更新，省略了真实锁、日志、连接与调度过程。'],['print(\'RR\',snapshot,snapshot)','刻意使用固定快照值来说明可重复读直觉，不是调用了数据库隔离级别API。']],
checks:[['若另一事务修改为20但尚未提交，能按本例直接让RC读到20吗？','不能。本例committed变量只代表已提交状态，未提交修改不应直接当作RC可见的新版本。'],['RR下使用锁定读时，可直接照搬两次10的结论吗？','不可以。必须分析锁定读的当前读语义、锁等待与事务自身操作，不能把普通一致性读模型套到所有语句。']],prerequisites:['transaction']},
'sql-mvcc':{
why:'如果读者需要看到旧数据，而写者已经产生新数据，数据库可以保留多个版本，让不同读视图选择合适版本。这是理解MVCC的入口。本节沿着30、20、10三个版本向过去查找，用一个简化截止编号解释“最新版本不一定是当前读者能看到的版本”。',
terms:[['MVCC','多版本并发控制，通过版本与可见性规则帮助读写并发；它不是所有操作都完全不需要锁的承诺。'],['版本链','同一逻辑记录的不同历史版本之间的关联，读者可沿链寻找符合自己视图的版本。'],['Read View','读视图，描述一致性读应如何判断事务版本是否可见；真实规则涉及事务编号、活跃事务集合等信息。']],
steps:[['把一个记录拆成三个历史状态','versions=[(3,30),(2,20),(1,10)]按从新到旧排列，每对数字前者是模型版本编号，后者是值。它们不是三条不同账户记录，而是同一个逻辑值在不同时间的样子。首先理解这一点，才不会把MVCC误认为普通多行查询。'],['给读者一个可见范围','cutoff=2表示教学规则允许看见编号不大于2的版本。真实InnoDB不能只靠这样一个整数完整表达Read View，因为还需排除某些当时活跃的事务；本例仅把可见性抽象成一个容易手算的条件，帮助理解搜索过程。'],['从最新版本开始逐个判断','先检查(3,30)，3大于2，不符合模型规则，跳过；再检查(2,20)，条件成立，立即选20。虽然更旧的(1,10)也满足条件，但它不是最新的可见版本，因此不应继续覆盖已经找到的20。遍历顺序与“找到就停止”共同决定结果。'],['连接到历史版本维护成本','保留历史版本需要额外信息，旧版本不能无限无条件保留。长时间保持的读视图可能让某些历史记录暂时不能清理。理解MVCC时应同时看到读并发的收益和版本维护的成本，本示例没有实现undo存储、清理线程或真实事务判断。']],
notes:[['versions=[(3,30),(2,20),(1,10)]','顺序必须与“从新到旧”的算法假设一致；如果随意打乱，取第一个符合条件的版本就不再可靠。'],['version<=cutoff','仅是本课定义的简化可见性条件，不能作为真实MySQL事务可见性的完整公式。'],['next(...)','Python找到第一个符合条件的value就返回；本例保证存在可见版本，通用代码还需处理没有匹配版本的情况。']],
checks:[['把cutoff改为1，输出什么？','先跳过3和2，选中编号1的值10，因此输出10。'],['MVCC能让UPDATE永远不等待其他事务吗？','不能。写操作仍涉及锁和冲突处理，MVCC主要解释某些一致性读取如何选择版本。']],prerequisites:['sql-isolation']},
'sql-deadlock':{
why:'事务甲拿着资源A等B，事务乙拿着B等A，谁都无法继续，这就是死锁的典型情形。与单纯“暂时等待一个正在运行的事务”不同，循环等待需要打破。本节把等待关系画成有向图，再用DFS发现环，理解数据库为何可能回滚一个事务并要求应用重试。',
terms:[['锁等待','一个事务请求的资源被另一事务以冲突方式持有，因此需要等待。等待本身不一定是死锁。'],['等待图','节点表示事务，边T0→T1表示T0正在等待T1释放资源；方向不能随意反过来。'],['灰色节点','DFS当前递归路径中的节点。走到一个灰色节点意味着沿等待方向又回到了尚未结束的路径，形成环。']],
steps:[['先把资源故事转换成图','示例g=[[1],[0]]表示事务0等待事务1，事务1等待事务0。它没有保存锁对象，只保存等待依赖。真实锁还区分记录锁、间隙锁以及不同模式，能否等待由具体冲突规则决定；本课从已经形成的等待图开始分析。'],['访问事务0并标记正在处理','color初始全为0，表示未访问。dfs(0)先把color[0]设为1，即灰色，再检查邻居1。此时1未访问，于是递归进入dfs(1)。灰色标记必须在深入邻居之前设置，否则返回到自己时无法识别当前路径上的环。'],['在事务1处发现回到灰色节点','dfs(1)把1设灰色，检查它等待的0，发现color[0]已经是1。说明当前路径0→1再接1→0闭合，于是返回true。若只是走到一个已经全部处理完的黑色节点，并不一定存在当前路径上的环，不能把“曾经访问过”一律当作死锁。'],['把检测结果与解决策略区分','程序输出true表示模型中存在等待环。真实数据库需要选择受害事务并回滚，应用可能需要重试整个业务事务，而不是只重试最后一条语句。通过一致的加锁顺序、缩短事务、合适索引等方式可减少风险，但检测代码本身没有自动执行这些优化。']],
notes:[['color[u]=1','表示节点仍在递归处理路径中，与已完成的color=2含义不同，三色状态用于避免误判。'],['color[v]==1','发现指向当前路径的边，构成有向环；这就是输出true的直接原因。'],['any(...)','从未访问的每个节点出发，防止只检查一个连通部分而漏掉另一个等待环。']],
checks:[['图只有0→1，事务1不等待别人，是否死锁？','不是循环等待。事务1完成后可能释放资源，让0继续，因此仅存在一条等待边不能判死锁。'],['死锁回滚后只重发最后一条UPDATE足够吗？','通常需要重新执行被回滚事务的完整业务步骤，并处理幂等与重试次数，否则此前步骤已经被撤销。']],prerequisites:['transaction','algo-dfs']},
'sql-logs':{
why:'数据库既要撤销失败事务，又要在崩溃后恢复已确认的修改，还可能把变化复制到其他服务器。一种日志不必承担所有职责。本节先用值10变为15说明“撤销”和“重做”的方向，再认识undo、redo与binlog各自解决的问题，避免把三者当成同一个文件的不同名字。',
terms:[['undo','用于支持回滚和历史版本等需求的信息，帮助找到修改前的状态；并非所有场景都只保存一个简单旧值。'],['redo','帮助恢复已记录的修改效果，与崩溃恢复有关；真实记录粒度和格式比业务SQL文本更底层。'],['binlog','MySQL服务器层的二进制日志，常用于复制与时间点恢复，其角色和InnoDB redo并不相同。']],
steps:[['先明确修改前后两个状态','page=10表示模型中的数据值，before保存10，after设为15。程序把page改成after，模拟一次更新。这里用一个整数代表页里的某个状态，只为说明恢复方向，真实数据库页含许多结构信息，不能把整数赋值看成完整页日志实现。'],['沿相反方向理解撤销','当事务决定回滚，程序page=before恢复10，打印undo 10。目标是消除尚未提交修改对该事务数据状态的影响。回滚不等于“再执行原SQL一次”，例如原来加5，再加5只会变成20，必须使用适当的反向或历史信息。'],['沿相同方向理解重做','之后page=after恢复15，打印redo 15，表示把应当存在的修改效果重新应用。崩溃时数据页与日志可能处于不同落盘阶段，恢复机制据此处理；真实系统还需识别哪些日志已应用等信息，不能简单对所有增量无条件重复相加。'],['把日志职责放进完整系统','undo、redo与binlog协作时还涉及提交和持久化顺序。binlog可描述用于复制或恢复的变化，而redo负责存储引擎层面的恢复需求。本代码没有实现真实日志文件、刷盘或两阶段提交，所以学习结论应停留在职责与方向区分，不据此推断崩溃安全已经实现。']],
notes:[['before,after=page,15','明确保存两个状态，避免更新后丢失旧值；真实日志如何表示变化由系统设计决定。'],['page=before','演示撤销方向，恢复修改前状态；它不是一个真实数据库ROLLBACK接口。'],['page=after','演示重做结果，不代表binlog与redo在任何时候都保存完全相同内容。']],
checks:[['undo主要是把15恢复成10，还是把10推进到15？','在本例中是恢复成10；向15推进表达的是重做修改效果。'],['有binlog就可以完全不需要redo吗？','不能这样替代。两者处于不同层次并承担不同职责，是否具备崩溃恢复能力要看存储引擎机制与配置。']],prerequisites:['transaction','sql-innodb']},
'sql-view':{
why:'多个页面都要查询金额不少于20的销售，如果到处复制同一段SQL，规则变化时容易漏改。视图可以给这段查询一个名字，让调用方通过稳定接口读取。本节建立一个只暴露id与amount的视图，同时说明它为什么通常不是自动保存结果的缓存。',
terms:[['视图','保存查询定义的数据库对象，调用时像表一样引用；普通视图并不自动持久保存一份独立结果。'],['底层表','视图查询实际依赖的数据来源，本例是demo_sales；底层数据变化会影响之后查询视图的结果。'],['执行身份','SQL SECURITY等设置影响访问底层对象时使用谁的权限，需要与授权设计一起考虑。']],
steps:[['先读懂视图要封装的查询','初始化中的定义选择id、amount，并用amount>=20筛选demo_sales。原始金额20、30、10、NULL中，前两行符合条件，所以视图当前可见id=1和2。视图不显示dept，但底层表中的部门字段仍然存在，未被删除。'],['用名字替代重复查询结构','CREATE OR REPLACE VIEW demo_high_sales AS ...保存这段查询定义。以后SELECT id,amount FROM demo_high_sales就能表达同一逻辑入口。OR REPLACE允许替换定义，但实际修改仍需相应权限，并要考虑依赖它的应用是否兼容。'],['把结果变化与持久快照区分','若底层id=3的金额从10改为25，之后查询视图通常就会看到它，因为视图定义仍是在筛选当前可见底层数据。它不是建立那一刻固定保存的两行名单。查询内部可能采用合并或物化策略，但执行中的物化不等于自动建立长期维护的物化视图。'],['查询、排序与更新要分别判断','示例ORDER BY id输出1 20、2 30。视图本身不保证任意读取顺序，因此调用处明确排序。某些简单视图可更新，含聚合等结构的视图往往受限制；不能因为能SELECT就认为可以任意INSERT或UPDATE，WITH CHECK OPTION也要单独理解。']],
notes:[['CREATE OR REPLACE VIEW','动作在初始化SQL中，客户端例程只读取已经建立的视图；若跳过初始化会找不到对象。'],['FROM demo_high_sales','读取一个命名查询入口，数据库仍需根据定义访问底层数据，而不是直接读取Python内存列表。'],['ORDER BY id','保证本次显示顺序，视图封装不会替调用方自动保证所有排序需求。']],
checks:[['视图建立后底层一笔金额从30改为5，下次查询还一定看到它吗？','不一定，按当前可见数据重新应用amount>=20后，该行不再满足条件。'],['把视图当作性能缓存有什么风险？','可能误判查询成本。普通视图主要封装逻辑，是否减少工作取决于底层计划，而非有一个名字就自动加速。']],prerequisites:['select','sql-ddl']},
'sql-routine':{
why:'某些数据处理规则可以封装在数据库服务端，避免每个应用分别复制实现。存储过程和存储函数提供这种能力，但它们的调用方式与用途不同。本节只实现输入乘2的小函数，先认识参数、返回类型和调用位置，再讨论什么时候值得把逻辑放入数据库。',
terms:[['存储函数','数据库中命名的函数，可接收参数并返回值，通常能出现在SELECT等表达式中。'],['存储过程','由CALL调用的一组服务端操作，可有IN、OUT、INOUT参数等机制，不等于普通SELECT表达式函数。'],['DETERMINISTIC','声明相同输入应产生相同输出的性质；不是声明一定快、一定不会报错，也不是自动证明函数纯净。']],
steps:[['先理解函数声明的每一部分','CREATE FUNCTION demo_tax(x INT)表示定义函数名demo_tax，接收名为x的整数参数；RETURNS INT说明结果也是整数。示例名称只是演示，不代表真实税费算法。函数参数是本次调用的输入，不是在表中永久增加一列叫x。'],['把函数体读成明确的计算规则','RETURN x*2把输入乘2并作为结果交还调用处。DETERMINISTIC NO SQL表达本例确定性与不访问SQL数据的声明。这里只做整数计算，若现实业务涉及金额精度、税率版本或舍入，应重新设计类型与规则，不能直接照搬整数乘法。'],['在SELECT表达式中调用一次','SELECT 7 AS input_value,demo_tax(7) AS output_value第一列直接显示7，第二列把7交给函数，得到14。两个别名只给结果列起名字。输出7 14帮助你同时核对输入与输出，调用过程中没有向demo_sales新增任何记录。'],['理解部署与权限边界','函数在初始化脚本中创建，客户端只负责执行调用查询。创建权限、二进制日志相关限制和服务器策略可能影响能否建立函数；遇到权限问题应核对练习环境，不应直接放宽生产服务器配置。是否采用存储程序还要考虑版本管理、测试和应用部署。']],
notes:[['DROP FUNCTION IF EXISTS demo_tax','初始化为避免重复定义先删除同名练习函数；只应针对专用练习对象执行。'],['RETURN x*2','返回一个值，与向屏幕打印不同；打印结果的是外部查询客户端。'],['demo_tax(7)','函数调用出现在SELECT列表达式中，存储过程则通常使用CALL，不能随意交换语法。']],
checks:[['demo_tax(0)与demo_tax(9)分别返回什么？','按本节纯乘法规则分别返回0与18，返回值不依赖demo_sales里有多少行。'],['声明DETERMINISTIC就证明函数一定没有副作用吗？','不能把声明当作完整验证。应检查函数真实实现、所访问状态及数据库规则；本例因为只算x*2才容易判断。']],prerequisites:['sql-functions','sql-ddl']}
});
Object.assign(BEGINNER_GUIDES,{
'sql-model':{
why:'假设要保存学生、课程和选课成绩。把所有信息塞进一张大表，学生改名时可能需要改很多行，也容易漏改。本节先学习怎样描述数据之间的约束，再用一个很小的属性闭包程序理解“知道某些字段，就能确定哪些字段”。这一步是在设计表之前把业务规则想清楚。',
terms:[['实体与属性','学生是实体，学号、姓名是属性；一张表的一行通常代表一个实体或一次联系。'],['函数依赖 X→Y','如果两行的X相同，就要求Y也相同。例如学号确定姓名；反向不一定成立，因为可能有同名学生。'],['属性闭包','从一组已知属性出发，把能够由依赖推出的属性全部收集起来。闭包不是对当前几行数据做统计。']],
steps:[['先把符号翻译成业务含义','示例用A、B、C避免被具体表名干扰。把A想成学号，B想成班级编号，C想成班级教室；假设业务保证A→B、B→C。已知一个学号后，先能找到班级，再能找到教室。这种连续推导就是闭包算法要做的事情。'],['从真正已知的属性开始','closure最初只有A，不能直接把所有属性都加入，否则无法区分哪些结论由规则支持。扫描第一条A→B时，左侧A已经在集合中，于是加入B，集合变成{A,B}。这里的集合不保存重复元素，反复加入B不会造成无限增长。'],['继续应用规则直到不再增加','扫描B→C时，B已经得到，于是加入C。下一轮再扫描两条规则，集合仍是{A,B,C}。before保存本轮开始前的副本，比较发现没有新属性，循环结束。需要重复扫描，是因为规则的书写顺序未必正好符合推导顺序。'],['把计算结果用于设计判断','输出ABC表示从A可推出这三个属性。如果整个关系恰好只有A、B、C，那么A具有超键能力；是否为候选键还要检查有没有更小的属性集合也能确定全表。范式设计还要检查具体依赖、无损分解和依赖保持，闭包程序本身并没有自动完成这些判断。']],
notes:[['closure={\'A\'}','花括号建立集合，表示当前确定知道A；这与包含一行业务数据的数据库表不是同一种对象。'],['set(left)<=closure','Python集合的<=表示“左侧是右侧的子集”，即依赖左边的所有属性都已知，并不是按字母大小比较。'],['before=set(closure)','必须复制集合；若直接令before指向同一个可变集合，后面的更新也会改动before，可能错误地认为从未发生变化。']],
checks:[['把依赖改为C→B、B→A，仍从A开始，闭包是什么？','只有A。函数依赖有方向，不能因为C能推出A就反过来认为A能推出C；两条依赖的左侧都不满足。'],['表中暂时没有重名，能据此认定姓名是候选键吗？','不能。候选键是对所有合法数据的业务约束，不是当前样本恰好无重复；应问业务是否允许同名。']],prerequisites:[]},
'sql-types-null':{
why:'数据库字段不仅要“能放进去”，还要表达正确含义。例如价格需要精确小数，缺失成绩不能随便填0，否则平均分会失真。本节用四笔销售中的一个缺失金额，说明类型选择与NULL如何影响统计。先理解数据的含义，再写查询，才能避免语句执行成功但答案错误。',
terms:[['数据类型','规定字段可以存什么值及其运算规则。INT用于整数，DECIMAL用于规定精度的十进制数，字符串与日期又有各自规则。'],['NULL','表示未知或缺失。它不等于0，也不等于空字符串；不知道金额和确实卖了0元是两种情况。'],['三值逻辑','SQL条件除了TRUE和FALSE，还可能得到UNKNOWN。WHERE只保留TRUE，因此与NULL做普通等号比较不会选中缺失行。']],
steps:[['逐行读懂练习数据','demo_sales共有四行，金额依次为20、30、10、NULL。前三行的金额已知，第四行只知道有这条销售记录，却不知道金额。先在纸上分别数“记录有几条”和“金额有几条”，会得到4和3，为后面核对SQL建立直观答案。'],['理解两个COUNT的统计对象','COUNT(*)的星号表示按行计数，这里四条记录全部参与。COUNT(amount)则统计amount表达式不为NULL的行，因此只数20、30、10。它不是把金额相加，也不是统计不同金额的种数；求和要用SUM，去重计数还需要DISTINCT。'],['用一条查询同时得到两种口径','FROM demo_sales指定读取哪张表；SELECT后写两个聚合表达式，就得到一行两列的结果4、3。虽然没有显式GROUP BY，聚合函数仍会对全部输入行作为一个整体统计。两个客户端逐列打印这一行，因此预期输出是4 3。'],['把缺失值规则应用到筛选','如果想找缺失金额，应写amount IS NULL。amount=NULL得到UNKNOWN，无法通过WHERE。COALESCE(amount,0)可以在显示时提供替代值，但它代表你选择了一个替代规则，不能证明真实销售金额就是0。是否替代必须与业务含义一致。']],
notes:[['COUNT(*)','按输入行计数，即使某行所有被查询的普通字段都为空，这一行仍是一行。'],['COUNT(amount)','忽略该表达式为NULL的行；若整张表没有行，COUNT仍返回0，而不是返回NULL。'],['cursor.execute','客户端把SQL交给MySQL执行，Python并没有自己遍历四条销售数据计算COUNT；运行前必须准备本节练习表。']],
checks:[['再插入一行amount=0，两个COUNT变为多少？','COUNT(*)为5，COUNT(amount)为4，因为0是一个已知数值，不是NULL。'],['WHERE amount<>20会保留NULL那行吗？','不会。NULL与20的不等比较仍是UNKNOWN；若业务要保留缺失行，需要另外写OR amount IS NULL。']],prerequisites:['sql-model']},
'sql-ddl':{
why:'应用代码可以校验年龄，但有人直接执行SQL时也可能写入非法数据。数据库约束相当于表自身的规则，让不同写入入口都遵守基本要求。本节从建立demo_people开始，逐个认识主键、非空和检查条件，再通过查询验证插入后的状态。建表与查询是两种不同工作。',
terms:[['DDL','数据定义语言，用来建立或改变数据库结构，例如CREATE TABLE与ALTER TABLE；它描述表长什么样。'],['主键 PRIMARY KEY','唯一标识一行的字段或字段组合。本例id不能重复且不能为NULL，便于准确找到某个人。'],['约束','数据库在写入时检查的条件。NOT NULL禁止缺失，CHECK检查值是否合法，外键检查引用的另一行是否存在。']],
steps:[['先阅读建表而不是直接运行查询','初始化脚本先创建专用数据库，再建立demo_people。id INT PRIMARY KEY说明id是整数且承担行身份；name VARCHAR(30) NOT NULL说明姓名最长允许30个字符且必须提供。列名、类型和约束共同构成表结构，不是三条独立查询。'],['理解年龄条件的精确含义','age INT CHECK(age>=0)要求已知年龄不能为负。插入20会通过，插入-1会被拒绝；插入NULL时条件得到UNKNOWN，因此仅靠这一CHECK不能禁止缺失。若需求要求每个人都填写年龄，还应增加NOT NULL，不要把两种约束混为一谈。'],['按列对应关系插入两个人','初始化脚本插入(1,Lin,20)与(2,Yu,22)，每一项按表定义的列顺序对应id、name、age。初学时更推荐显式写列名，避免后续表结构变化使值对应错误。脚本会重置专用练习表，因此应在练习库运行，不能拿业务表试验。'],['最后用查询观察已经保存的数据','SELECT name,age只取姓名和年龄，不输出id；ORDER BY id则仍可按id排序。因此最终先看到Lin 20，再看到Yu 22。C++和Python示例执行的是这个观察查询，建表与插入已经在上方初始化SQL中完成，不能省略准备步骤。']],
notes:[['CREATE TABLE demo_people','创建的是持久的表结构，执行成功后其他连接也能在适当权限下访问，不是创建程序内的临时数组。'],['CHECK(age>=0)','检查写入值是否满足条件；它不会自动把负数改成0，也不会自动补全缺失年龄。'],['ORDER BY id','明确输出顺序，避免把当前数据库碰巧返回的物理顺序误认为永久保证。']],
checks:[['插入新的id=1但姓名不同，为什么仍失败？','主键比较的是id，不是整行是否相同；已有id=1时再插入相同主键违反唯一约束。'],['要表示“年龄必须填写且不少于18”，应怎样定义？','可以使用age INT NOT NULL CHECK(age>=18)。NOT NULL排除缺失，CHECK再约束已知数值的范围。']],prerequisites:['sql-types-null']},
'sql-crud':{
why:'查询只是读取数据，真实系统还要新增订单、修改库存和删除草稿。初学者最容易把“修改某一行”写成“修改所有行”，或把增量更新写成覆盖。本节让你跟踪三次写入前后的表状态，理解INSERT、UPDATE、DELETE分别改变什么，再用SELECT检查结果。',
terms:[['CRUD','Create、Read、Update、Delete的缩写，对应新增、读取、修改、删除四类操作；这里的Create通常指新增记录。'],['WHERE条件','限定本次操作作用于哪些行。它不是注释，缺少条件的UPDATE或DELETE通常会影响整张表。'],['受影响行数','驱动报告写操作影响了多少行，用于核对预期；不同连接选项可能区分匹配行与真正改变值的行。']],
steps:[['先建立可追踪的起始状态','demo_sales初始化后id=1的金额为20，id=2为30，另外还有id=3和4。把id视为每条销售的唯一编号，后续操作都根据编号定位，避免把同部门多条销售误当作同一条。初始化会重置练习数据，所以推演从明确状态开始。'],['新增一条，再修改已有的一条','INSERT加入id=5、部门C、金额9，使表暂时多一行。随后UPDATE中的SET amount=amount+5让id=1的旧值20变成25。右侧先读取这一行原来的amount再加5，不是把所有金额设为5；WHERE id=1限定了修改对象。'],['删除条件匹配的整行','DELETE FROM demo_sales WHERE id=5删除刚加入的第5行，它不是只清空amount字段。若想保留记录却标记某个字段缺失，应考虑UPDATE设置NULL，并确认字段允许缺失。新增后又删除，最终记录数回到初始数量，但id=1的金额变化仍保留。'],['用读取语句验证写入结果','最终查询WHERE id<=2，只保留id=1、2，ORDER BY id确保编号顺序，SELECT id,amount得到1 25与2 30。客户端示例读取的是初始化脚本完成三次写入后的结果；你可以逐条执行脚本并在每一步插入SELECT，观察状态如何变化。']],
notes:[['SET amount=amount+5','表达“在原值基础上增加”，对于NULL原值结果仍为NULL，不能默认所有列都已有数字。'],['DELETE FROM demo_sales WHERE id=5','删除匹配记录；对不存在的id执行通常不会报“找不到”异常，而是影响0行。'],['SELECT id, amount','只选择要核验的两列，便于把实际结果与手工推演比较，不需要把表的所有字段都打印出来。']],
checks:[['把SET amount=amount+5改成SET amount=5，id=1最终是多少？','变成5。这是覆盖赋值，原来的20不参与计算。'],['删除id=5后再次执行同一条DELETE，会怎样？','通常影响0行，因为目标已经不存在。业务是否把这视为成功，需要由接口语义决定。']],prerequisites:['sql-ddl','select']},
'select':{
why:'假设老师要列出85分及以上的学生，并让高分排在前面。你不需要把整张表搬进程序再筛选，可以直接用SQL描述需要的结果。本节把一条查询拆成“从哪里读、保留谁、显示什么、怎样排序”，帮助你从自然语言逐步写出查询，而不是背一段固定语法。',
terms:[['SELECT列表','指定结果要显示哪些列或表达式，例如name、score；没有被显示的列仍可能用于筛选或排序。'],['谓词','能够判断一行是否满足条件的表达式，例如score>=85。WHERE只保留判断结果为TRUE的行。'],['参数绑定','把SQL结构和用户提供的值分开发送。C++示例使用?占位，Python连接器使用%s，阈值85单独传入。']],
steps:[['先把输入表读成三张小卡片','students中有Lin 92、Chen 76、Yu 88，并分别带有id和class_id。FROM students指定这些记录是查询的数据来源。先认识原始行，才能知道过滤后究竟少了谁；SQL不会凭空生成不存在的学生，也不会因为排序就修改表里的原始成绩。'],['用WHERE逐行做筛选','对Lin判断92>=85为真，保留；对Chen判断76>=85为假，排除；对Yu判断88>=85为真，保留。因此剩下两行。这里比较的是数字大小，若把成绩错误存为字符串，可能引入转换或排序语义的问题，所以表设计与查询不能完全分开。'],['选择显示列并明确排序','SELECT name,score要求结果仅包含姓名和成绩。ORDER BY score DESC表示成绩从高到低，随后id ASC为同分学生提供确定的先后顺序。最终Lin 92排在Yu 88之前；查询语句的书写顺序与理解时的逻辑处理顺序并不完全相同。'],['把可变化的阈值交给参数','用户下次可能选择90分，不应拼接一整段SQL字符串。预处理语句保留固定结构，把85或90作为值绑定。Python的单元素参数元组要写成(85,)，末尾逗号不可省略；它表示一个参数集合，而不是普通括号里的数字。']],
notes:[['score >= ?','C++连接器中的?代表一个待绑定的值，随后setInt(1,85)绑定第一个参数；参数编号从1开始。'],['cursor.execute','Python版本通过第二个参数传递阈值，驱动负责正确处理值，不能把%s当作普通字符串格式化来手工替换。'],['ORDER BY score DESC, id ASC','先比较成绩，只有成绩相同才比较id。第二个排序键不会打乱不同成绩之间的顺序。']],
checks:[['阈值改为90，结果是什么？','只剩Lin 92。Yu的88不再满足条件，Chen仍被排除；排序不会让被过滤的行重新出现。'],['去掉ORDER BY后，是否一定仍先输出Lin？','不保证。数据库可采用不同访问路径，只有显式排序才能对结果顺序提出要求。']],prerequisites:['sql-types-null']},
'join':{
why:'学生表保存class_id，班级表保存班级名称。如果只查学生表，你只能看到班级编号，不能直接得到“A班有哪些人”。JOIN把相关表连接起来。本节还要求没有学生的C班也出现在结果中，因此要理解LEFT JOIN保留左表的含义，而不是只背连接语法。',
terms:[['连接键','两张表用来对应的字段。本例students.class_id引用classes.id，值相等说明学生属于该班级。'],['表别名','classes c中的c是表的简写，c.id可明确表示班级编号，避免两张表都有id时产生歧义。'],['左外连接','以左表每行作为必须保留的对象；若右表没有匹配行，结果中右表相关列用NULL补齐。']],
steps:[['确定哪个对象必须全部显示','需求是“列出所有班级及学生”，所以把classes放在LEFT JOIN左边。A、B、C三行班级都必须进入结果。若把students放左边，空班级没有任何学生行作为起点，就无法靠相同写法保留下来；连接方向来自需求而不是习惯。'],['对每个班级寻找全部匹配学生','ON s.class_id=c.id是连接条件。A班编号1，匹配Lin与Chen，所以A会出现两行；B班编号2匹配Yu，得到一行。连接不是把每个班级只挑一名学生，多对一关系反向读取时，一行班级会与多行学生分别组成结果。'],['为空班级补齐并处理显示','C班没有匹配学生，LEFT JOIN仍保留一行，此时s.name为NULL。COALESCE(s.name,\'-\')选取第一个非NULL值，把缺失姓名显示为短横线。这个显示替代没有向students表插入一个叫“-”的学生，底层数据并未改变。'],['按稳定顺序核对四行结果','SELECT取班级名称和处理后的姓名，ORDER BY c.id,s.id先按班级编号，再按学生编号排列。结果为A Lin、A Chen、B Yu、C -。如果将右表条件错误放到WHERE中，补齐NULL的空班级可能被过滤掉，写条件时要重新检查是否仍满足保留所有班级的需求。']],
notes:[['LEFT JOIN students s','右表提供可有可无的匹配信息，左表的保留规则由LEFT决定，并非由SELECT里先写哪个字段决定。'],['ON s.class_id=c.id','表示关系匹配规则；不能误写成s.id=c.id，因为学生编号与班级编号含义不同。'],['COALESCE(s.name, \"-\")','课程SQL使用单引号字符串；其作用是显示占位符，不能把它理解为补建一条学生记录。']],
checks:[['A班再增加一名学生，连接结果总行数变为多少？','变为5行。A班每名学生各形成一条匹配结果，空C班仍保留一行。'],['若改为INNER JOIN，哪一行消失？','C -消失，因为内连接只保留两边都匹配成功的组合。A和B的匹配行仍在。']],prerequisites:['select','sql-model']},
'group-by':{
why:'如果老师想知道每班人数，直接SELECT会得到逐个学生的明细，而不是每个班级一行。GROUP BY把具有相同分组值的记录放在一起，再用聚合函数计算每组结果。本节用三名学生手工分成两组，再说明为什么人数条件应放在HAVING，而不是WHERE。',
terms:[['分组键','决定哪些行归为一组的字段，例如class_id。键值相同的学生进入同一组，即使姓名不同也不影响分组。'],['聚合函数','对一组行计算一个值，如COUNT计数、SUM求和、AVG平均。聚合把多行的信息汇总成结果。'],['HAVING','对已经形成的分组结果进行筛选，可使用COUNT等聚合值；WHERE则在形成分组之前筛选原始行。']],
steps:[['先把明细按班级拆成两个集合','students中Lin和Chen的class_id都是1，Yu的class_id是2。GROUP BY class_id把前两人组成班级1这一组，Yu单独组成班级2这一组。结果粒度从“一名学生一行”变成“一个班级一行”，这是后面理解SELECT内容的关键。'],['在每组内部计算人数','COUNT(*)数每组中输入行的数量，所以班级1得到2，班级2得到1。AS student_count给结果列起一个便于阅读的名字，不会改动表中的列名。聚合后不能随意同时显示一个未分组的学生姓名，因为同组可能有多个姓名而没有唯一答案。'],['用HAVING保留人数足够的组','HAVING COUNT(*)>=2检查的是刚计算出来的组人数。班级1的2满足条件，班级2的1不满足，于是只剩班级1。若把这个聚合条件放在普通WHERE阶段，就还没有分组人数可供判断；需要分清筛选发生在汇总之前还是之后。'],['确认输出与空组的边界','SELECT class_id,COUNT(*)最终输出1 2，ORDER BY class_id定义班级结果的顺序。这里数据来源只有students，完全没有学生的班级不会自动形成一个人数为0的组。若要显示空班级，需要先从classes左连接students，并注意COUNT学生主键与COUNT(*)的差别。']],
notes:[['GROUP BY class_id','使用班级编号作为分组键，而不是按当前相邻行“碰巧挨在一起”来分组；输入排序不是分组语义的前提。'],['COUNT(*) AS student_count','别名用于表达结果含义，这里人数来自每组的全部行，而不是某个姓名字符串的长度。'],['HAVING COUNT(*) >= 2','对组进行筛选，可能一次移除一整组；它不是在每组里只留下两名学生。']],
checks:[['若先加WHERE score>=85，再分组，每班人数是多少？','先排除76分的Chen，剩Lin和Yu，所以班级1、2都为1；再执行原HAVING时没有组达到2，结果为空。'],['空表执行无GROUP BY的COUNT(*)与按class_id分组有什么区别？','前者返回一行0；后者没有任何分组，返回零行。统计的结果形状也需要考虑。']],prerequisites:['select','join']},
'sql-subquery':{
why:'需求可能是“找出所在部门至少有一笔大额销售的所有记录”。注意不是只找大额那一笔：同部门的小额记录也要保留。相关EXISTS能把这种“存在一个见证”的判断直接写出来。本节让你逐行带入外层部门，看到为什么A部门20和30两行都会出现。',
terms:[['子查询','嵌在另一条SQL中的查询，可以提供单值、集合或存在性判断，具体形状决定可用位置。'],['相关子查询','内部查询引用外层当前行的字段，本例t.dept=s.dept中的s.dept来自外层销售记录。'],['EXISTS','只问内部查询是否至少返回一行；不要求取出那一行的具体数值，也不按匹配数量复制外层行。']],
steps:[['先区分外层任务与内层证据','外层s负责列出候选销售，内层t负责寻找“同部门且amount>=25”的证据。两者都读取demo_sales，但使用不同别名，表示两个独立的逻辑角色。不要因为使用同一张表，就把s与t理解为必须是同一条记录。'],['把A部门第一行代入条件','外层id=1的部门是A、金额20。内层比较t.dept=A，并寻找金额至少25的行，id=2金额30就是见证。因此EXISTS为真，外层id=1被保留。关键是内层金额条件作用于t，不是直接要求外层s.amount>=25。'],['继续处理其余候选行','外层id=2同样属于A，也能找到金额30那一行，因此被保留。B部门的金额只有10和NULL，没有一行的比较结果为TRUE，所以B的两条外层记录都被排除。存在性判断不因为找到多个见证而重复输出外层记录。'],['从概念推演走向真实执行','结果按s.id排序后输出1 A、2 A。逐行代入是理解语义的方法，不表示MySQL必须真的对每个外层行重新完整执行子查询；优化器可能改写为半连接或采用其他策略。写对含义后，再用执行计划分析性能。']],
notes:[['SELECT 1','EXISTS关心有没有结果行，因此选常数1即可；这个1不是要求记录编号必须等于1。'],['t.dept=s.dept','建立内部记录与当前外部记录的关联，省略它会变成“全表存在任意大额销售就保留所有外层行”。'],['EXISTS (...)','返回存在性逻辑值；若要找没有对应证据的记录，可考虑NOT EXISTS，而不是随意用含NULL的NOT IN替代。']],
checks:[['若把A部门金额30改为24，会输出什么？','结果为空。A、B都没有金额至少25的见证，所有外层记录都不满足EXISTS。'],['同部门新增两条大额销售，会让id=1重复出现两次吗？','不会。EXISTS只有真或假；找到一个或多个见证都只表示该外层行通过筛选。']],prerequisites:['select','join']}
});
Object.assign(BEGINNER_GUIDES,{
'sql-union':{
why:'有时同一个结果来自两个渠道：一份查询列出A部门销售，另一份列出金额不少于20的销售。我们希望把名单合并，但同一条记录不要出现两遍。UNION解决的是把结果上下拼接，与JOIN把相关字段左右组合不同。先画出两份名单，再选择是否去重，会比直接套语法更可靠。',
terms:[['集合运算','把多个查询结果视作行的集合来组合，比较对象是整行，而不是只看第一列。'],['UNION','合并并去除重复结果行；两边查询必须产生相同数量、位置相互兼容的列。'],['UNION ALL','保留每一行及其重复次数，常用于不同批次明细汇总；它不是语法上更长就一定更慢。']],
steps:[['分别算出左侧查询','WHERE dept=\'A\'保留id=1和2，SELECT id,dept形成(1,A)、(2,A)。注意此时结果列只有编号和部门，金额不参与后续整行相等判断。应先独立验证左右查询，再检查合并规则，避免把错误归因于UNION。'],['再算出右侧查询','WHERE amount>=20同样选中金额20和30的两条记录，投影成(1,A)、(2,A)。两边列的顺序均为id、dept，因此可以直接对应。如果一边写dept,id，即使数据库能做类型转换，语义也已经不同，不能指望UNION按列名自动对齐。'],['把四条候选结果做整行去重','逻辑上先得到(1,A)、(2,A)、(1,A)、(2,A)，再把完全相同的行各保留一份。最终只有两行。如果选的是id,amount，而同一id对应不同amount，那么整行并不相同，不会只根据id自动合并；UNION也不是数据库主键去重工具。'],['在合并后定义最终顺序','末尾ORDER BY id对整体结果排序，输出1 A和2 A。左侧或右侧各自的扫描顺序都不能代表合并结果的稳定顺序。需要保留重复时换成UNION ALL；应先根据业务确认重复是否有意义，再考虑省去去重操作可能带来的性能收益。']],
notes:[['UNION SELECT','连接的是两条SELECT结果，不是向表中INSERT数据；执行不会改变demo_sales。'],['SELECT id,dept','两边选择列表按位置对应，因此列数与数据含义都要一致，不能只检查列名相同。'],['ORDER BY id','放在整个集合表达式最后，表达最终排序需求；没有ORDER BY的集合结果不承诺顺序。']],
checks:[['本例改为UNION ALL会有几行？','有4行，因为左右各两行，重复也保留。排序后相同id的两行仍然都存在。'],['两行分别为(1,A)与(1,B)，UNION会只留一行吗？','不会。整行的部门不同，它们是两个不同结果行，即使第一列id相同。']],prerequisites:['select']},
'sql-window':{
why:'如果既要保留每笔销售，又想知道它在本部门排第几，普通GROUP BY会把多条明细压成一行，无法满足需求。窗口函数在明细旁边增加计算结果。本节逐个部门排序，再给每行编号，让你看清“计算排名的顺序”和“最后显示行的顺序”为什么可以不同。',
terms:[['窗口','当前行进行计算时所参考的一组行。PARTITION BY把输入划分为互不混用的部门窗口。'],['ROW_NUMBER','在每个窗口的指定顺序中依次给出1、2、3等编号；即使值相同，每行仍获得不同编号。'],['OVER','说明窗口函数怎样分组、怎样排序；它与普通SELECT外层的ORDER BY作用阶段不同。']],
steps:[['先保留四条销售明细','本例没有GROUP BY，因此id=1、2、3、4四行都还在。A部门包含金额20、30，B部门包含10、NULL。窗口计算不会把A的两条销售合并成一条总额，而是在每条原始行旁边添加rn这一列。'],['在A部门内部按金额降序编号','OVER中的PARTITION BY dept先分部门，ORDER BY amount DESC,id再在部门内排序。A中id=2金额30排第一，rn=1；id=1金额20排第二，rn=2。附加id排序键使金额相同时仍有确定的编号次序，不依赖数据库碰巧如何返回同分行。'],['处理B部门及NULL','在MySQL本例的降序金额排序中，已知金额10位于NULL之前，因此id=3得到1，id=4得到2。NULL不是0，也不代表负数；排序中的位置与数值比较中的UNKNOWN规则需要分别理解。换数据库时还应确认其默认NULL排序规则。'],['按外层顺序展示已经算好的编号','最外层ORDER BY id把行重新排列为1、2、3、4，编号不会重新计算，于是输出1 2、2 1、3 1、4 2。若要只取每部门前三名，通常先在子查询或CTE中计算rn，再在外层按rn筛选，不能把本层尚未得到的窗口结果随意写进WHERE。']],
notes:[['ROW_NUMBER() OVER(...)','括号中的规则决定每行编号，不表示整个结果最后就必须按这个顺序显示。'],['PARTITION BY dept','各部门从1重新编号；删除这一部分后，四条记录会在一个共同窗口内统一编号。'],['AS rn','给新增计算列命名，没有往原表永久增加一个rn字段。']],
checks:[['若两笔销售金额相同，ROW_NUMBER会给相同排名吗？','不会，它必须分配不同序号；本例用id作为并列时的确定排序依据。需要并列名次时应了解RANK或DENSE_RANK。'],['去掉最外层ORDER BY id，rn是否失效？','不会失效，窗口规则仍决定rn；只是结果行的最终展示顺序不再由这一外层排序保证。']],prerequisites:['group-by','sql-subquery']},
'sql-cte':{
why:'查询变长时，把中间结果取一个名字会更容易读。递归CTE还能从起点不断生成下一层数据，例如数字序列或组织层级。本节从1生成到5，每轮只增加一个数字，让你看到递归的起点、推进规则和停止条件分别在哪里；缺少任何一部分都容易出错。',
terms:[['CTE','Common Table Expression，即公用表表达式。WITH给一个查询结果命名，使主查询可以像引用表一样引用它。'],['锚点','递归的非递归起始部分。本例SELECT 1先产生第一行n=1，而不是从空集合凭空开始。'],['递归成员','引用CTE自身并产生下一轮结果的部分。本例从已有n生成n+1，并用n<5限制继续扩展。']],
steps:[['为结果及列起名字','WITH RECURSIVE seq(n)表示定义名为seq的递归结果，其中有一列叫n。seq不是提前建好的业务表，而是本条语句范围内可引用的查询名称。括号里的n是列名，不是传给函数的数值参数，这一点和普通函数调用容易混淆。'],['锚点先提供数字1','括号中的第一个SELECT 1只产生一行1。UNION ALL把锚点产生的行与递归部分产生的行共同纳入结果。这里保留每轮生成的数字，不做自动去重；如果递归逻辑会反复生成同一状态，就必须另行设计防环或终止机制。'],['一轮一轮手工展开','递归部分读到n=1时，1<5成立，生成2；随后2生成3、3生成4、4生成5。当轮到n=5时，5<5为假，不再生成6。条件检查的是生成前的旧n，因此上界是5而不是4。把这一轮次写清楚，就不容易出现边界差一错误。'],['主查询只负责使用完整序列','最终SELECT n,n*n从seq中取每个数字和平方，ORDER BY n保证1到5的顺序。得到1 1、2 4、3 9、4 16、5 25。递归列的类型等规则还受锚点影响，字符串路径等更复杂示例需预留合适类型与长度，不能只照搬整数例子。']],
notes:[['WITH RECURSIVE seq(n)','RECURSIVE声明允许自引用；seq的生命周期是这条查询，不会自动保存在数据库里供以后调用。'],['WHERE n<5','控制是否继续扩展，是算法正确终止的业务条件；服务器递归深度上限只能作为额外限制。'],['SELECT n,n*n','乘法表达式计算每行的平方，不会修改seq中的n值，也不需要另外建立平方列。']],
checks:[['把条件改为n<3会输出哪些n？','输出1、2、3。n=2仍能生成3，n=3不再继续。'],['去掉终止条件会自动在数字最大值之前正常结束吗？','不能这样设计。查询可能触发递归深度或数值范围错误，必须由问题本身提供明确终止条件。']],prerequisites:['sql-union']},
'sql-json':{
why:'有些记录的附加属性不固定，例如课程标签可能包含语言、难度和扩展设置。JSON可以把这些键值组织成一个文档，但查询时仍要分清JSON值与普通SQL值。本节只构造一个小文档并取出两项，先理解路径和类型转换，再考虑是否适合把业务字段放进JSON列。',
terms:[['JSON对象','由键和值组成的文档，例如{"lang":"cpp","level":2}。键lang对应字符串，键level对应数字。'],['JSON路径','描述在文档哪里取值；$表示文档根，$.lang表示根对象的lang成员，不是字符串中的某个字符下标。'],['类型转换','JSON字符串、SQL字符串和SQL整数有不同使用方式。JSON_UNQUOTE去掉JSON字符串表示层，CAST明确转换数值类型。']],
steps:[['先看JSON_OBJECT怎样组装文档','JSON_OBJECT的参数按键、值交替出现：lang对应cpp，level对应2。因此本例的输入不是一张存储表，而是查询中临时构造的对象。构造JSON能保证字符串得到适当转义，比自己拼接大括号、引号和用户输入更可靠。'],['沿路径取出语言字段','JSON_EXTRACT接收文档和路径$.lang，得到JSON字符串值"cpp"。它仍保留JSON值的语义，不能因为肉眼看到几个字母就假定已经是普通SQL文本。JSON_UNQUOTE将其转换为未带JSON引号的字符串cpp，方便输出或与普通字符串处理结合。'],['提取并明确转换等级','第二列用$.level取出数字2，再CAST为UNSIGNED，即无符号整数类型。这个例子选择了正常的小非负整数，所以转换直观；实际数据若缺字段、内容是字符串或超出范围，需要设计校验与错误处理，不能把任何JSON值都强行当整数使用。'],['观察一行两列的结果','整个SELECT没有FROM，因为两个表达式都由常量构造。数据库返回cpp和2，客户端按列打印为cpp 2。没有FROM并不代表不是SQL，也不代表客户端在本地解析JSON；这两个JSON函数都由MySQL执行，因此仍需要数据库连接。']],
notes:[['JSON_OBJECT(\'lang\',\'cpp\',\'level\',2)','参数成对出现，键写成字符串，数字2不用字符串引号，才能表达数值而非文本。'],['JSON_EXTRACT(...,\'$.lang\')','路径从根对象取一个成员，字段拼写必须与文档结构一致；不存在的路径不能当成正常已知值。'],['CAST(... AS UNSIGNED)','显式表达预期数值类型，便于后续计算；它不是JSON模式验证器，不会检查整个文档是否符合业务要求。']],
checks:[['把路径改为$.missing，应期待仍输出cpp吗？','不应。该字段不存在，提取结果需要按缺失情况处理；程序不能假设所有文档都有所有键。'],['JSON_OBJECT中的level值写成\'2\'与2相同吗？','文档中的类型不同：前者是JSON字符串，后者是JSON数字。之后某些转换可能得到同一数值，但存储语义不能混淆。']],prerequisites:['select','sql-types-null']},
'sql-charset':{
why:'输入一个“中”字，为什么有的函数说长度1，有的说长度3？因为用户看到的字符和计算机保存的字节不是同一个计量单位。理解这个区别能帮助你设置字段长度、计算传输大小和排查乱码。本节固定使用utf8mb4，把同一份数据用两种长度口径测量。',
terms:[['字符集','规定字符与编码之间的关系。utf8mb4可以表示完整Unicode范围中的字符，并使用可变数量字节编码。'],['字节长度','实际编码占多少字节。LENGTH在本节返回字节数，适合衡量存储或传输尺寸的一部分。'],['排序规则 collation','决定字符串比较和排序怎样看待大小写、重音等差异；它与“能否存下这个字符”的字符集职责不同。']],
steps:[['从确定的字节开始避免环境歧义','0xE4B8AD是“中”在UTF-8中的三个字节。示例使用十六进制字面量，是为了避免终端输入编码或文件保存编码影响演示结果。它并不表示三个中文字符，也不是十进制整数所代表的文字内容。'],['显式告诉数据库如何解释字节','CONVERT(... USING utf8mb4)把这组字节按指定字符集解释成字符串。没有正确编码信息时，同样字节可能显示为乱码。数据库连接的客户端字符集、表列字符集与文件编码是不同环节，排查乱码时应逐个核对，而不是只修改一个字段声明。'],['用字符口径测一次','CHAR_LENGTH得到字符串包含的字符数，本例只有一个“中”，所以结果1。这个口径通常更接近“输入了几个编码字符”，但复杂Unicode组合字符和用户感知的字形仍可能存在差异；不能把它无条件当作所有自然语言的视觉字符计数器。'],['再用字节口径测一次','LENGTH统计同一字符串在该编码中的字节数，得到3。于是输出1 3。换成ASCII字母A时两者通常都为1，容易掩盖区别；测试中文或其他多字节字符，才能让差异显现。VARCHAR长度定义与索引字节限制也应分别查看规则。']],
notes:[['0xE4B8AD','明确给出三个编码字节，便于复现实验；这里不依赖读者键盘输入中文。'],['CHAR_LENGTH','按字符计数，不会因为某个中文字符编码占三字节就把它计为三个字符。'],['LENGTH','按字节计数；不要用它直接限制“最多输入十个汉字”而不考虑编码。']],
checks:[['在utf8mb4下，字符串A中通常对应怎样的两种长度？','A占一个字节，中占三个字节，因此CHAR_LENGTH为2，LENGTH为4。'],['使用不区分大小写的排序规则，会把原始字符串全部改成小写吗？','不会。排序规则影响比较与排序语义，并不自动重写保存的字符内容。']],prerequisites:['sql-types-null']},
'sql-functions':{
why:'日期不是普通整数，月底加一天不能简单把日期文本最后一位加1；缺失字符串也不应该在程序里反复写相同判断。SQL函数可以在查询中完成这些确定的值转换。本节通过闰年2月和NULL替代两个小例子，学习函数参数、返回值以及计算发生的位置。',
terms:[['标量函数','对一组输入值返回一个结果，例如DATE_ADD。它与COUNT这类汇总多行的聚合函数不同。'],['INTERVAL','表达日期或时间间隔的语法，包含数量和单位，如INTERVAL 1 DAY表示一天，不是字符串拼接。'],['COALESCE','按顺序返回第一个不为NULL的参数；只有缺失值被跳过，0和空字符串都属于正常非NULL值。']],
steps:[['明确日期的日历语义','输入日期是2024-02-28，2024是闰年，2月有29天。若把日期当普通字符串或把日号简单加到29而不检查月份，其他日期就会出错。DATE_ADD负责按日历规则推进日期，所以能够处理月底和跨年的情况。'],['阅读DATE_ADD的两个参数','第一个参数给出起始日期，第二个INTERVAL 1 DAY给出增加一个日历日。计算结果为2024-02-29，不是2024-03-01。单位如果改为MONTH或HOUR，含义与边界处理也会变化，不能只看数量1就认为所有调用等价。'],['逐个检查COALESCE的候选值','COALESCE(NULL,\'unknown\')先看到NULL，继续检查第二个参数unknown，发现它是普通字符串，于是返回unknown。这个函数不会修改任何表记录，也不会让数据库以后把所有NULL都永久替换成这个字符串；替代只发生在本次表达式求值中。'],['把两个独立结果放在一行','SELECT中的逗号分开两列，数据库返回日期结果和字符串结果，客户端打印2024-02-29 unknown。这个查询不需要FROM，因为不依赖业务表。学习函数时可先用常量测试边界，再把列名代入，让它逐行处理真实数据。']],
notes:[['DATE_ADD','使用数据库的日期运算规则，返回值不是在原字符串后面直接追加字符。'],['INTERVAL 1 DAY','DAY是单位关键字，表达一天；若希望计算工作日，还需要节假日等额外业务规则。'],['COALESCE(NULL,\'unknown\')','第一个参数明确缺失，第二个提供显示默认值。返回默认值不代表真实业务信息已经变为已知。']],
checks:[['COALESCE(0,99)返回什么？','返回0，因为0不是NULL。COALESCE不按真假值筛选参数。'],['把日期改为2023-02-28再加一天会怎样？','得到2023-03-01，因为2023年2月没有29日；日期函数会按日历跨月。']],prerequisites:['sql-types-null','select']},
'sql-keyset':{
why:'列表翻页常写LIMIT加OFFSET，但翻到很后面时可能需要跳过大量记录；数据同时变化还可能造成重复或遗漏。游标式分页记住上一页最后一个排序位置，再从它后面继续。本节用唯一id作为游标，先理解“从哪里接着读”，再讨论多列排序与并发边界。',
terms:[['分页','把一个大结果拆成多次小结果返回，减少一次传输与展示的数据量；每页必须有明确顺序。'],['游标位置','这里指上次读到的排序键值，不是数据库连接器中的cursor对象。上一页最后id=1就保存数字1。'],['Keyset分页','使用排序键的范围条件继续查询，例如WHERE id>1 ORDER BY id LIMIT 2，避免按页数跳过前面所有记录。']],
steps:[['先规定稳定的排列方式','本例按唯一主键id升序读取学生。Lin的id=1，Chen的id=2，Yu的id=3。唯一性意味着不存在两个学生共享同一排序位置，下一页条件容易表达。如果只按可能重复的score排序，就需要再加id作为决胜键，游标也要保存两部分。'],['用上一页末尾值划定起点','假设上一页最后显示Lin，因此保存last_id=1。WHERE id>1排除已经读到的位置1及之前的记录，保留id=2和3。这里使用严格大于而不是大于等于，否则上一页最后一行会在下一页重复出现。'],['排序后最多取两行','ORDER BY id确定候选的递增顺序，LIMIT 2只返回最前面的两条。SELECT name,score虽然没有显示id，页面实际实现仍通常需要读取或保留最后一行id，才能继续生成下一次请求。本教学输出只关注姓名与成绩。'],['理解适用性和限制','结果是Chen 76、Yu 88。如果后面没有更多记录，下一页为空即可停止。Keyset适合向前或向后连续浏览，不天然支持任意跳到第100页；排序键被修改、删除或新增的并发行为也必须根据业务定义，不能把它当成所有分页问题的万能方案。']],
notes:[['WHERE id > 1','1代表已读到的位置，应由参数传入；不是固定跳过一行，若id有空洞仍按值范围继续。'],['ORDER BY id LIMIT 2','先定义顺序，再限制结果数量；没有稳定排序的“下一页”没有可靠含义。'],['SELECT name, score','演示只打印两列；真正构造下一页链接时应额外获得最后一条记录的排序键。']],
checks:[['若学生id为1、10、30，游标1且每页2条会读取谁？','读取id=10和30。Keyset按键值范围查询，不要求编号连续。'],['把条件改成id>=1会发生什么？','id=1可能再次出现在下一页，造成边界记录重复，所以通常使用严格范围条件。']],prerequisites:['select','sql-index']},
'sql-index':{
why:'表很大时，查询部门A且金额不少于20的记录，如果每次都扫描整表会浪费工作。联合索引像一本按“部门、金额、编号”排序的目录，帮助数据库缩小查找范围。本节先理解键的排列顺序，再看为什么某些查询能直接从索引得到所需列。',
terms:[['联合索引','一个索引键由多个列按给定顺序组成，例如(dept,amount,id)，比较时先看dept，再看amount，最后看id。'],['回表','通过二级索引找到主键后，再访问聚簇索引获取未包含的行数据；不是把查询结果重新写入表。'],['覆盖索引','查询需要的信息可以从所选索引获得，从而可能减少额外的行访问；是否采用仍由优化器决定。']],
steps:[['把复合键想成有序目录','初始化建立(dept,amount,id)索引。A部门的记录在目录中靠在一起，内部又按金额排列。它类似先按城市、再按街道、最后按门牌整理地址，不能随意交换三列顺序后认为目录仍支持完全相同的定位方式。'],['固定第一部分再寻找范围','WHERE dept=\'A\'先限定到A区域，amount>=20再在该区域中定位金额下界。两条A记录金额20和30均满足条件，所以得到id=1、2。只写amount>=20而不约束dept时，同样的金额分散在不同部门区域，访问路径的有效性会不同。'],['核对查询所需列是否已在目录中','SELECT需要id和amount，筛选需要dept，排序需要amount,id，这些都包含在示例索引里。因此具备覆盖查询的条件。InnoDB二级索引还涉及主键信息和MVCC等实现细节，不能把“覆盖”简单理解为无条件零磁盘访问或完全不涉及其他结构。'],['区分能使用与一定使用','示例表只有四行，全表扫描可能非常便宜，优化器未必选择你刚建的索引。应使用EXPLAIN观察，而不是为了看到某个索引名就断言优化器错误。索引也要占空间，并在插入更新时维护，因此要围绕真实查询需求设计。']],
notes:[['CREATE INDEX demo_idx ON demo_sales(dept,amount,id)','在初始化中创建额外访问结构；创建索引不会改变SELECT返回哪些合法数据，只影响可选访问方式。'],['ORDER BY amount,id','在dept固定后与索引后续键顺序一致，有机会利用顺序，最终是否免排序要看实际计划。'],['WHERE dept=\'A\' AND amount>=20','等值条件和范围条件组合形成键区间；不要把范围扫描的总成本一律写成O(log n)，命中行也要访问。']],
checks:[['只查询name，但索引中没有name，还一定覆盖吗？','不一定。若所需列无法从所选索引获得，通常还要访问行记录获取它。'],['索引越多，所有操作一定越快吗？','不是。读取可能受益，但写入需要维护更多索引，存储和缓存压力也会增加。']],prerequisites:['select','sql-ddl']},
'sql-explain':{
why:'索引已经建好，查询却没有使用它，并不一定意味着数据库出错。优化器需要在多种访问方法中估算代价。本节先用一个透明的小算式理解“为什么会选某个计划”，再把这个思路带到EXPLAIN中，避免只盯着一个字段或一个索引名判断性能。',
terms:[['执行计划','数据库准备怎样获取和组合数据的步骤，例如全表扫描、索引范围扫描、连接方式和排序。'],['基数与选择性','基数可描述行数或不同值数量；条件命中比例越小，通常越容易通过索引缩小读取范围。'],['成本估计','优化器根据统计信息和成本模型比较方案的估计工作量，不是提前把每个方案都完整执行一次。']],
steps:[['先识别这是计算模型而非EXPLAIN输出','程序设置rows=1000、matches=20，表示表有1000行，条件预计命中20行。这里没有连接MySQL，也没有读取真实页或索引。模型的目的，是把“存在固定定位成本和逐行访问成本”拆开，让每个数字的来源可见。'],['计算扫描方案的成本','scan=rows把扫描每行的成本简化为1，总成本1000。这忽略了缓存、并行、行宽和顺序I/O等现实因素，但保留“即使只返回少量行，也可能读很多行”的核心现象。输出行数小并不自动意味着执行工作量小。'],['计算索引方案并比较','index=10+matches*4中，10代表一次定位的固定代价，20*4代表命中20行后的额外访问代价，共90。由于90小于1000，程序选择index并输出index 90。数字4是教学假设，不是MySQL对每次回表固定收取的真实费用。'],['把模型意识用于阅读计划','真实查询可先看EXPLAIN中的访问方式、候选与实际索引、预计行数和过滤比例，再结合具体版本理解输出。EXPLAIN ANALYZE会实际执行并报告观测信息，使用前应考虑语句影响。统计信息过时、数据倾斜或参数变化都可能让估计偏离实际。']],
notes:[['rows,matches=1000,20','两者不是同一个概念：表总行数与预计命中行数分别影响不同方案的成本。'],['index=10+matches*4','固定成本加逐行成本的结构便于比较，不应把示例常数当成真实硬件或数据库参数。'],['min(index,scan)','选择较小的估计成本；它并没有证明该方案在所有环境中实际运行一定最快。']],
checks:[['若matches=300，模型会选择哪个方案？','索引成本为10+300×4=1210，大于扫描1000，因此选择scan。命中很多行时扫描可能更合算。'],['EXPLAIN显示预计100行，实际10000行，首先应关注什么？','关注估计偏差及其原因，如统计信息、数据分布或条件相关性；不能只因为用了索引就认为计划良好。']],prerequisites:['sql-index']}
});
</script><script>/* 原创逐步教学稿。API以课内C++17/20标签为准；网络示例均为有限机制模型。 */
(()=>{
const pair=s=>s.split('｜');
function G(id,why,terms,steps,notes,checks,apis=[]){BEGINNER_GUIDES[id]={why,terms:terms.map(pair),steps:steps.map(pair),notes:notes.map(pair),checks:checks.map(pair),...(apis.length?{apis}: {})};}
function A(name,purpose,params,returns,example,pitfall,python){return {name,purpose,params,returns,example,pitfall,python};}
G('stl-query-algorithms','假设有一排成绩，你要找第一个超过及格线的人，或者统计有多少人成绩为偶数。可以自己写循环，也可以把“在哪里找”和“怎样算符合条件”交给标准算法。学习本节时先区分三个问题：找位置、数数量、判断是否存在。它们都在扫描同一批数据，但返回的东西完全不同，使用之前先想清楚你下一步需要什么。',
['谓词｜接受一个元素并返回true或false的函数，例如x>5就是判断这个数是否大于5。算法负责循环，谓词只负责判断一个元素。','迭代器｜表示容器内某个位置的对象，*p读取它所指的元素。end()表示最后元素之后的位置，因此不能对它做*p。','半开区间｜[begin,end)包含begin而不包含end；空容器的两者相同，所以算法自然能处理空范围。'],
['先把数据和要求写成白话｜本例数据是4、7、10、3，要求一是找到第一个大于5的数，要求二是统计偶数。注意“第一个”按原数组次序决定，并非最小或最大。先在纸上写出位置0到3，就能区分返回的位置1与该位置上的值7。输入不需要排序，算法会从左到右逐个检查。','跟着find_if走一遍｜第一次把4交给谓词，4>5为false，继续；第二次把7交进去，结果为true，于是立刻返回指向7的位置。后面的10虽然也满足，但已经不再影响第一次匹配。如果所有元素都不满足，返回的是a.end()，并不是一个值为0的元素。','再做计数而不是查找｜count_if重新遍历整个范围，4%2==0和10%2==0成立，所以计数为2。7和3不贡献计数。这里必须继续看到最后，不能像find_if那样找到一个就停止。因此程序输出7 2，第一个数字是找到的值，第二个数字是匹配总数。','理解空范围和选择算法｜如果数组为空，find_if返回end，count_if返回0，any_of返回false，而all_of返回true，因为没有任何反例。初学者容易把all_of的空范围结果理解为“有元素符合”，其实它只表示没有不符合的元素。需要确认非空时应另外检查empty。'],
['auto p=find_if(...)｜auto让编译器推导迭代器类型，p不是找到的整数；必须先判p!=a.end()再用*p读取。','[](int x){return x>5;}｜[]表示不捕获外部变量，int x是当前元素，return后面的比较产生bool。若门槛保存在变量limit中可用[limit]捕获它。','count_if(...,x%2==0)｜%是取余，除以2余0表示偶数；统计结果与迭代器不是同一种返回类型，不能对它解引用。'],
['将条件改成x>20会输出什么？｜find_if没有匹配，p==end，if块不会输出元素；计数部分仍输出空格和2，因为偶数条件没有改变。','要判断至少一个元素为负数需要count_if吗？｜可以，但any_of更直接，遇到第一个负数即可返回true，无需为了存在性继续统计所有负数。'],[
A('std::find(first,last,value)','找到第一个等于指定值的元素','first/last是范围；value是目标','匹配位置或last','std::vector<int> a{4,7}; auto p=std::find(a.begin(),a.end(),7);','先判p!=a.end()再解引用；线性扫描。','next((x for x in a if x==7), None)返回值而非迭代器。'),
A('std::find_if(first,last,pred)','找到第一个满足条件的元素','pred对每个元素返回bool','匹配位置或last','std::vector<int> a{4,7}; auto p=std::find_if(a.begin(),a.end(),[](int x){return x>5;});','谓词不要修改正在遍历的容器结构。','next((x for x in a if x>5), None)。'),
A('std::count / std::count_if','统计相等或符合条件的元素数','范围及目标值/谓词','计数值','std::vector<int> a{2,2,3}; auto n=std::count(a.begin(),a.end(),2);','总是检查整个范围，通常O(n)。','a.count(2)；sum(x>2 for x in a)。'),
A('std::all_of / any_of / none_of','判断全部、至少一个、一个也没有满足条件','范围和谓词','bool','std::vector<int> a{2,4}; bool ok=std::all_of(a.begin(),a.end(),[](int x){return x%2==0;});','空范围all_of和none_of为true，any_of为false。','all(...)、any(...)、not any(...)。'),
A('std::min_element / max_element','找到最小/最大元素所在位置','范围，可附比较器','迭代器，空范围返回last','std::vector<int> a{4,7}; auto p=std::max_element(a.begin(),a.end());','相等时返回第一个；不能解引用空范围结果。','max(a)返回值；空列表默认会抛异常，可给default。')]);
G('stl-transform-copy','把摄氏温度统一换算、把分数平方、把合格记录复制到新列表，都是“读一批数据，再产生一批结果”的任务。这里最关键的是输出位置：算法不会凭空让一个空vector变长。先理解输入迭代器负责读、输出迭代器负责写，再学习transform、copy、fill和generate，就能避免许多看似能编译却越界的代码。',
['输出迭代器｜告诉算法下一次结果应写到哪里，可以指向已经存在的元素，也可以是每次写入都会追加的back_inserter。','一元变换｜每次读取一个输入，得到一个输出，例如x变成x*x。二元变换则读取两组对应位置的元素。','初始化与赋值｜vector<int> b(3)已经有3个元素；空b只有容量或没有元素时，直接写b.begin()不能创造合法元素。'],
['从一组有负数的数据开始｜输入a为-2、0、3，目标是产生平方结果且保留原数组。手算得到4、0、9，结果数量仍是3。先创建空的b说明我们想逐个追加，而不是覆盖原数据；这样读取a时不会因为修改它的长度而使迭代器失效。','为什么选择back_inserter｜空b的begin等于end，没有任何可写元素。back_inserter(b)是一个特殊适配器，算法向它赋值时会调用b.push_back，因此第一次写4后b有1项，写0后有2项，写9后有3项。只有提供了这种追加行为，空容器才可以接收结果。','逐步执行平方变换｜transform从a.begin读到-2，把它传给lambda，得到4并写出；然后处理0得到0，最后处理3得到9。它不负责打印，也不会把输出保存到某个自动创建的地方，保存在哪里完全取决于第三个参数。随后独立的for循环才把b里的数输出。','换成其他任务时怎样选择｜只想原样复制时用copy；只保留符合条件的输入时用copy_if；已有三个位置都要设为7时用fill；每个位置想通过函数重新产生值时用generate。这些名字看似相近，但有的读输入、有的只写目标，也有的输出数量不固定，先明确数据流再选函数。'],
['transform(...,back_inserter(b),...)｜第三个参数是输出起点，不是新容器本身；back_inserter需要<iterator>。','[](int x){return x*x;}｜每次输入一个整数返回平方；大整数平方可能溢出int，实际题目应按数据范围选择long long。','for(int x:b)｜范围for按b中现有元素顺序读取，这里打印的是变换后的b，a仍是-2 0 3。'],
['把back_inserter(b)改成b.begin()且b为空行吗？｜不行，没有已存在的元素可供赋值。应先b.resize(a.size())，或继续使用追加适配器。','reserve(3)后就能向b.begin写三项吗？｜不行。reserve只预留内存，size仍为0；resize才会创建三个逻辑元素。'],[
A('std::copy(first,last,out)','原样复制一段数据','输入范围与输出起点','写完后的输出迭代器','std::vector<int> a{1,2},b; std::copy(a.begin(),a.end(),std::back_inserter(b));','输出必须可写；重叠复制方向有要求，不要随意让区间互相覆盖。','b=a.copy()；b.extend(a)追加。'),
A('std::copy_if(first,last,out,pred)','复制符合条件的元素','输入、输出和筛选谓词','输出末尾迭代器','std::vector<int> a{-1,2},b; std::copy_if(a.begin(),a.end(),std::back_inserter(b),[](int x){return x>0;});','保留输入中满足条件元素的相对顺序。','b=[x for x in a if x>0]。'),
A('std::transform(first,last,out,op)','把每个元素变换后写出','op是一个输入产生一个输出的函数','输出末尾迭代器','std::vector<int> a{2,3},b(2); std::transform(a.begin(),a.end(),b.begin(),[](int x){return x*x;});','写b.begin前必须有足够现存元素；这里b(2)已创建2项。','b=[x*x for x in a]。'),
A('std::fill(first,last,value)','给现有范围重复赋同一个值','范围和重复值','void，无返回值','std::vector<int> a(3); std::fill(a.begin(),a.end(),7);','不增加容器长度。','a[:]=[7]*len(a)，嵌套可变对象复制要防共享引用。'),
A('std::generate(first,last,generator)','对每个现存位置调用无参函数产生值','目标范围及无参生成函数','void','std::vector<int> a(3); int n=1; std::generate(a.begin(),a.end(),[&n]{return n++;});','捕获引用时变量要活得足够久；这里依次得到1、2、3。','a=list(range(1,4))；更一般可用列表推导调用函数。')]);
G('stl-erase-remove','想从一排数中删掉重复值，直觉上会寻找“去重函数”。但STL把“在范围里整理元素”和“改变容器长度”分成了两层：unique负责把该留下的值放到前面，vector::erase负责真正缩短长度。理解这两个阶段后，删除所有负数、删除指定值、去掉连续重复都能按同一个思路完成，而不必边遍历边乱改下标。',
['逻辑末尾｜算法返回一个位置，表示有用结果到这里为止；它不一定等于容器原来的end。','相邻去重｜unique只把连续相等的元素压成一个，不会在整个数组里寻找所有相同值。','erase区间｜a.erase(first,last)真正删除[first,last)的元素，并更新size；这是容器成员函数。'],
['先判断要保留什么顺序｜输入3、1、3、2、1的相同数字并不都相邻。若要求得到升序的唯一数字，可以先sort成为1、1、2、3、3。这个排序会改变原次序；如果要求保留首次出现顺序，就不能照搬本节，应使用前面vector去重课程中“集合记录已见值”的方法。','手推unique如何整理｜从排序结果开始，先保留第一个1，遇到第二个1跳过，遇到2将它放到下一个保留位置，遇到3继续保留，最后一个3跳过。整理后前3个位置是1、2、3，函数返回下标3的位置。整个vector仍有5个元素，后面两个位置的内容不应再当成有意义的结果。','把逻辑末尾变成真实末尾｜a.erase(newEnd,a.end())删除后面的无用区间，size才从5变成3。代码把unique调用直接嵌入erase参数里，是省略了newEnd变量的写法，不是unique自动调用了erase。初学时可以拆成两行，观察size在两个阶段是否改变。','推广到删除某种值｜remove把所有不等于目标值的元素稳定地移到前面；remove_if根据谓词删除满足条件的项。它们和unique一样返回逻辑末尾，因此vector中常写erase(remove(...),end())。C++20还提供std::erase与erase_if简化这一组合，但必须使用支持该版本的编译配置。'],
['sort(a.begin(),a.end())｜为相邻去重创造条件；排序加去重总成本主要是O(n log n)排序。','unique(...)｜返回迭代器而非删除数量；若想得到新长度，可在vector中计算newEnd-a.begin()。','a.erase(...,a.end())｜修改vector本身的长度，删除位置及后面的迭代器可能失效，不能继续使用旧end。'],
['直接对[1,2,1]调用unique会得到几个有效元素？｜仍是3个，因为没有相邻相等的两个元素。unique不是全局去重器。','只调用remove(a.begin(),a.end(),2)会让size减小吗？｜不会。它整理不等于2的元素并返回新末尾，需要再调用容器erase才能缩短。'],[
A('std::remove(first,last,value)','把不等于value的元素保留到前部','范围和要移除的值','逻辑新末尾','std::vector<int> a{1,2,2,3}; auto e=std::remove(a.begin(),a.end(),2); a.erase(e,a.end());','算法本身不改变size；尾部不再是结果。','a=[x for x in a if x!=2]。'),
A('std::remove_if(first,last,pred)','移走满足谓词的元素','pred返回true表示要删除','逻辑新末尾','std::vector<int> a{-1,2}; a.erase(std::remove_if(a.begin(),a.end(),[](int x){return x<0;}),a.end());','不要把true理解为保留条件。','a=[x for x in a if x>=0]。'),
A('std::unique(first,last)','合并相邻等价元素','通常先排序以实现全局去重','逻辑新末尾','std::vector<int> a{1,1,2}; a.erase(std::unique(a.begin(),a.end()),a.end());','不相邻重复不会消除；需要后续erase。','连续去重可用itertools.groupby；sorted(set(a))改变顺序。'),
A('std::erase / std::erase_if（C++20）','直接对容器执行相应删除','容器与目标值/删除谓词','删除元素数量','std::vector<int> a{1,2,2}; auto removed=std::erase(a,2);','这是非成员函数；需要C++20，不是a.erase(2)。','筛选新列表后用旧长度减新长度得到删除数量。')]);
G('stl-bounds','查找“第一个达到某分数的人”、统计排序表里某个值出现几次，都不只需要回答有没有。lower_bound和upper_bound提供一对位置，把小于、等于、大于目标的区域分开。先把它们看成两把放在数组缝隙里的尺子，再理解二分查找，就不会把upper_bound误认为最后一个相等元素。',
['下界lower_bound｜升序范围中第一个不小于目标的元素位置，也就是第一个>=目标的位置。','上界upper_bound｜升序范围中第一个严格大于目标的位置；它可能是end，而不是某个相等元素。','等值区间｜[lower,upper)恰好包含所有与目标等价的项，长度就是出现次数；左右位置相同表示没有匹配。'],
['标出数据位置｜示例1、2、2、2、4的下标是0、1、2、3、4。先确认它已经升序，否则这些函数依赖的分区前提没有保证。查找2时，0号元素1太小，1号元素2第一次达到目标，因此lower_bound的位置应是1，而不是值2。','再找到等值区域的出口｜从左到右看，1、2、3号位置都等于2，不满足严格大于2；4号位置的值4才满足。因此upper_bound的位置为4。[1,4)包含三个位置，注意右端4不在区间中，正好避开了值4。','看懂equal_range返回的两个量｜equal_range一次把上下界作为一对迭代器返回。auto [l,r]用结构化绑定给这两个位置起名字。vector迭代器可相减，所以l-a.begin()是1、r-a.begin()是4、r-l是3。若换成链表迭代器，不能照写减法，应考虑distance及其线性成本。','不存在目标也有合理位置｜若查找3，下界与上界都在值4之前，也就是位置4，计数为0；若查找9，两者都为end。返回end不是异常，而是说明插入到末尾才能保持有序。任何时候先判断位置是否为end，再读取元素，不能因为查找函数正常返回就直接解引用。'],
['auto [l,r]=equal_range(...)｜C++17结构化绑定展开pair；两者都是迭代器。','r-l｜这里只适用于vector这种随机访问迭代器，表示相等元素个数，不是数值差。','比较器必须一致｜若数据按降序排序，边界算法也要传相应降序比较器，否则排序关系与查找关系不匹配。'],
['[1,2,2,4]中查3的上下界是什么？｜都指向4的下标3，因此等值区间为空；这仍给出了保持升序时3应插入的位置。','在set中应优先用通用lower_bound还是成员函数？｜优先s.lower_bound，它能利用树结构进行对数查找；通用算法在非随机访问迭代器上可能进行线性次数的移动。'],[
A('std::lower_bound(first,last,value)','找升序范围第一个>=value的位置','按同一比较关系排列的范围及目标','迭代器或last','std::vector<int> a{1,2,4}; auto p=std::lower_bound(a.begin(),a.end(),3);','查到的是插入边界，不能据此直接断言值存在。','bisect.bisect_left(a,3)返回下标。'),
A('std::upper_bound(first,last,value)','找第一个>value的位置','同上','迭代器或last','std::vector<int> a{1,2,2,4}; auto p=std::upper_bound(a.begin(),a.end(),2);','上界不是最后一个相等元素。','bisect.bisect_right(a,2)。'),
A('std::equal_range(first,last,value)','同时得到所有等值元素的半开范围','有序范围与目标','pair<iterator,iterator>','std::vector<int> a{1,2,2}; auto [l,r]=std::equal_range(a.begin(),a.end(),2);','空区间说明目标不存在；区间两端仍可能等于end。','用bisect_left和bisect_right组成下标对。'),
A('std::binary_search(first,last,value)','只判断是否存在目标','有序范围与目标','bool','std::vector<int> a{1,3}; bool found=std::binary_search(a.begin(),a.end(),3);','不返回位置；需要位置时改用lower_bound并核对等价性。','i=bisect_left(a,x); found=i<len(a) and a[i]==x。')]);
G('stl-set-algorithms','两个课程名单分别按学号排列，想找共同选课的人、所有选课的人，或者只选了第一门的人。这就是交集、并集和差集。STL的“集合算法”可以直接处理有序vector，不要求容器类型必须是set。理解两个指针如何比较当前值，才能知道为什么输入顺序和重复次数都会影响结果。',
['交集｜两个输入都拥有的值；多重集合语义下某值保留两侧出现次数的较小值。','并集与合并｜set_union对同值保留较大的出现次数；merge把两侧所有元素都保留，所以它们不是同一个操作。','差集｜A减B保留A中扣除B对应次数后剩下的元素，方向交换通常改变答案。'],
['给两个名单排好序｜本例a为1、3、5，b为3、4、5，两者均升序。算法不会先帮你排序，也不要求它们已经去重。先排序的原因是比较两个当前值后，可以确定较小值以后不可能再与另一边更大的值相等，从而放心向前移动。','手推共同元素｜先比较1与3，1较小，第一边前进；接着3与3相等，写出3，两边都前进。然后比较5与4，第二边前进；最后5与5相等，写出5。任意一边结束后已无法产生新交集，因此结果为3、5。每个输入位置最多向前经过一次。','输出空间由调用者提供｜out最初为空，使用back_inserter让每次命中都通过push_back追加。若改用out.begin却没有先创建足够元素，会写到不存在的位置。交集数量最多是两侧长度较小者，但不用提前计算长度，追加适配器让代码更易读。','理解重复值再换函数｜如果a中有两个3、b中有一个3，交集只保留一个3；并集保留两个3；merge保留三个3。这个区别来自多重集合的计数定义，而不是算法随机丢掉数据。想做数学上的无重复集合操作，可先分别排序去重，再选择相应函数。'],
['set_intersection(...)｜前四个参数是两段输入范围，第五个是输出位置；算法不修改a或b。','a.begin(),a.end(),b.begin(),b.end()｜每一对边界都必须来自对应容器，混用容器的迭代器不是合法范围。','back_inserter(out)｜让输出容量自动增长，但仍需有足够内存，算法不会免除分配成本。'],
['a=[1,1,2]、b=[1,3]的交集是什么？｜为[1]。值1的次数取min(2,1)=1，2和3不同时存在。','set_union与merge在两个[1]上结果是否相同？｜不同。并集是[1]，merge是[1,1]，后者保留两侧全部记录。'],[
A('std::set_intersection','求两个有序范围交集','两组[first,last)及输出位置','输出末尾','std::vector<int>a{1,3},b{3,4},o; std::set_intersection(a.begin(),a.end(),b.begin(),b.end(),std::back_inserter(o));','两边按同一规则有序；不要输出到重叠输入区域。','sorted(set(a)&set(b))是无重复集合，重复计数需collections.Counter。'),
A('std::set_union','求有序多重集合并集','两组有序范围及输出位置','输出末尾','std::vector<int>a{1},b{1,2},o; std::set_union(a.begin(),a.end(),b.begin(),b.end(),std::back_inserter(o));','重复次数取最大，而不是全部相加。','sorted(set(a)|set(b))；多重计数可用Counter并集。'),
A('std::set_difference','求第一组减第二组','先A范围再B范围及输出','输出末尾','std::vector<int>a{1,2},b{2},o; std::set_difference(a.begin(),a.end(),b.begin(),b.end(),std::back_inserter(o));','方向有意义；例子只剩1。','sorted(set(a)-set(b))。'),
A('std::set_symmetric_difference','保留仅一侧多出来的部分','两组有序范围及输出','输出末尾','std::vector<int>a{1,2},b{2,3},o; std::set_symmetric_difference(a.begin(),a.end(),b.begin(),b.end(),std::back_inserter(o));','同值出现次数取两边次数差的绝对值。','sorted(set(a)^set(b))用于无重复集合。'),
A('std::merge','合并两个已排序序列','两组有序范围及输出','输出末尾','std::vector<int>a{1},b{1,2},o; std::merge(a.begin(),a.end(),b.begin(),b.end(),std::back_inserter(o));','结果1、1、2；不会去重。','list(heapq.merge(a,b))，输入也需有序。'),
A('std::includes','判断第一组是否包含第二组的全部元素及次数','两个有序范围','bool','std::vector<int>a{1,2,2},b{2,2}; bool ok=std::includes(a.begin(),a.end(),b.begin(),b.end());','多重计数要满足，不只是判断每种值出现过。','集合比较b_set<=a_set忽略次数，Counter需逐项比较。')]);
G('stl-heap-algorithms','如果反复需要当前最大任务，可以把vector整理成堆，而不必每次完整排序。堆算法与priority_queue解决相似问题，但它们直接操作你已有的范围，不替你增删vector元素。因此“把新元素放进去”和“恢复堆规则”、“把最大元素挪到末尾”和“真正删除它”都要分成两步。理解这种分工是正确使用本节函数的关键。',
['大顶堆｜父节点不小于孩子，根位置就是最大值；数组其他位置并不要求整体升序或降序。','堆范围｜算法把[first,last)当成一棵用数组表示的完全二叉树，维护这个范围内的父子关系。','恢复堆｜添加或取出元素后，只沿少量父子关系调整位置，不需要把所有元素完整排序。'],
['先建立最大值在前的结构｜a初始为3、1、4，make_heap把这三个数重新排列，使a.front为4。不要背诵剩余两个数的位置，合法堆可能有不同布局。重要的不变量是父元素不小于子元素，所以只看第一个位置就能知道当前最大值，而不是认为整个数组已经排好了序。','追加与上浮是两次动作｜先a.push_back(2)，容器size从3变成4，但新加的2不一定满足堆规则。push_heap要求除最后一个元素外的前面范围原本就是堆，它将新元素沿父节点方向调整到适当位置。这个函数不会替你push_back，也不会凭空知道待插入值。','取最大值与删除也分两步｜pop_heap将原堆顶4移动到最后位置，并让前面3项重新构成堆。此时size仍然是4，所以代码用a.back读出4，再a.pop_back真正删除末尾。若在pop_heap后立即读front，读到的已经是剩余元素中的最大值，不能当作刚取出的值。','最后得到有序结果｜剩余堆含1、2、3，sort_heap将其变成升序1、2、3。排序后这个升序范围通常不再满足默认大顶堆要求，若要继续调用push_heap或pop_heap，应先重建堆。与priority_queue相比，直接堆算法更灵活，也要求调用者自己维护每一步的前置条件。'],
['make_heap(a.begin(),a.end())｜一次性建堆为O(n)，不是给每个元素完整排序。','pop_heap(...);a.pop_back()｜前者调整范围且不改长度，后者删除刚移到末尾的元素，两者顺序不能倒过来。','sort_heap(...)｜只接受已经满足对应比较规则的堆范围，不是任意vector都能直接调用。'],
['push_heap之前忘记push_back会插入新值吗？｜不会，它只调整已经存在的范围。没有先加入元素，就没有新值可以插入。','堆顶是最大值能推出第二个元素是第二大吗？｜不能。第二大可能在根的两个孩子之一，但数组布局不是完整排序。'],[
A('std::make_heap','把随机访问范围整理为堆','first,last，可选比较器','void','std::vector<int>a{3,1,4}; std::make_heap(a.begin(),a.end());','默认大顶堆，建堆O(n)。','heapq.heapify(a)默认小顶堆。'),A('std::push_heap','把范围末尾的新元素加入已有堆','完整范围，前n-1项已是堆','void','std::vector<int>a{3,1}; std::make_heap(a.begin(),a.end()); a.push_back(4); std::push_heap(a.begin(),a.end());','先追加，再调整，O(log n)。','heapq.heappush(a,x)包含追加与恢复。'),A('std::pop_heap','把堆顶挪到末尾并恢复前部堆','非空堆范围','void','std::vector<int>a{3,1}; std::make_heap(a.begin(),a.end()); std::pop_heap(a.begin(),a.end()); int top=a.back(); a.pop_back();','不删除元素，O(log n)。','heapq.heappop(a)直接删除并返回最小值。'),A('std::sort_heap','将堆变为有序范围','合法堆范围','void','std::vector<int>a{3,1}; std::make_heap(a.begin(),a.end()); std::sort_heap(a.begin(),a.end());','默认得到升序，随后不再保持大顶堆。','sorted(a)新建列表，原堆保持不变。'),A('std::is_heap','检查范围是否符合堆规则','范围及比较器','bool','std::vector<int>a{4,2,3}; bool ok=std::is_heap(a.begin(),a.end());','只检查不修复，O(n)。','可逐个检查父节点不大于孩子，注意heapq为小顶堆。')]);
G('stl-permutation','安排三个任务的顺序时，需要列出所有不同排列。如果任务标签有重复，直接交换枚举容易重复输出。next_permutation按照字典序把当前排列变成下一种，像翻字典一样逐页前进。学习它之前先理解“从最小排列开始”与“最后一次调用会复位”，才能写出不漏初始项、不多打印一项的循环。',
['字典序｜从左到右找第一个不同位置，那个位置较小的序列排在前面；例如112在121之前。','排列｜同一批元素重新安排位置，元素数量和值不变；重复元素交换后可能仍是同一序列。','旋转与反转｜反转颠倒整个区间的方向；旋转保持两段内部顺序，只把后半段移到前面。'],
['先选择正确起点｜本例数组1、1、2已经是字典序最小排列，因此可以从它开始列出所有后继。若从1、2、1开始，就只会得到它及之后的2、1、1，直到复位，并不会自动回头补打印1、1、2。一般枚举前先sort，以保证起点正确。','看第一次怎样变化｜112右侧还有可以增大的位置，把第二个1与后面的2交换，得到121。算法的目标不是随便换两个数，而是只增加最靠后的可增加部分，再把后缀整理成尽量小的顺序，从而保证得到的是紧接着的下一种，不会跳过排列。','走到终点观察返回值｜121的下一种是211。再调用时已经没有更大的排列，函数把范围恢复为112并返回false，循环结束。返回false不是数组变成空，也不是抛出异常，而是“没有下一种”。因此do先打印当前排列、while再尝试前进的结构恰好打印三行。','区分枚举与调整位置｜如果只想把1234反过来，用reverse得到4321；如果想从第三个元素开始循环阅读，用rotate得到3412。它们不会枚举所有排列。next_permutation每次最坏线性，但排列总数可能达到n!，即使单步很快，也不适合用来枚举大量元素的全部顺序。'],
['do{...}while(next_permutation(...))｜do块至少执行一次，所以最小排列先被打印；若改成while先调用则会漏第一行。','for(int x:a)cout<<x｜这里故意不打印空格，因此1、1、2显示为112，输出样式不改变数组的三个元素。','next_permutation返回bool｜true表示成功前进，false表示已复位到最小排列；数据本身也被原地修改。'],
['为什么[1,1,2]只有3种不同排列？｜三个位置有3!种带身份安排，但两个1不可区分，每种被算了2!次，因此是3!/2!=3。','对[3,2,1]调用一次next_permutation后是什么？｜默认比较下返回false，数组变为[1,2,3]，因为原排列已最大。'],[
A('std::next_permutation','变成下一种字典序排列','双向迭代器范围，可选比较器','成功为true，最大排列复位后false','std::vector<int>a{1,2,3}; bool more=std::next_permutation(a.begin(),a.end());','枚举全部前先排序，单次O(n)。','itertools.permutations生成位置排列，重复输入可能产生重复项。'),A('std::prev_permutation','变成上一种字典序排列','范围及比较器','成功true，最小排列复位为最大后false','std::vector<int>a{3,2,1}; bool more=std::prev_permutation(a.begin(),a.end());','反向完整枚举应从最大排列开始。','可对小规模去重排列排序后逆序遍历，没有同名原地标准方法。'),A('std::reverse','原地颠倒区间','双向范围','void','std::vector<int>a{1,2,3}; std::reverse(a.begin(),a.end());','改变原数组；O(n)。','a.reverse()原地；a[::-1]产生新列表。'),A('std::rotate','把middle位置移到最前','first,middle,last，同一范围','指向原first元素的新位置','std::vector<int>a{1,2,3,4}; std::rotate(a.begin(),a.begin()+2,a.end());','middle可等于两端；得到3 4 1 2。','a=a[2:]+a[:2]会创建新列表。'),A('std::is_permutation','判断两序列是否由相同多重元素组成','两组范围（使用四迭代器重载）','bool','std::vector<int>a{1,2},b{2,1}; bool ok=std::is_permutation(a.begin(),a.end(),b.begin(),b.end());','不是检查是否已经有序；最坏可为平方比较次数。','collections.Counter(a)==collections.Counter(b)。')]);
G('stl-numeric','一周每天的新增数量已知，想知道截至每天的总量；或者想把两组数逐项相乘再相加。<numeric>提供这些常见模式。这里应先区分“只要最终总数”与“要每一步的中间总数”，并学会让C++的累积器类型容纳结果。输入元素都是int，不代表总和也一定能安全放在int中。',
['累积｜从一个初始值出发，依次把元素合入结果；求和从0出发，求乘积通常从1出发。','前缀和｜第i项记录从开头到i的总和，长度与输入相同；例如2、3、5的前缀和是2、5、10。','相邻差分｜第一个值保留，后面每项减去前一项，可以把前缀和还原为原始增量。'],
['分清两个输出任务｜a是2、3、5。第一行要求每走一步的累计值，因此创建与a同长度的p保存三个结果；第二行只要一个总数，可直接让accumulate返回。两种任务共享“不断累加”的想法，但返回形状不同，不要把partial_sum当成返回vector的函数。','手算扫描过程｜第一次累计2，写到p[0]；第二次把3加上去得到5，写p[1]；第三次再加5得到10，写p[2]。代码中的p(a.size())已经创建三个可写位置，因此p.begin合法作为输出起点。若p最初为空，应使用back_inserter而不是直接写begin。','解释0LL为什么重要｜accumulate把初值的类型作为累积类型。0是int，0LL是long long，因此后者能容纳更大的整数和。这里三个小数不会溢出，但养成按数据范围选择初值的习惯能避免隐藏错误。把结果最后赋给long long并不能修复已经在int累积过程发生的溢出。','从总量反推增量｜对2、5、10做adjacent_difference，第一项仍是2，后两项是5-2=3、10-5=5，回到原数组。这个逆向检查能帮助你发现前缀边界错误。还要留意partial_sum的内部累积类型与输入值类型相关，不能只把输出容器改成long long就假定所有中间加法也变宽。'],
['partial_sum(...,p.begin())｜写入三个结果，不自动调整p长度；本例事先分配了相同size。','accumulate(...,0LL)｜LL后缀让整数常量类型为long long，决定累积器类型。','reduce与accumulate｜reduce允许改变分组顺序，浮点舍入结果可能不同，不能把它当成保证相同求和顺序的替代品。'],
['a=[2,3]，accumulate初值是10，结果多少？｜10+2+3=15。初值会参与计算，不只是类型提示。','前缀和[4,7,12]对应增量是什么？｜4、7-4=3、12-7=5，因此是[4,3,5]。'],[
A('std::accumulate','按顺序归并得到单个值','范围、初值，可选二元操作','初值类型的累积结果','std::vector<int>a{2,3}; auto sum=std::accumulate(a.begin(),a.end(),0LL);','<numeric>；初值参与结果，整数要防溢出。','sum(a,0)；Python整数可扩展。'),A('std::partial_sum','生成包含当前位置的前缀累计结果','输入范围和足够大的输出范围','输出末尾迭代器','std::vector<long long>a{2,3,5},p(3); std::partial_sum(a.begin(),a.end(),p.begin());','输入类型决定重要的中间计算类型。','list(itertools.accumulate(a))。'),A('std::adjacent_difference','计算首项与相邻差值','输入、输出，可选二元操作','输出末尾','std::vector<int>a{2,5,10},d(3); std::adjacent_difference(a.begin(),a.end(),d.begin());','首项原样复制，不是与0以外任意值相减。','d=a[:1]+[a[i]-a[i-1] for i in range(1,len(a))]。'),A('std::inner_product','对应位置相乘再求和','第一范围、第二起点、初值','累积结果','std::vector<int>a{1,2},b{3,4}; auto x=std::inner_product(a.begin(),a.end(),b.begin(),0LL);','第二范围长度必须足够；乘法自身也需防溢出。','sum(x*y for x,y in zip(a,b))；zip默认截断，长度语义不同。'),A('std::iota','连续填入递增值','已存在目标范围与起始值','void','std::vector<int>a(3); std::iota(a.begin(),a.end(),5);','得到5 6 7，不扩容；每次使用++递增。','list(range(5,8))。'),A('std::gcd / std::lcm（C++17）','最大公约数与最小公倍数','两个整数','公共整数类型的结果','auto g=std::gcd(12,18); auto l=std::lcm(12,18);','<numeric>；绝对值及最小公倍数需能被结果类型表示。','math.gcd(12,18)、math.lcm(12,18)。')]);
G('stl-string','配置文件里常见name=atlas这样的文本。程序需要找到等号，再把键和值分开。string可以看成拥有自己存储空间的字符序列，支持追加、查找、切片、插入和删除。初学者最容易混淆的是“字符位置”“子串长度”和“查不到的标记”，因此本节先用一行文本反复说明这三个概念，再把常用接口按用途组织起来。',
['字符与字符串｜\'a\'是单个char，"atlas"是一段字符串字面量；push_back接收单个字符，append可以接收一段字符串。','下标与长度｜下标从0开始，长度10的字符串最后一个有效字符下标为9。substr(pos,count)第二参数是数量，不是结束下标。','string::npos｜表示没有找到位置的特殊无符号值，不能把它当成普通下标，也不应转换成int后随意比较。'],
['把每个位置写出来｜name=atlas依次是n在0、a在1、m在2、e在3、等号在4，atlas从5开始。s.find等号返回4，因此p表示分隔符的位置，不是分隔符的数量。如果文本里有多个等号，这个重载只找从起点开始的第一个，其余部分仍保留在值中。','先处理不存在分隔符的情况｜如果输入是name，find返回npos。程序先判断这个特殊值，打印invalid并提前返回。这个检查必须在p+1之前理解清楚：查找失败时继续拿特殊值参与下标运算，会让后面的切片含义完全偏离预期，不能依赖偶然的整数回绕。','分别切出键与值｜s.substr(0,p)从0开始取4个字符，得到name，不包含等号；s.substr(p+1)从5开始一直取到末尾，得到atlas。两个substr都创建新的string，修改它们不会改变原s。Python对应切片s[:p]与s[p+1:]，但Python查找失败通常返回-1，规则并不相同。','再认识修改操作与字符编码｜append追加整段，insert在指定位置前插入，erase按位置和数量删除，replace把一段替换成新内容。它们可能导致重新分配，使旧指针失效。std::string按char存储，UTF-8中文常占多个字节，因此size通常不是人眼看到的中文字数，不能直接按字节切片当作通用中文字符切分。'],
['auto p=s.find(\'=\')｜auto保留string::size_type这类无符号位置类型，避免很长字符串位置被窄int截断。','s.substr(0,p)｜两个参数分别是起点和长度；在本例长度恰好等于等号下标，因为起点是0。','s.substr(p+1)｜省略数量表示取到结尾；当等号在最后，结果可以是合法空字符串。'],
['输入a=b=c按本例会分成什么？｜find得到第一个等号下标1，键是a，值是b=c。后续等号没有被再次分割。','substr(2,3)是取下标2到3吗？｜不是，是从下标2开始取3个字符，即2、3、4三个位置；若剩余不足则取到结尾。'],[
A('size() / length() / empty()','查询长度或是否为空','无参数','长度或bool','std::string s="abc"; auto n=s.size(); bool e=s.empty();','UTF-8情况下长度通常是字节数。','len(s)、not s；Python str按Unicode码点计数。'),A('operator[] / at(pos)','访问指定字符','从0开始的位置','字符引用','std::string s="cat"; s.at(0)=\'b\';','常规字符访问要求pos<size；at越界抛out_of_range。','s[0]读取；Python字符串不可原地修改。'),A('front() / back()','读取首尾字符','无参数','字符引用','std::string s="cat"; char a=s.front(),b=s.back();','先检查非空。','s[0]、s[-1]，空串抛IndexError。'),A('push_back(ch) / pop_back()','尾部追加/删除一个字符','追加接收char；删除无参数','void','std::string s="ab"; s.push_back(\'c\'); s.pop_back();','pop_back要求非空；与返回被删字符的Python列表pop不同。','字符串可用s+=\'c\'及s=s[:-1]产生新值。'),A('append(text) / operator+=','追加字符串','要追加的文本','当前string引用','std::string s="hello"; s.append(" world"); s+="!";','可能扩容并使旧指针失效。','s+=text，Python str不可变。'),A('find(text,pos=0)','从pos开始找首次匹配','目标字符/子串，可选起点','下标或npos','std::string s="a=b"; auto p=s.find(\'=\');','先判断npos，不要直接索引查找结果。','s.find(\'=\')未找到返回-1。'),A('rfind(text,pos=npos)','向前寻找最后一个符合范围的匹配','目标及允许搜索的最后起点','下标或npos','std::string s="a/b/c"; auto p=s.rfind(\'/\');','方向与find不同，pos不是要搜索的字符数量。','s.rfind(\'/\')。'),A('substr(pos,count=npos)','复制一段子串','起点、最多复制字符数量','新的string','std::string s="abcdef"; auto t=s.substr(2,3);','pos>size抛异常；count超剩余会截到末尾。','s[2:5]；Python切片越界更宽容。'),A('insert(pos,text)','在位置前插入文本','合法起点和文本','当前string引用','std::string s="ac"; s.insert(1,"b");','中间插入需要移动后续字符。','s=s[:1]+\'b\'+s[1:]。'),A('erase(pos,count)','删除指定片段','起点与数量','当前string引用','std::string s="abcde"; s.erase(1,2);','结果ade；第二参数不是结束下标。','s=s[:1]+s[3:]。'),A('replace(pos,count,text)','用文本替换一个片段','起点、旧片段长度、新内容','当前string引用','std::string s="cat"; s.replace(0,1,"b");','新旧长度可不同，可能扩容。','位置替换用切片拼接；str.replace按内容匹配，语义不同。'),A('clear() / resize(n,ch)','清空或调整逻辑长度','resize接收长度和可选填充字符','void','std::string s="ab"; s.resize(4,\'x\'); s.clear();','resize增大默认填\0，打印时不一定可见。','s=s.ljust(4,\'x\')扩展；s=\'\'清空。'),A('compare(other)','字典序比较文本','另一字符串','小于0、等于0、大于0','std::string a="abc"; bool before=a.compare("abd")<0;','不要假设返回值恰好是-1或1。','使用a<other、a==other等比较。'),A('c_str() / data()','获取底层字符地址以对接接口','无参数','字符指针','std::string s="abc"; const char* p=s.c_str();','字符串修改或销毁可能使指针失效；嵌入\0会影响C风格接口。','通常encode得到bytes，再按接口要求传入。'),A('std::getline(stream,s)','读取一整行到字符串','输入流、目标字符串，可选分隔符','输入流引用，可用于判断成功','std::string s; std::getline(std::cin,s);','与cin>>混用时注意遗留换行；getline本身不保留行尾分隔符。','input()读一行；文件对象可用readline。')]);
G('stl-tuple','一个函数有时需要同时返回“最小值”和“最小值所在下标”。如果只返回int，就会丢掉其中一项；依赖全局变量又让调用关系难以理解。pair把两项结果组合成一个对象，tuple把更多不同类型的字段组合起来。先学会区分字段的业务含义、组合对象的存储方式和解包时的变量名，再决定什么时候应该改用带清晰字段名的struct。',
['pair｜固定两个成员，名称为first和second，两项类型可以不同。pair<string,int>可以表达姓名与年龄。','tuple｜固定数量且可含不同类型的组合，通常用编译期编号get<I>访问字段。','结构化绑定｜C++17的auto [value,index]给组合中的字段分别命名；不带&的写法通常是在使用副本。'],
['约定结果含义｜输入9、2、7，要求返回最小值2以及下标1。下标从0开始，不能把它与自然语言“第二个”混用。函数声明pair<int,int>只能表达两个整数，不能表达谁先谁后，所以return中的顺序必须与调用者解包时的约定一致，否则程序虽然能编译却会解释错结果。','跟着最小位置更新｜p初始为0，暂定9最小；i=1时a[1]是2，小于a[p]的9，因此p更新为1；i=2时7不小于2，p保持不变。只保存位置就能随时通过a[p]读取当前最小值，不必再维护一个可能与位置不同步的变量。相等时不更新，因此保留首次出现位置。','打包后拆包｜return {a[p],p}构造pair{2,1}并返回，主函数auto [value,index]把两项分别命名。打印得到2 1。这里不是返回临时数组，也不是让value引用输入数组中的元素；若希望引用现有组合的成员，需要理解auto&与对象生命周期，而不能仅凭变量名猜测是否共享存储。','空输入与接口设计｜空数组没有最小元素，例程会先抛invalid_argument，避免继续访问a[0]。tuple虽然能继续扩展到三四项，但get<2>难以说明业务含义；字段多且含义稳定时，定义struct Result并使用result.value等名字通常更清楚。组合工具应帮助表达结果，不能代替明确约定。'],
['pair<int,int> best(...)｜返回一个含两个int的对象，第一项约定是值，第二项约定是下标。','return {a[p],p}｜花括号按成员顺序构造pair，不是返回多个独立返回值。','auto [value,index]｜需要C++17；引用解包auto&要求被引用对象仍然有效。'],
['输入[2,2]会返回哪个下标？｜0。条件是严格小于，相等时不更新，首次出现的位置得到保留。','pair<string,int>是否要求两个成员类型相同？｜不要求，first是string，second是int，这与同类型元素数组不同。'],[
A('std::make_pair(a,b)','构造两项组合','两个可推导类型的值','pair对象','auto p=std::make_pair(std::string("Lin"),20);','<utility>；普通值会复制或移动进入组合。','p=("Lin",20)。'),A('pair::first / second','访问两项成员','通过对象成员访问','相应成员','std::pair<int,int> p{2,1}; p.second=3;','成员名本身不说明业务含义。','p[0]和p[1]；Python tuple不能原地修改。'),A('std::make_tuple / std::get<I>','创建和访问多字段组合','字段值；I为编译期编号','tuple或字段引用','auto t=std::make_tuple(1,std::string("A")); auto name=std::get<1>(t);','不能将任意运行时下标直接用作模板编号I。','t=(1,"A"); name=t[1]。'),A('std::tie(a,b)','把已有变量组合成引用tuple','已有可修改变量','引用tuple','int x=0,y=0; std::tie(x,y)=std::make_pair(2,3);','引用不可超过被引用变量生命周期。','x,y=(2,3)，Python解包不是持久引用tuple。'),A('std::tuple_cat','拼接多个tuple/pair','多个组合对象','新的tuple','auto t=std::tuple_cat(std::make_tuple(1),std::make_pair(2,3));','字段可能被复制或移动。','t=(1,)+(2,3)。')]);
G('stl-bitset','有些信息只需要开或关，例如哪些选项已经选中。bitset把固定数量的位组合起来，按位与可以求共同开启项，按位或可以合并开启项。与普通整数打印不同，它会显示完整位宽，让每一位的位置都能看清。初学时最重要的是把显示顺序与下标方向分开：最右边一位才是下标0，而不是左边第一位。',
['位bit｜只能表示0或1的信息单位；bitset<8>在编译时固定为8位，不能push_back增加长度。','按位与&｜只有两侧对应位都为1时结果才为1，可解释为两组状态的交集。','最低位｜显示在最右边且下标为0的位，对应整数权重1；向左依次权重2、4、8。'],
['先对齐数据｜a为00101101，b为00011100，将它们上下对齐观察8个对应位置。a开启右起0、2、3、5号位，b开启2、3、4号位。这里字符表示二进制状态，不能把整个字符串按普通十进制数字理解，也不能把字符数与开启位数混淆。','逐位求交集｜共同开启的只有2、3号位，所以c=a&b为00001100。这个新对象不会修改a或b。若转成十进制数，第2位权重4，第3位权重8，总值12；直接打印bitset则显示8个字符，包括左边的0，方便检查每一位是否正确。','区分三个查询结果｜c.count返回1的数量，即2；c.size返回固定位宽8；c.to_ulong得到整数12。它们描述的是同一对象的三个方面，不能互相替换。判断是否至少有一位开启可用any，而无需先转换为十进制再比较，也不需要自己循环所有位。','修改单个位并注意边界｜set(0)开启最低位，reset(0)清除它，flip(0)翻转它；不带位置的版本操作全部位。test(pos)检查指定位置并在非法位置抛异常，operator[]则不应当作越界保护。固定位宽意味着移出最高位的数据会丢失，Python无限精度整数需要额外掩码才有同样效果。'],
['bitset<8>a("00101101")｜8是编译期位宽，字符串最右端对应0号位。','auto c=a&b｜生成新bitset；a&=b才是直接修改a。','c.count()｜统计置1位数量，不是求整数值或字符串长度。'],
['00000001的test(0)为什么为true？｜0号位是最右边一位。左边第一位是7号位。','00001100全部flip后是什么？｜11110011。翻转作用于全部8位，并非只把原来的1改成0。'],[
A('set(pos,value) / set()','设置单个位或全部位','位置、bool，或无参数','bitset自身引用','std::bitset<8>b; b.set(2); b.set(0,false);','位置重载会检查越界；set()全设为1。','mask|=1<<2；清位用mask&=~(1<<0)。'),A('reset(pos) / reset()','清除单个位或全部位','位置或无参数','bitset引用','std::bitset<8>b(15); b.reset(1);','reset()得到全0。','mask&=~(1<<1)；全部清零mask=0。'),A('flip(pos) / flip()','翻转单个位或全部位','位置或无参数','bitset引用','std::bitset<8>b(1); b.flip(0);','全翻转限制在8位内。','mask^=1<<0；全部翻转用mask^255。'),A('test(pos) / operator[]','读取某位，[]也可修改','从0开始的下标','bool或代理引用','std::bitset<8>b(4); bool yes=b.test(2); b[0]=true;','[]返回可写代理，不一定是真正bool&。','bool(mask&(1<<pos))。'),A('count() / any() / none() / all()','统计和判断置位情况','无参数','数量或bool','std::bitset<8>b(12); auto n=b.count(); bool ok=b.any();','all要求全部8位为1。','mask.bit_count()；mask!=0。'),A('to_string() / to_ulong() / to_ullong()','转文本或整数','无参数','字符串或无符号整数','std::bitset<8>b(12); auto s=b.to_string(); auto x=b.to_ulong();','超出目标整数表示范围会抛overflow_error。','format(mask,"08b")；整数本身即数值。'),A('operator& / | / ^ / << / >>','位交集、并集、异或与移位','相同位宽对象或移位量','新bitset','std::bitset<8>a(3),b(5); auto c=a|b; auto d=c<<1;','移出范围的位丢弃，空位补0。','整数位运算后可&255限制宽度。')]);
G('stl-comparator','学生排序要求分数高的靠前、同分时学号小的靠前。这不是默认pair的顺序，因此需要比较器。比较器回答“x是否应该排在y前面”，不是返回差值，也不是直接要求交换。理解这个提问方式后，再看lambda参数、捕获列表和严格弱序，就能写出清楚且自洽的排序规则，而不再靠反复试大于号小于号猜结果。',
['比较器｜接受两个元素并返回bool，true表示第一个应位于第二个之前。','严格弱序｜规则必须自洽，自己不能在自己之前，先后关系需要传递，等价分组也要一致。','lambda捕获｜[]不使用外部状态，[limit]按值捕获，[&limit]引用捕获；捕获方式影响状态与生命周期。'],
['先解释记录字段｜三条pair记录为{2,90}、{1,90}、{3,80}，first是学号，second是分数。默认pair比较首先看first，也就是学号；题目首先看分数，所以必须显式传比较器。存储字段的顺序与业务排序优先级不是一回事，不能让默认规则替你决定。','分数不同按降序｜比较{2,90}和{3,80}时，分数不同，返回90>80，结果true，表示前者在前。这里>表示高分先出现。sort内部会决定比较哪些元素和如何移动它们，比较器只描述关系，不应在里面偷偷修改元素或根据调用次数改变结果。','同分时再比较学号｜比较{2,90}和{1,90}时，分数相同，进入学号比较2<1，结果false；反过来比较1<2为true，因此学号1先于2。最终输出学号1、2、3。这个第二关键字明确了同分次序，不必依赖sort对等价元素是否稳定。','检查规则是否严格｜把同一条记录同时作为x和y，分数相同，学号也相同，x.first<y.first为false，满足自己不在自己前面。若误写<=，相等时为true，会破坏排序前提。若只想同分保持输入顺序，可使用只看分数的stable_sort，但它不能凭空帮你把学号排成升序。'],
['const auto&x,const auto&y｜泛型lambda以常量引用读取记录，避免无谓复制，也防止通过参数修改记录。','条件?表达式1:表达式2｜三目运算，根据分数是否不同选择比较分数或学号，可改写成if帮助理解。','for(auto [id,score]:a)｜结构化绑定拆开排序后的pair；虽然只打印id，score仍参与过排序。'],
['return x.score>=y.score为什么不合格？｜相等甚至同一元素比较时会返回true，违反严格性；降序应使用>。','stable_sort是否自动按照学号打破同分？｜不会，它仅保留比较器认为等价的元素原相对次序，若原学号乱序仍然乱序。'],[
A('Lambda [](参数){函数体}','定义局部短函数','捕获列表、参数与函数体','可调用对象','auto square=[](int x){return x*x;}; int y=square(3);','引用捕获对象必须在调用时存活。','square=lambda x:x*x。'),A('std::less<T> / std::greater<T>','提供标准严格比较对象','模板参数指定类型','调用后bool','std::vector<int>a{1,3,2}; std::sort(a.begin(),a.end(),std::greater<int>{});','priority_queue中的堆顶表现需结合适配器规则理解。','sorted(a,reverse=True)。'),A('std::sort(first,last,comp)','按比较规则原地排序','随机访问范围和比较器','void','std::vector<int>a{1,3,2}; std::sort(a.begin(),a.end(),[](int x,int y){return x>y;});','比较器满足严格弱序；不保证等价项原顺序。','a.sort(key=...,reverse=...)通常按key表达。'),A('std::stable_sort(first,last,comp)','让等价项保留原相对次序','范围及比较器','void','std::vector<std::pair<int,int>>a{{2,90},{1,90}}; std::stable_sort(a.begin(),a.end(),[](const auto&x,const auto&y){return x.second>y.second;});','此例学号2仍在1前。','Python list.sort和sorted本身稳定。'),A('std::function<R(Args...)>','保存同签名的不同可调用对象','目标签名与函数对象','可调用包装','std::function<int(int)> f=[](int x){return x+1;}; int y=f(2);','可能有额外开销；空包装调用抛bad_function_call。','Python函数直接赋值给变量。')]);
G('stl-views','函数只想处理数组中间一段时，复制会增加成本，也无法直接改回原数组。span提供一个借用窗口，string_view提供只读字符窗口。它们描述数据在哪，却通常不拥有数据。初学者应先问“真正保存元素的是谁”“谁必须活得更久”，再追求省复制；理解这两个问题才能安全使用视图，而不是把它当成另一种自动管理存储的vector。',
['所有权｜负责保存数据及释放存储的责任；vector拥有元素，span通常只借用它们。','借用视图｜保存位置与长度的轻量描述，创建时不复制所有元素；主人销毁后可能悬空。','可变与只读｜span<int>允许修改元素，span<const int>只读；string_view只读地观察字符。'],
['画出原数据与窗口｜a是1、2、3、4，span<int>(a)覆盖全部4项，subspan(1,2)从下标1开始取2项，mid观察原来的2、3。这里没有新建独立的两元素数组，因此mid与a共同指向相同存储。第二参数2是数量，窗口覆盖下标1和2，不是只取到下标2之前。','通过引用修改｜for(int&x:mid)让x成为当前原元素的引用。第一轮把a[1]从2改20，第二轮把a[2]从3改30，随后打印a得到1 20 30 4。若去掉&变成int x，循环修改的是复制出来的数，原a不会变化，这个差别与视图本身是否拥有内存是两个不同问题。','理解字符串视图的切分｜string_view的substr返回另一个借用窗口，string的substr则创建拥有字符的新字符串。窗口结尾不一定有零字符，因此string_view.data不能直接当成任何C字符串接口都接受的完整字符串。正确接口必须同时知道长度，或先复制成真正string后使用c_str。','生命周期比语法更重要｜返回指向局部数组的span、返回指向局部string的string_view都不安全，因为主人在函数结束时销毁。vector扩容也可能搬走元素，旧span因此失效。保持数据主人比视图活得更久，结构修改后重新建立窗口，是开始使用时最可靠的规则。'],
['span<int> mid｜C++20，需要<span>，不会延长a生命周期。','subspan(1,2)｜起点加数量不能超过原范围；不能假设会像Python切片自动截断。','for(int&x:mid)｜引用让修改作用于原元素；const span<int>不等于span<const int>。'],
['返回局部数组的span安全吗？｜不安全，span未复制数组，局部数组销毁后保存的地址失效。','string_view::substr会复制字符吗？｜通常不会，只创建新的位置与长度描述；string::substr会创建新string。'],[
A('std::span<T>(container)（C++20）','借用连续元素','连续容器或指针加长度','span对象','std::array<int,3>a{1,2,3}; std::span<int>s(a);','不接受非连续list；主人必须存活。','普通list切片复制，memoryview面向缓冲对象。'),A('span::subspan(offset,count)','取得子窗口','偏移与数量','span','std::array<int,4>a{1,2,3,4}; auto s=std::span<int>(a).subspan(1,2);','C++20要求范围合法，不自动宽容截断。','a[1:3]是新列表，不是回写原列表的视图。'),A('span::first(n) / last(n)','借用前n项或后n项','不超过长度的n','span','int a[]{1,2,3}; std::span<int>s(a); auto t=s.last(2);','仍共享原数据。','memoryview可切片；list切片语义不同。'),A('span::size() / size_bytes() / data()','查询元素数、字节数和起始地址','无参数','数量或指针','int a[]{1,2}; std::span<int>s(a); auto bytes=s.size_bytes();','元素数量不是字节数量。','memoryview.nbytes和len(view)也需区分。'),A('std::string_view / substr（C++17）','借用只读字符序列','字符串与子范围','字符串视图','std::string s="name=atlas"; std::string_view v(s); auto key=v.substr(0,4);','不能借用已销毁临时string；data末尾不保证零结尾。','Python str切片没有同样的借用生命周期约束。'),A('string_view::remove_prefix / remove_suffix','缩小当前窗口','去掉的字符数','void','std::string_view v="[abc]"; v.remove_prefix(1); v.remove_suffix(1);','仅改变视图，数量必须<=size。','s=s[1:-1]产生字符串值。')]);
G('stl-ranges','先筛选偶数，再把偶数平方，是自然的两步任务。C++20的ranges与views能把它写成一条管道，避免为了每一步都创建中间vector。但管道通常只是描述将来怎样遍历，并不表示结果已经全部计算并保存。初学者应先把普通循环的输入、条件和输出弄清楚，再用视图表达同样的数据流，才能看懂惰性计算何时发生。',
['Range｜能获得开始和结束并遍历的一段数据，容器本身也可以传给ranges算法。','View｜轻量的范围描述，可表达筛选与变换，未必拥有最终元素。','惰性求值｜直到迭代真正需要某个值时才计算，而不是建立表达式时一次计算全部值。'],
['先手算筛选与映射｜输入1到6，条件x%2==0留下2、4、6，再平方得到4、16、36。这里先过滤再变换，顺序不是随便调换的。如果条件针对原始值而变换会改变值，换序可能改变结果。原数组仍然保存1到6，输出只是根据它计算的新观察结果。','读懂管道连接｜a | views::filter把a送入过滤视图，后面的|再将范围送入transform。这个|是库提供的组合运算，不是在对容器逐位求或。auto v保存整条操作描述，filter与transform中的lambda也被保留，以便后续遍历需要时调用。','看for如何触发求值｜迭代先检查1不符合，于是跳过；遇到2，计算平方4并交给x打印。下一次跳过3，到4产生16；最后到6产生36。没有显式存储所有偶数的中间vector，也没有把a中的偶数原地改成平方。重复遍历可能重新执行计算，所以不要依赖变换函数只调用一次。','想保存结果就显式收集｜如果结果要长期保留或反复使用，可以创建result，然后for(int x:v) result.push_back(x)。这才创建拥有结果的容器。教程使用C++20，不能假设C++23的ranges::to一定可用。视图借用的底层容器必须有效，随意扩容或修改其结构可能使迭代器及缓存失效。'],
['views::filter｜true的项才会继续进入下游，不是删除a中的元素。','views::transform｜保存逐项映射，访问元素时产生平方。','for(int x:v)｜实际求值发生在这里；x是本例生成结果的值。'],
['创建v后a.size是否变为3？｜不会，a仍有6项，过滤视图只改变遍历时看到哪些项。','C++20如何把结果保存成vector？｜创建空result，再遍历v并push_back，明确完成物化。'],[
A('std::views::filter(pred)（C++20）','惰性筛选','bool谓词','筛选视图','std::vector<int>a{1,2,3}; auto v=a|std::views::filter([](int x){return x>1;});','不修改原容器；原数据要存活。','filter(lambda x:x>1,a)。'),A('std::views::transform(op)','惰性变换','逐项操作函数','变换视图','std::vector<int>a{2,3}; auto v=a|std::views::transform([](int x){return x*x;});','重复遍历可能重复计算。','map(lambda x:x*x,a)。'),A('std::views::take(n) / drop(n)','取前n项或跳过前n项','非负数量','视图','std::vector<int>a{1,2,3}; auto v=a|std::views::drop(1)|std::views::take(1);','原a不变，结果只看到2。','itertools.islice(a,1,2)。'),A('std::views::iota(start,end)','生成递增序列','起点与不包含的终点','视图','auto v=std::views::iota(1,4);','无终点重载可能无限，消费时要有边界。','range(1,4)。'),A('std::ranges::sort(range)','直接对范围排序','符合要求的随机访问范围','结束迭代器','std::vector<int>a{3,1,2}; std::ranges::sort(a);','修改原数据，不是惰性view；并非任何视图都满足要求。','a.sort()原地。'),A('std::ranges::find(range,value)','在范围中查值','范围与目标','迭代器或针对临时非借用范围的dangling类型','std::vector<int>a{1,2}; auto p=std::ranges::find(a,2);','仍需检查p!=a.end()才能读取。','next或index，失败返回与类型不同。')]);
G('stl-pmr','处理一次请求时会产生很多短命容器，请求结束后它们一起丢弃。PMR让vector保留熟悉的接口，同时把内存从哪里来交给一个资源对象。这是进阶内容，初学时先理解两层职责：容器管理元素的构造和销毁，资源管理底层字节存储。它不会让算法自动变快，也不会让所有内存生命周期问题消失，收益要结合具体分配模式测量。',
['allocator｜容器申请存储等操作使用的接口，不负责决定排序或查找算法。','memory_resource｜运行时的内存资源接口，PMR容器可以把分配请求交给指定资源。','单调资源｜不断向前分配，单次释放通常不立刻回收字节，最后由资源统一回收。'],
['区分三层对象｜buffer是1024字节原始缓冲区，arena是使用它的资源，batch是从arena获得存储的pmr::vector<int>。buffer不是1024个int，arena也不是vector。只有明确谁借用谁，才能正确安排销毁顺序，不能因为它们都写在同一个函数里就忽略依赖关系。','连接资源再添加元素｜batch(&arena)把容器连接到资源。reserve(4)预留至少4个int所需空间，但逻辑长度仍是0；四次push_back才真正放入2、4、6、8。之后求和得到20，与普通vector的业务结果相同。PMR改变的是供应存储的位置，而不是push_back或求和的含义。','内层作用域保护顺序｜batch放在内部花括号中，离开时先析构容器和元素，再在外层结束时析构arena，最后buffer失效。单调资源不立即回收单个分配，不表示可以省略元素析构；若元素持有文件等资源，析构依然负责释放这些其他资源，不能与字节回收混为一谈。','理解耗尽后的行为｜默认上游资源可能在初始buffer耗尽后继续申请内存，所以1024不是硬上限。若指定null_memory_resource作为上游，缓冲不足时会抛bad_alloc。想调用release统一回收前，要保证使用那些存储的对象已经结束使用。Python普通list没有对应PMR接口，本课Python只表达相同求和任务。'],
['std::byte buffer[1024]｜声明原始字节，资源处理分配与对齐需求。','batch(&arena)｜资源指针必须在容器使用期间有效。','batch所在花括号｜刻意使容器先销毁，资源后销毁。'],
['arena.release后还能读旧batch吗？｜不应如此。底层存储已释放，旧容器可能持有失效地址。','PMR是否改变求和的O(n)复杂度？｜不会，它影响分配行为，逐个读取n个数的工作仍是线性的。'],[
A('std::pmr::monotonic_buffer_resource','建立阶段性资源（C++17）','可选缓冲地址、大小和上游','资源对象','std::byte b[1024]; std::pmr::monotonic_buffer_resource r(b,sizeof b);','需要<memory_resource>，资源必须比使用者活得久。','普通list无相同接口。'),A('std::pmr::vector<T>','使用运行时资源的vector','可传资源指针','容器对象','std::pmr::monotonic_buffer_resource r; std::pmr::vector<int> v(&r); v.push_back(7);','vector迭代器失效规则仍适用。','list只对应元素序列功能。'),A('monotonic_buffer_resource::release()','批量回收资源存储','无参数','void','std::pmr::monotonic_buffer_resource r; {std::pmr::vector<int> v(&r); v.push_back(1);} r.release();','先结束使用相关存储的对象。','无普通list级直接对应。'),A('std::pmr::null_memory_resource()','提供分配必失败的上游','无参数','资源指针','std::byte b[1024]; std::pmr::monotonic_buffer_resource r(b,sizeof b,std::pmr::null_memory_resource());','缓冲不足时抛bad_alloc。','无直接标准对应。'),A('get_allocator().resource()','取得PMR容器的资源','无参数','memory_resource指针','std::pmr::vector<int> v; auto* r=v.get_allocator().resource();','查看资源不意味着转移其所有权。','普通Python容器不公开此接口。')]);
G('stl-exception-safety','替换一组数据时，如果中途发现非法值，希望旧数据完整保留，而不是一半旧一半新。异常安全讨论的是操作失败后的状态，并不是保证永远不发生错误。本节用复制、检查、交换三步实现整体提交，先在临时容器中准备所有内容，只有确认成功才替换目标。这样失败路径也能被清楚推演，容易写出可靠接口。',
['异常｜throw报告无法正常完成，控制流跳向匹配catch，途中局部对象按规则析构。','强保证｜失败后原来可观察状态保持不变，成功时才整体更新。','提交点｜准备全部完成后真正改变目标的那一步，本例是swap。'],
['说明旧值为什么必须保留｜a原本是7、8，新输入为1、-2、3，约定拒绝负数。如果先清空a再添加，遇到-2时a可能只剩1，失败已经破坏旧内容。因此我们把dst视为正式结果，在准备阶段保持它完全不变，而不是先修改再试图猜测如何撤回。','临时对象承接可能失败的工作｜auto tmp=src复制出独立容器，复制或分配失败时dst仍未改变。随后检查tmp，1合法，-2触发invalid_argument，后面的swap没有机会执行。离开函数时tmp自动析构，因此不会为了保留旧数据就泄漏这次临时申请的内存。','全部通过才交换｜如果输入改为1、2、3，检查结束后dst.swap(tmp)把新数据送入dst，旧7、8进入tmp。函数结束时tmp负责销毁旧内容。这里普通vector<int>默认分配器支持适合提交的交换语义，不能据此断言任意自定义对象swap都不抛异常或都能安全交换分配器。','让调用者处理错误含义｜main的catch只为展示失败后仍打印7 8而留空，真实业务应提示错误或记录原因。函数名replace_positive容易让人误解为只接受正数，但代码条件x<0实际允许0，应以条件为准。RAII能清理C++对象，并不能自动回滚已经写入外部文件或数据库的副作用。'],
['auto tmp=src｜是复制而非引用，所有验证发生在候选数据上。','if(x<0)throw｜只拒绝负数，若要求严格正数需改为<=0。','dst.swap(tmp)｜本例唯一提交点，失败时未执行所以dst保留。'],
['输入包含0会失败吗？｜不会，条件仅拒绝x<0。严格正数要求需另改规则。','先dst.clear再复制还提供强保证吗？｜不提供，复制或检查失败时旧数据已经丢失。'],[
A('try / catch','尝试并处理异常','代码块和异常类型','控制流结构','try {throw std::invalid_argument("bad");} catch(const std::invalid_argument& e) {/*处理*/}','语言结构不是STL函数，理解容器失败处理必需。','try/except ValueError。'),A('throw std::invalid_argument','报告参数不合法','说明字符串','不正常返回','if(-1<0) throw std::invalid_argument("negative");','<stdexcept>；本路径后续代码不执行。','raise ValueError("negative")。'),A('vector复制构造','准备独立候选数据','已有vector','新vector','std::vector<int> src{1,2}; auto tmp=src;','O(n)时间与空间，可能分配失败。','tmp=src.copy()通常浅复制。'),A('vector::swap(other)','交换两容器内容','兼容的另一个vector','void','std::vector<int>a{7,8},tmp{1,2}; a.swap(tmp);','自定义分配器要核对传播和相等要求。','a,tmp=tmp,a交换变量引用。'),A('noexcept(expression)','查询表达式是否具有不抛声明','表达式，查询本身不执行','编译期bool','std::vector<int>a,b; constexpr bool safe=noexcept(a.swap(b));','不等于证明逻辑正确，也不是catch。','Python无相同静态契约。')]);
G('stl-parallel-policy','把很多数平方再求和，看起来能分给多个执行单元同时做。执行策略允许标准算法采用顺序、并行等安排，但不承诺一定启动多线程，更不承诺更快。初学时先让每项计算独立，再认识归约重新分组可能带来的差别，最后才讨论性能。示例采用seq确保容易验证，展示接口语义，并不是一个多线程测速程序。',
['执行策略｜传给部分标准算法的对象，表达允许怎样调度计算，不是指定线程编号。','数据竞争｜多个执行单元无正确同步地访问同一存储且至少一个写入，可能导致未定义行为。','归约｜把多项合并为一个值，分组顺序可能与逐个从左到右相加不同。'],
['拆成独立的平方工作｜a为1、2、3、4，b提前创建同样4个位置。每项平方分别写到对应输出，得到1、4、9、16。lambda不递增共享计数器，也不修改其他位置，依赖关系简单。输出不能用多个并发push_back随意追加，否则容器自身状态也会成为共享写入点。','理解seq的位置｜execution::seq放在transform的第一个参数位置，选择带执行策略的重载。它要求顺序策略，但并不是每个STL函数都支持这种额外参数。即使其他环境允许par，这段代码也明确用seq，不能从输出30推断发生了并行或获得了任何速度提升。','把结果合成单个数｜reduce的初值0参与结果，四个平方相加为30。reduce允许改变归约分组，即使策略seq也不保证与accumulate的固定左折叠相同。这里小整数不溢出，任何分组都是30；浮点数会有舍入差异，整数超范围也不能被数学加法的结合律掩盖。','正确性成立后才选并行｜par允许实现并行，但可以选择串行；par_unseq允许更强的非序列安排，回调限制更严格。不要简单在回调里sum+=x，也不要认为加锁就适合所有策略。任务规模小、内存带宽受限或调度成本高时可能更慢，实际测试要固定输入规模、工具链和测量方法。'],
['std::execution::seq｜需要<execution>，本例明确不是并行演示。','b(a.size())｜先创建输出元素，逐位置写入避免并发改变容器长度。','reduce(...,0)｜初值决定重要的结果类型与初始值，大范围可按需求选0LL。'],
['par是否保证开启多个线程？｜不保证，这是允许的执行方式，具体实现和输入规模决定调度。','回调里sum+=x为什么不可靠？｜多个任务可能同时修改sum产生数据竞争，应使用正确归约或经过设计的同步机制。'],[
A('std::execution::seq（C++17）','选择顺序策略','支持策略的算法首参数','策略对象','std::vector<int>a{1,2},b(2); std::transform(std::execution::seq,a.begin(),a.end(),b.begin(),[](int x){return x*x;});','策略重载有自己的异常规则，不是任意函数都支持。','普通for表达顺序任务。'),A('std::execution::par','允许并行调度','算法首参数','策略对象','std::vector<int>a{3,1,2}; std::sort(std::execution::par,a.begin(),a.end());','不保证并行或加速，工具链可能需要后端库。','concurrent.futures是另一套显式并发接口。'),A('std::execution::par_unseq','允许并行与非序列执行','算法首参数','策略对象','std::vector<int>a{1,2},b(2); std::transform(std::execution::par_unseq,a.begin(),a.end(),b.begin(),[](int x){return x*x;});','避免共享可变状态及不适合非序列执行的同步调用。','无普通Python容器算法的直接对应策略。'),A('std::reduce','允许重新分组的归约','范围、初值，可选操作和策略','归约结果','std::vector<int>a{1,4,9,16}; auto x=std::reduce(std::execution::seq,a.begin(),a.end(),0LL);','浮点结果不保证与accumulate完全相同。','sum(a)无相同策略契约。'),A('std::transform_reduce','组合变换和归约','范围、初值、归约操作、变换操作','归约结果','std::vector<int>a{1,2,3}; auto x=std::transform_reduce(a.begin(),a.end(),0LL,std::plus<>{},[](int x){return 1LL*x*x;});','<numeric>；省中间数组不等于必然更快。','sum(x*x for x in a)。')]);
G('layers','浏览器发送一句hello，并不是把这五个字母直接扔到网线上。不同层各自添加需要的信息，例如应用层表达请求、传输层区分进程、网络层寻找跨网目的地、链路层负责当前一跳。本节先用套盒子的字符串模型把顺序看清。它帮助你理解封装，不代表真实报文长得像带方括号的文本，更不是完整协议栈。',
['协议｜通信双方约定的消息格式、含义与行为，双方都遵守才知道怎样解释收到的数据。','封装｜下层把上层的整段内容当作负载，再添加本层需要的信息。','一跳｜数据从当前设备经过一条链路到相邻设备；跨互联网通信可能经过多跳。'],
['从应用数据开始｜data最初只含hello。代码首先调用wrap("HTTP",data)，把它变成HTTP[hello]，意在表示应用协议给内容加上语义。真实HTTP有请求方法、首部等格式，不是这样一个简单标签，但“上层数据被包在里面”的关系适合用模型观察。','依次向下封装｜下一轮得到TCP[HTTP[hello]]，再下一轮得到IP[TCP[HTTP[hello]]]。每一次都把旧data整体保留为新层负载，因此不能把HTTP、TCP、IP看成三个互相替代的消息。它们各解决不同范围的问题，层次之间通过接口协作。','外层对应当前发送链路｜最后加入Ethernet，输出Ethernet[IP[TCP[HTTP[hello]]]]。离开本机时最外层是当前链路的封装，接收端通常按相反方向解释外层再交给上层。路由器转发时会重新处理每一跳的链路封装，不会把整个互联网视为一根连续以太网线。','理解模型未表现的部分｜真实协议有二进制字段、长度、校验、分片或重组、状态与错误处理，不能用一段字符串拼接替代。这里也没有socket或实际网络发送。掌握套层次的顺序后，再到IP、TCP、HTTP课程分别学习每层哪些字段承担地址、可靠性与请求语义。'],
['wrap(layer,data)｜函数返回新字符串，旧data作为内部完整负载保留。','for中的层顺序｜从HTTP到Ethernet逐层向下，最后添加的出现在输出最外面。','data=wrap(...)｜每次用新封装替换当前表示，长度增加但原hello仍在最内层。'],
['接收端先解释HTTP还是Ethernet？｜在此模型中先处理最外层Ethernet，再逐层向内，最后交给应用。','路由器需要把所有HTTP业务都读懂才能转发吗？｜通常不需要，基本IP转发根据网络层信息决定下一跳；额外代理或安全设备可能承担其他职责。']);
G('subnet','一个IPv4地址有32位，前多少位表示网络由前缀长度决定。例如192.168.1.130/26不是把最后一个十进制数当成整个主机部分，而是保留前26个二进制位。学习本节先把点分十进制与二进制位宽对应起来，再手算掩码与按位与，才能理解为什么网络地址是192.168.1.128。',
['IPv4地址｜32位数，常分成四组8位，以0到255的十进制数显示。','前缀长度｜/26表示前26位属于网络前缀，剩下6位是该子网内的位置部分。','子网掩码｜前缀位置为1、后面为0的32位数，与地址按位与即可清除主机位。'],
['先定位变化发生在哪里｜前三段192、168、1占24位，/26还保留最后一段的前2位。130的8位二进制是10000010，只保留前2位后成为10000000，也就是128。因此网络地址前三段不变，最后一段变为128，这个过程不需要猜测十进制是否能被26整除。','建立32位表示｜代码把192左移24位、168左移16位、1左移8位，再与130按位或，组合成一个uint32_t。各段占据互不重叠的8位区域。使用无符号类型让高位位运算更明确，输入合法性也应确保每段在0到255内，本例使用固定合法常量。','生成掩码并求网络地址｜前缀26对应掩码255.255.255.192，最后一段11000000。ip&mask保留网络部分，清除后6位。prefix==0单独处理是为了避免把32位数左移32位这种非法位移；prefix大于32直接拒绝，说明位宽边界属于算法正确性的一部分。','再把结果变回人能读的形式｜右移24、16、8、0位并与255，逐段取出网络地址的四个字节，打印192.168.1.128。/26的地址块大小为2的6次方即64，此块范围128到191；通常子网首尾有特殊含义，但/31、/32等情形另有规则，不能机械套用减2公式。'],
['uint32_t(192)<<24｜先转为32位无符号再移位，明确要把该字节放到最高8位。','prefix==0 ? 0u : ...｜专门保护前缀0的边界，避免移位量等于类型宽度。','(net>>24)&255｜右移后用255保留低8位，恢复点分十进制的一段。'],
['192.168.1.190属于同一个/26块吗？｜属于，190在128到191范围内，清除后6位也得到128。','/32的网络地址与原IP什么关系？｜保留全部32位，因此相同；它表示单个地址前缀，不能按普通子网减2计算。']);
G('net-delay','下载速度快不等于第一次响应一定快。发送一个包需要把所有位推入链路，信号还需要时间传播到另一端，设备也可能排队和处理。本节先只计算发送时延加传播时延，帮助你分清“带宽”和“距离”。先把字节换成位、秒换成毫秒，再代入公式，比背一个没有单位的数字更可靠。',
['带宽｜链路单位时间可传输的位数，例如10Mb/s表示每秒1000万位，不是1000万字节。','发送时延｜把整个数据包所有位推入链路所需时间，计算为包长位数除以速率。','传播时延｜信号沿介质到达另一端的时间，主要与距离和传播速度有关，不由包长直接决定。'],
['把输入量与单位对齐｜本例bytes=1000字节、rate=10000000位每秒、propMs=5毫秒。一个字节8位，因此包长为8000位。如果直接1000除以rate，会把发送时延少算8倍；这是初学网络计算时最常见的单位错误之一。','算出发送部分｜8000除以10000000得到0.0008秒，乘1000转换为0.8毫秒。这是最后一位离开发送接口所需的时间，不是每一位传播到目的地的时间。更大的包会增加这部分，更高的链路速率会降低这部分，但它们不直接缩短两地物理距离。','加入传播部分｜题设传播时延为5毫秒，与0.8毫秒相加得到5.8毫秒。模型忽略处理、排队、协议握手以及多跳存储转发，因此不能把这个结果当成真实浏览器请求耗时。它只回答一条理想链路上从开始发送到最后一位到达的大致时间。','用改变输入检查理解｜把速率加倍，发送部分降为0.4毫秒，总计5.4毫秒，而不是5.8除以2。因为5毫秒传播部分没有变化。带宽时延积则描述链路在一段往返时间内可以容纳多少在途数据，使用时应明确时间取单向还是往返，避免将不同公式混用。'],
['bytes*8/rate*1000｜先换位、再算秒、最后换毫秒，运算使用double保留小数。','+propMs｜将已经同为毫秒的两种时延相加。','fixed<<setprecision(1)｜只控制显示一位小数，不改变物理模型精度。'],
['速率加倍后总时延是否减半？｜本例不是，传播5毫秒不变，总时延变5.4毫秒。','为什么真实下载可能比5.8毫秒慢很多？｜还存在多包传输、排队、处理、多跳、握手与服务端工作等未纳入因素。']);
G('net-crc','网线或无线信号可能让某些位发生翻转。发送端可在数据后附加校验信息，接收端据此发现一部分传输错误。CRC用二进制多项式除法生成余数，本节把它写成字符串上的异或长除法。先用很短的1101与生成串1011手推每一步，理解它是差错检测，不是加密，也不是自动纠正所有错误。',
['异或XOR｜两个位不同得1、相同得0；没有借位，1异或1直接变0。','生成多项式｜双方事先约定的除数，本例用位串1011表示，长度4意味着附加3位余数。','余数｜补零后的数据除以生成串所得不足除数阶数的部分，追加到数据后形成校验码字。'],
['先补上余数的位置｜原data是1101，生成串g是1011，长度4，所以要在数据后补3个0得到1101000。这3位不是先知道的校验值，而是为求余数预留的位置。除法只在当前最高位为1时异或，否则前进到下一位，不能像十进制长除法那样使用普通减法借位。','逐步执行异或｜第一步1101000的前4位1101与1011异或，得到0110000。第二步从位置1看，1100与1011异或，整串成为0011100；第三步位置2的1110与1011异或，成为0001010；第四步位置3的1010与1011异或，得到0000001。','读取尾部余数｜按代码读取从data.size也就是位置4开始的最后3位，得到001。把原数据1101和余数001拼接，输出1101001。注意发送的是原始数据加余数，不是整个除法工作区0000001，否则接收方就失去了原始内容。','理解检测能力与模型范围｜接收方用相同生成多项式对完整码字检查余数，非零说明发现不一致；余数为零不等于绝对没有错误，因为某些错误模式仍可能漏检。真正CRC协议还规定初值、位反射、最终异或等细节，本例只展示最基础多项式除法，不可直接与任意网卡CRC数值比较。'],
['w=data+string(g.size()-1,\'0\')｜预留3位余数位置，g必须是有效且最高位为1的生成串。','w[i+j]==g[j]?\'0\':\'1\'｜用字符比较模拟异或，相同0、不同1。','data+w.substr(data.size())｜保留原数据，只取工作区尾部作为余数。'],
['CRC能让窃听者看不懂内容吗？｜不能，它用于检测差错，码字仍包含原数据，不提供加密保密性。','生成串长度5时补多少个0？｜补4个，因为余数阶数最多为4位。']);
G('net-switch-vlan','同一局域网中多台机器连到交换机，交换机要决定一帧应该从哪个端口发出。它通过观察源MAC地址学习设备所在位置，再查目标MAC决定转发。本节用A、B代替真实地址，先手推学习表怎样变化。VLAN用于分隔二层广播域，真实交换表通常还要包含VLAN信息，示例暂只处理一个广播域。',
['MAC地址｜链路层用于标识接口的地址，本例用A、B这样的标签简化。','学习表｜记录某源地址最近从哪个端口到达，帮助下一次寻找它。','泛洪FLOOD｜不知道目标端口时，向同广播域内除入端口以外的合适端口转发，并不代表发到全互联网。'],
['第一帧建立第一条记录｜A发给B，从端口1进入。交换机先观察源地址A，于是表中记A→1；这时没有B的位置，所以输出FLOOD。学习依据是源地址与入端口，不能凭目标B猜它也在端口1，否则回包会被送错。','第二帧利用已学信息｜B给A的帧从端口2到达，先新增B→2，然后查目标A，已知A在1，因此输出1。此刻表有A→1和B→2。交换机没有要求终端主动发送一张位置表，它是通过正常流量逐渐学会的，长时间没有流量的记录还会老化。','第三帧可定向转发｜A再次从1发给B，更新或确认A→1，再查B得到2，输出2。如果某帧目标也在当前入端口，模型输出FILTER，表示无需再从同端口转发。这与未知目标泛洪不同，不是所有找不到跨端口路径的情况都应该广播。','将模型扩展到VLAN｜两个不同VLAN可能出现相同MAC标签，不能用单独MAC作为唯一键，应按VLAN与MAC区分学习记录。VLAN隔离广播域，跨VLAN通信通常需要三层转发。模型未处理广播、多播、生成树状态与老化计时，只抓住“先学源、再查目的”的核心顺序。'],
['t[src]=in｜学习源位置，重复看到同一源时可以更新它所在端口。','t.find(dst)｜查目标，find不会因为没找到就自动创建一个错误的默认端口。','it->second==in｜目标与来源在同一入端口时过滤，不再反射发送。'],
['第一帧为什么不能直接输出B的端口？｜表中还没有B的位置，源地址只告诉交换机A在哪，不能推断B。','两个VLAN能共用只以MAC为键的简化表吗？｜通常不应这样简化，否则可能把不同广播域的位置混在一起；需要包含VLAN上下文。']);
G('net-stp','多条链路能提高可用性，但二层网络形成环路时，广播帧可能不断循环并复制。生成树协议让冗余拓扑中的部分链路暂不用于普通转发，从而保留无环的活动结构。本例只实现第一步根桥选择：比较桥标识，选出数值较小者。理解这个局部模型后，还要继续知道选根并不等于已经完成整个生成树计算。',
['二层环路｜交换链路绕一圈回到原设备，帧可能反复出现；以太网帧没有像IP TTL那样的通用逐跳上限。','根桥｜生成树计算的参考中心，其他桥选择通向它的路径。','桥标识比较｜本模型先比较优先级数字，数字小者优先，数字相同再比较规范化MAC字符串。'],
['把候选信息列出来｜三个桥分别为优先级32768地址末尾01、优先级4096地址末尾09、优先级32768地址末尾02。priority这个名称容易让人误以为数字越大越优先，但此处协议比较选择较小标识，因此先看4096小于32768，第二个候选已经占优。','理解pair默认比较｜代码用pair<int,string>保存两部分。pair按first优先、相同再比较second的字典序规则比较，这恰好符合这个简化桥标识模型。MAC字符串都采用相同宽度与格式，否则文本字典序未必正确表达数值大小，输入格式也属于前提。','选出根候选｜min_element返回最小pair所在位置，解引用得到4096与00:00:00:00:00:09。虽然它的地址末尾09大于其他两个，第一字段优先级已经胜出，根本不需要再按地址挑较小者。输出只是被选中的桥标识，不是端口转发状态。','说明离完整STP还差什么｜真正协议还要交换BPDU、比较路径成本、选择根端口和指定端口、处理状态过渡与拓扑变化。不能选完根桥就把其余桥或所有非直连链路删掉。生成树的目的是让活动二层路径无环并保留必要连通性，冗余链路仍可在故障后参与重新收敛。'],
['vector<pair<int,string>>bridges｜每项保存优先级和地址，字段顺序决定默认比较顺序。','*min_element(...)｜函数返回迭代器，前面的*读取候选值；输入必须非空才能这样解引用。','b.first与b.second｜输出桥标识两个部分，不代表路径成本或端口号。'],
['32768/01与32768/02谁先？｜优先级相同，规范化地址01更小，因此前者先。','选出根桥后是否就完成STP？｜没有，还需要路径、端口角色、状态转换与拓扑变化处理等步骤。']);
G('net-wireless','无线发送者不一定能听见所有会干扰同一接收者的设备。A和C互相听不见，却都能向B发送，这时各自以为信道空闲，仍可能在B处碰撞。这个隐藏终端问题说明“我没听到别人”不等于“我的接收者那里没有别的信号”。本节用一个能否互相听见的矩阵枚举这种结构，不发送真实无线信号。',
['覆盖关系｜一个设备的发送能被另一个设备接收到，本例以0/1矩阵表示。','隐藏终端｜两个发送者互相听不见，却共享一个可接收它们信号的节点。','碰撞｜多个信号在接收位置重叠导致难以正确解码，是否冲突取决于接收环境而不只发送端感知。'],
['先读矩阵而不是记图形｜hear第一行0、1、0表示A能与B建立本例中的可听关系，但A与C之间没有关系；第二行1、0、1表示B与A、C相连；第三行0、1、0与第一行对应。矩阵使用对称的简化模型，真实无线链路可能受功率和环境影响而不对称。','固定一个接收者再选发送者｜当receiver为B也就是下标1时，候选a=A、c=C。hear[A][B]和hear[C][B]都为1，说明两者都可能把信号送到B；hear[A][C]为0，说明A无法通过听到C来知道C正在发。三个条件一起成立才是本例要找的隐藏结构。','为什么只枚举c>a｜若同时检查A、C和C、A，会把同一对发送者输出两次。内层循环让c从a+1开始，每个无序对只考虑一次。最终输出A C -> B，箭头表示它们共享的接收者，不表示代码真的模拟了同时发送与信号碰撞的物理过程。','连接到无线接入机制｜无线网络使用载波侦听、退避等机制降低冲突，RTS/CTS可以在某些情形缓解隐藏终端，但并不是所有无线问题的万能解。这里矩阵只揭示潜在冲突拓扑，没有建模时间、距离衰减、重传或吞吐，因此不能由一次枚举直接计算真实碰撞概率。'],
['hear[a][receiver]｜检查发送者a与固定接收者的可听关系。','c=a+1｜避免把同一发送者对以相反顺序重复计数。','char(\'A\'+a)｜将下标0、1、2转成标签A、B、C，标签只是展示用途。'],
['A与C互相听不见是否足以判隐藏终端？｜不够，还要有同一个接收者能够收到二者，否则未必形成这个冲突结构。','模型输出A C -> B是否证明每次发送都会碰撞？｜不是，它只找潜在条件，实际是否同时发送及能否解码还取决于时序与无线环境。']);
G('net-arp','电脑要把IP包发到远方网站，当前以太网帧应该交给谁？通常不是直接寻找远方服务器的MAC，而是先决定下一跳：同一子网直接交给目标，跨子网交给网关。ARP用于把当前链路上的IPv4下一跳地址解析成MAC。本节先用掩码判断同网段，弄清楚要问谁的MAC，再谈如何真正发ARP请求。',
['下一跳｜当前设备直接交付数据的邻居；跨网通信时通常是默认网关。','默认网关｜当目的地不在本地直连网段且无更具体路由时，把包交给的路由设备。','ARP｜在IPv4局域链路上询问某个协议地址对应的链路地址，结果可缓存在邻居表中。'],
['写出本机与目的地｜self为192.168.1.10，dst为8.8.8.8，掩码255.255.255.0。按位与掩码后，本机网络是192.168.1.0，目标网络是8.8.8.0，两者不同。不能仅根据地址里是否有相同数字猜是否同网段，必须结合前缀与路由信息。','选择当前能直接到达的对象｜由于目标不在本地网段，本例选择网关192.168.1.1作为下一跳，输出该地址。这表示接下来应该获得网关的MAC，用以太网帧交给网关。IP包的目的地址仍是8.8.8.8，不会因为当前帧交给网关就把最终目的IP改成网关。','区分IP与MAC的作用范围｜MAC负责当前链路上的帧交付，IP帮助跨多跳寻找最终目的地。经过路由器后，下一条链路通常会使用新的链路层封装。因此不能向本地广播询问“谁拥有远方服务器MAC”来跨越整个互联网，ARP广播不会自动穿过所有路由器。','明确模型假设｜代码只处理一个直连/默认网关选择，不包含完整路由表、ARP缓存、超时或真实广播。如果目标改成192.168.1.20，在同一/24内，下一跳应为目标自身。真实主机通常先按路由表选择出接口和下一跳，再在该接口上执行邻居解析。'],
['ip(a,b,c,d)｜把四个字节组合为32位无符号地址，便于统一做掩码运算。','(self&mask)==(dst&mask)｜在本例单网段假设下比较网络前缀。','条件表达式选择网关｜输出是下一跳IP，不是解析出的MAC；本例尚未实现ARP报文交换。'],
['跨网发送时以太网目的MAC是谁的？｜通常是当前下一跳网关的MAC，不是远方终点服务器的MAC。','目的改成192.168.1.20会选择谁？｜同一/24网段，本例应直接选择192.168.1.20作为下一跳。']);
