lesson('vector','stl','vector 动态数组','连续存储 · 扩容 · 遍历','顺序容器',18,
 [['为什么需要动态数组','vector 将元素连续存放，支持按下标随机访问，并在容量不足时申请更大的存储空间。size 是现有元素数，capacity 是可容纳的元素数。Python 的 list 在常见实现中也是动态数组，但存放的是对象引用。'],['把一次操作放进时间尺度','按下标访问是 O(1)，尾部 push_back 的摊还成本是 O(1)，一次扩容可能是 O(n)。中间插入、删除需要移动后续元素。reserve 只预留容量，resize 才改变元素数量。'],['实践：保留第一次出现的元素','从左到右遍历输入，用一个集合记录已经见过的值，只把第一次出现的值追加到结果。结果仍按原始出现顺序排列。']],
 '扩容可能使迭代器、指针与引用失效。遍历时直接 erase 后继续递增旧迭代器也可能出错；使用 erase 返回的新迭代器。','平均 O(n) 时间，O(n) 额外空间（哈希集合）。',
 String.raw`#include <iostream>
#include <vector>
#include <unordered_set>
std::vector<int> unique_first(const std::vector<int>& a) {
    std::unordered_set<int> seen;
    std::vector<int> result;
    for (int x : a)
        if (seen.insert(x).second) result.push_back(x);
    return result;
}
int main() {
    for (int x : unique_first({3, 1, 3, 2, 1})) std::cout << x << ' ';
}`,`def unique_first(a):
    seen, result = set(), []
    for x in a:
        if x not in seen:
            seen.add(x)
            result.append(x)
    return result

print(*unique_first([3, 1, 3, 2, 1]))`, '3 1 2',
 ['reserve(100) 对空 vector 的 size 有何影响？',['变为 100','仍为 0','变为 1','取决于元素类型'],1,'reserve 仅保证容量至少达到参数，不构造新元素。'],
 ['对 [1,2,3,4] 删除下标 1 的元素后，内容是？',['[1,3,4]','[2,3,4]','[1,2,4]','[1,0,3,4]'],0,'下标从 0 开始，删除 2，后面的元素向左移动。'],
 '实现 unique_first：删除整数序列的重复值，保留第一次出现的顺序。输入 [3,1,3,2,1]，输出 [3,1,2]。空数组应返回空数组，考虑负数。');
lesson('unordered-map','stl','unordered_map 哈希映射','键值对 · 计数 · 平均复杂度','关联容器',20,
 [['从键定位到值','unordered_map 使用哈希组织唯一键。查找、插入和删除平均 O(1)，最坏可能 O(n)。Python 的 dict 可表达键值映射，但不要依赖 C++ unordered_map 的遍历顺序。'],['访问与查询的区别','C++ 的 m[key] 在键不存在时会插入默认值。只检查存在性时使用 find；Python 的 d[key] 对缺失键会抛出 KeyError，d.get(key, 0) 则返回默认值且不插入。'],['实践：频次统计','逐个读入单词并累加计数，再按指定查询顺序取值。把输入顺序和哈希表内部顺序分开，才能得到可预测的输出。']],
 '哈希表不是有序表。迭代顺序无法用来寻找最小键；rehash 也会使迭代器失效。','平均 O(n+q) 时间，O(k) 空间，k 为不同键数量。',
 String.raw`#include <iostream>
#include <string>
#include <vector>
#include <unordered_map>
int main() {
    std::vector<std::string> words = {"red", "blue", "red"};
    std::unordered_map<std::string, int> freq;
    for (const auto& w : words) ++freq[w];
    for (const std::string w : {"red", "blue", "green"}) {
        auto it = freq.find(w);
        std::cout << w << ':' << (it == freq.end() ? 0 : it->second) << '\n';
    }
}`,`words = ["red", "blue", "red"]
freq = {}
for word in words:

for word in ["red", "blue", "green"]:

 ['unordered_map 默认保证哪一项？',['按键升序','按插入顺序','键唯一','最坏 O(1) 查找'],2,'键唯一；遍历无序，极端冲突时查找可退化。'],
 ['空的 unordered_map<string,int> m 执行 m["a"]++ 后，m["a"] 是？',['未定义','0','1','抛出异常'],2,'缺失键先插入值初始化的 int（0），再自增到 1。'],
 '统计 ["red","blue","red"] 的频次，并依次查询 red、blue、green。未出现的单词显示 0，查询缺失键时不要修改词频表。');
lesson('set','stl','set 有序集合','去重 · 顺序 · 范围查询','关联容器',16,
 [['用顺序换取范围能力','std::set 存放唯一元素，按比较器排序；查找和更新为 O(log n)。Python 的 set 只提供无序去重，本节用 sorted(set(...)) 产生有序快照，它不等于可动态更新的有序树。'],['lower_bound 的含义','set.lower_bound(x) 返回第一个不小于 x 的元素。它可能返回 end，因此必须先检查。Python 对排好序的列表使用 bisect_left 找到同样的插入位置。'],['实践：找到下一个可用值','对 [7,2,7,9,4] 去重排序，查找不小于 5 的最小值。先得到 [2,4,7,9]，答案为 7。']],

lesson('priority-queue','stl','priority_queue 优先队列','堆 · Top K · 优先级','容器适配器',22,
 [['先处理优先级最高的项','priority_queue 是容器适配器，默认把最大元素放在 top。push、pop 为 O(log n)，top 为 O(1)。Python 的 heapq 默认维护最小堆。'],['保留最大的 k 个数','维护大小不超过 k 的最小堆。每次插入一个数，超出 k 就弹出最小值。最终堆内保留最大的 k 个数，堆顶是第 k 大。'],['理解不变量','处理任意前缀后，堆始终保留该前缀的最大 k 项（元素不够时全部保留）。重复值算不同位置的元素，不会自动去重。']],
 'C++ pop() 不返回被移除的值，先 top() 再 pop()。k 必须满足 1 ≤ k ≤ n。','O(n log k) 时间，O(k) 空间。',

`, `class Ring:
    def __init__(self, capacity):
        if capacity <= 0:
            raise ValueError('capacity')
        self.a, self.head, self.size = [0]*capacity, 0, 0
    def push(self, x):
        if self.size == len(self.a):
            return False
        self.a[(self.head+self.size) % len(self.a)] = x
        self.size += 1
        return True
    def pop(self):
        if not self.size:
            raise IndexError('empty')
        x = self.a[self.head]
        self.head = (self.head+1) % len(self.a)
        self.size -= 1
        return x

 String.raw`#include <iostream>
#include <vector>
std::vector<int> merge_sort(std::vector<int> a) {
    if (a.size()<2) return a;
    auto mid=a.begin()+a.size()/2;
    auto left=merge_sort(std::vector<int>(a.begin(),mid));
    auto right=merge_sort(std::vector<int>(mid,a.end()));
    size_t i=0,j=0,k=0;
    while(i<left.size() && j<right.size())
        a[k++]=(left[i]<=right[j] ? left[i++] : right[j++]);
    while(i<left.size()) a[k++]=left[i++];
    while(j<right.size()) a[k++]=right[j++];
    return a;
}

        return a[:]

    left, right = merge_sort(a[:mid]), merge_sort(a[mid:])

int min_coins(const std::vector<int>& coins, int amount) {
    if(amount<0) return -1;
    std::vector<int> dp(amount+1,amount+1); dp[0]=0;
    for(int s=1;s<=amount;++s)

        con->commit(); std::cout<<"committed";

    print(f'{k}:{m[k]}')`,out:'apple:1\npear:2',q1:['map 默认遍历顺序由什么决定？',['插入时间','键的比较关系','值的大小','哈希值'],1,'map 的关联关系由键的比较器排序。'],q2:['读取缺失键 m["x"]（值类型 int）会怎样？',['只返回错误','不改变容器','插入 x 并值初始化为 0','随机返回'],2,'operator[] 会创建缺失键。'],task:'统计 pear、apple、pear 的次数，并按键升序输出 apple:1、pear:2。不要依赖 Python 字典的插入顺序。',source:'https://eel.is/c++draft/map'});
add({id:'stl-multi-associative',title:'multiset 与 multimap：重复键',sub:'多重集合 · equal_range · 删除粒度',group:'关联容器',sections:[['重复值是数据的一部分','multiset 允许多个等价元素，multimap 允许多个等价键与不同值共存。它们仍按比较关系有序，适合成绩排名、事件时间表和一对多映射。'],['equal_range 找到整组','equal_range(key) 返回 [first,last)，恰好覆盖全部等价键。遍历该区间可取出某个分类的全部记录，而 lower_bound 与 upper_bound 给出两端位置。'],['删除一个与删除全部','erase(key) 删除全部匹配元素；erase(iterator) 只删除该位置的一个。示例从 2,2,5 中仅删一个 2，剩余 2 的计数应为 1。']],pitfall:'multimap 没有 operator[]，因为一个键可能对应多个值，单值访问含义不明确。',cost:'定位范围 O(log n)，遍历 k 个匹配项 O(k)；计数通常 O(log n+k)。',cpp:String.raw`int main(){multiset<int> s{2,2,5};s.erase(s.find(2));cout<<s.count(2)<<'\n';multimap<string,int> m{{"A",1},{"B",9},{"A",3}};auto [a,b]=m.equal_range("A");for(auto i=a;i!=b;++i)cout<<i->second<<' ';}`,py:`from collections import Counter
s = Counter([2,2,5])
s[2] -= 1
print(s[2])
records = [('A',1),('B',9),('A',3)]
print(*(v for k,v in records if k == 'A'))`,out:'1\n1 3',q1:['multiset 与 set 的主要区别是？',['支持重复等价值','元素无序','不支持查询','只有字符串键'],0,'multiset 不要求键唯一。'],q2:['multiset {2,2,5} 执行 erase(2) 后还剩几个 2？',['0','1','2','取决于迭代顺序'],0,'按键删除会移除全部等价键。'],task:'从多重集合 [2,2,5] 仅删除一个 2，输出剩余计数 1；再输出 multimap 中键 A 对应的 1、3。',source:'https://eel.is/c++draft/associative'});
add({id:'stl-unordered-family',title:'unordered_set 与无序多重容器',sub:'哈希等价 · 负载因子 · 重复键',group:'关联容器',sections:[['四种哈希容器','unordered_set 保存唯一值，unordered_map 保存唯一键值对；unordered_multiset 和 unordered_multimap 允许重复。哈希函数与相等谓词必须一致：被判定相等的键必须具有相同哈希值。'],['桶与负载因子','load_factor 是元素数除以桶数。reserve 与 rehash 可调整容量策略，降低频繁扩容开销，但不会保证元素遍历顺序，也不能消除最坏冲突。'],['实践：区分存在性与次数','向无序集合加入 4,4,9 得到两个不同值；无序多重集合仍有两个 4。输出计数而不是直接遍历，避免让答案依赖实现特定顺序。']],pitfall:'rehash 会使迭代器失效；相同键的 hash 一致只是必要条件，冲突键仍需要相等比较。',cost:'常见查找平均 O(1)，最坏 O(n)；多重键匹配项还需 O(k) 处理。',cpp:String.raw`int main(){unordered_set<int> a{4,4,9};unordered_multiset<int>b{4,4,9};unordered_multimap<int,string>c{{4,"x"},{4,"y"}};cout<<a.size()<<' '<<b.count(4)<<' '<<c.count(4);}`,py:`from collections import Counter, defaultdict
values = [4,4,9]
a = set(values)
b = Counter(values)
c = defaultdict(list)
for k,v in [(4,'x'),(4,'y')]:
    c[k].append(v)
print(len(a), b[4], len(c[4]))`,out:'2 2 2',q1:['unordered_multiset 是否允许重复值？',['不允许','只允许一个 0','允许','取决于 Python 版本'],2,'multi 容器保存等价键的多次出现。'],q2:['若 equal(a,b) 为真，自定义 hash 必须满足？',['hash(a) 不等于 hash(b)','hash(a) 等于 hash(b)','a 与 b 地址相同','a 小于 b'],1,'相等对象必须落入相同哈希值对应的桶。'],task:'分别构造唯一无序集合、多重无序集合和多重无序映射，输出不同值数 2、值 4 的次数 2、键 4 的记录数 2。',source:'https://eel.is/c++draft/unord.req'});
add({id:'stl-stack-queue',title:'stack 与 queue：受限接口适配器',sub:'LIFO · FIFO · 底层容器',group:'容器适配器',sections:[['只暴露任务需要的操作','stack 与 queue 不自行定义全新存储布局，而是包装底层容器并限制接口。stack 使用 top，queue 使用 front/back，两者默认底层容器通常是 deque。'],['读取与移除分开','C++ 的 pop 返回 void，要先读取再弹出；二者都不提供直接 begin/end 遍历。空容器上读取元素不合法，应先检查 empty。'],['实践：同一输入两种顺序','依次加入 1、2、3，栈依次取出 3、2、1，队列取出 1、2、3。Python 列表可模拟栈，collections.deque 可模拟队列。']],pitfall:'不要用 list.pop(0) 作为高吞吐 Python 队列；它会移动后面的元素。',cost:'本示例每次入出 O(1)，整体 O(n) 时间、O(n) 存储。',cpp:String.raw`int main(){stack<int>s;queue<int>q;for(int x:{1,2,3}){s.push(x);q.push(x);}while(!s.empty()){cout<<s.top()<<' ';s.pop();}cout<<'\n';while(!q.empty()){cout<<q.front()<<' ';q.pop();}}`,py:`from collections import deque
s = [1,2,3]
q = deque(s)
while s:
    print(s.pop(), end=' ')
print()
while q:
    print(q.popleft(), end=' ')`,out:'3 2 1\n1 2 3',q1:['queue.front() 读取的是？',['最近加入的元素','最早尚未移除的元素','最大值','随机元素'],1,'队列是先进先出。'],q2:['C++ stack.pop() 的返回类型是？',['int','引用','void','迭代器'],2,'读取栈顶要使用 top，pop 只负责移除。'],task:'向栈和队列依次加入 1、2、3，分别输出完整移除顺序。访问元素前检查容器不为空。',source:'https://eel.is/c++draft/container.adaptors'});
add({id:'stl-iterator-categories',title:'迭代器类别与半开区间',sub:'输入输出 · 前向双向 · 随机访问',group:'迭代器与有效性',
sections:[['类别描述操作能力','输入迭代器用于读取，输出迭代器用于写入；前向支持多趟遍历，双向支持递减，随机访问支持常数时间跳转。连续迭代器还保证连续存储。算法会要求特定能力。'],['统一使用半开区间','[first,last) 包括 first，不包括 last。空区间满足 first==last；last 可比较但不可解引用。容器的 end 不是最后一个元素，而是末尾之后的位置。'],['同接口不等于同成本','advance 对 vector 迭代器可以直接跳转，对 list 迭代器需要逐节点行走。本例分别前进两步取出 30，再计算链表范围长度 4。']],
pitfall:'list 迭代器不支持 it+2；distance 对链式迭代器可能要遍历全部范围。',cost:'随机访问移动 O(1)，链式移动 k 步 O(k)。',cpp:String.raw`int main(){vector<int>a{10,20,30,40};list<int>b(a.begin(),a.end());auto x=a.begin();auto y=b.begin();advance(x,2);advance(y,2);cout<<*x<<' '<<*y<<' '<<distance(b.begin(),b.end());}`,
py:`a = [10,20,30,40]
it = iter(a)
next(it)
next(it)
print(a[2], next(it), len(a))`,out:'30 30 4',q1:['end 指向哪里？',['最后元素','最后元素之后','第一个元素','最大元素'],1,'end 是哨兵位置，不可解引用。'],q2:['list 迭代器前进 k 步一般需要？',['O(1)','O(log k)','O(k)','O(k²)'],2,'必须沿链接逐个前进。'],task:'分别将 vector 和 list [10,20,30,40] 的起始迭代器前进两步，输出 30 30，再输出区间长度 4。',source:'https://eel.is/c++draft/iterator.requirements'});
add({id:'stl-iterator-adapters',title:'迭代器适配器：反向与插入',sub:'reverse_iterator · back_inserter · 流迭代器',group:'迭代器与有效性',
sections:[['反向遍历的边界','rbegin 指向反向序列的第一个值，rend 表示反向末尾。reverse_iterator.base 指向正向序列中被访问元素的后一个位置，转换为正向删除位置时要注意偏移。'],['输出位置也可以是一种动作','back_inserter 将赋值转为 push_back；front_inserter 与 inserter 分别适配头部和指定位置插入。目标必须支持对应容器操作。'],['实践：反向复制到空容器','对 [1,2,3] 使用反向范围和尾插适配器得到 [3,2,1]。ostream_iterator 还能把算法输出接到流。Python 用 reversed 与 extend 实现同一任务。']],
pitfall:'向空 vector.begin 直接 copy 不会自动增长 size；需要 resize 或插入迭代器。',cost:'O(n) 时间和目标存储。',cpp:String.raw`int main(){vector<int>a{1,2,3},b;copy(a.rbegin(),a.rend(),back_inserter(b));copy(b.begin(),b.end(),ostream_iterator<int>(cout," "));}`,py:`a = [1,2,3]
b = []
b.extend(reversed(a))
print(*b)`,out:'3 2 1',q1:['back_inserter 将赋值适配为？',['pop_back','push_back','sort','clear'],1,'输出一个元素会在目标尾部追加。'],q2:['空 vector 只 reserve(3) 后直接 copy 到 begin 是否安全？',['安全','不安全，size 仍为 0','只对整数安全','取决于排序'],1,'容量不等于已构造元素数。'],task:'用反向与插入迭代器把 [1,2,3] 复制到空目标容器，输出 3 2 1。',source:'https://eel.is/c++draft/iterator.adaptors'});
add({id:'stl-iterator-invalidation',title:'迭代器失效与安全删除',sub:'erase 返回值 · 扩容 · 生命周期',group:'迭代器与有效性',
sections:[['迭代器依赖存储状态','vector 重分配使旧迭代器、指针和引用失效。vector.erase 使被删位置及之后的位置失效。节点容器和哈希容器有不同规则，不能套用一种容器的结论。'],['用 erase 返回的新位置','删除当前元素时写 it=erase(it)，不删除时才递增。循环每次重新比较当前 end，这样可正确处理连续多个待删除元素。'],['偶然正确仍可能无效','失效迭代器的错误常在扩容或内存布局变化后才暴露。实践删除 [1,2,4,3,6] 的偶数，连续的 2 和 4 都必须移除。']],
pitfall:'erase 后无条件再 ++it 会跳过元素，且可能操作无效位置。',cost:'逐项 vector.erase 最坏 O(n²)；批量 erase-remove 可做到 O(n)。',cpp:String.raw`int main(){vector<int>a{1,2,4,3,6};for(auto it=a.begin();it!=a.end();){if(*it%2==0)it=a.erase(it);else ++it;}for(int x:a)cout<<x<<' ';}`,py:`a = [1,2,4,3,6]
i = 0
while i < len(a):
    if a[i]%2 == 0:
        del a[i]
    else:
        i += 1
print(*a)`,out:'1 3',q1:['vector 重分配后旧迭代器如何？',['全部保持有效','仅 end 失效','全部失效','自动更新'],2,'底层存储已改变。'],q2:['循环删除后应如何得到下一位置？',['使用 erase 返回值','无条件再递增旧迭代器','保存原 end 永久使用','解引用已删除位置'],0,'容器返回新的有效后继或 end。'],task:'原地删除 [1,2,4,3,6] 中所有偶数，输出 1 3。演示逐项安全删除，并说明最坏平方复杂度。',source:'https://eel.is/c++draft/vector.modifiers'});
add({id:'stl-sorting',title:'排序算法：完整、稳定与局部排序',sub:'sort · stable_sort · nth_element',group:'算法库',
sections:[['只做需求所需的排序','sort 整理全部区间；partial_sort 只把前 k 个排好；nth_element 只保证第 k 位置与两侧分区，两边内部不保证有序。都要满足对应迭代器与比较器要求。'],['稳定性是明确保证','stable_sort 保留等价元素原相对顺序。按分数排序时，若同分仍需按登记顺序出现，就应选择稳定排序。Python sorted 本身稳定。'],['实践：保留同分登记顺序','Ana:80、Bo:70、Cy:80 升序排列应得到 Bo、Ana、Cy。比较器只比较分数，让稳定性负责 Ana 与 Cy 的次序。']],
pitfall:'不能根据 sort 某次结果推断它具有稳定性。',cost:'sort O(n log n) 比较；stable_sort 有足够缓冲区 O(n log n)，否则可为 O(n log²n)。',cpp:String.raw`int main(){vector<pair<string,int>>a{{"Ana",80},{"Bo",70},{"Cy",80}};stable_sort(a.begin(),a.end(),[](const auto&x,const auto&y){return x.second<y.second;});for(auto [name,score]:a)cout<<name<<' ';}`,py:`a = [('Ana',80),('Bo',70),('Cy',80)]
print(*(name for name,score in sorted(a,key=lambda x:x[1])))`,out:'Bo Ana Cy',q1:['保持同键元素原顺序应选择？',['stable_sort','任意 sort','reverse','unique'],0,'稳定性需要明确保证。'],q2:['nth_element 完成后两侧内部一定有序吗？',['都一定','只有左边','不保证','等同完整排序'],2,'只保证目标位置和分区关系。'],task:'将 Ana:80、Bo:70、Cy:80 按分数稳定升序排序，输出 Bo Ana Cy。',source:'https://eel.is/c++draft/alg.sorting'});
add({id:'stl-partition',title:'partition：按条件分组',sub:'稳定分区 · 分界点 · 谓词',group:'算法库',
sections:[['分区不是排序','partition 把满足谓词的元素移到前部，返回第一个不满足条件的位置。两组内部不一定有序，也不保证原相对顺序。'],['稳定分区保留组内次序','stable_partition 适合“优先处理一类任务，但保持各组到达顺序”。partition_point 可在已按同一谓词分区的范围内查找分界点。'],['实践：偶数先行','将 [3,2,4,1] 稳定分为偶数和奇数，结果是 [2,4,3,1]，分界位置下标 2。Python 用两次条件筛选拼接得到等价结果。']],
pitfall:'partition_point 的前提是已经分区，不是任意条件搜索的替代品。',cost:'partition 线性；稳定分区的比较为 O(n)，移动成本取决于可用缓冲区。',cpp:String.raw`int main(){vector<int>a{3,2,4,1};auto p=stable_partition(a.begin(),a.end(),[](int x){return x%2==0;});cout<<distance(a.begin(),p)<<'\n';for(int x:a)cout<<x<<' ';}`,py:`a = [3,2,4,1]
left = [x for x in a if x%2 == 0]
right = [x for x in a if x%2 != 0]
print(len(left))
print(*(left+right))`,out:'2\n2 4 3 1',q1:['partition 主要完成？',['全局升序','满足谓词者在前','删除重复','逆序'],1,'只按谓词真假分组。'],q2:['[3,2,4,1] 偶数优先的稳定分区是？',['4 2 1 3','2 4 3 1','1 2 3 4','3 1 2 4'],1,'两组分别保留原相对顺序。'],task:'输出 [3,2,4,1] 偶数优先稳定分区的分界下标 2，再输出 2 4 3 1。',source:'https://eel.is/c++draft/alg.partitions'});
add({id:'stl-query-algorithms',title:'find、count 与谓词查询',sub:'find_if · all_of · any_of · none_of',group:'算法库',
sections:[['让查询意图直接可读','find 查找指定值，find_if 查找首个满足条件者，count/count_if 统计出现次数。all_of、any_of、none_of 分别表达全部、至少一个和一个也没有。'],['理解空区间','空区间的 all_of 与 none_of 为真，any_of 为假。前者没有反例，后者没有满足条件的见证，符合逻辑中的全称和存在命题。'],['实践：监测值查询','对 [4,7,10,3] 找首个大于 5 的值并统计偶数数量，结果为 7 和 2。find_if 结果必须先和 end 比较，不能假设一定找到。']],
pitfall:'find 返回位置，不是布尔值；得到 end 后不得解引用。',cost:'最坏 O(n) 时间，O(1) 额外状态。',cpp:String.raw`int main(){vector<int>a{4,7,10,3};auto p=find_if(a.begin(),a.end(),[](int x){return x>5;});if(p!=a.end())cout<<*p;cout<<' '<<count_if(a.begin(),a.end(),[](int x){return x%2==0;});}`,py:`a = [4,7,10,3]
first = next((x for x in a if x>5),None)
print(first,sum(x%2 == 0 for x in a))`,out:'7 2',q1:['find_if 返回？',['首个匹配位置或 end','匹配总数','最后一个值','排序结果'],0,'返回可定位元素的迭代器。'],q2:['空区间的 all_of 为？',['假','真','抛异常','随机'],1,'不存在违反条件的元素。'],task:'对 [4,7,10,3] 输出首个大于 5 的值及偶数个数，结果为 7 2；说明无匹配时应如何检查。',source:'https://eel.is/c++draft/alg.nonmodifying'});
add({id:'stl-transform-copy',title:'transform、copy 与填充生成',sub:'逐项映射 · fill · generate',group:'算法库',
sections:[['复制、过滤与变换','copy 保留值，copy_if 带条件筛选，transform 将每个输入映射为新值。fill 写入固定值，generate 每次调用生成器产生新值。'],['输出范围必须合法','普通输出迭代器不会自动调整容器大小。可预先 resize，也可用 back_inserter。仅 reserve 不增加 size，无法提供可直接赋值的元素。'],['实践：生成平方序列','对 [-2,0,3] 逐项平方写到新容器，得到 [4,0,9]，原数组保持不变。示例只处理小整数，避免把溢出处理混入映射主题。']],
pitfall:'二元 transform 的第二输入也必须足够长，且输出重叠必须满足具体算法的前提。',cost:'n 次映射 O(n) 时间，独立结果 O(n) 空间。',cpp:String.raw`int main(){vector<int>a{-2,0,3},b;transform(a.begin(),a.end(),back_inserter(b),[](int x){return x*x;});for(int x:b)cout<<x<<' ';}`,py:`a = [-2,0,3]
b = [x*x for x in a]
print(*b)`,out:'4 0 9',q1:['transform 的用途是？',['逐项映射并输出','只判断存在','只删除','只能排序'],0,'算法将函数作用于输入元素。'],q2:['只 reserve 后目标 size 为？',['容量值','保持原值','总是 1','随机'],1,'reserve 只改变容量保证，不构造元素。'],task:'输入 [-2,0,3] 保持不变，生成平方序列 4 0 9；C++ 使用 transform 与尾插输出。',source:'https://eel.is/c++draft/alg.transform'});
add({id:'stl-erase-remove',title:'remove、unique 与逻辑尾部',sub:'擦除移除惯用法 · 去重 · C++20 erase_if',group:'算法库',
sections:[['算法移动元素，容器管理长度','remove_if 把要保留的元素向前压缩，返回新逻辑尾部，但并不改变容器 size。后面的值仍存在但不能再当作结果使用。'],['接上容器 erase','对 vector 使用 erase(remove_if(...),end()) 才真正缩短容器。unique 同样返回逻辑尾部，只处理相邻重复；全局去重常先排序再 unique。C++20 的 erase_if 封装了常见删除任务。'],['实践：排序去重','对 [3,1,3,2,1] 先排序，再 unique，再 erase，最后得到 [1,2,3]。这和保留首次出现顺序的去重需求不同。']],
pitfall:'忽略 unique 返回值会把逻辑结果之后的元素也打印出来。',cost:'排序 O(n log n)，压缩与 erase O(n)。',cpp:String.raw`int main(){vector<int>a{3,1,3,2,1};sort(a.begin(),a.end());a.erase(unique(a.begin(),a.end()),a.end());for(int x:a)cout<<x<<' ';}`,py:`a = [3,1,3,2,1]
a = sorted(set(a))
print(*a)`,out:'1 2 3',q1:['remove_if 会直接改变 vector.size 吗？',['会','不会','只删除一个','取决于值'],1,'算法只压缩元素并返回逻辑尾部。'],q2:['全局排序去重常见步骤是？',['unique 后直接遍历全部','sort→unique→erase','erase→sort→insert','reverse→count'],1,'先让相同值相邻，再压缩并缩短容器。'],task:'将 [3,1,3,2,1] 排序去重为 1 2 3，C++ 不允许只调用 unique 后打印原 size。',source:'https://eel.is/c++draft/alg.remove'});
add({id:'stl-bounds',title:'lower_bound、upper_bound 与 equal_range',sub:'有序边界 · 重复计数 · 插入位置',group:'算法库',
sections:[['三个边界语义','lower_bound 找首个不小于 x 的位置；upper_bound 找首个大于 x 的位置；equal_range 同时给出两者，形成全部等价元素的半开区间。'],['排序关系必须一致','查找时使用的比较关系要与构建有序范围时一致。对降序数据沿用升序查找前提会被破坏。返回 end 表示落在尾部边界，不是访问越界的许可。'],['实践：重复值所在区间','[1,2,2,2,4] 中值 2 的范围是下标 [1,4)，长度 3。C++ 用 equal_range，Python 用 bisect_left 与 bisect_right。']],
pitfall:'有序树容器优先使用成员 lower_bound；通用算法在非随机访问迭代器上可能有线性移动成本。',cost:'随机访问有序数组上 O(log n) 比较和时间；计数为边界差。',cpp:String.raw`int main(){vector<int>a{1,2,2,2,4};auto [l,r]=equal_range(a.begin(),a.end(),2);cout<<l-a.begin()<<' '<<r-a.begin()<<' '<<r-l;}`,py:`from bisect import bisect_left,bisect_right
a = [1,2,2,2,4]
l,r = bisect_left(a,2),bisect_right(a,2)
print(l,r,r-l)`,out:'1 4 3',q1:['upper_bound(x) 寻找什么？',['首个等于 x','首个大于 x','最后一个小于 x','任意相等值'],1,'upper 表示越过全部等价元素的右边界。'],q2:['[1,2,2,2,4] 中 2 的 equal_range 是？',['[1,3)','[1,4)','[0,4)','[2,4)'],1,'三个 2 占据下标 1、2、3。'],task:'输出 [1,2,2,2,4] 中数值 2 的左边界、右边界与数量，结果为 1 4 3。',source:'https://eel.is/c++draft/alg.binary.search'});
add({id:'stl-set-algorithms',title:'有序集合算法与 merge',sub:'交并差 · 对称差 · 合并',group:'算法库',
sections:[['算法作用于有序范围','set_union、set_intersection、set_difference、set_symmetric_difference 分别求并、交、差、对称差。输入可以是排序数组，不要求类型必须是 set。'],['重复值也有规则','这些算法按多重集合处理重复计数：交集取最小重数，并集取最大重数。merge 则保留两边全部元素，是加总重数，不能与 set_union 混淆。'],['实践：两个名单的交集','对已排序且唯一的 [1,3,5] 和 [3,4,5] 求交集，得到 [3,5]。输出插入迭代器负责增长目标，Python 显式排序交集得到相同顺序。']],
pitfall:'输入未按相同比较器排序时，不满足算法前提；集合差 A-B 与 B-A 通常不同。',cost:'两个长度 n、m 的有序输入，O(n+m) 时间和结果空间。',cpp:String.raw`int main(){vector<int>a{1,3,5},b{3,4,5},out;set_intersection(a.begin(),a.end(),b.begin(),b.end(),back_inserter(out));for(int x:out)cout<<x<<' ';}`,py:`a,b = [1,3,5],[3,4,5]
print(*sorted(set(a)&set(b)))`,out:'3 5',q1:['set_intersection 是否要求输入类型为 std::set？',['必须','不必，有序范围即可','只能 vector','只能数组指针'],1,'算法按迭代器范围工作。'],q2:['A 中两个 2，B 中三个 2，交集中有几个 2？',['1','2','3','5'],1,'多重集合交集取两边重数的最小值。'],task:'对 [1,3,5] 与 [3,4,5] 求有序交集并输出 3 5。说明若含重复值，Python set 版本与多重集合算法存在何种区别。',source:'https://eel.is/c++draft/alg.set.operations'});
add({id:'stl-heap-algorithms',title:'堆算法：管理已有容器',sub:'make_heap · push_heap · pop_heap · sort_heap',group:'算法库',
sections:[['堆并不一定封装在适配器里','make_heap 可把一个随机访问范围原地组织成堆。默认最大堆使最大值位于 front；底层数组并不是整体排序的。'],['扩展与删除是两步协议','push_back 新值后调用 push_heap；pop_heap 将堆顶交换到尾部并维护剩余范围，之后还需 pop_back 真正移除。只调用 pop_heap 不会减少 size。'],['实践：弹出最大值','把 [3,1,4] 建堆，追加 2 并调整，然后弹出最大值 4。对剩余堆 sort_heap 得到 [1,2,3]。Python 用负数维护最大堆语义。']],
pitfall:'所有堆操作必须使用一致比较器，sort_heap 的输入必须已经是相应的堆。',cost:'make_heap O(n)，单次 push/pop O(log n)，sort_heap O(n log n)。',cpp:String.raw`int main(){vector<int>a{3,1,4};make_heap(a.begin(),a.end());a.push_back(2);push_heap(a.begin(),a.end());pop_heap(a.begin(),a.end());cout<<a.back()<<'\n';a.pop_back();sort_heap(a.begin(),a.end());for(int x:a)cout<<x<<' ';}`,py:`import heapq
a = [-x for x in [3,1,4]]
heapq.heapify(a)
heapq.heappush(a,-2)
print(-heapq.heappop(a))
print(*sorted(-x for x in a))`,out:'4\n1 2 3',q1:['pop_heap 会自动减少容器 size 吗？',['会','不会','只对 vector 会','只移除最小值'],1,'它只调整范围，需要容器 pop_back。'],q2:['make_heap 的标准线性建堆复杂度是？',['O(1)','O(log n)','O(n)','O(n²)'],2,'自底向上调整总工作量为线性。'],task:'对 [3,1,4] 建最大堆、加入 2、弹出最大值 4，再排序剩余堆，输出第二行 1 2 3。',source:'https://eel.is/c++draft/alg.heap.operations'});
add({id:'stl-permutation',title:'排列、反转与旋转',sub:'next_permutation · reverse · rotate',group:'算法库',
sections:[['按字典序枚举排列','next_permutation 将序列变为下一字典序排列，若已经最大则恢复最小排列并返回 false。从有序序列开始可枚举所有不同排列，包括重复元素情况下的去重排列。'],['反转和旋转是不同操作','reverse 颠倒元素次序，rotate 把指定中点之前的一段移到末尾，并保留两段内部次序。它们是构建排列与序列重排的常用工具。'],['实践：重复元素排列','从 [1,1,2] 开始输出全部不同排列：112、121、211。Python itertools.permutations 会产生重复项，这里通过集合去重再排序匹配任务。']],
pitfall:'从非最小排列开始枚举，无法覆盖所有更小排列；Python 去重方案的内存成本也不同。',cost:'单次 next_permutation O(n)；全枚举随不同排列数增长，可能阶乘级。',cpp:String.raw`int main(){vector<int>a{1,1,2};do{for(int x:a)cout<<x;cout<<'\n';}while(next_permutation(a.begin(),a.end()));}`,py:`from itertools import permutations
for p in sorted(set(permutations([1,1,2]))):
    print(''.join(map(str,p)))`,out:'112\n121\n211',q1:['最大排列调用 next_permutation 后返回什么？',['true','false','抛异常','返回元素数'],1,'它恢复最小排列并返回 false。'],q2:['[1,1,2] 有几个不同排列？',['2','3','6','9'],1,'3!/2!=3。'],task:'按字典序枚举 [1,1,2] 的所有不同排列，输出 112、121、211。',source:'https://eel.is/c++draft/alg.permutation.generators'});
add({id:'stl-numeric',title:'数值算法：累积、扫描与差分',sub:'accumulate · partial_sum · inner_product',group:'算法库',
sections:[['累积的初值决定类型','accumulate 从初值开始按顺序累积，初值 0 表示 int，0LL 表示 long long。对大整数数组使用错误初值可能导致截断或溢出。'],['前缀和与相邻差分','partial_sum 输出每个位置之前的累积值，adjacent_difference 可恢复相邻增量。inner_product 逐对相乘再累加；iota 生成连续值。'],['实践：先扫描再求和','对 [2,3,5] 生成前缀和 [2,5,10]，最后总和为 10。C++ 使用 long long 初值，Python 整数可自动扩展，但仍有时间和存储成本。']],
pitfall:'reduce 可改变归约顺序；浮点加法不满足精确结合律，结果可能与顺序 accumulate 有差异。',cost:'扫描与累积 O(n) 时间，输出前缀数组 O(n) 空间。',cpp:String.raw`int main(){vector<int>a{2,3,5};vector<int>p(a.size());partial_sum(a.begin(),a.end(),p.begin());for(int x:p)cout<<x<<' ';cout<<'\n'<<accumulate(a.begin(),a.end(),0LL);}`,py:`from itertools import accumulate
a = [2,3,5]
print(*accumulate(a))
print(sum(a))`,out:'2 5 10\n10',q1:['accumulate 的累积结果类型主要由什么决定？',['最大元素','初值类型','容器名称','最后元素'],1,'初值类型决定内部累积器类型。'],q2:['[2,3,5] 的 partial_sum 是？',['2 3 5','2 5 10','0 2 5','10 8 5'],1,'依次累加得到 2、5、10。'],task:'输出 [2,3,5] 的前缀和及总和。C++ 总和使用 long long 初值，并解释与初值 0 的差异。',source:'https://eel.is/c++draft/numeric.ops'});
// 关联工具与现代接口
add({id:'stl-string',title:'string：字符串操作与边界',sub:'查找 · 子串 · 替换 · npos',group:'函数对象与关联工具',sections:[['字符串也是拥有存储的序列','string 保存字符并管理内存，size 是 char 元素数。在 UTF-8 中一个中文字符通常占多个字节，因此不能把字节下标当作 Unicode 字符下标。'],['查找结果需要检查','find 返回首次出现位置，失败返回 string::npos。substr(pos,count) 的第二参数是长度；replace 可替换指定区间。越界位置可能抛出异常。'],['实践：解析键值行','在 name=atlas 中寻找等号，再提取等号两侧。若等号缺失，先返回错误，避免拿 npos 继续计算下标。Python 的 find 失败是 -1，语义需要单独判断。']],pitfall:'npos 是无符号类型的最大值；不要用 pos >= 0 判断 C++ 查找成功。',cost:'示例线性查找 O(n)，子串复制总计 O(n) 空间。',cpp:String.raw`int main(){string s="name=atlas";auto p=s.find('=');if(p==string::npos){cout<<"invalid";return 0;}cout<<s.substr(0,p)<<' '<<s.substr(p+1);}`,py:`s = 'name=atlas'
p = s.find('=')
print('invalid' if p == -1 else s[:p] + ' ' + s[p+1:])`,out:'name atlas',q1:['string::find 未找到时返回？',['0','-1 的 int','string::npos','空字符串'],2,'返回 size_type 的特殊值 npos。'],q2:['s="abcdef"，s.substr(2,3) 是？',['cde','bc','cdef','abc'],0,'从下标 2 开始复制 3 个字符。'],task:'解析 name=atlas，输出 name atlas；没有等号时输出 invalid。',source:'https://eel.is/c++draft/basic.string'});
add({id:'stl-views',title:'string_view 与 span：借用连续数据',sub:'非拥有视图 · 生命周期 · 子区间',group:'现代标准扩展',standard:'C++20',extra:'#include <span>',sections:[['视图不负责管理所有者','string_view 借用字符序列；span<T> 借用连续的 T 序列。复制视图只复制地址和长度，不复制元素，底层对象必须比视图活得更久。'],['只读视图和只读元素不同','span<const int> 禁止通过视图改元素；const span<int> 固定视图本身，但仍可以修改元素。string_view 字符只读，却不保证末尾有空字符。'],['实践：修改数组中间区域','对 [1,2,3,4] 建立覆盖下标 1、2 的 span，把两个元素乘十，原数组变成 [1,20,30,4]。Python 的列表切片会复制，本例显式使用索引模拟借用更新。']],pitfall:'不要从局部 string 返回 string_view，也不要在 vector 扩容后使用旧 span。',cost:'建立子视图 O(1)，更新 k 个元素 O(k)，额外空间 O(1)。',cpp:String.raw`int main(){array<int,4>a{1,2,3,4};span<int> mid=span<int>(a).subspan(1,2);for(int&x:mid)x*=10;for(int x:a)cout<<x<<' ';}`,py:`a = [1,2,3,4]
for i in range(1,3):
    a[i] *= 10
print(*a)`,out:'1 20 30 4',q1:['span 是否拥有所指向的数据？',['总是拥有','不拥有','只有动态长度才拥有','由元素大小决定'],1,'span 是借用视图，需要外部保证生命周期。'],q2:['const span<int> 能否通过 operator[] 改元素？',['能','不能','只允许改第一个','必定抛异常'],0,'视图 const 不等于元素 const；只读元素用 span<const int>。'],task:'用 C++20 span 修改数组 [1,2,3,4] 的中间两个数为原值十倍；Python 用索引实现相同结果。',source:'https://eel.is/c++draft/views'});
add({id:'stl-tuple',title:'pair、tuple 与结构化绑定',sub:'组合返回值 · 解构 · 字典序',group:'函数对象与关联工具',sections:[['把相关结果作为一个值','pair 表达两个值，tuple 表达任意固定数量的异构值。它们适合短小的局部结果；含义复杂时，有命名字段的 struct 通常更易读。'],['按引用还是按值解构','auto [a,b]=p 复制成员；auto& [a,b]=p 引用成员。get<0> 按编译期索引访问，tie 可绑定已有变量或辅助多字段排序。'],['实践：返回最小值及位置','扫描 [9,2,7]，返回 pair<int,int>{2,1}。一次扫描同时获得两个相关结果，结构化绑定直接给结果命名。Python 使用元组解包完成相同任务。']],pitfall:'不要返回引用局部变量的 tuple；结构化绑定也必须遵守被引用对象的生命周期。',cost:'一次遍历 O(n)，额外空间 O(1)。',cpp:String.raw`pair<int,int> best(const vector<int>&a){if(a.empty())throw invalid_argument("empty");int p=0;for(int i=1;i<(int)a.size();++i)if(a[i]<a[p])p=i;return {a[p],p};}int main(){auto [value,index]=best({9,2,7});cout<<value<<' '<<index;}`,py:`def best(a):
    if not a: raise ValueError('empty')
    p = min(range(len(a)), key=lambda i: a[i])
    return a[p], p
value, index = best([9,2,7])
print(value, index)`,out:'2 1',q1:['修改结构化绑定以同时修改原 pair 应写？',['auto [a,b]','auto& [a,b]','const auto [a,b]','无需区分'],1,'引用绑定关联原成员。'],q2:['pair(2,9) 与 pair(3,1) 的字典序关系？',['前者更小','前者更大','相等','只比较第二项'],0,'先比较第一项，2 小于 3，第二项不参与。'],task:'扫描 [9,2,7]，通过组合返回值返回最小值及第一个最小值下标，输出 2 1；空输入明确报错。',source:'https://eel.is/c++draft/tuple'});
add({id:'stl-bitset',title:'bitset：固定大小的位集合',sub:'位运算 · 移位 · 集合模型',group:'函数对象与关联工具',sections:[['用一位表示一个状态','bitset<N> 的 N 是编译期常量，支持 set、reset、flip、test 和 count。右端字符对应第 0 位，通常让第 i 位表示编号 i 是否属于集合。'],['位操作对应集合操作','按位与求交集，按位或求并集，异或求仅出现一次的元素。移位用于移动状态位置，移出的位被丢弃。Python 整数位运算需显式掩码才能模拟固定宽度。'],['实践：两个课程集合求交','位串 00101101 与 00011100 的交集为 00001100，包含两个成员。直接用 count 得到交集大小，无需逐项存储布尔对象。']],pitfall:'bitset 的字符串打印顺序从高位到低位；整数转换也有目标类型宽度限制。',cost:'通常按机器字批量运算；N 位存储 O(N)，本例固定 8 位。',cpp:String.raw`int main(){bitset<8>a("00101101"),b("00011100");auto c=a&b;cout<<c<<' '<<c.count();}`,py:`a = int('00101101',2)
b = int('00011100',2)
c = (a & b) & 255
print(format(c,'08b'), c.bit_count())`,out:'00001100 2',q1:['bitset<8> 中字符串最右侧对应？',['第 7 位','第 0 位','任意位置','符号位'],1,'打印和字符串构造按高位到低位排列。'],q2:['按位与通常对应集合的什么操作？',['并集','差集','交集','笛卡尔积'],2,'只有两个集合都置位的位置才保留。'],task:'计算 8 位集合 00101101 和 00011100 的交集，打印 8 位结果及成员数量。',source:'https://eel.is/c++draft/template.bitset'});
add({id:'stl-comparator',title:'Lambda、函数对象与比较器契约',sub:'捕获 · 严格弱序 · 多字段排序',group:'函数对象与关联工具',sections:[['把小段行为传给算法','Lambda 可按值或按引用捕获局部变量。按值捕获保存创建时的值，按引用捕获依赖原变量的生命周期；函数对象通过 operator() 提供可调用行为。'],['比较器表达严格的先于关系','sort 的比较器需要严格弱序，尤其 cmp(x,x) 必须是 false。使用 <= 会破坏这一要求。按分数降序再按编号升序，可用两个不同字段逐层比较。'],['实践：成绩排序','记录 (编号,分数) 为 (2,90)、(1,90)、(3,80)，按分数降序且同分编号升序得到 1、2、3。Python key 为 (-分数,编号)，与 C++ 比较器表达相同规则。']],pitfall:'比较器不能在排序过程中随意改变排序标准；捕获悬空引用也会产生未定义行为。',cost:'排序 O(n log n) 比较；固定字段比较 O(1)。',cpp:String.raw`int main(){vector<pair<int,int>>a{{2,90},{1,90},{3,80}};sort(a.begin(),a.end(),[](const auto&x,const auto&y){return x.second!=y.second?x.second>y.second:x.first<y.first;});for(auto [id,score]:a)cout<<id<<' ';}`,py:`a = [(2,90),(1,90),(3,80)]

 '实现属性闭包：起始 {A}，依赖 A→B、B→C，输出 ABC。增添无关依赖 D→E 后结果应不变。','https://www.cs.cornell.edu/courses/cs4320/2021fa/');
LESSONS.at(-1).sources[0][0]='Cornell CS 4320：关系数据库与建模课程';
query('sql-types-null','类型选择与 NULL 三值逻辑','DECIMAL · 时间类型 · UNKNOWN','建模与基础',
 [['按语义选择类型','整数用于计数，DECIMAL 用于需要十进制精度的金额，浮点用于允许舍入的测量。DATETIME 与 TIMESTAMP 的时区语义和范围不同，应结合连接时区及业务要求选择。'],['NULL 表示未知或缺失','NULL 不是 0，也不是空字符串。普通比较遇到 NULL 通常得到 UNKNOWN；WHERE 只保留 TRUE。IS NULL 检测缺失，COALESCE 为显示或计算提供替代值。'],['聚合与缺失值','COUNT(*) 计行，COUNT(column) 只计非 NULL 值。示例分别求 demo_sales 总行数与已知金额数，结果为 4、3，不应把未填金额自动解释成真实零销售。']],
 'NOT IN 子查询若含 NULL，可能得到与你直觉不同的结果；需要明确排除 NULL 或使用相关 NOT EXISTS。','计数通常需访问记录或索引项，具体执行成本由存储引擎和计划决定。',
 'SELECT COUNT(*), COUNT(amount) FROM demo_sales','4 3',
 ['金额通常优先选哪种类型以避免二进制浮点舍入？',['FLOAT','DOUBLE','DECIMAL','BLOB'],2,'DECIMAL 存储精确十进制数，仍需合理设置精度和小数位。'],
 ['WHERE amount = NULL 能正确筛出缺失金额吗？',['能','不能，应使用 IS NULL','只在主键能','必须改成 = 0'],1,'普通比较结果为 UNKNOWN，不会被 WHERE 保留。'],
 '统计练习表总行数和 amount 非空行数，返回 4 3；解释两个 COUNT 为什么不同。','data-types.html');
query('sql-ddl','DDL、主外键与 CHECK 约束','建表 · 参照完整性 · 迁移','建模与基础',
 [['在数据库边界守住约束','PRIMARY KEY 保证行身份，UNIQUE 表达业务唯一性，NOT NULL 禁止缺失。CHECK 校验行内条件，外键要求引用目标存在；这些约束可拦截绕过应用校验的写入。'],['约束与事务不是同一件事','约束说明什么状态合法，事务说明一组修改如何共同提交。许多 DDL 会导致隐式提交，不能把 CREATE/ALTER 直接当成可随意回滚的普通数据更新。'],['用一个小表验证设计','创建 demo_people，主键为 id，name 非空，age 允许为空但非空时不能为负。插入两行后按 id 查询，可在练习库另外尝试重复主键或负年龄观察约束错误。']],
 'CHECK 的 UNKNOWN 结果不会像 FALSE 一样拒绝行，因此需要禁止 NULL 时还要声明 NOT NULL。','DDL 可能涉及元数据锁、表重建或后台工作；上线前应评估具体 ALTER 的算法与锁。',
 'SELECT name, age FROM demo_people ORDER BY id','Lin 20\nYu 22',
 ['防止同一 id 出现两次通常使用？',['ORDER BY','PRIMARY KEY','LIMIT','AVG'],1,'主键组合要求唯一且非空。'],
 ['CHECK(age>=0) 是否单独禁止 NULL？',['一定禁止','不一定，需 NOT NULL','只禁止 0','自动改为 0'],1,'NULL 产生 UNKNOWN，想禁止缺失要独立设置非空约束。'],
 '在专用练习库建立 id 主键、name 非空、age 非负的表，插入 Lin/20 与 Yu/22，并按 id 查询。','create-table.html',
 String.raw`CREATE DATABASE IF NOT EXISTS cs_atlas; USE cs_atlas;
DROP TABLE IF EXISTS demo_people;
CREATE TABLE demo_people(id INT PRIMARY KEY,name VARCHAR(30) NOT NULL,age INT CHECK(age>=0)) ENGINE=InnoDB;
INSERT INTO demo_people VALUES(1,'Lin',20),(2,'Yu',22);`);
query('sql-crud','INSERT、UPDATE 与 DELETE','条件更新 · 影响行数 · 批量写入','建模与基础',
 [['写入必须定义目标','INSERT 新增行，UPDATE 改已有行，DELETE 删除满足条件的行。UPDATE 和 DELETE 缺少 WHERE 可能影响整张表，练习前应先用相同条件 SELECT 检查目标范围。'],['区分更新和覆盖','SET amount=amount+5 是基于现值的增量更新；SET amount=5 是覆盖。应用可结合主键和旧版本号做乐观并发控制，并核对受影响行数。'],['验证写入后的状态','初始化脚本在 demo_sales 插入 id=5，给 id=1 加 5，再删去 id=5。最终按 id 查看前两行，金额应为 25 与 30。脚本每次重置专用表后再做写入。']],
 '受影响行数的“匹配行/实际变化行”口径可能受连接选项影响；不应脱离驱动语义推断业务成功。','带主键条件通常定位少量记录，批量写入还要考虑日志、锁、网络往返。',
 'SELECT id, amount FROM demo_sales WHERE id<=2 ORDER BY id','1 25\n2 30',
 ['想给已有金额加 5，应写？',['SET amount=5','SET amount=amount+5','SET amount=NULL','ORDER BY 5'],1,'表达式引用当前列值，执行增量修改。'],
 ['UPDATE 缺少 WHERE 时一般会？',['只更新第一行','更新所有匹配行，此时是全表','自动拒绝','不更新'],1,'除额外安全模式等限制外，未设条件的 UPDATE 会作用于所有行。'],
 '执行初始化中的新增、增量更新与删除后查询 id≤2 的行，应输出 1 25、2 30。','update.html',setup+"\nINSERT INTO demo_sales VALUES(5,'C',9);\nUPDATE demo_sales SET amount=amount+5 WHERE id=1;\nDELETE FROM demo_sales WHERE id=5;");
query('sql-subquery','子查询、EXISTS 与半连接','标量 · 相关子查询 · 反连接','数据查询',
 [['子查询有不同形状','标量子查询应返回至多一行一列，IN 与集合成员关系有关，EXISTS 只关心是否存在行。相关子查询会引用外层列，但优化器不一定按朴素逐行方式执行。'],['用存在性表达需求','查找所在部门有一笔金额至少 25 的销售记录：外层保留部门相同的行，EXISTS 内部寻找见证。A 部门有 30，因此 id=1、2 均被保留。'],['注意反连接的 NULL','NOT EXISTS 判断没有满足条件的行，与包含 NULL 的 NOT IN 并不总等价。编写反连接前先定义缺失值的业务语义。']],
 '标量子查询返回多行会报错；不要用无 ORDER BY 的 LIMIT 1 随意掩盖数据模型问题。','可能被优化为半连接、物化或其他计划，需结合 EXPLAIN 观察。',
 'SELECT s.id,s.dept FROM demo_sales s WHERE EXISTS (SELECT 1 FROM demo_sales t WHERE t.dept=s.dept AND t.amount>=25) ORDER BY s.id','1 A\n2 A',
 ['EXISTS 主要关注子查询的什么？',['第一列值','是否至少返回一行','列名长度','全部排序顺序'],1,'EXISTS 是存在性判断。'],
 ['A 部门有 20 和 30，两条外层行查“同部门是否有金额≥25”，保留几行？',['0','1','2','3'],2,'两行都能在部门内找到金额 30 这一见证。'],
 '使用相关 EXISTS 查询所属部门至少存在一条 amount≥25 的记录，输出 id 和部门，结果为 1 A、2 A。','subqueries.html');
query('sql-union','UNION 与集合运算','去重 · UNION ALL · 列对齐','数据查询',
 [['纵向拼接结果','UNION 将同列数的查询结果合并并消除重复行；UNION ALL 保留重复。它们是纵向合并结果，不是 JOIN 那样横向拼接匹配行。'],['对应位置决定兼容性','两侧列按位置匹配，需要兼容类型，结果列名通常来自第一侧。不同列顺序即使都能转换类型，也可能悄悄改变语义。'],['最终排序放到最外层','集合结果本身没有稳定顺序。示例把 A 部门与金额至少 20 的查询合并，两边都选中 id=1、2；UNION 最终各保留一次。']],
 '只要重复有意义就使用 UNION ALL；为了“保险”无条件去重可能隐藏重复数据来源，也增加成本。','UNION 去重可能需要临时结构，UNION ALL 通常省去这一步，但最终排序仍有成本。',
 "SELECT id,dept FROM demo_sales WHERE dept='A' UNION SELECT id,dept FROM demo_sales WHERE amount>=20 ORDER BY id",'1 A\n2 A',
 ['保留重复行应选？',['UNION ALL','UNION','DISTINCT','GROUP BY'],0,'UNION ALL 直接合并，不执行集合去重。'],
 ['两个结果均为 (1,A),(2,A)，UNION 后有几行？',['1','2','3','4'],1,'重复的完整行各保留一份。'],
 '把 A 部门查询与 amount≥20 查询使用 UNION 合并，再按 id 排序；改用 UNION ALL 比较重复行。','union.html');
query('sql-window','窗口函数与组内排名','OVER · PARTITION · 行与组','数据查询',
 [['聚合但不压缩原行','窗口函数在一个窗口上计算，并把结果附加到原行。GROUP BY 往往把一组压缩为一行，窗口函数则保留每个参与记录。'],['分组范围与排序规则','PARTITION BY 指定独立分区，ORDER BY 指定分区内顺序。ROW_NUMBER 给连续编号；RANK 对并列留空位，DENSE_RANK 对并列不留空位。'],['让并列顺序可重现','示例按部门分区、amount 降序、id 升序编号。id 是稳定的决胜键；金额相同时如果不给决胜键，ROW_NUMBER 对这些行的顺序可能不确定。']],
 '窗口 ORDER BY 不等于最终结果 ORDER BY。累计 SUM 还需看清 ROWS/RANGE 窗口框架；并列排序键会影响默认框架。','通常涉及分区与排序，实际成本由数据规模、索引与窗口计划决定。',
 'SELECT id, ROW_NUMBER() OVER(PARTITION BY dept ORDER BY amount DESC,id) AS rn FROM demo_sales ORDER BY id','1 2\n2 1\n3 1\n4 2',
 ['窗口函数通常会把每组压成一行吗？',['一定会','通常保留原行','只能返回一行','只能用于主键'],1,'窗口结果附在原行上，和普通 GROUP BY 的输出粒度不同。'],
 ['分数 90,90,80 的 DENSE_RANK 是？',['1,2,3','1,1,3','1,1,2','0,0,1'],2,'密集排名对并列只占一个等级，不跳过下一名次。'],
 '对 demo_sales 按部门分区，金额降序、id 升序生成 ROW_NUMBER，最终按 id 输出 id 与编号。','window-functions.html');
query('sql-cte','CTE 与递归查询','WITH · 锚点 · 终止条件','数据查询',
 [['给中间结果一个名字','普通 CTE 可把复杂查询拆为命名步骤，提高可读性；它不承诺一定物化，也不是持久化的表。一次语句结束后名称即失效。'],['递归从锚点出发','递归 CTE 由非递归锚点和引用自身的递归部分组成。示例从 n=1 开始，每轮得到 n+1，并仅让 n<5 的行继续扩展。'],['终止和类型都是设计问题','图或组织树查询要处理循环，不能只希望数据永远无环。递归列类型由非递归部分等规则确定，字符串拼接路径时要预留足够宽度。']],
 '服务器有递归深度等限制；提高限制不能修复缺少终止条件的递归。','本例生成 n 个数为 O(n) 行处理；复杂递归还取决于连接与去重。',
 'WITH RECURSIVE seq(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM seq WHERE n<5) SELECT n,n*n FROM seq ORDER BY n','1 1\n2 4\n3 9\n4 16\n5 25',
 ['递归 CTE 的非递归部分通常称为？',['索引','锚点','外键','视图授权'],1,'锚点提供递归展开的初始行。'],
 ['从 1 开始，只在 n<5 时生成 n+1，最终最大 n 是？',['4','5','6','无限'],1,'n=4 可生成 5，n=5 不再继续。'],
 '用 WITH RECURSIVE 生成 1 到 5，并输出数字及平方；解释为什么不会产生 6。','with.html');
query('sql-index','B+树、联合索引与覆盖索引','聚簇 · 最左前缀 · 回表','索引与执行计划',
 [['索引是一种额外访问路径','InnoDB 聚簇索引叶节点保存行数据，二级索引记录包含主键信息，可能需要再访问聚簇索引取其他列。索引提高某些读取效率，也增加写入、空间和维护成本。'],['联合键按字典序组织','索引 (dept,amount,id) 先按 dept，再按 amount，再按 id 排列。固定 dept 后对 amount 做范围查询，通常形成连续区间；只有 amount 条件不等价于同样有效的最左前缀定位。'],['覆盖可以减少额外访问','如果查询需要的列都能从索引获取，就可能使用覆盖索引。示例按 dept=A、amount≥20 取 id 和 amount，并保持金额与 id 的顺序。是否实际选它要看优化器判断。']],
 '“最左前缀”是理解复合访问路径的原则，不表示优化器在任何版本和数据分布下都绝不使用其他索引策略。','点查常用树高估算；范围查询还需扫描命中项，不能统一写成 O(log n)。',
 "SELECT id,amount FROM demo_sales WHERE dept='A' AND amount>=20 ORDER BY amount,id",'1 20\n2 30',
 ['二级索引覆盖查询的好处之一是？',['永远零 IO','可能减少回表','不再维护索引','自动消除锁'],1,'需要的数据在该索引中即可得到时可减少额外行访问。'],
 ['索引 (dept,amount) 固定 dept 后，对 amount 范围查询通常如何定位？',['连续键区间','随机全表每列','只能用哈希','不能查询'],0,'联合键按字典序排列，同一 dept 的 amount 有序。'],
 '建立 (dept,amount,id) 索引，查询 A 部门金额至少 20 的 id 和 amount。另用 EXPLAIN 检查计划，不把索引选择写成硬性保证。','multiple-column-indexes.html',setup+'\nCREATE INDEX demo_idx ON demo_sales(dept,amount,id);');
query('sql-view','视图与查询封装','逻辑视图 · 权限 · 更新限制','数据库对象',
 [['把查询保存成接口','普通视图存储查询定义，而不是自动保存一份结果快照。它可以向应用暴露稳定的列集合，降低应用对底层表结构的直接依赖。'],['更新能力有条件','简单视图可能可更新，聚合、分组或复杂结构可能限制更新。WITH CHECK OPTION 可约束经由视图的写入仍符合视图条件，但不能代替所有表级约束。'],['安全要看执行身份','SQL SECURITY DEFINER 与 INVOKER 影响权限检查上下文，设计者应清楚谁有权访问底层对象。示例视图只暴露金额至少 20 的 id 与 amount。']],
 '视图不是自动的性能缓存；执行成本取决于展开或物化等实际策略。','与底层查询计划有关，不能把读取视图视为常数时间。',
 'SELECT id,amount FROM demo_high_sales ORDER BY id','1 20\n2 30',
 ['普通视图主要保存什么？',['查询定义','所有查询结果快照','数据库密码','二进制日志'],0,'普通视图是命名查询，是否物化执行不等于持久保存结果。'],
 ['含 GROUP BY 的视图是否一定可直接更新？',['一定可以','不一定且常受限制','自动改所有行','只能通过 LIMIT'],1,'视图可更新性受定义结构和数据库规则约束。'],
 '建立筛选 amount≥20 的视图，只暴露 id 和 amount，再查询得到 1 20、2 30。','views.html',setup+'\nCREATE OR REPLACE VIEW demo_high_sales AS SELECT id,amount FROM demo_sales WHERE amount>=20;');
query('sql-routine','存储过程与存储函数','参数 · 局部逻辑 · 调用边界','数据库对象',
 [['把稳定逻辑放到服务端','存储过程可封装多条语句并由 CALL 调用，存储函数通常在表达式中返回一个值。是否放入数据库应权衡网络往返、部署方式、权限、可测试性和可维护性。'],['参数与错误处理','过程可有 IN、OUT、INOUT 参数，复合语句可以声明局部变量与处理器。业务事务的提交边界应明确，不能让调用方误以为一个函数调用天然等于完整事务。'],['先理解最小函数','这里创建 demo_tax(x)，返回 x 的两倍作为函数语法演示，并查询输入 7 得到 14。它并非真实税率计算，选择确定性纯函数避免把网络或时钟行为混入示例。']],
 '创建存储函数需要相应权限，启用二进制日志时还可能受函数声明与服务器策略限制；不要为做练习随意放宽生产权限。','函数被每行调用时会累积成本；示例单次整数计算为 O(1)。',
 'SELECT 7 AS input_value,demo_tax(7) AS output_value','7 14',
 ['通常调用存储过程使用什么语句？',['CALL','DESCRIBE','VACUUM','MERGE'],0,'CALL 用来调用存储过程；函数可出现在表达式中。'],
 ['确定性函数的含义最接近？',['永不报错','相同输入得到相同结果','一定零开销','一定无权限限制'],1,'确定性描述输入与输出关系，不是性能或权限保证。'],
 '在练习库创建纯函数 demo_tax(x) 返回 2*x，再查询输入 7 与输出 14；这只是函数机制演示。','stored-routines.html',
 String.raw`CREATE DATABASE IF NOT EXISTS cs_atlas; USE cs_atlas;
DROP FUNCTION IF EXISTS demo_tax;
CREATE FUNCTION demo_tax(x INT) RETURNS INT DETERMINISTIC NO SQL RETURN x*2;`);
query('sql-trigger','触发器与派生字段','BEFORE · AFTER · NEW/OLD','数据库对象',
 [['由数据事件触发','触发器响应表上的 INSERT、UPDATE 或 DELETE，可在事件前后执行逻辑。它适用于某些跨写入口的统一维护，但会让写操作的实际工作不再只由外层 SQL 决定。'],['区分新旧行','NEW 表示新行值，OLD 表示旧行值，可用范围取决于事件类型。BEFORE INSERT 可以设置 NEW 的派生字段；AFTER 常用于依赖已发生事件的处理。'],['一个可观察的派生值','demo_line 的 amount 在插入前由 price*qty 计算。插入单价 7、数量 3 后查询金额为 21。实际订单还需小数金额、舍入和库存事务等设计。']],
 '触发器应避免隐藏昂贵操作；多行语句会对涉及的行触发相应处理，不要按一次语句只执行一次估算。','每行触发开销累积；本例每行计算 O(1)。',
 'SELECT id,amount FROM demo_line ORDER BY id','1 21',
 ['BEFORE INSERT 中 NEW 通常表示？',['将要插入的新行','被删除的旧行','另一张表','事务日志'],0,'NEW 用于访问或在允许场景下设置新行值。'],
 ['每行触发器插入 100 行时，不能假设什么？',['会有新增行','触发逻辑只执行一次','存在 NEW','需要权限'],1,'行级触发器的成本随被处理行数量增加。'],
 '建立 BEFORE INSERT 触发器令 amount=price*qty，插入 (id=1,price=7,qty=3)，查询得到 1 21。','triggers.html',
 String.raw`CREATE DATABASE IF NOT EXISTS cs_atlas; USE cs_atlas;
DROP TABLE IF EXISTS demo_line;
CREATE TABLE demo_line(id INT PRIMARY KEY,price INT,qty INT,amount INT);
CREATE TRIGGER demo_line_calc BEFORE INSERT ON demo_line FOR EACH ROW SET NEW.amount=NEW.price*NEW.qty;

comp({id:'compiler-regex',title:'正则语言与词法规则',sub:'连接 · 选择 · 闭包 · 最长匹配',group:'词法与形式语言',sections:[['用规则描述 token','正则表达式以连接、选择和重复组合字符集合。例如 [A-Za-z_][A-Za-z0-9_]* 描述简化的 ASCII 标识符，第一位和后续位置的限制不同。'],['词法器还需要冲突规则','完整词法器通常在当前位置选择最长可匹配前缀；长度相同再按规则优先级决定。关键字 if 可以先按标识符识别再查关键字表，不能仅靠随意排列规则解决全部冲突。'],['实践：整串标识符验证','对三个字符串做整串匹配，区分合法标识符与以数字开头的串。它是 token 验证器，不是扫描完整程序的最长匹配词法器。']],pit:'正则匹配局部子串和匹配整串不同；嵌套括号语言一般需要栈或语法分析。',cost:'此简单模式可线性扫描；通用回溯型正则引擎不保证所有模式线性。',c:String.raw`regex r("[A-Za-z_][A-Za-z0-9_]*");for(string s:{"alpha_2","2alpha","_x"})cout<<s<<" "<<regex_match(s,r)<<'\n';`,p:String.raw`import re

comp({id:'compiler-nfa',title:'NFA、ε 闭包与子集构造',sub:'状态集合 · ε 转移 · DFA',group:'词法与形式语言',sections:[['非确定不等于随机','NFA 同时保留所有可能状态，一条输入能接受，只需至少一条路径最终到达接受态。ε 转移不消耗字符，因此读取字符前后都需考虑闭包。'],['把集合变成 DFA 状态','子集构造以 NFA 状态集合为 DFA 状态，初态是起点的 ε 闭包。对字符求所有可达状态再求闭包；任一成员为接受态时整个集合为接受态。最坏可产生指数个集合。'],['实践：模拟 a*b','使用 0→ε1、1→a1、1→b2 的 NFA。闭包由工作队列求解，输入 aaab 后集合包含接受态 2。这实现 NFA 模拟，不生成完整 DFA 表。']],pit:'遗漏字符转移后的 ε 闭包会漏掉可接受路径；空串也要检查初始闭包。',cost:'本例状态常数，处理长度 n 为 O(n)；一般集合模拟与状态数和边数有关。',c:String.raw`map<int,vector<int>> eps{{0,{1}}};map<pair<int,char>,vector<int>> tr{{{1,'a'},{1}},{{1,'b'},{2}}};

comp({id:'compiler-grammar-rewrite',title:'消除左递归与提取左因子',sub:'等价语言 · 预测分析',group:'语法分析',sections:[['直接左递归的风险','A→Aα | β 的朴素递归下降会在消耗输入前再次调用 A，导致无限递归。可改为 A→βA′、A′→αA′ | ε，保持生成的串集合。'],['左因子延迟选择','A→αβ | αγ 可提取为 A→αA′、A′→β | γ，让分析器先匹配公共前缀。消除左递归和提取左因子并不保证任意文法都会变成 LL(1)。'],['实践：把加法链解析成左结合值','E→E+n | n 改写为 E→nE′。程序使用循环读取加号后整数，同时累积左结合的语义值，避免把改写后右递归语法树误当成原运算结合性。']],pit:'变换保持语言不自动保持语义动作的执行顺序；减法链必须显式维护左结合。',cost:'输入 n 个字符时 O(n) 扫描，常数额外空间。',c:String.raw`istringstream in("8+3+2");long long value,x;char op;if(!(in>>value))throw runtime_error("number");while(in>>op){if(op!='+'||!(in>>x))throw runtime_error("syntax");value+=x;}cout<<value;`,p:`parts='8+3+2'.split('+')

comp({id:'compiler-first-follow',title:'FIRST、FOLLOW 与可空性',sub:'不动点 · 预测集合',group:'语法分析',sections:[['FIRST 看能从哪里开始','FIRST(X) 收集 X 可推导串的首终结符，若可推导空串则记 ε。对序列从左往右累加 FIRST，只有前项可空才继续看后一项。'],['FOLLOW 看后面可能出现什么','FOLLOW(A) 收集句型中 A 后面可能紧接的终结符，开始符号还包含结束标记 $。A→αBβ 要把 FIRST(β) 去掉 ε 加入 FOLLOW(B)，β 可空时还加入 FOLLOW(A)。'],['实践：有限文法的 FIRST 不动点','S→AB、A→aA|ε、B→b。反复遍历规则直到集合不再增长，得到 FIRST(S)={a,b}。程序实现一般序列的 FIRST 传播；FOLLOW 的规则在概念中给出，需在预测表课程中使用。']],pit:'ε 是空串标记，不能作为真正输入 token 放入分析表的终结符列。',cost:'有限集合单调增长保证终止；朴素算法重复扫描所有产生式。',c:String.raw`map<char,vector<string>>rules{{'S',{"AB"}},{'A',{"aA",""}},{'B',{"b"}}};map<char,set<char>>f;bool change=true;while(change){change=false;for(auto [a,rs]:rules)for(string rhs:rs){bool nullable=true;for(char x:rhs){set<char>v=rules.count(x)?f[x]:set<char>{x};for(char c:v)if(c!='#')change|=f[a].insert(c).second;if(!v.count('#')){nullable=false;break;}}if(nullable)change|=f[a].insert('#').second;}}for(char c:f['S'])cout<<c;`,p:`rules={'S':['AB'],'A':['aA',''],'B':['b']}

comp({id:'compiler-ll1',title:'LL(1) 预测分析表与分析栈',sub:'单符号向前看 · 表驱动',group:'语法分析',sections:[['表项来自预测集合','对 A→α，把规则填入 FIRST(α) 的非空终结符列；α 可空时填入 FOLLOW(A) 列。如果同一格需要多条不同规则，文法不能直接用该 LL(1) 表确定选择。'],['分析栈替代递归调用','栈顶为终结符时与当前输入匹配；为非终结符时查表，用产生式右部逆序入栈。栈和输入同时到结束标记才接受。'],['实践：识别 a*b','文法 S→AB、A→aA|ε、B→b。表中 A 在 a 上展开 aA，在 b 上展开为空。程序对 aaab 逐步分析并接受，同时对缺失末尾 b 的输入能够拒绝。']],pit:'逆序压栈才能先处理产生式左端符号；错误表项应报错，不能悄悄当 ε。',cost:'对固定文法、无循环的正确分析表，处理输入通常 O(n)，栈最多 O(n)。',c:String.raw`map<pair<char,char>,string>t{{{'S','a'},"AB"},{{'S','b'},"AB"},{{'A','a'},"aA"},{{'A','b'},""},{{'B','b'},"b"}};string input="aaab$";vector<char>s{'$','S'};size_t i=0;bool ok=true;while(!s.empty()&&ok){char x=s.back();s.pop_back();if(x=='a'||x=='b'||x=='$'){if(i>=input.size()||input[i++]!=x)ok=false;}else{auto it=t.find({x,input[i]});if(it==t.end())ok=false;else for(auto p=it->second.rbegin();p!=it->second.rend();++p)s.push_back(*p);}}cout<<(ok&&i==input.size()?"accept":"reject");`,p:`table={('S','a'):'AB',('S','b'):'AB',('A','a'):'aA',('A','b'):'',('B','b'):'b'}

print('accept' if ok and i==len(text) else 'reject')`,out:'accept',q1:['LL(1) 的 1 表示？',['只有一条规则','一个向前看符号','一个状态','只读一行'],1,'分析决策只查看当前的一个输入符号。'],q2:['同一表格单元含两条产生式说明？',['表一定正确','存在预测冲突','全部接受','必须删除输入'],1,'不能确定唯一展开规则。'],task:'实现给定文法的表驱动 LL(1) 分析器，aaab 接受，aaa 和 ba 拒绝。'});
comp({id:'compiler-lr',title:'LR 项目、闭包与移进归约',sub:'项目集 · 活前缀 · GOTO',group:'语法分析',sections:[['点标记当前识别进度','项目 A→α·β 表示已识别 α，还期待 β。点后为非终结符 B 时，闭包加入 B 的所有点在开头的产生式，直到不再新增。GOTO 将点跨过某符号后再求闭包。'],['移进与归约反向构造推导','移进消耗输入并压入新状态；归约用右部长度弹栈，再按左部非终结符查 GOTO。LR 分析自底向上重建最右推导的逆序，不等于任意看到右部就立即替换。'],['实践：构造初始 LR(0) 项目闭包','对 Z→S、S→aS|b，从 Z→·S 出发，加入 S 的两条初始项目，得到三个项目。程序实现工作队列闭包；完整状态图和 ACTION 表不在本例中生成。']],pit:'归约需要状态和向前看条件，仅匹配栈上字符会产生错误决策。',cost:'单次闭包在项目数量有限时终止，集合去重成本取决于实现。',c:String.raw`vector<pair<char,string>>p{{'Z',"S"},{'S',"aS"},{'S',"b"}};set<pair<int,int>>items{{0,0}};queue<pair<int,int>>q;q.push({0,0});while(!q.empty()){auto [r,d]=q.front();q.pop();if(d==int(p[r].second.size()))continue;char x=p[r].second[d];for(int j=0;j<int(p.size());j++)if(p[j].first==x&&items.insert({j,0}).second)q.push({j,0});}cout<<items.size();`,p:`rules=[('Z','S'),('S','aS'),('S','b')]

while work:
    r,d=work.pop(); rhs=rules[r][1]

    for j,(lhs,_) in enumerate(rules):
        if lhs==rhs[d] and (j,0) not in items:
            items.add((j,0)); work.append((j,0))
print(len(items))`,out:'3',q1:['项目点的位置表示？',['输入行号','产生式右部识别进度','类型大小','寄存器号'],1,'点前已识别，点后待识别。'],q2:['A→α·Bβ 的闭包应补充？',['B→·γ 的所有产生式','所有完整项目','删除B','把β全移进'],0,'为了识别 B，需要考虑 B 的所有候选开头。'],task:'构造 Z→·S 的 LR(0) 闭包，文法 Z→S、S→aS|b，输出项目数 3。'});
comp({id:'compiler-lr-families',title:'SLR、LR(1) 与 LALR 的冲突',sub:'FOLLOW · 向前看集合 · 状态合并',group:'语法分析',sections:[['归约条件精度逐步不同','SLR 在已完成项目 A→α· 上使用 FOLLOW(A) 作为归约条件；规范 LR(1) 把向前看符号放入项目，区分更细的上下文，因此可接受更多文法。'],['LALR 合并相同 LR(0) 核心','LALR 把具有相同核心的 LR(1) 状态合并，并合并项目的向前看集合，减少状态数。合并可能引入归约/归约冲突；处理冲突应检查文法或明确优先级，不能随意覆盖表项。'],['实践：检测 ACTION 冲突','把动作列表写入以状态与终结符为键的表。当同一格出现 shift 4 与 reduce 2 时报告冲突。该检测适用于各种表构造结果，不生成 LR 状态图，也不自动解决冲突。']],pit:'某个解析器生成器默认“优先移进”不是文法天然无二义的证明。',cost:'m 个候选动作使用有序表 O(m log m)，空间 O(m)。',c:String.raw`map<pair<int,char>,string>table;vector<pair<pair<int,char>,string>>a{{{3,'+'},"shift 4"},{{3,'+'},"reduce 2"}};int conflicts=0;for(auto [key,act]:a){if(table.count(key)&&table[key]!=act)conflicts++;else table[key]=act;}cout<<conflicts;`,p:`table={}; conflicts=0

comp({id:'compiler-attributes',title:'属性文法与语法制导翻译',sub:'综合属性 · 继承属性 · 依赖顺序',group:'语义分析',sections:[['语法结构承载语义值','综合属性由子节点计算父节点，例如表达式节点的值来自左右孩子。继承属性从父节点或兄弟传入，例如当前作用域、期望类型或偏移量。'],['依赖决定求值次序','属性之间构成依赖图，必须先算依赖再算使用者。纯综合属性常可后序遍历计算；带继承属性时需要设计访问顺序，循环依赖不能靠随意递归解决。'],['实践：后序表达式的综合值','栈模拟后序 AST 遍历：遇到数字入栈，遇到二元操作弹出右、左操作数并计算。给定 2 3 + 4 * 产生综合值 20。只演示纯整数、无副作用属性。']],pit:'弹栈顺序在减法和除法中很重要，先弹的是右操作数。',cost:'n 个 token 为 O(n) 时间，O(n) 栈空间。',c:String.raw`vector<string>tokens{"2","3","+","4","*"};vector<int>s;for(string t:tokens){if(t=="+"||t=="*"){if(s.size()<2)throw runtime_error("operand");int b=s.back();s.pop_back();int a=s.back();s.pop_back();s.push_back(t=="+"?a+b:a*b);}else s.push_back(stoi(t));}if(s.size()!=1)throw runtime_error("expression");cout<<s.back();`,p:`stack=[]
for t in ['2','3','+','4','*']:

comp({id:'compiler-symbols',title:'符号表、作用域与名字遮蔽',sub:'作用域栈 · 查找 · 绑定',group:'语义分析',sections:[['名字需要绑定到声明','同名字符串不一定指向同一变量。每个声明具有类型、位置、可见范围等信息；名称解析为每次使用找到对应声明，并为后续类型检查与代码生成提供稳定标识。'],['从内向外查找','进入词法作用域压入新表，离开时弹出；声明写入当前表，使用从最内层向外查找。外层同名声明可以被遮蔽，而同一作用域重复声明是否允许由语言规则决定。'],['实践：嵌套变量 x','外层 x=1，内层 x=2。进入内层查得 2，离开后查得 1。例子用值表示绑定内容，真实编译器一般存符号元数据而不是执行时值。']],pit:'编译期词法作用域和运行期调用栈相关但不同；闭包捕获还要处理变量的生存期。',cost:'嵌套深度 d 时，朴素查找需检查至多 d 个表。',c:String.raw`vector<map<string,int>>s{{{"x",1}}};auto lookup=[&](string key){for(auto it=s.rbegin();it!=s.rend();++it)if(it->count(key))return it->at(key);throw runtime_error("undeclared");};s.push_back({{"x",2}});cout<<lookup("x")<<' ';s.pop_back();cout<<lookup("x");`,p:`scopes=[{'x':1}]

comp({id:'compiler-types',title:'静态类型检查与类型推导',sub:'规则 · 约束 · 转换',group:'语义分析',sections:[['类型规则排除无意义组合','加法、调用、赋值都有操作数要求。类型环境把变量映射到类型，表达式规则由子表达式类型推出父表达式类型；检查失败要报告源位置和预期类型。'],['推导不是执行程序','类型推导通过约束求类型，而不是先运行表达式观察结果。隐式转换、重载选择、泛型实例化等会扩大复杂度；最一般统一与具有子类型的约束求解也不是同一种算法。'],['实践：小型数值提升规则','本例允许 int+int 得到 int，int/float 的混合加法得到 float，bool 不参与数值加法。两次查询输出 float 和 error，规则刻意简化，不代表 C++ 或 Python 的全部类型系统。']],pit:'不能把某语言“bool 也是整数”的规则无条件迁移到另一种自定义语言。',cost:'单个二元规则 O(1)；遍历无共享 AST 通常至少 O(n)。',c:String.raw`auto plusType=[](string a,string b){if((a!="int"&&a!="float")||(b!="int"&&b!="float"))return string("error");return string(a=="float"||b=="float"?"float":"int");};cout<<plusType("int","float")<<' '<<plusType("bool","int");`,p:`def plus_type(a,b):

print(plus_type('int','float'),plus_type('bool','int'))`,out:'float error',q1:['静态类型检查通常发生在？',['运行所有路径后','编译分析期间','仅网络发送时','磁盘损坏后'],1,'它根据程序结构和类型规则进行静态分析。'],q2:['本例规则下 int+float 的结果？',['int','float','bool','error'],1,'规则规定混合数值提升为 float。'],task:'实现给定小语言的二元加法类型规则，int/float 输出 float，bool/int 输出 error。'});
comp({id:'compiler-tac',title:'三地址代码、临时变量与 IR 降低',sub:'表达式树 · 指令序列 · 求值顺序',group:'中间表示',sections:[['把复杂操作拆成小步骤','三地址代码常用 x=y op z 的形式，让每条指令的定义和使用更清楚。表达式 (a+b)*(c-d) 可以先生成两次局部计算，再生成乘法，临时变量记录中间结果。'],['临时值使数据依赖显式','后一条指令使用前面定义的临时值，构成依赖图。降低时必须保持语言规定的求值次序，尤其要考虑函数调用、异常和内存副作用。'],['实践：由后缀表达式生成 IR','栈上保存变量或临时名，遇到运算符取两个操作数、生成新临时、压回结果。输入 a b + c d - * 得到三条指令；这里没有类型、溢出或副作用。']],pit:'不能为了得到漂亮的临时编号而任意交换具有副作用的子表达式。',cost:'n 个 token，O(n) 指令处理和栈空间。',c:String.raw`vector<string>s;int next=0;for(string t:{"a","b","+","c","d","-","*"}){if(t=="+"||t=="-"||t=="*"){string b=s.back();s.pop_back();string a=s.back();s.pop_back();string r="t"+to_string(next++);cout<<r<<" = "<<a<<" "<<t<<" "<<b<<'\n';s.push_back(r);}else s.push_back(t);}`,p:`stack=[]; next_id=0

comp({id:'compiler-basic-blocks',title:'基本块与控制流图 CFG',sub:'入口 · 跳转 · 后继边',group:'中间表示',sections:[['基本块内部没有分叉','基本块是一段单入口、顺序执行且只在末尾转移控制的指令。第一条指令、跳转目标、跳转后的下一条通常是领导者，由此可以切分指令序列。'],['控制流图连接基本块','节点是基本块，边表示可能的执行转移。条件跳转有真、假后继；无条件跳转没有顺序落下边；return 没有后继。不可达块可通过从入口的图遍历发现。'],['实践：计算可达块','给定菱形控制流 0→1/2→3，加一个孤立块4。从入口 BFS 访问，输出0、1、2、3。例子演示已有 CFG 的可达性，不从真实汇编提取块。']],pit:'CFG 的两条边表示可能执行，并不意味着一次运行会同时走两条。',cost:'V 个块、E 条边，遍历 O(V+E) 时间、O(V) 空间。',c:String.raw`vector<vector<int>>g{{1,2},{3},{3},{},{}};vector<bool>seen(5);queue<int>q;q.push(0);seen[0]=true;while(!q.empty()){int u=q.front();q.pop();cout<<u<<' ';for(int v:g[u])if(!seen[v]){seen[v]=true;q.push(v);}}`,p:`from collections import deque

comp({id:'compiler-dataflow',title:'数据流分析与活跃变量',sub:'IN/OUT · GEN/KILL · 不动点',group:'优化与数据流',sections:[['活跃性描述未来需求','若某变量当前值沿某条后续路径会在重新定义前被使用，则它在当前位置活跃。该信息帮助删除死赋值和分配寄存器，是保守的静态近似。'],['从后往前传播集合','OUT[B] 为所有后继 IN 的并集；IN[B]=USE[B]∪(OUT[B]−DEF[B])。对有限变量集合反复更新直到稳定，循环控制流也能处理。USE 只含块内首次定义之前的使用。'],['实践：两块的集合传播','块0定义x且无使用，块1使用x。算法得 IN[0]为空、OUT[0]={x}。输出两个集合大小0和1，体现定义前不需要旧x，定义后新x仍有用。']],pit:'把 USE 写成“块中出现过的所有读取”会把先定义后使用的局部值错误传播到块入口。',cost:'有限集合单调迭代必终止；成本与边数、变量数和迭代次数有关。',c:String.raw`vector<set<string>>use{{},{"x"}},def{{"x"},{}},in(2),out(2);vector<vector<int>>succ{{1},{}};bool changed=true;while(changed){changed=false;for(int b=1;b>=0;b--){set<string>o;for(int s:succ[b])o.insert(in[s].begin(),in[s].end());set<string>i=use[b];for(auto x:o)if(!def[b].count(x))i.insert(x);if(i!=in[b]||o!=out[b])changed=true;in[b]=i;out[b]=o;}}cout<<in[0].size()<<' '<<out[0].size();`,p:`use=[set(),{'x'}]; defs=[{'x'},set()]; succ=[[1],[]]
ins=[set(),set()]; outs=[set(),set()]
changed=True
while changed:
    changed=False
    for b in (1,0):
        out=set().union(*(ins[s] for s in succ[b]))
        incoming=use[b]|(out-defs[b])
        changed |= incoming!=ins[b] or out!=outs[b]
        ins[b],outs[b]=incoming,out
print(len(ins[0]),len(outs[0]))`,out:'0 1',q1:['活跃变量分析是哪个方向？',['后向','仅前向','随机','不看边'],0,'未来使用向前传播到更早的位置。'],q2:['块定义x，下一块使用x，该块OUT是否含x？',['含','不含','看名字长度','只能含y'],0,'离开定义块后，该新值还会被使用。'],task:'实现两块活跃变量不动点，块0定义x、块1使用x，输出 IN[0] 与 OUT[0] 的大小0 1。'});
comp({id:'compiler-ssa',title:'SSA、支配关系与 φ 节点',sub:'单次赋值 · 分支汇合 · 重命名',group:'中间表示',sections:[['每个名字只定义一次','SSA 给每次赋值一个新版本，使用明确指向某次定义。普通控制流合并时，变量可能来自不同前驱，φ 节点根据实际进入的边选择对应版本。'],['支配关系约束定义可见性','若从入口到块B的所有路径都经过A，则A支配B。SSA 的普通使用应被定义支配；φ 的操作数按前驱边解释。构造算法常用支配树、支配边界与重命名栈。'],['实践：模拟分支汇合的 φ','左分支产生x1=10，右分支产生x2=20。以实际前驱名称选择φ的值，left 输出10。这里只执行选择语义，不实现完整 SSA 构造，也不把φ视作同时计算两个分支。']],pit:'φ 按来源边选择，不能简单把它理解为“任意选一个最近赋值”。',cost:'已知前驱的φ查找在本例 O(log p)，p为前驱数。',c:String.raw`map<string,int>incoming{{"left",10},{"right",20}};string pred="left";cout<<incoming.at(pred);`,p:`incoming={'left':10,'right':20}
predecessor='left'
print(incoming[predecessor])`,out:'10',q1:['SSA 中同一个版本名被定义几次？',['一次','两次','任意次','不能定义'],0,'每个SSA名字只对应一个定义。'],q2:['φ 的选择依据是？',['变量按字母排序','实际进入的前驱边','最大数值','最小寄存器'],1,'每条前驱边对应一个输入值。'],task:'实现 x3=φ(left:x1=10,right:x2=20) 的选择语义，left输出10，right输出20，未知前驱报错。',source:llvm});
comp({id:'compiler-cse',title:'公共子表达式、值编号与死代码',sub:'表达式键 · 可用性 · 副作用',group:'优化与数据流',sections:[['重复表达式需要相同输入值','同样文本 a+b 并不必然产生同样值，a或b可能已被修改。值编号对操作符和输入值编号建立键，发现此前已计算且仍可用的纯表达式时复用结果。'],['删除也需要语义依据','死代码消除删除结果不被需要且无可观察副作用的计算。带I/O、volatile、可能抛出的异常或内存写入不能仅因返回值未使用就删除；加载复用还需别名分析。'],['实践：不可变输入的局部复用','给两次 a+b 和一次 a-b 分配值名。输入不可变，表达式为纯运算，重复的 a+b 复用v0，减法分配v1。这里只演示一个基本块内的表达式表。']],pit:'不能把浮点加法随意按数学交换、结合规则规范化；语言的精度和异常语义可能不同。',cost:'有序映射下n条表达式 O(n log n) 时间和 O(n) 空间。',c:String.raw`map<string,string>values;int n=0;for(string e:{"a+b","a+b","a-b"}){if(!values.count(e))values[e]="v"+to_string(n++);cout<<values[e]<<' ';}`,p:`values={}
for expression in ['a+b','a+b','a-b']:
    if expression not in values: values[expression]=f'v{len(values)}'
    print(values[expression],end=' ')`,out:'v0 v0 v1',q1:['复用表达式至少要求？',['文本一样即可','输入值相同且计算可安全复用','变量名短','代码行相邻'],1,'修改、内存副作用和异常都可能影响合法性。'],q2:['返回值不用的打印调用可以直接删吗？',['可以','不能，打印有可观察副作用','只看字符数','总可换成0'],1,'死结果不等于整个操作无影响。'],task:'为不可变变量上的 a+b、a+b、a-b 做局部值编号，输出v0 v0 v1；解释为何不能直接用于可变内存加载。'});
comp({id:'compiler-loop-opt',title:'循环优化：不变量外提与强度削弱',sub:'支配 · 可投机执行 · 归纳变量',group:'优化与数据流',sections:[['循环不变不等于一定能移动','表达式的输入在循环中不变，是外提的必要线索。还需确保它的定义支配使用、没有别名写入破坏依赖，并且在循环零次执行时提前求值不会引入异常或副作用。'],['归纳变量支持强度削弱','若i每轮加1，4*i也每轮加4，可用递增的派生归纳变量替代重复乘法。现代目标上是否更快还取决于指令、向量化和寄存器压力。'],['实践：保持固定范围的总和','累加i=0..4时的4*i+7，原式与派生变量版本都得到75。用小的非负整数避免溢出，验证两种实现的可观察结果一致。']],pit:'把除法外提可能在原循环零次执行时新增除零异常；仅检查输入不变不够。',cost:'两种版本均 O(n)；削弱只改变常数操作，不改变渐进复杂度。',c:String.raw`int original=0,optimized=0;for(int i=0;i<5;i++)original+=4*i+7;int scaled=0;for(int i=0;i<5;i++,scaled+=4)optimized+=scaled+7;cout<<original<<' '<<optimized;`,p:`original=sum(4*i+7 for i in range(5))
optimized=0; scaled=0
for _ in range(5):
    optimized+=scaled+7; scaled+=4
print(original,optimized)`,out:'75 75',q1:['循环不变量外提还必须考虑？',['只有行数','零次执行与副作用/异常','只看变量名','代码颜色'],1,'移动计算可能让原先不执行的操作发生。'],q2:['i每次加1，4*i每次可改为加几？',['1','2','4','7'],2,'派生归纳变量每轮增加4。'],task:'对i=0..4累加4*i+7，用原始乘法与逐步加4两种方式实现，输出75 75。'});
comp({id:'compiler-registers',title:'寄存器分配、干涉图与溢出',sub:'活跃区间 · 图着色 · Spill',group:'代码生成与运行时',sections:[['有限寄存器承载许多临时值','同时活跃、必须保留的不同值通常不能占同一物理寄存器。干涉图用边记录这种冲突，分配近似为有限颜色的图着色；预着色寄存器、调用约定和指令约束还会限制选择。'],['没有颜色就考虑溢出','寄存器不足时将某些值放到栈槽，需要额外加载和存储。图着色、线性扫描与分裂活跃区间等是常用策略，实际优化目标不只是减少颜色数，还包括运行成本。'],['实践：贪心着色三角干涉图','三个互相干涉的值只有两个寄存器。按节点顺序分配0、1，第三个标记spill。本例是展示冲突约束的简单贪心算法，不声称找到最优溢出方案。']],pit:'在一般图上，贪心算法失败不证明该图无法用给定颜色数着色；结果依赖顺序。',cost:'邻接表贪心约 O(V+E+VK)，K为可用寄存器数。',c:String.raw`vector<vector<int>>g{{1,2},{0,2},{0,1}};vector<int>color(3,-1);for(int u=0;u<3;u++){set<int>used;for(int v:g[u])if(color[v]>=0)used.insert(color[v]);for(int c=0;c<2;c++)if(!used.count(c)){color[u]=c;break;}}for(int c:color)cout<<(c<0?"spill":to_string(c))<<' ';`,p:`graph=[[1,2],[0,2],[0,1]]; colors=[-1]*3
for u in range(3):
    used={colors[v] for v in graph[u] if colors[v]>=0}
    colors[u]=next((c for c in range(2) if c not in used),-1)
print(*('spill' if c<0 else str(c) for c in colors))`,out:'0 1 spill',q1:['干涉边通常表示？',['两个值可随时共用寄存器','两个值同时活跃造成冲突','两文件同名','指令长度相同'],1,'需要同时保存的独立值不能被同一寄存器互相覆盖。'],q2:['三角形干涉图至少需要几种颜色？',['1','2','3','4'],2,'三个节点两两相邻，因此需要三个不同颜色。'],task:'用两个寄存器对三角干涉图做顺序贪心分配，输出0 1 spill，并解释溢出后还需插入哪些指令。'});
comp({id:'compiler-instruction-selection',title:'指令选择与模式覆盖',sub:'目标模式 · 树覆盖 · 成本',group:'代码生成与运行时',sections:[['IR 操作不等于机器指令','目标体系结构有寻址模式、立即数限制和特殊指令。一条IR操作可能展开成多条指令，多个IR节点也可能被一条机器指令覆盖。'],['按合法模式比较成本','可用树或DAG匹配寻找指令模式，再按延迟、大小等估计选择。动态规划可组合子树成本；真实后端还要处理共享子表达式、寄存器约束和调度。'],['实践：虚构目标的两种覆盖','对a*b+c，目标提供MUL与ADD各成本1，以及仅对当前整数语义合法的MAD成本1。程序比较普通覆盖成本2和组合覆盖成本1，选择MAD。它不是生成真实CPU机器码。']],pit:'浮点乘加融合会改变舍入次数，不能把整数示例的融合合法性直接推广到所有浮点模式。',cost:'本例候选数常数；树动态规划成本依赖节点数与每节点模式数。',c:String.raw`map<string,int>cost{{"MUL+ADD",2},{"MAD",1}};auto best=min_element(cost.begin(),cost.end(),[](const auto&a,const auto&b){return a.second<b.second;});cout<<best->first<<' '<<best->second;`,p:`costs={'MUL+ADD':2,'MAD':1}
best=min(costs,key=costs.get)
print(best,costs[best])`,out:'MAD 1',q1:['指令选择主要依赖？',['源文件名','目标指令集与IR模式','用户昵称','SQL索引'],1,'目标的合法模式和约束决定可选指令。'],q2:['浮点 MUL+ADD 替换成 FMA 总是逐位相同吗？',['总是','不总是，舍入次数不同','只看变量名','从不计算'],1,'FMA一次舍入，分开运算通常两次舍入。'],task:'为虚构整数目标比较 MUL+ADD成本2 与MAD成本1，输出MAD 1；写明浮点推广的限制。'});
comp({id:'compiler-calling',title:'调用约定、栈帧与闭包环境',sub:'参数 · 保存寄存器 · 对齐',group:'代码生成与运行时',sections:[['调用者与被调用者共同遵守协议','调用约定规定参数与返回值位置、哪些寄存器由哪方保存、栈对齐及返回地址处理。同样机器码指令若双方采用不同约定，仍可能传错值或破坏寄存器。'],['栈帧是布局与生命周期问题','局部变量、保存值、溢出槽等按对齐要求分配空间。闭包捕获的环境可能比创建它的栈帧活得更久，需要逃逸分析、堆分配或其他生存期管理。'],['实践：简化局部槽布局','在虚构布局中依次放一个大小4对齐4的槽、一个大小8对齐8的槽，偏移为0与8，最后帧大小按16对齐为16。本例不代表某个真实ABI的完整布局。']],pit:'不能默认栈向下增长就直接用正偏移相加当真实地址；帧基址与偏移规则由ABI和后端决定。',cost:'n个槽的顺序布局 O(n) 时间。',c:String.raw`auto align=[](int n,int a){return (n+a-1)/a*a;};int offset=0;for(auto [size,a]:vector<pair<int,int>>{{4,4},{8,8}}){offset=align(offset,a);cout<<offset<<' ';offset+=size;}cout<<align(offset,16);`,p:`def align(n,a): return (n+a-1)//a*a
offset=0; positions=[]
for size,alignment in [(4,4),(8,8)]:
    offset=align(offset,alignment); positions.append(offset); offset+=size
print(*positions,align(offset,16))`,out:'0 8 16',q1:['调用约定需要双方一致的是？',['注释风格','参数位置与寄存器保存规则','源码行数','变量长度'],1,'它是二进制调用接口。'],q2:['偏移4处放对齐8的槽，起始偏移应为？',['4','5','8','16'],2,'向上对齐到下一个8的倍数。'],task:'按(大小4,对齐4)、(大小8,对齐8)顺序安排局部槽，最终帧16字节对齐，输出0 8 16。'});
comp({id:'compiler-gc',title:'运行时内存与垃圾回收',sub:'根集合 · 可达性 · 标记清扫',group:'代码生成与运行时',sections:[['可达对象不能被回收','从栈、全局变量、寄存器等根开始，沿引用访问到的对象仍可能被使用。编译器需要向运行时提供对象布局和安全点等信息，移动式回收器还要更新引用位置。'],['不同回收器有不同代价','标记清扫先标记可达对象再回收未标记者；复制或压缩回收减少碎片但移动对象。引用计数能及时回收部分对象，却需要额外机制处理环；分代回收利用对象寿命分布。'],['实践：标记一个对象图','根为0，引用0→1、1→2，另有不与根连接的自环3→3。遍历标记0、1、2，判定3可回收。程序只计算可达性，不分配真实堆或移动对象。']],pit:'有环不一定是垃圾，是否从根可达才是追踪式GC的标准。',cost:'标记与清扫合计 O(V+E)，标记状态 O(V)。',c:String.raw`vector<vector<int>>g{{1},{2},{},{3}};set<int>marked;vector<int>work{0};while(!work.empty()){int u=work.back();work.pop_back();if(!marked.insert(u).second)continue;for(int v:g[u])work.push_back(v);}for(int i=0;i<4;i++)if(!marked.count(i))cout<<i;`,p:`graph=[[1],[2],[],[3]]; marked=set(); work=[0]
while work:
    u=work.pop()
    if u in marked: continue
    marked.add(u); work.extend(graph[u])
print(*(i for i in range(len(graph)) if i not in marked))`,out:'3',q1:['追踪式GC判断存活主要依据？',['对象编号小','从根集合可达','对象无环','对象名字长'],1,'根可达对象可能仍被程序使用。'],q2:['不与任何根连接的自环对象可以回收吗？',['可以','不能，只要有环就永生','只能改名','必须被读一次'],0,'追踪式GC可以回收不可达的循环引用。'],task:'对0→1→2与3→3，根集合{0}，做标记并输出未标记对象3。'});
comp({id:'compiler-linking',title:'汇编、链接、符号与重定位',sub:'目标文件 · 符号解析 · PC相对地址',group:'代码生成与运行时',sections:[['目标文件保留未确定位置','编译单元可先生成机器指令、数据、符号表和重定位记录。跨文件函数的最终地址可能尚未知，链接器安排段和解析符号后再修补引用。动态链接还可能在装载或首次调用时完成绑定。'],['重定位计算有明确约定','绝对与PC相对重定位使用不同公式。常见形式涉及符号地址S、附加值A和位置P，但P究竟指字段还是下一条指令取决于格式；不能把某个示例公式当所有平台通用。'],['实践：教学PC相对跳转','本例约定编码位移=目标地址−下一条指令地址。目标0x1200、下一条地址0x1005，得到十进制507。仅演算位移，不生成ELF/PE文件，也不处理字段宽度。']],pit:'位移必须能装入目标字段；地址计算正确仍可能因溢出无法编码。',cost:'单次重定位 O(1)；全部重定位通常与记录数量线性相关，另有符号查找成本。',c:String.raw`long long target=0x1200,nextInstruction=0x1005;cout<<target-nextInstruction;`,p:`target=0x1200
next_instruction=0x1005
print(target-next_instruction)`,out:'507',q1:['链接器处理跨文件调用主要需要？',['变量颜色','符号解析和重定位','CSS布局','数据库查询'],1,'确定引用目标并修补地址相关字段。'],q2:['按本例公式0x1200−0x1005的十进制结果？',['507','512','5','4096'],0,'0x1FB 等于507。'],task:'按约定“目标减下一条地址”计算0x1200与0x1005的PC相对位移507，并说明真实格式还需检查字段宽度。'});
comp({id:'compiler-vm-jit',title:'字节码解释器与 JIT',sub:'操作数栈 · 热点 · 即时编译',group:'代码生成与运行时',sections:[['字节码是可执行的中间形式','虚拟机可以用循环取指、译码并执行字节码。栈式虚拟机从操作数栈取输入，寄存器式虚拟机使用显式编号；两者都需处理非法指令、类型与栈深度。'],['JIT 将热点转为机器码','解释器启动成本低，JIT 对频繁执行的路径编译优化并缓存机器码。利用运行时反馈进行推测优化时，需要守卫和去优化路径，以便假设失效后恢复正确执行。'],['实践：一个微型栈机','字节码 PUSH 2、PUSH 3、ADD、PUSH 4、MUL 得到20。程序检查栈元素数并拒绝未知指令，演示解释执行，不声称已经实现JIT或机器码生成。']],pit:'把代码字符串交给eval执行并不等于实现了自己的虚拟机或JIT编译器。',cost:'n条字节码通常 O(n) 分派，操作数栈最多 O(n)。',c:String.raw`vector<pair<string,int>>code{{"PUSH",2},{"PUSH",3},{"ADD",0},{"PUSH",4},{"MUL",0}};vector<int>s;for(auto [op,arg]:code){if(op=="PUSH")s.push_back(arg);else if(op=="ADD"||op=="MUL"){if(s.size()<2)throw runtime_error("underflow");int b=s.back();s.pop_back();int a=s.back();s.pop_back();s.push_back(op=="ADD"?a+b:a*b);}else throw runtime_error("opcode");}if(s.size()!=1)throw runtime_error("stack");cout<<s.back();`,p:`code=[('PUSH',2),('PUSH',3),('ADD',0),('PUSH',4),('MUL',0)]
stack=[]
for op,arg in code:
    if op=='PUSH': stack.append(arg)
    elif op in ('ADD','MUL'):
        if len(stack)<2: raise ValueError('underflow')
        b=stack.pop(); a=stack.pop(); stack.append(a+b if op=='ADD' else a*b)
    else: raise ValueError('opcode')

 '如果数据始终是三个坐标、七天统计或四个读数，不需要在运行中增减数量，就可以使用array。把它想成固定格数的托盘：格子数量固定，格子里的值仍然可以修改。它支持整体复制和标准算法，比原生数组更容易组合使用。本节从四个读数出发，先定位要修改的格子，再计算更新后的总和。',
 [['array<int,4>','包含<array>，int是类型，4是编译时确定的长度；array<int,4>与array<int,5>是不同类型。'],['值初始化','array<int,4> a{}让四个int都为0。局部整数array没有初始化时不能直接读取其中的值。'],['固定长度与只读','固定长度意味着不能push_back或resize，不意味着元素不可修改。const才表达相应的只读约束。']],
 [['建立四个格子并检查编号','std::array<int,4> a{2,4,6,8}的实际内容就是2、4、6、8。下标0对应2，下标3对应8，a.size()返回4。尖括号的4规定长度，花括号列出初值，二者不要混淆。若想根据用户输入动态决定数量，应选择vector，而不是把普通运行时变量塞进模板参数。'],['用已有位置完成替换','要把第二个读数改为5，应写a.at(1)=5。修改后是[2,5,6,8]，长度依然为4，并没有插入新格子。at返回该元素的引用，因此可以放在赋值号左边。若误写at(4)，访问的是不存在的第五个元素，程序会抛出越界异常，这能帮助你发现编号算错。'],['使用范围遍历避免写错边界','begin指向第一项，end表示最后一项之后，遍历条件是位置不等于end。也可以使用for(int x:a)逐个取得值。array<int,0>也是合法类型，它的begin等于end；通用代码不能因为看到array就假定存在front或back。固定长度这一性质不替你保证长度大于零。'],['把求和理解成连续更新一个变量','accumulate的初值为0，依次读到2、5、6、8时，累计值变成2、7、13、21，因此输出21。初值不是起始下标，而是累计器最开始的数值和类型。可能得到很大整数总和时应考虑0LL等合适类型。Python列表可以算相同结果，但它仍可增长，不具备array的编译期长度约束。']],
 [['a.at(1)=5','替换已有元素，不增加长度。at检查边界，[]版本不检查。'],['accumulate(a.begin(),a.end(),0)','需要<numeric>；从0开始把整个半开范围相加，返回累计结果。'],['array<int,4>','第二个模板参数属于类型的一部分，不是普通构造函数的运行时实参。']],
 [['固定长度为什么还能修改a[0]？','固定的是元素数量，不是内容。只有const等只读限制才禁止这种修改。'],['a{}与a{4}有什么区别？','对array<int,4>而言，前者是[0,0,0,0]，后者是[4,0,0,0]。{4}并不是“创建4个元素”的指令，长度已由类型指定。']],
 [['array<T,N> a{...}','创建固定长度容器','T为元素类型，N为编译期长度。','新对象。','std::array<int,4> a{2,4,6,8};','需<array>；N不能随运行时输入变化。','a=[2,4,6,8] # Python列表无固定长度约束'],
 ['size() / empty()','读取固定长度或判断零长度','无参数。','数量或bool。','std::array<int,4> a{};\na.size(); // 4\na.empty(); // false','array<T,0>合法，但不能读两端。','len(a), not a'],
 ['at(i) / operator[](i)','读写现有元素','0<=i<N。','元素引用。','std::array<int,2> a{7,8};\na.at(0)=9;','at检查越界；[]不检查。','a=[7,8]\na[0]=9'],
 ['fill(value)','把所有格子设为相同值','value为填充值。','void。','std::array<int,3> a{};\na.fill(7);','长度不变，时间O(N)。','a=[0]*3\na[:]=[7]*len(a)'],
 ['front() / back()','读取两端元素','无参数。','元素引用。','std::array<int,2> a{7,8};\na.front();\na.back();','要求N>0。','a[0],a[-1]'],
 ['begin() / end()','获取标准算法的遍历范围','无参数。','迭代器。','std::array<int,3> a{3,1,2};\nstd::sort(a.begin(),a.end());','sort需<algorithm>，end不能解引用。','a=[3,1,2]\na.sort()'],
 ['data()','取得连续数据指针','无参数。','T*或const T*。','std::array<int,2> a{7,8};\nint* p=a.data();','指针有效期不超过array对象，零长度时不能解引用。','普通列表没有等价指针接口。'],
 ['swap(other)','交换同长度、同类型数组','other必须是相同类型。','void。','std::array<int,2> a{1,2},b{3,4};\na.swap(b);','通常逐个交换，成本O(N)。','a,b=[1,2],[3,4]\na,b=b,a']],['vector']);
put('stl-deque',
 '任务调度有时要把普通任务加到尾部，把紧急任务加到头部。vector在头部插入通常需要移动许多已有元素，deque提供高效的两端增删。它既能像双端队列一样操作，也能按下标访问。先把左右方向画清楚，再记函数名称；不要把deque与限制只能队尾入、队头出的queue适配器当成同一个接口。',
 [['双端队列','deque允许两端添加和移除。front是头部，back是尾部，push表示新增，pop表示删除。'],['分段存储','deque通常把元素放在多个存储块中，不保证整体连续。不能把首元素地址当成整个容器的连续数组入口。'],['随机访问','C++ deque支持常数时间下标访问。Python collections.deque的中间位置访问通常需遍历，不具有相同复杂度保证。']],
 [['先把紧急任务放在头部','初始序列[2,3]中，2是front，3是back。push_front(1)得到[1,2,3]，不是把2覆盖成1。原来的两个任务仍然存在，数量从2变为3。函数名称里的front决定插入方向，而参数1仅是任务的值，不代表插入下标1。把这两件事分开就不会把队列方向写反。'],['在尾部接收普通任务','push_back(4)继续得到[1,2,3,4]。现在front仍是1，back是4，d[2]得到3。支持下标访问不代表元素整体连续，底层可能通过块索引完成定位。需要把数据交给只接受连续数组指针的接口时，应该选择vector或复制到连续存储，而不是对deque首地址随意加偏移。'],['读取任务以后再删除它','如果要处理最前面的任务，先在非空条件下读取front得到1，然后pop_front删除1，剩下[2,3,4]。C++的pop_front不返回删除值；如果你想保留任务数据，应该先复制出来。pop_back则删除尾部的4，含义完全不同。空队列不能读front或执行弹出操作。'],['最后观察剩余序列并理解语言差异','循环输出剩下的2、3、4，不会再看到已被删除的1。Python的appendleft对应头部追加，append对应尾部追加，popleft删除头部并返回值；C++删除函数返回void。另一个区别是迭代器失效规则：C++端部插入可能使旧迭代器失效，所以不要保存旧迭代器后继续遍历。']],
 [['deque<int> d{2,3}','需<deque>；花括号给出两个初始元素。'],['d.push_front(1)','在原始头部之前新增1，不覆盖旧元素。'],['d.pop_front()','要求非空；只删除，不返回被删值。']],
 [['从[2,3]开始push_front(1)、push_back(4)、pop_back后是什么？','先得到[1,2,3,4]，最后删除尾部4，剩下[1,2,3]。'],['deque可以直接当作连续数组使用吗？','不可以依赖这种保证。它能随机访问，但不保证所有元素连续；随机访问能力和连续存储是两个不同性质。']],
 [...common('std::deque<int>','{2,3}','from collections import deque\nc=deque([2,3])'),
 ['push_front(x) / push_back(x)','在两端新增值','x为元素值。','void。','std::deque<int> d{2,3};\nd.push_front(1);\nd.push_back(4);','端部插入可能使迭代器失效。','from collections import deque\nd=deque([2,3])\nd.appendleft(1)\nd.append(4)'],
 ['pop_front() / pop_back()','删除两端元素','无参数。','void。','std::deque<int> d{1,2,3};\nd.pop_front();\nd.pop_back(); // [2]','先确保非空。','d.popleft()\nd.pop() # Python会返回删除值'],
 ['front() / back()','读写两端但不移除','无参数。','元素引用。','std::deque<int> d{2,3};\nd.front()=7;','非空前提。','d[0],d[-1]'],
 ['at(i) / operator[](i)','按下标读写','i是有效下标。','元素引用。','std::deque<int> d{2,3};\nd.at(1)=8;','C++随机访问O(1)，Python deque中间访问不保证O(1)。','d[1]=8'],
 ['insert(pos,x) / erase(pos)','在中间位置增删','pos为迭代器。','插入位置或删除后的后继迭代器。','std::deque<int> d{1,3};\nd.insert(d.begin()+1,2);\nd.erase(d.begin());','中间操作通常线性，可能使许多旧位置失效。','d.insert(1,2)\ndel d[0]'],
 ['resize(n,x)','调整长度','n为新长度，x为可选填充值。','void。','std::deque<int> d{1};\nd.resize(3,8);','这会真正建立或销毁元素。','while len(d)<3:\n    d.append(8)'],
 ['emplace_front(args...) / emplace_back(args...)','在两端直接构造','元素构造参数。','C++17起返回新元素引用。','std::deque<std::pair<int,int>> d;\nd.emplace_front(1,2);','pair另需<utility>，构造仍可能分配内存。','d.appendleft((1,2))']],['vector']);
put('stl-linked-containers',
 '若经常在已知位置插入、删除，且希望不搬动后面的每个元素，可以考虑链式容器。list用节点前后相连，forward_list只保留向后的连接。它们不是“能无限快速操作的数组”：找到第几个节点通常仍要逐个走。本节先用相邻去重观察内容变化，再认识两种链表为什么采用不同的插入、删除位置接口。',
 [['节点','一个保存值和连接信息的单元。插入节点可通过调整连接完成，不要求把所有值装在一整块连续内存中。'],['双向与单向','list可以沿前后方向移动；forward_list只能向前走。因此后者经常操作某位置的后继，而不是直接操作该位置。'],['相邻去重','unique只合并连续相等的元素。例如[1,1,2,2,1]变成[1,2,1]，最后的1仍保留，因为它与第一个1不相邻。']],
 [['先按节点顺序画出输入','两种容器都从1→1→2→2→1开始。每个箭头表示后继关系，不表示数组下标。list额外具有反向连接，因此可以从末尾向前走；forward_list没有这个能力，也不提供下标运算。选择它们之前，需要区分“我已经有位置”与“我还要遍历找到位置”，后者会产生额外的线性成本。'],['unique比较的是相邻节点','从第一个1向后看，第二个也是1，所以删除重复节点；接着遇到2，与保留的1不同，留下2；再遇到2则删除；最后一个1与前面的2不同，继续保留。因此两个容器都输出1 2 1。这个结果不是去掉所有重复数值，若要全局去重，必须另选算法或先排序并接受顺序改变。'],['理解单链表为什么需要before_begin','在单链表中删除某个节点，需要让它前面的节点跳过它。因此forward_list提供erase_after和insert_after：参数指向前驱。若要操作第一个元素，前面没有真实节点，于是before_begin提供一个特殊的“头部之前”位置。它可用作操作位置，但不能解引用读取一个不存在的值。'],['按容器能力选择算法','std::sort要求随机访问迭代器，不能直接对list调用std::sort(begin,end)。list和forward_list有自己的成员sort，能通过适合链表的方式重排节点。它们的成员remove和unique会真正删除节点；普通std::remove只重新安排范围中的值。函数同名不代表容器长度变化和失效规则完全一致。']],
 [['a.unique()','这是链表成员函数，真正删除连续重复的节点，不只是返回逻辑尾部。'],['forward_list<int>','需<forward_list>；只有单向迭代能力，没有size、back、push_back等接口。'],['list<int>','需<list>；双向链表可以访问两端，但不能使用l[3]。']],
 [['为什么输出末尾仍有1？','因为unique只检查连续相等的元素，末尾1前面是2，并非重复相邻项。'],['为什么forward_list没有erase(it)这种常用成员？','单向结构删除节点需要它的前驱。erase_after让调用者提供前驱位置，从而调整连接；不能把list的接口直接套用。']],
 [...common('std::list<int>','{1,2}','c=[1,2]'),
 ['push_front(x) / push_back(x)','list在头尾添加','x是新元素。','void。','std::list<int> l{2};\nl.push_front(1);\nl.push_back(3);','forward_list只有push_front，没有push_back。','from collections import deque\nl=deque([2])\nl.appendleft(1); l.append(3)'],
 ['insert(pos,x) / erase(pos)','list在已知位置插入或删除','pos为有效迭代器；插入允许end。','插入位置或删除后的后继迭代器。','std::list<int> l{1,3};\nauto it=std::next(l.begin());\nl.insert(it,2);\nit=l.erase(it);','next需<iterator>；单次已知位置操作常数时间，寻找位置另计。','l=[1,3]\nl.insert(1,2)\ndel l[2] # Python列表会移动元素'],
 ['before_begin() / insert_after(pos,x)','forward_list在某位置后插入','pos为前驱，可取before_begin。','新插入元素迭代器。','std::forward_list<int> f{2};\nf.insert_after(f.before_begin(),1);','before_begin不是实际元素，不可解引用。','f=[2]\nf.insert(0,1) # 仅表达顺序结果'],
 ['erase_after(pos)','forward_list删除前驱之后的元素','pos后面必须有可删除的元素。','删除后后继迭代器。','std::forward_list<int> f{1,2};\nf.erase_after(f.before_begin()); // [2]','不是删除pos本身。','f=[1,2]\ndel f[0]'],
 ['remove(value) / remove_if(pred)','删除匹配值或满足条件的节点','value为匹配值，pred是返回bool的判定函数。','C++17为void；C++20起返回删除数量。','std::list<int> l{1,2,2,3};\nl.remove(2); // [1,3]','成员remove真正删除节点，别与std::remove混淆。','l=[1,2,2,3]\nl[:]=[x for x in l if x!=2]'],
 ['unique()','删除连续重复值','可选二元相等判定。','C++17为void；C++20起返回删除数量。','std::list<int> l{1,1,2,1};\nl.unique(); // [1,2,1]','不是全局去重。','from itertools import groupby\nl=[k for k,_ in groupby([1,1,2,1])]'],
 ['sort() / reverse()','链表专用排序或反转','sort可带比较器；reverse无参数。','void。','std::list<int> l{3,1,2};\nl.sort();\nl.reverse();','不能用要求随机访问的std::sort代替成员sort。','l=[3,1,2]\nl.sort(); l.reverse()'],
 ['splice(pos,other)','list转移另一个链表的节点','pos为目标插入位置，other为来源链表。','void。','std::list<int> a{1},b{2,3};\na.splice(a.end(),b); // b变空','分配器须相容；还存在单节点/范围重载。forward_list用splice_after。','a,b=[1],[2,3]\na.extend(b); b.clear() # 复制元素语义并非节点转移'],
 ['merge(other)','合并两个已经有序的链表','other为相同排序规则下的有序链表。','void，转移节点后来源通常变空。','std::list<int> a{1,3},b{2,4};\na.merge(b);','两边必须已按相同比较规则排序；不会自动先排序。','import heapq\na,b=[1,3],[2,4]\na=list(heapq.merge(a,b)); b.clear()']],['vector']);
put('unordered-map',
 '想统计每种颜色出现几次，可以建一张“颜色名称→次数”的表。数组下标适合整数位置，unordered_map允许使用字符串等类型当作键。先理解键与值各表示什么，再分清新增、修改和只读查询。本节输入red、blue、red，要求查询red、blue、green时分别得到2、1、0，同时不能因为查询green就误把它加入统计表。',
 [['键和值','键是用于查找的名字，例如red；值是这个名字关联的数据，例如次数2。同一键在unordered_map里最多对应一条记录。'],['哈希与桶','哈希函数把键转换成可用于选桶的数值。不同键可能落在同一桶，叫冲突；容器仍要判断真正的键是否相等。'],['默认插入','m[key]在键不存在时会创建条目并值初始化值。若值类型为int，新值是0；这让计数方便，也可能让看似只读的查询改变容器。'],['平均与最坏成本','查找和插入通常平均常数时间，但大量冲突时可能退化到线性；不能把平均O(1)当作所有输入的绝对保证。']],
 [['先从空表理解第一次累加','最初freq中没有任何键。读到red时，freq[\"red\"]会先建立red→0，然后++把0改成1。第二个词blue也经历相同过程，表变成red→1、blue→1。这里键是字符串内容，不是它在输入里的下标；出现两次的red应该更新同一条记录，而不是再建一个重复键。'],['重复键更新已有次数','第三个词仍然是red，方括号找到已存在的值1，累加后变成2。此时不同键数量为2，而不是输入词数3。size统计条目数量，不统计各个次数的总和。把“不同颜色的数量”与“输入词的数量”分开，就能理解为什么表大小与计数和可能不同。'],['只读查询要避免意外写入','查询red与blue可以用find，得到对应位置后读取it->second。查询green时find返回end，这时应该输出0而不是解引用end，也不必插入green。若使用freq[\"green\"]进行显示，会把不存在的green新增为0，之后size变成3，这通常不是只读查询想要的副作用。'],['按明确的查询顺序输出','unordered_map不保证按插入顺序或字典顺序遍历，所以本节按照red、blue、green这个固定查询列表输出。Python字典保存插入顺序，不应据此推断C++无序映射也这样工作。Python的get(word,0)不会插入缺失键，适合本节只读查询；统计时再把get结果加1写回去。']],
 [['++freq[word]','方括号会为缺失键建立0，再前置自增得到1；已有键则在原次数基础上加1。'],['it == freq.end()','判断没找到，必须在访问it->second之前检查；end不是默认值0。'],['it->second','映射元素是一对键和值，first是键，second是值。箭头表示通过迭代器访问它指向的对象成员。']],
 [['只输入red三次，size是多少，red的值是多少？','size为1，因为只有一种键；red对应值为3，表示这个键被计数了三次。'],['为什么显示缺失词的次数建议用find而不是[]？','find不改变容器，未找到时自行输出0；[]会新增缺失键，改变size和后续遍历结果。']],
 [...common('std::unordered_map<std::string,int>','{{"red",2}}','c={"red":2}'),
 ['operator[](key)','访问值，缺失时建立默认值','key为键。','对应值的引用。','std::unordered_map<std::string,int> m;\n++m["red"]; // red:1','需<unordered_map>与<string>；只读查询谨慎使用。','m={}\nm["red"]=m.get("red",0)+1'],
 ['at(key)','只访问已有键','key为键。','对应值引用，缺失时抛out_of_range。','std::unordered_map<std::string,int> m{{"red",2}};\nstd::cout << m.at("red");','不会默认插入；必须处理缺失。','m={"red":2}\nm["red"] # Python缺失也抛异常'],

put('set',
 '如果要保存不重复的数值，并经常问“第一个不小于某个值的数是什么”，set把去重与有序查找组合在一起。它不是按编号访问的数组，也不是键值映射：每个元素本身就是用于排序和查找的键。本节把7、2、7、9、4放进去，再寻找不小于5的最小值，用这个过程认识自动去重和边界查询。',
 [['有序集合','set按比较器定义的顺序组织元素，默认对整数升序。插入次序不会改变最终遍历顺序。'],['唯一键','按比较关系等价的元素最多保存一份。默认整数比较下，两次插入7只保留一个7。'],['lower_bound','返回第一个不小于目标的元素位置；它查的是边界，不要求目标本身存在。若所有元素都更小，返回end。']],
 [['逐个插入并画出有序结果','插入7后集合为{7}，插入2后遍历顺序是{2,7}，再次插入7不会增加元素，接着插入9和4得到{2,4,7,9}。这里排序和去重由容器维护，用户无需每插一次就调用sort。size最终为4，不是输入数量5，理解这个差异能避免把集合当作原始序列。'],['把边界查询转换成一个明确条件','寻找不小于5的最小数，就是在有序数据中找第一个满足x>=5的位置。2和4都太小，7是第一个满足条件的元素，所以lower_bound(5)指向7。不要把lower_bound理解成一定找到5，也不要因为输入中没有5就直接认为查询失败。'],['未找到的情况由end表示','如果目标改成10，集合中没有元素满足x>=10，因此返回end。只有先确认it!=s.end()，才能通过*it读取结果。若集合为空，同样会返回end。end不是0，也不是最后一个元素；用特殊位置表达不存在，可以避免把合法值0误当作失败信号。'],['不要通过迭代器修改排序键','set的元素参与内部排序，如果直接把某个7改成1，内部位置可能不再符合顺序。因此set迭代器不允许你随意赋值修改元素。通常先删除旧键再插入新键，或学习C++17节点句柄。Python示例用sorted(set(...))建立有序列表，然后bisect查询，它并不是Python内置set自动保持有序。']],
 [['s.lower_bound(5)','set成员函数能利用其查找结构，常见保证为对数时间；不要用对链式迭代范围反复移动的通用版本代替。'],['*it','解引用取得该位置的值，之前必须排除end。'],['sorted(set(...))','Python先去重再排序，结果是列表；原始Python set没有C++ set的有序成员查询接口。']],
 [['lower_bound(7)与upper_bound(7)分别指向哪里？','在{2,4,7,9}中，前者是7，后者是9。lower允许等于目标，upper要求严格大于目标。'],['插入重复7会把原来的7移到最后吗？','不会。set只保留一个等价键，遍历顺序由比较规则决定，不是按最近插入排序。']],
 [...common('std::set<int>','{2,4,7,9}','c={2,4,7,9}'),
 ['insert(value) / emplace(args...)','插入唯一键','新键或元素构造参数。','pair<iterator,bool>，bool表示是否新增。','std::set<int> s{2};\nauto r=s.insert(2); // r.second为false','重复插入不增加size。','s={2}\ns.add(2)'],
 ['find(key) / count(key)','精确查找','key为目标。','find返回位置或end；count为0或1。','std::set<int> s{2,4};\nauto it=s.find(4);\nif(it!=s.end()) std::cout << *it;','与边界查询不同：find(3)不会返回4。','s={2,4}\n4 in s'],
 ['contains(key)','直接判断存在（C++20）','key为目标。','bool。','// C++20\nstd::set<int> s{2,4};\nbool ok=s.contains(4);','C++17使用find或count。','4 in {2,4}'],
 ['lower_bound(key) / upper_bound(key)','查询不小于/大于目标的首元素','key为边界。','迭代器，可能等于end。','std::set<int> s{2,4,7,9};\nauto a=s.lower_bound(5); // 7\nauto b=s.upper_bound(7); // 9','顺序基于比较器；本例使用默认升序。','from bisect import bisect_left,bisect_right\na=[2,4,7,9]\nbisect_left(a,5),bisect_right(a,7)'],
 ['equal_range(key)','获得所有等价键的半开范围','key为目标。','一对迭代器，分别等价于lower和upper界。','std::set<int> s{2,4};\nauto range=s.equal_range(4);','set最多包含一个等价键，multiset可能多个。','使用有序列表上的bisect_left和bisect_right。'],
 ['erase(key) / erase(it)','删除键或位置','有效键值或元素迭代器。','按键返回0或1；按位置返回后继。','std::set<int> s{2,4};\ns.erase(2);','不能erase(end())，删除后仅被删元素的位置失效。','s={2,4}\ns.discard(2)'],
 ['rbegin() / rend()','按反向顺序遍历','无参数。','反向迭代器。','std::set<int> s{2,4};\nfor(auto it=s.rbegin();it!=s.rend();++it)\n    std::cout << *it;','rend也不能解引用；set迭代器不支持it+1。','for x in sorted({2,4},reverse=True):\n    print(x)']],['vector']);
put('stl-map',
 '如果你既要保存“名字→数据”，又希望按名字排序输出，可以使用map。它和unordered_map都保存键值对，但map维护比较顺序，更适合边界查询与有序遍历。本节统计pear、apple、pear，最终按键输出apple:1和pear:2。先弄清“按键排序”与“按次数排序”不同，再学习插入、访问和修改。',
 [['键值对','map的一条记录包含first键和second值，例如apple与1。键用于定位，值可以更新。'],['按键有序','默认字符串按字典式比较排列，因此apple排在pear之前，即使pear最先插入。'],['查找与赋值','find只找不写；operator[]在缺失键时会新建默认值；at只访问已有键，缺失时抛异常。']],
 [['根据问题决定键和值','我们想知道每个水果词出现多少次，所以键应是字符串，值应是整数。声明map<string,int>以后，不能把“第几个单词”误当作键，否则重复的pear会被统计到两条不同记录里。词频统计关心的是名称相同，而不是出现位置相同。'],['一步一步更新同一条记录','初始空表；第一个pear让默认值0加1，得到pear→1。apple第一次出现得到apple→1。第三个pear已经存在，原次数1增加到2。结束后有两条记录，总次数为3。与unordered_map类似，[]很适合本例计数，但在纯查询场景中可能造成隐式插入。'],['有序遍历体现的是键规则','遍历map时先得到apple→1，再得到pear→2，因为默认比较器比较键字符串。这里不是按频次排序，也不是按输入顺序排序。如果需求改为“出现次数最多的先输出”，需要把记录放入可排序序列并按值比较，不能以为map天然按照second排序。'],['读取记录时区分first和second','C++可以用结构化绑定for(const auto& [k,v]:m)把键和值分别命名；也可以访问条目的first和second。键维持内部顺序，不允许直接改成另一个键；值则可以更新。Python用普通dict统计后对键执行sorted，表达的是同一输出结果，但不是提供与C++ map相同的树式成员接口。']],
 [['++m[x]','缺失水果先建立次数0，再加1；已有键只更新值。'],['for (const auto& [k,v] : m)','C++17结构化绑定；const引用避免复制并表示本循环只读。'],['m.begin()','指向按比较规则最靠前的键，而非最早插入的记录。']],
 [['pear先出现，为什么apple先输出？','map按键的比较顺序组织数据，apple字典序在pear前面，与插入顺序无关。'],['只想显示banana是否存在，用m[\"banana\"]会怎样？','会新增banana→0，改变容器。应用find或count进行不修改的查询。']],
 [...common('std::map<std::string,int>','{{"pear",2},{"apple",1}}','c={"pear":2,"apple":1}'),
 ['operator[](key) / at(key)','访问可更新的值','key为键。','值引用；at缺失抛异常。','std::map<std::string,int> m;\n++m["apple"];\nm.at("apple")=3;','[]会新建缺失键；头文件<map>、<string>。','m={}\nm["apple"]=m.get("apple",0)+1\nm["apple"]=3'],
 ['insert({key,value}) / emplace(key,value)','只插入新键','键值对或构造参数。','pair<iterator,bool>。','std::map<int,int> m{{1,10}};\nauto result=m.emplace(1,99);','重复键不会覆盖原值。','m={1:10}\nm.setdefault(1,99)'],
 ['insert_or_assign(key,value)','插入或覆盖（C++17）','键及新值。','位置及是否新增。','std::map<int,int> m{{1,10}};\nm.insert_or_assign(1,99);','返回bool为false可表示已有键被更新，不是失败。','m={1:10}\nm[1]=99'],
 ['try_emplace(key,args...)','键不存在时构造值（C++17）','键及值类型构造参数。','位置及是否新增。','std::map<int,std::string> m;\nm.try_emplace(1,3,\'a\');','重复键不替换原值。','m={}\nif 1 not in m: m[1]="a"*3'],
 ['find(key) / count(key)','不修改地精确查找','key为目标键。','find返回位置/end；count返回0/1。','std::map<int,int> m{{1,10}};\nauto it=m.find(1);\nif(it!=m.end()) std::cout << it->second;','解引用前检查end；C++20也有contains。','m={1:10}\n1 in m'],
 ['lower_bound(key) / upper_bound(key)','查找键的有序边界','key为边界键。','迭代器。','std::map<int,char> m{{2,\'a\'},{7,\'b\'}};\nauto it=m.lower_bound(5); // 键7','返回按键比较的位置，不是按值比较。','Python dict无此成员，需排序键后bisect。'],
 ['erase(key) / erase(it)','删除记录','键值或有效迭代器。','删除数量或后继迭代器。','std::map<int,int> m{{1,10}};\nm.erase(1);','按键删除不存在记录为0；不能删end。','m={1:10}\nm.pop(1,None)'],
 ['swap(other)','交换两个映射的内容','相容类型的映射。','void。','std::map<int,int> a{{1,2}},b{{3,4}};\na.swap(b);','自定义分配器需要满足交换条件。','a,b={1:2},{3:4}\na,b=b,a']],['unordered-map','set']);
put('stl-multi-associative',
 '同一个分数可能由多个学生取得，同一个类别也可能对应多条记录。set和map限制等价键唯一，multiset和multimap则保留重复键。本节用两个2和一个5说明“删一个2”与“删所有2”的差别，再查找类别A对应的全部值。先把每次出现当成独立记录，才能正确理解计数、范围和删除接口。',
 [['multi','这里表示允许多个等价键，而不是一个值自动变成数组。multimap中同一键的每一对键值仍是独立元素。'],['等价范围','equal_range(k)返回包含所有等价键的半开区间。重复键在有序容器中相邻，因此可以一次确定这段范围。'],['按键删除与按位置删除','erase(key)删除所有等价键；erase(iterator)只删除迭代器指向的那一个元素。']],
 [['先保留每一次重复出现','multiset插入2、2、5后，size为3，count(2)为2。它不会像set那样自动合并两个2。若数据表示两名成绩相同的学生，合并会丢掉人数，因此重复项是否保留是业务含义，不是“重复就一定无用”的固定规则。'],['只删除一个2需要找到具体位置','find(2)返回某个等价元素的位置，在确认不等于end后调用erase(it)，只移除这一项。此时剩下2、5，count(2)为1。如果直接调用erase(2)，两个2都会删除，返回删除数量2。代码里整数2与迭代器it即使都能传给erase，所选重载也完全不同。'],['一键多值仍然是多条记录','multimap加入(A,1)、(B,9)、(A,3)，按键遍历时两条A相邻。它没有operator[]，因为A对应两个值，方括号无法唯一回答“你要的是哪一条”。查某个键的所有记录时，不能只用find读取一次就认为已经找全，需要取整个等价范围。'],['从左界遍历到右界但不读取右界','equal_range(\"A\")返回两个迭代器first和second。从first开始逐个读取second字段，遇到范围结束位置就停止，得到1和3。这里pair.second作为区间右界，与元素的second作为映射值是不同层次的成员。把变量命名为first和last，再把当前记录命名为it，能减少理解混乱。']],
 [['s.erase(s.find(2))','示例保证2存在；一般代码应先保存find结果并检查end，然后按位置只删一项。'],['s.count(2)','返回等价元素的数量，multiset可大于1。'],['records.equal_range("A")','得到全部A记录的半开区间，而不是两个A值本身。']],
 [['multiset{2,2,5}调用erase(2)后剩什么？','只剩5，按键删除会删除两个2。若只删一个，先find再按迭代器删除。'],['为什么multimap没有m[key]？','一个键可能对应多条记录，无法唯一确定应返回哪一个值。使用find、equal_range或遍历来明确需求。']],
 [...common('std::multiset<int>','{2,2,5}','from collections import Counter\nc=Counter([2,2,5])'),
 ['insert(value) / emplace(args...)','保留重复地插入','元素值或构造参数。','插入元素的迭代器，不是唯一键容器的pair。','std::multiset<int> s;\nauto it=s.insert(2);\ns.insert(2);','multiset size统计所有出现次数。Python Counter的len只统计不同键数，不能直接等同。','from collections import Counter\ns=Counter()\ns[2]+=1\ns[2]+=1'],
 ['count(key)','统计等价键总数','key为目标。','非负计数。','std::multiset<int> s{2,2,5};\nstd::cout << s.count(2); // 2','有序重复键计数需要处理等价范围，成本可含匹配数。','s=Counter([2,2,5])\ns[2]'],
 ['erase(key)','删除所有等价键','key为键值。','被删除的元素数量。','std::multiset<int> s{2,2,5};\nauto n=s.erase(2); // n=2','若只删一项，应改用迭代器重载。','s=Counter([2,2,5])\ns.pop(2,None)'],
 ['find(key) + erase(it)','仅删除一个等价元素','find结果必须不等于end。','erase返回后继迭代器。','std::multiset<int> s{2,2,5};\nauto it=s.find(2);\nif(it!=s.end()) s.erase(it);','只定位一个元素，不负责枚举全部重复记录。','s=Counter([2,2,5])\nif s[2]>0: s[2]-=1'],
 ['equal_range(key)','获得全部重复记录范围','key为目标键。','pair<iterator,iterator>。','std::multimap<char,int> m{{\'A\',1},{\'A\',3}};\nauto [first,last]=m.equal_range(\'A\');\nfor(auto it=first;it!=last;++it) std::cout << it->second;','右界不属于范围，缺失时两界相等。','records=[("A",1),("A",3)]\n[v for k,v in records if k=="A"]'],
 ['lower_bound / upper_bound','分别取得等价范围左右界','目标键。','迭代器。','std::multiset<int> s{2,2,5};\nauto first=s.lower_bound(2);\nauto last=s.upper_bound(2);','默认升序下前者>=目标，后者>目标。','from bisect import bisect_left,bisect_right\na=[2,2,5]\nbisect_left(a,2),bisect_right(a,2)']],['set','stl-map']);
