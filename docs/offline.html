</script><script>const WORKED_EXAMPLES={"bfs":["求地铁最少换乘次数时，先只数边数。设 A 连 B、C，B 连 D。从 A 出发，把 B、C 都标为距离 1，再从 B 发现 D，距离就是 2。队列先处理离起点近的点，所以第一次发现 D 时没有更短路线。","若 C 也连 D，要再把 D 加入队列吗？","入队时就标记访问。第二次看到 D 时已经有同样短的路线，再入队只会重复工作。"],"algo-dfs":["在纸上画出两组相连的村庄 A—B、C—D。从 A 沿路走到 B，无路可走就退回。第一趟只能标记 A、B。接着从未标记的 C 出发，第二趟标记 C、D。启动搜索的次数就是连通分量数。","孤立的 E 没有道路，算一个分量吗？","算。从 E 启动搜索只能标记自己，但它也是一组内部可达、与其他点不连通的顶点。"],"algo-topological":["把先修课画成箭头，A→C 与 B→C 表示 C 有两个未完成前提。先处理入度为零的 A，C 的入度从 2 降到 1。再处理 B，C 降到 0，才能把 C 放进可选队列。","处理 A 后马上输出 C 会违反什么？","B 还没完成，B→C 的约束仍然存在。多个零入度点之间则可以有多种合法顺序。"],"algo-mst":["三座城市之间修路的费用为 AB=1、BC=2、AC=5。先修最便宜的 AB，再修 BC，三个点已连通，总价 3。此时加 AC 会形成环。Kruskal 用并查集判断一条候选边的两端是否已经连通。","最小生成树一定给出任意两点的最短路吗？","它优化所有选中边的总费用。某一对城市在树上的路径可能比原图中的直达边长。"],"algo-dijkstra":["设 A→B 花 5，A→C 花 1，C→B 花 2。最初 B 的暂定距离是 5，C 是 1。先取暂定距离最小的 C，再比较到 B 的旧值 5 和新路线 1+2，于是 B 改成 3。这个比较叫松弛。","为什么不能刚发现 B 就宣布答案是 5？","发现只说明有一条可行路线。非负边权下，取出当前最小且仍有效的候选时才可确定距离。"],"algo-bellman-ford":["一张优惠券可以让某段路的费用为负。对每条边 u→v 尝试用“到 u 的费用 + 边价”改善 v，反复做多轮。A→B=4、B→C=−2 会把 C 的费用改善到 2。先扫描哪条边可能影响本轮进度，但足够多轮后结果一致。","为什么还要额外检查一轮？","没有可达负环时，最短简单路径至多经过 V−1 条边。再能严格改善，说明可达路径中存在反复绕行还会降价的环。"],"algo-floyd":["先写出城市间直达费用表。A→B=3、B→C=4、A→C=10。允许经过 B 后，A 到 C 就多了一个选择，比较 10 和 3+4，表格改写为 7。逐个允许新的中间点，最后得到每一对起终点的距离。","为什么通常让中间点 k 的循环在最外层？","一整轮更新共享同一个含义，即允许前 k 个点作中转。下一轮才能使用这一轮已算好的子路径。"],"algo-scc":["单行道 A→B、B→A、B→C 中，A 和 B 可以互相到达，因此属于同一个强连通分量。C 能被它们到达，却不能返回，必须单列。把每组缩成一个点，图就变成 AB→C，循环依赖藏在组内。","弱连通和强连通在这个例子里相同吗？","忽略箭头方向时三个点都连通，但按箭头走只有 A 与 B 互通，因此强连通分成两组。"],"algo-matching":["甲能做任务 1 和 2，乙只能做 1。如果先把甲配给 1，乙看似无处可去。沿“乙→1→甲→2”重新分配，把甲移到 2，把乙配到 1，就从一对变成两对。这条交替使用空闲和已占用关系的路线叫增广路径。","只寻找空闲任务为什么可能漏解？","它忽略了已有匹配可以调整。增广路径内部交换占用关系，只在两端增加一对净匹配。"],"algo-maxflow":["把边容量想成每分钟最多可过多少水。某条增广路径上剩余容量分别为 5、2、4，这趟最多加 2。每条正向边的剩余量都减 2，同时反向边多出 2，让以后可以撤销这次选择的一部分。","反向容量表示真的铺了一根回水管吗？","它记录算法还能取消多少已分配的流量。利用它可以调整早期路线，避免把局部选择误当全局限制。"],"dp":["用面值 1、3、4 凑 6。先求较小金额的最少硬币数，再按最后一枚来分类：最后用 1 就查金额 5，用 3 就查金额 3，用 4 就查金额 2。最好的选择是 3+3，共 2 枚。","为什么 dp[0] 应为 0？","凑出零元恰好需要零枚。这个已知起点让金额等于硬币面值时得到 0+1，而暂时无法凑出的金额应另设不可达标记。"],"algo-knapsack":["一个重 2、价值 3 的物品，背包容量 4。若每件最多取一次，更新容量 4 时要读取加入这件物品之前容量 2 的旧值。一维数组按容量从大到小更新能保留这个旧值。","顺序从小到大会发生什么？","容量 2 先变成 3，容量 4 又读到这个新值，会得到 6，相当于把同一件用了两次。这正是完全背包允许的行为。"],"algo-sequence-dp":["比较字符串 AB 和 ACB。最长公共子序列允许跳过字符，因此可以匹配 A、跳过 C、再匹配 B，长度是 2。用两串前缀长度做表坐标，末字符相同时从左上角加一，不同时从丢掉任一末字符的两个结果里取最大。","为什么这里可以跳过 C，而最长公共子串不行？","子序列只要求保持相对顺序。子串要求连续，所以遇到不匹配时不能跨过去接在同一个子串上。"],"algo-interval-dp":["三个矩阵尺寸分别为 10×30、30×5、5×60。先乘前两个花 1500 次标量乘法，再乘第三个花 3000 次，总共 4500。先乘后两个要 9000 次，再与第一个乘还需 18000 次。相同数学结果对应不同计算费用。","为什么先计算短区间？","长区间的最后一次乘法把它分成两个短区间。先知道两边各自的最低成本，才能比较这个分割点是否划算。"],"algo-tree-dp":["树上选活动地点，相邻点不能同时选。父点权重 5，两名孩子各为 4。选父点只能得到 5，舍弃父点则两个孩子都可选，得到 8。对每个点分别保存“选”和“不选”两种最优值，从叶子往上交给父亲。","父点不选时，是否必须选每个孩子？","不必。每个孩子的子树都可独立比较选与不选两种值，取较好的一种。"],"algo-bitmask-dp":["给三个人分三个不同任务，可以用三位二进制数记录哪些任务已被拿走。掩码 101 表示任务 0、2 已用，下一人只能接任务 1，置位后得到 111。每种掩码保存到达这种占用状态的最低总价。","为什么掩码可以同时确定轮到第几个人？","按固定顺序每人恰分一个任务时，已置位的位数就是已分配的人数。这个结论依赖“一人一个”的约束。"],"algo-digit-dp":["统计不超过 35 的整数时，从十位开始填。若十位选 3，个位最大只能选 5，这条分支仍受上界约束。若十位选 2，个位可选 0 至 9，因为前面已经严格小于 35。tight 标记保存这一区别。","统计含数字 0 的数时，前导零也应算吗？","取决于题目对表示的定义。通常整数 7 写成 07 补位仅为计算方便，应另外记录是否已开始填写有效数字。"],"algo-kmp":["模式 ABAB 在匹配到 ABA 后失配。已读部分的最长真前缀兼后缀是 A，可接着尝试下一个字符，无须让文本指针倒退。前缀函数事先记录各模式前缀可退回多长，每次失配就按这张表跳转。","为什么“真前缀”要排除整个字符串？","若允许退回原长度，失配后状态没有变短，就可能永远停在同一个比较上。"],"algo-rolling-hash":["把两位数字 34 看成 3×10+4。窗口右移要得到 45，可以先减去最高位贡献 30，再乘 10，加上新数字 5。字符串滚动哈希把这个思路用于字符编码，再取模限制数值大小。","哈希相等就一定找到同一个字符串了吗？","取模会让不同值落到同一结果。需要精确匹配时应在候选位置直接比较字符。"],"algo-aho-corasick":["在文本 she 中同时找 she 和 he。读完 e 时，当前完整前缀是 she，而其后缀 he 也是一个模式。失败链接连接到可复用的后缀状态，把那个状态的命中数也算进来，才能在同一位置报告两种匹配。","命中 she 以后直接跳到下一段有何问题？","可能漏掉以同一字符结尾的短模式，也可能漏掉与已匹配区间重叠的新模式。"],"algo-suffix-array":["对 aba，三个非空后缀依次是 aba、ba、a。按字典序排序得到 a、aba、ba，所以只需保存起点 [2,0,1]。相邻两个后缀 a 和 aba 的公共前缀长度是 1，这个长度可以帮助发现文本中的重复部分。","后缀数组里的 2 代表什么？","代表原字符串下标 2 起始的后缀排在这个位置。它是位置编号，不能当作字符出现次数。"],"algo-manacher":["在 abba 中，最长回文中心在两个 b 中间。先比较 b 和 b，再比较外面的 a 和 a，得到长度 4。奇回文则有一个真正的中心字符，例如 aba 的 b。分别记录两类半径，避免漏掉偶数长度。","为什么镜像半径仍要受右边界限制？","已知回文只保证区间内部的对称性，超出右边界的字符尚未比较，必须实际向外检查。"],"algo-number-theory":["计算 gcd(30,18)，先把 30 除以 18 得余数 12，再算 gcd(18,12)，接着是 gcd(12,6)，最后 gcd(6,0)=6。因为能整除两数的因子也整除两数的差，取余不改变公因子集合。","快速幂为什么能跳过很多乘法？","把指数写成二进制，各位对应底数的连续平方。只把指数中为 1 的位对应的幂乘入答案。"],"algo-geometry":["从点 A=(0,0) 到 B=(2,0) 的方向是向右。测试点 C=(1,1) 在它的左侧，叉积为 2×1−0×1=2。换成 C=(1,−1) 结果变成负数。符号表达方向，零表示共线。","叉积为零能直接判断 C 在线段 AB 上吗？","只能判定在同一直线上。还要检查 C 的坐标是否位于两端点围成的范围内。"],"algo-randomized":["数据流只允许保存一个样本。第一项直接保留，第二项以 1/2 概率替换，第三项以 1/3 概率替换。第一项最终留下的概率是 1×1/2×2/3=1/3，与第三项相同。证明假定每轮有独立均匀的随机选择。","固定种子多次运行总得到同一项，能证明均匀性吗？","固定种子用于复现一次轨迹。均匀性来自随机模型和概率证明，不能由一串固定输出推出。"],"algo-np-approx":["要覆盖图中每条边，可以挑一条尚未覆盖的边，把两个端点都选入，然后跳过已覆盖的边。每次所挑的边彼此没有共同端点，所以最优解也至少要为每条挑中的边支付一个端点。我们的费用不超过这个下界的两倍。","两倍近似是否表示每次都恰好多花一倍？","它给出最坏情况的上限。有的输入能得到最优解，有的输入会花更多。"],"algo-lca":["家谱里找两人的最近共同祖先，先把较深节点上移到相同深度。需要上移 5 层时，5=4+1，可以用预先记录的第 4 层祖先与第 1 层祖先完成两次跳转。之后同步提升两点，直到它们的父节点相同。","为什么预存 1、2、4、8 层就够了？","任意非负整数都能写成这些二次幂之和。跳跃表用更多预处理空间换取每次查询更少的移动。"],"algo-astar":["网格寻路时，已经走了 3 步，离目标还横差 2 格、纵差 1 格。只许上下左右移动时，至少还需 3 步，于是这一候选的估计总代价是 6。优先处理估价小的候选，再根据实际走出的新路径更新距离。","遇到障碍后曼哈顿距离还是下界吗？","在单位代价四邻网格里，障碍只可能增加绕行距离，所以下界仍成立。允许便宜的对角移动时要重新选择估价。"],"algo-fft":["两个多项式 (1+2x) 和 (3+4x) 相乘，常数项为 3，一次项为 1×4+2×3=10，二次项为 8。系数 [3,10,8] 就是卷积。FFT 先把系数转为多个取值点上的函数值，相乘后再反变换回系数。","输入都长 2，为什么不能只用两个变换点？","线性卷积有 3 个系数，长度太短会让高次项绕回低次位置。应补零到至少 3，并选择实现支持的变换长度。"],"net-dhcp":["一台新电脑刚接入局域网，尚未取得可用地址。它先寻找服务端，收到可用地址提议，再请求使用其中一个，最后等确认。确认带来的租期意味着地址有使用期限，重连或续租后可能改变。","收到提议就能把地址当作永久地址吗？","提议之后还需请求和确认，租约也有到期时间。地址、默认网关、DNS 等配置各有自己的用途。"],"net-icmp":["设两个路由器位于源和目标之间。探测包的 TTL 初值为 1 时，第一个路由器转发前减到 0，丢弃并可能返回超时通知。改为 2 就能探测第二跳。逐步增大 TTL 可以观察路径上的响应。","某一跳未返回通知，就能断定它无法转发吗？","设备可能限制或忽略诊断响应，同时仍然转发其他数据。一次无响应不足以定位故障。"],"net-ipv6":["IPv6 地址有八组十六进制数。2001:db8::1 写出了前三个非空组中的 2001、db8 和末尾 1，双冒号把中间五组零省略。还原为八组再比较地址，可以避免把不同文本写法误当成不同设备。","为什么同一地址只能出现一次双冒号？","若有两处可变长度的省略，读者无法确定每处各补几组零。"],"net-cidr":["路由表同时有 10.0.0.0/8 与 10.2.0.0/16。目的 10.2.3.4 与两条都匹配，但第二条固定的前缀位更多，指向更具体的网络，应选 /16。查找时先检查匹配，再比较前缀长度。","更长的前缀一定覆盖更多地址吗？","固定的位越多，可变化位越少，所以覆盖范围越小，匹配却越具体。"],"net-nat":["两台内网电脑同时访问同一服务端，网关把源地址改成同一公网地址，再分配不同的外部端口。响应回到公网端口时，网关查映射表，才能恢复对应的内网地址和端口。","只记录公网 IP，足以区分这两条连接吗？","不足。需要端口、协议及具体 NAT 策略所要求的其他信息才能区分映射。"],"net-rip":["A 到邻居 B 的代价为 1，B 通告自己距离 D 为 3，于是 A 经 B 到 D 的候选代价是 4。若旧路线代价为 7，就用 4 更新并记录下一跳 B。节点只需听邻居通告，不必保存完整网络图。","链路断开后，为什么旧路由可能一时仍在传播？","不同节点接收更新的时间不同，邻居还可能互相引用旧信息。距离向量协议需要专门机制处理这种收敛过程。"],"net-ospf":["每个路由器发布自己连接哪些邻居及链路费用。大家得到同一片区域的链路图后，各自以自己为起点算最短路。A—B 为 2、B—C 为 1、A—C 为 6 时，A 到 C 会选择先发给 B。","两个路由器拥有相同拓扑图，下一跳表一定相同吗？","起点不同，最短路树和本地需要选择的第一跳也可能不同。"],"net-bgp":["从一个自治系统到同一目的前缀可能有多条通告路线。先按运营策略选可接受的路线，再比较相关属性。发现 AS_PATH 中已经有自己的编号时，就可以拒绝一条可能绕回自己的通告。","自治系统跳数最少就一定被选中吗？","选择受本地策略等属性影响，跳数只是其中一项，不能把 BGP 当成按物理距离求最短路。"],"tcp":["从序列号 100 开始发送三个数据字节，它们的位置是 100、101、102。接收方都连续收到时，回 ACK 103，表示下一次期待 103。如果中间的 101 尚未到达，累计确认不能跳过这个缺口。","ACK 103 表示已收到编号 103 的字节吗？","它表示 103 之前的连续字节已收到，103 是期待的下一位置。SYN 和 FIN 也会占用序列空间。"],"net-udp":["发送方先发一个两字节数据报，再发一个三字节数据报。UDP 保留这两条消息的边界，接收方需要为每个数据报准备足够缓冲。网络可能丢失、重复或改变它们的到达顺序。","校验和通过是否意味着从此不会丢包？","校验针对收到的数据是否出现可检测的损坏。没有到达的数据报不会因此被自动重传。"],"net-arq":["停等协议发出序号 0 后等待确认。若接收方已收到但确认丢失，发送方超时会重发 0。接收方要识别重复、再发确认，同时只给应用交付一次。滑动窗口允许多条尚未确认的数据同时在途。","为何仅靠超时重发还不足以实现可靠交付？","确认本身也会丢失，接收端必须识别重复，还需要按协议处理乱序和序号回绕。"],"net-rto":["测到一次 100ms 后，下一次样本是 140ms。估算器不会立刻把常规时延完全替换为 140，而是将旧估计和新样本加权，同时记录偏离幅度。波动较大的网络需要给超时计时器留下更多余量。","超时值设得越小，恢复一定越快吗？","过小会把仍在路上的正常 ACK 误判为丢失，增加无谓重传并占用带宽。"],"net-congestion":["把窗口统一换算为数据段。发送端拥塞窗口为 4，接收方只允许 3，已经有 2 段在途。可再发送 min(4,3)−2=1 段。两个窗口分别反映网络承载能力和接收方缓冲能力。","若接收窗口增长到 10，其他值不变，可再发送多少？","此时受拥塞窗口 4 限制，减去在途的 2，还可发送 2 段。"],"net-tcp-lifecycle":["一端发送 FIN，表示自己已经没有更多数据要发送。对方确认这个 FIN 后，仍可能继续发送尚未传完的数据。直到另一个方向也发出 FIN 并得到确认，两个发送方向才都结束。","收到对方 FIN 后，还可以向对方发送剩余响应吗？","TCP 的两个方向可以分别关闭。只要本端发送方向仍开放，就可以继续发送。"],"net-framing":["约定每条消息第一个字节是负载长度。第一次读到长度 2 和字母 h，数据还差一个字节，应暂存。下一次读到 i，就能交付 hi。若后面还有下一帧开头，应留给下一轮解析。","为什么读取到半条消息时不能直接丢弃？","TCP 只保证有序字节流，系统调用返回的分段可能恰好切在消息中间，需要保留缓冲直到收齐。"],"net-quic":["流 0 先收到偏移 1 的 B，偏移 0 还缺着，因此它要等待。流 4 同时收到自己偏移 0 的 X，就可以独立交付。稍后流 0 收到 A，便可以连续交付 AB。每条流要单独记录期待的位置。","多流是否意味着同一流内也能任意乱序交付？","可靠字节流仍按该流内部偏移交付。独立性体现在一个流的缺口不要求其他流也停下。"],"http":["读请求行 GET /notes HTTP/1.1 时，第一段是希望执行的方法，第二段是请求目标，第三段是版本。服务端处理后返回状态，例如 200 表示请求成功。请求行之后还有首部和可能存在的消息体。","能否只看请求行就知道最终状态码？","不能。同一路径可能存在、需要授权或发生错误，状态由服务器处理结果决定。"],"net-smtp":["读到“250-第一行”时，三位数给出应答码，而紧随的短横线表示后面还有同次应答。继续读到“250 最后一行”才结束。只看第一行的 250 就开始下一步，会把上一条回复的一部分错当成新回复。","多行和多次应答怎样区分？","看应答码后的分隔符并跟踪当前回复状态。同一次多行应答由最后的空格分隔行结束。"],"net-dns":["某记录在时刻 100 缓存，TTL 为 30 秒。129 时已经过去 29 秒，仍然有效。130 时已经达到期限，应重新获取。缓存键还需区分记录类型，同一域名的 A 和 AAAA 记录回答不同问题。","TTL 到期意味着域名已被删除吗？","只表示本地缓存不能继续把旧答案当成新鲜结果。权威服务器可能返回相同记录，也可能返回新值。"],"net-http-cache":["缓存中的页面标签是 v1，允许新鲜 30 秒。过了 40 秒，客户端带上这个标签询问服务端。若内容仍为 v1，可返回 304 并复用旧正文。若已是 v2，需要发送新正文。","304 没有新的页面正文，浏览器为什么还能显示页面？","条件请求基于已有缓存实体。验证成功后，客户端可复用该实体并更新相关元数据。"],"net-cookie":["浏览器保存一条限定 example.test 且带 Secure 属性的 Cookie。请求该主机的 HTTPS 页面时可满足这两项条件；改为 HTTP 或换到其他主机就无法通过这个简化检查。真实浏览器还要处理路径、过期与跨站上下文。","HttpOnly 会禁止浏览器随请求发送 Cookie 吗？","它限制脚本读取。浏览器仍可在符合发送条件时携带 Cookie。"],"net-proxy-cdn":["反向代理前面只有一个访问地址，后面有 A、B、C 三台服务器。健康检查发现 B 不可用，轮询列表就变成 A、C，四个请求分配为 A、C、A、C。CDN 还能在边缘保留可缓存的响应，减少回源。","健康节点数量为零时为什么不能继续取模轮询？","除数为零没有合法结果，也没有可用目标。此时应明确返回不可用状态。"],"net-tls":["访问某个域名时，验证器要综合信任链、有效时间与服务端身份。例如签发者可信、日期有效，但证书属于另一个主机，此连接仍不能通过身份校验。教学程序用已知条件练习判断，实际连接使用标准 TLS 库。","为什么可信签发者这一项不能替代主机名验证？","可信签发意味着证书涵盖的身份可以被信任，仍需核对那个身份是否与本次访问的主机相符。"],"net-qos":["令牌桶容量 3，初始有 3 枚令牌，每秒补 1 枚。时刻 0 连来四个请求，前三个各用掉一枚，第四个被拒绝。时刻 1 新增一枚令牌，下一请求可以通过。长期空闲也只能补到容量上限。","桶容量与补充速率分别影响什么？","容量限制瞬时能积攒多少突发额度，速率影响长期平均可以补回多少额度。"],"compiler-grammar-rewrite":["表达式规则 E→E+T 或 T 若直接写成递归函数，处理 E 的第一步又调用 E，输入位置完全没前进。改成先读一个 T，再循环读取后续的 +T，既能处理 T+T+T，也让每一轮都消耗输入。","改写后如何让减法仍按左结合计算？","每读完一个右操作数就把已有左边结果与它组合，例如先构造 (a−b)，再与 c 组成 (a−b)−c。"],"compiler-first-follow":["设 S→AB，A 可生成 a 或空，B 生成 b。S 开头可能是 a，也可能是跳过 A 后的 b，所以 FIRST(S) 包含 a 和 b。A 后面可出现 b，因此 b 在 FOLLOW(A) 中。","看到 b 时为什么可以选择 A 的空产生式？","b 能合法跟在 A 之后，当前 A 可为空，所以可以不消耗 b，让后面的 B 去处理它。"],"compiler-ll1":["预测分析器看两个线索：栈顶待展开的非终结符，以及输入中下一个符号。若栈顶为 A、下一符号为 a，就查表格[A,a]取得一条产生式。将右部倒序压栈，可以让最左边的符号先被处理。","一个表格单元出现两条不同规则意味着什么？","当前一个前瞻符号不足以唯一预测，不能把任意选其中一条当成可靠的 LL(1) 分析。"],"compiler-lr":["移进把当前输入符号读进分析栈，归约则把栈顶一串已经识别的右部替换成其左部。例如数字 token 可先移进，再按 T→数字 归约为 T。项目中的圆点标记产生式右部已经读到哪里。","归约本身是否又消耗一个输入符号？","它整理栈里的已有结构，前瞻符号仍留待下一步。消耗输入的是移进动作。"],"compiler-lr-families":["遇到能归约的项目时，分析器还要判断当前前瞻是否允许归约。SLR 使用左部的 FOLLOW 集，规范 LR(1) 把前瞻与具体项目绑定，LALR 再合并核心相同的状态。集合越粗，原来分开的决定越可能相撞。","为什么合并两个状态之后可能出现归约冲突？","两个状态各自可区分的前瞻信息被合在一起，可能在同一个终结符上同时允许不同归约。"],"compiler-error-recovery":["读算式 1+; 时，加号后本应有操作数，却遇到分号。记录这一处错误，然后跳到分号这样的语句边界，才能继续分析下一条完整语句。恢复时应确保输入指针确实前进，否则会反复报告同一错误。","跳过错误语句后能否断言整份程序合法？","恢复只让分析继续，以便报告后续问题。已记录的错误仍应保留。"],"compiler-attributes":["在树节点 E→E1+T 上，若左子树给出值 2，右子树给出值 3，父节点就能计算 5。这种从子向父传递的数值叫综合属性。类型环境等信息也可以从父节点传给子节点，称为继承属性。","为什么必须先计算孩子的值再给父节点求和？","父节点的公式依赖两个孩子的结果。属性的依赖方向决定可行的计算顺序。"],"compiler-symbols":["外层声明 x=1，内层又声明 x=2。进入内层时压入一张新表，查询 x 从最内层向外找，因此命中 2。离开内层时弹出整张表，后续查询恢复为 1。这个规则称为名字遮蔽。","内层只读取外层 x，也必须在内层声明一份吗？","按这种词法作用域规则不需要。当前层找不到时继续向外查，能见到最近的有效声明。"],"compiler-types":["检查 2+3 时，语义分析先查出左右操作数都是整数，再按语言规则给加法表达式标记整数类型。如果右边改为布尔值，就要查该语言是否允许这种组合。类型检查依据目标语言的规则，而不是运行示例所用宿主语言的隐式转换。","变量已经声明就一定能用于任何运算吗？","声明解决名字是否存在，类型规则还要判断它能否出现在该运算的位置。"],"compiler-tac":["把 a+b*c 拆成 t1=b*c 和 t2=a+t1。临时变量 t1 保存中间结果，第二条指令明确依赖它。把每条指令限制为简单操作，后续就更容易分析哪些值被读取、哪些值被重新定义。","如果先算 a+b，结果一般相同吗？","一般不同，那会变成 (a+b)*c。降低到中间表示时必须保留语法树规定的结合关系。"],"compiler-basic-blocks":["连续的两条算术指令通常可以在同一基本块中。遇到条件跳转后，下一步可能去两个不同位置，应结束本块，把可能的后继分别连边。跳转目标必须成为新块入口，防止从块中间进入。","控制流图上的边表示变量之间的数据依赖吗？","表示执行顺序可能从哪个块转到哪个块。变量的定义与使用还要另外分析。"],"compiler-ssa":["if 的一支定义 x1=3，另一支定义 x2=7。两条路线合流后，后续代码需要一个名字 x3。写 x3=φ(x1,x2) 表示根据实际来自哪个前驱选择对应值。每个名字只定义一次，便于追踪来源。","φ 会把两个数相加或平均吗？","它选择与进入该块的路径对应的值。同一次执行只会沿一个前驱到达。"],"constant-fold":["树上 2+3 的两个孩子都是已知常量，可以在编译时把整棵小树换成常量 5。若表达式为 x+(2+3)，只折叠右边，再保留 x+5。遇到溢出、除零或浮点舍入时必须遵守被编译语言的规则。","为什么不能顺便把 x 当成 0 再继续折叠？","缺少 x 的确定值，任意猜测会改变运行结果。只能替换在该处已经证明的计算。"],"compiler-dataflow":["从指令末尾往前看，若接下来还要 print(x)，则在打印前必须保留 x。若前一条指令是 x=y+1，它产生新 x，旧 x 的需求在此消失，但输入 y 在这条指令之前必须存在。这就是活跃变量的逆向传播。","分支的两个后继只要有一路会使用 x，前面需要保留它吗？","通常需要。活跃分析合并所有可能后继的需求，防止任一路径读取不到原值。"],"compiler-cse":["两条指令分别计算 a+b，若中间 a、b 都未改变，且加法在此语义下可安全复用，第二条可以使用第一次的结果。若中间出现 a=9，则文本相同的 a+b 已经代表另一组输入。","没有人使用函数调用的返回值，是否总能删除调用？","不能。函数可能写文件、改变状态或抛异常。死代码消除还需要考虑可观察的副作用。"],"compiler-loop-opt":["循环里每次都计算 width*height，而两者在循环中都不变。若把计算提前也不会引入额外异常或副作用，可以预先求一次 area，循环中重复读取它。判断能否外提既看值会不会变，也看执行时机是否安全。","循环可能执行零次时，提前做除法有何风险？","原程序可能完全不会执行这次除法。提前执行可能引入原本不会发生的除零异常。"],"compiler-correctness":["优化的目标是对所有合法输入保持可观察行为。比较 3*x 与 x+x+x，可以先在多个小整数上逐个比对结果，快速发现反例。有限样例全部通过后，还需要结合整数范围与语言语义判断更大的输入。","为什么测试通过不能当作数学证明？","测试只覆盖被选中的输入与运行环境，溢出边界等未测试情形仍可能改变结果。"],"compiler-registers":["两个临时值若将来都还要用，就不能同时占用同一个寄存器。在干涉图里给它们连边，再用不同颜色代表不同寄存器。如果颜色不够，选择一个值暂存到栈，使用前再装回。","两个值的生命周期没有重叠，可以共用寄存器吗？","可以。上一个值最后一次使用之后，其寄存器可以交给下一项，这正是活跃性分析的用途。"],"compiler-instruction-selection":["同一段中间表示可以由不同目标指令覆盖。例如把一个值乘以 2，可以选择通用乘法，某些目标也能用加法或移位实现。选择要同时看目标指令支持、操作数限制、语义和估计成本。","最少指令条数是否总意味着实际最快？","不一定。单条指令的延迟、吞吐量以及额外寄存器搬移都会影响实际成本。"],"compiler-calling":["调用者需要把实参放到双方约定的位置，被调用者再从这些位置取值。局部变量和保存的返回信息可放进栈帧。函数返回时恢复规定的寄存器并按约定交回结果，调用方才能继续执行。","为什么不能让每个函数自行决定返回值放哪个寄存器？","独立编译的调用方需要预先知道到哪里取结果，共同的调用约定保证它们能够配合。"],"compiler-gc":["从仍可直接取得的根对象 A 开始标记。若 A 指向 B，就继续标记 B。即使 C 和 D 互相引用，只要根无法到达它们，标记结束时它们仍是未标记，可由清扫阶段回收。","只有引用计数时，互相引用的 C 和 D 为什么可能留着？","两者的计数都因对方的引用而非零。可达性追踪从根出发，能区分这种孤立环。"],"compiler-linking":["在一个文件中调用另一个文件定义的函数，汇编时往往还不知道最终地址。目标文件留下符号名和需要修补的位置，链接器布置各段后查符号表，把引用按重定位规则改成正确地址或偏移。","为什么不能把每个目标文件都假设从地址 0 永久运行？","链接时各段要组合，位置会变化。可重定位的引用使不同文件在新的布局下仍能正确访问目标。"],"compiler-vm-jit":["栈式字节码先执行 PUSH 2、PUSH 3，栈变为 [2,3]。ADD 弹出两个操作数，压入和 5。解释器逐条读取并执行这些指令。JIT 可以把重复运行的片段编译为机器码，再直接执行已编译版本。","把栈式字节码解释一遍是否就实现了 JIT？","解释已经能运行字节码，JIT 还需要在运行过程中生成并执行目标机器代码。"]};</script><script>const RUN_TRACES={"vector": [[2, "seen, result = set(), []", "seen = set(), result = []"], [3, "for x in a:", "x = 3"], [5, "seen.add(x)", "seen = {3}"], [6, "result.append(x)", "result = [3]"], [3, "for x in a:", "x = 1"], [5, "seen.add(x)", "seen = {1, 3}"], [6, "result.append(x)", "result = [3, 1]"], [3, "for x in a:", "x = 3"], [3, "for x in a:", "x = 2"], [5, "seen.add(x)", "seen = {1, 2, 3}"], [6, "result.append(x)", "result = [3, 1, 2]"], [3, "for x in a:", "x = 1"]], "stl-array": [[1, "a = [2,4,6, function syllabus(){return `<div class="page-heading"><div class="eyebrow">THE BIG PICTURE, ONE TOPIC AT A TIME</div><h1>先看全貌，再深入每一个知识点<span class="heading-dot">.</span></h1><p>参考标准文档、官方手册和大学课程整理。展开领域，即可查看所有已收录单元。</p></div><div class="syllabus-stats"><span><strong>${CATEGORIES.length}</strong> 大领域</span><span><strong>${CATEGORIES.reduce((n,c)=>n+groupsFor(c.id).length,0)}</strong> 组主题</span><span><strong>${LESSONS.length}</strong> 个学习单元</span><span><strong>${allQuestions.length}</strong> 道原创练习</span></div><div class="curriculum-intro"><strong>覆盖主要知识体系，也说明学习深度</strong><p>每个单元都包含讲解、双语言示例与练习。高级结构和协议可能通过关键操作或简化模型讲解，具体边界在课内说明；“全景目录”不意味着穷尽所有 API 重载、研究分支或生产系统实现。</p></div><div class="catalog-tools"><label class="catalog-search">${icon('search',18)}<input id="syllabus-search" placeholder="搜索整个课程体系，例如 AVL、MVCC、SSA" aria-label="搜索全部课程"></label><button class="text-button" data-action="expand-domains">展开全部</button><button class="text-button" data-action="collapse-domains">收起全部</button></div><div id="syllabus-contents">${syllabusContents()}</div><p class="syllabus-footnote">大纲核对日期：2026-11-17 · C++ 示例以 C++17 为主，新特性单独标注 · MySQL 以 8.4 为语义基线。</p>`;}

function highlight(code){const re=/(\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:const|int|long|bool|void|return|for|while|if|else|class|struct|def|import|from|in|not|and|or|True|False|None|auto|std|try|catch|throw|raise|public|private|using|namespace|SELECT|FROM|WHERE|ORDER|BY|LEFT|JOIN|ON|GROUP|HAVING|UPDATE|SET|COMMIT|TRANSACTION|START)\b|\b\d+\b)/g;let out='',last=0;for(const m of code.matchAll(re)){out+=esc(code.slice(last,m.index));let cls=m[0].startsWith('//')||m[0].startsWith('#')?'comment':/^["']/.test(m[0])?'string':/^\d/.test(m[0])?'number':'keyword';out+=`<span class="syntax-${cls}">${esc(m[0])}</span>`;last=m.index+m[0].length;}return out+esc(code.slice(last));}
function codeBlock(cpp,python,sql='',id='',standard='C++17'){const key='code'+(++codeCounter);let lang=state.language==='python'?'python':'cpp';codeStore[key]={cpp,python,sql};return `<div class="code-block" data-code="${key}" ${id?`id="${id}"`:''}><div class="code-toolbar"><div class="code-tabs" role="tablist" aria-label="代码语言">${[['cpp',standard],['python','Python 3'],...(sql?[['sql','SQL']]:[])].map(([v,t])=>`<button role="tab" aria-selected="${lang===v}" data-action="language" data-lang="${v}" class="${lang===v?'selected':''}">${t}</button>`).join('')}</div><button class="copy-button" data-action="copy" aria-label="复制代码">${icon('copy',14)} 复制</button></div><pre tabindex="0"><code>${highlight(codeStore[key][lang])}</code></pre></div>`;}
function questionCard(q,index,mode='practice'){
 const exam=mode==='exam',answer=exam?state.exam.answers[q.id]:state.practice[q.id],submitted=exam&&state.exam.submitted;
 const locked=exam&&!submitted,canReveal=!exam||submitted;
 const checked=exam?submitted:state.practice[q.id+'_checked'];
 const draftKey=(exam?'exam:':'practice:')+q.id;
 return `<article class="question-card" data-question="${q.id}"><div class="question-meta"><span>练习 ${String(index+1).padStart(2,'0')}</span><span class="difficulty d${q.difficulty}">${['','基础理解','进阶推演','编程实践'][q.difficulty]}</span>${exam?`<span>${esc(q.title)}</span>`:''}</div><h3>${esc(q.prompt)}</h3>${q.type==='choice'?`<fieldset class="options" ${submitted?'disabled':''}><legend class="sr-only">选择你的答案</legend>${q.options.map((o,i)=>`<label class="option ${answer===i?'chosen':''} ${checked&&i===q.answer?'correct':''} ${checked&&answer===i&&i!==q.answer?'incorrect':''}"><input type="radio" name="${mode}-${q.id}" value="${i}" data-mode="${mode}" data-question="${q.id}" ${answer===i?'checked':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>${!exam?`<button class="button small outline" data-action="check-answer" data-question="${q.id}">检查答案</button>`:''}${checked?`<p class="answer-status ${answer===q.answer?'good':'bad'}">${answer===q.answer?'✓ 回答正确':answer===undefined?'未作答':'再想一想'} · 正确答案 ${String.fromCharCode(65+q.answer)}</p>`:''}`:`<label class="draft-label">你的解题草稿 <span>在本地编辑器运行代码后，对照参考解答</span><textarea spellcheck="false" data-draft="${draftKey}" placeholder="先写思路，再写代码…">${esc(state.drafts[draftKey]||'')}</textarea></label>`}${canReveal?`<details class="answer-details"><summary><span>${icon('book',16)} 查看参考答案与解析</span>${icon('chevron',16)}</summary><div class="answer-body">${q.type==='choice'?`<strong>正确答案：${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><p>${q.explanation}</p>`:`<p>${q.explanation}</p>${codeBlock(q.cpp,q.python,q.sql,'',q.cppStandard)}<div class="self-rating"><span>对照后，我的完成情况：</span>${[['done','已独立完成'],['review','还需复习']].map(([v,t])=>`<button class="button small ${state.practice[q.id+'_rating']===v?'primary':'outline'}" data-action="rate" data-question="${q.id}" data-value="${v}">${t}</button>`).join('')}</div>`}</div></details>`:`<p class="locked-note">提交测评后可展开参考答案${q.type==='code'?'，编程题由你对照自评':''}。</p>`}</article>`;
}
function lessonPage(l){const c=byCat(l.cat),ls=units(l.cat),idx=ls.indexOf(l);return `<div class="small-breadcrumb">${link('home','学习地图')} ${icon('chevron',14)} ${link('category/'+l.cat,c.name)} ${icon('chevron',14)} <span>${l.title}</span></div><div class="reading-layout"><article class="lesson-article"><div class="eyebrow">${c.name} / ${l.group} / ${String(idx+1).padStart(2,'0')}</div><div class="lesson-title-line"><h1>${l.title}</h1><button class="icon-button favorite-button ${state.favorites.includes(l.id)?'saved':''}" data-action="favorite" data-id="${l.id}" aria-label="${state.favorites.includes(l.id)?'取消收藏':'收藏本节'}" aria-pressed="${state.favorites.includes(l.id)}">${icon('bookmark',22)}</button></div><p class="lesson-subtitle">${l.subtitle}</p><div class="lesson-info"><span>${icon('clock',15)} 约 ${l.minutes} 分钟</span><span>${icon('code',16)} 双语言实现</span><span>${icon('test',15)} 3 道分级练习</span></div><div class="learning-goal"><span>${icon('spark',20)}</span><div><strong>这一节，你会学到</strong><p>${l.concepts.map(x=>esc(x[0])).join('；')}。</p></div></div>${beginnerGuide(l)}<section id="concepts"><div class="article-section-label">01 / UNDERSTAND</div><h2>先把概念想清楚</h2>${l.concepts.map(([h,p],i)=>`<div class="concept"><span class="concept-index">${i+1}</span><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></div>`).join('')}<aside class="pitfall"><strong>容易忽略的细节</strong><p>${esc(l.pitfall)}</p></aside></section><section id="implementation"><div class="article-section-label">02 / IMPLEMENT</div><h2>看懂代码，再亲手写一遍</h2><p class="section-intro">${l.codeKind==='simulation'?'本节用简化模型演示关键机制，具体假设与实现范围见讲解；完整系统还需要处理更多状态与边界。':l.cat==='sql'?'SQL 展示数据库操作；两个语言版本展示如何连接 MySQL 并执行。请先准备本节专用练习数据。':'两个版本实现同一思路。Python 使用对应语言的数据结构；代码版本与简化条件以本节说明为准。'}</p>${l.cat==='sql'&&l.codeKind!=='simulation'?`<details class="setup-details"><summary>运行前：准备 MySQL 练习数据库与连接器</summary><div><p>建议使用 MySQL 8.4，先执行下面的初始化 SQL。Python 安装 mysql-connector-python；C++ 安装 MySQL Connector/C++ 的 JDBC API 头文件及 mysqlcppconn 链接库。两种语言均从 MYSQL_PASSWORD 环境变量读取密码，请按本机配置调整连接地址和用户名。</p><pre><code>${esc(l.sqlSetup||SQL_SETUP)}</code></pre><p>INSERT IGNORE 不会重置已有数据；事务例子每运行一次都会修改余额。不要在业务数据库练习。这里没有连接在线数据库，也不会在网页内执行 SQL。</p></div></details>`:''}${codeBlock(l.cpp,l.python,l.sql,'',l.cppStandard)}<div class="output-box"><span>预期输出</span><pre>${esc(l.output)}</pre></div>${tutorialTrace(l)}<div class="complexity"><strong>复杂度 / 执行成本</strong><p>${esc(l.complexity)}</p></div></section><section id="exercises"><div class="article-section-label">03 / PRACTICE</div><h2>把理解变成自己的答案 <span class="count-pill">03</span></h2><p class="section-intro">由易到难，先尝试再展开答案。选择题可检查结果，编程题对照双语言实现自评。</p>${allQuestions.filter(q=>q.lesson===l.id).map((q,i)=>questionCard(q,i)).join('')}</section><section class="references"><h3>继续阅读</h3>${(l.sources||REFERENCES[l.cat]||[]).map(([t,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join('')}<p>本节讲解与练习为本站原创；以上链接用于进一步查阅语言或协议细节。</p></section><div class="lesson-finish"><div><strong>${state.done.includes(l.id)?'这一节，已经留下了你的足迹。':'完成一小步，知识向前一步。'}</strong><p>完成标记可随时取消，按自己的节奏学习。</p></div><button class="button ${state.done.includes(l.id)?'outline':'primary'}" data-action="complete" data-id="${l.id}">${icon('check',17)} ${state.done.includes(l.id)?'已完成 · 点击取消':'标记本节已完成'}</button></div><div class="prev-next">${idx>0?link('lesson/'+ls[idx-1].id,'← '+ls[idx-1].title):link('category/'+c.id,'← 返回课程目录')}${idx<ls.length-1?link('lesson/'+ls[idx+1].id,ls[idx+1].title+' →'):link('assessment','进入专项测评 →')}</div></article><aside class="reading-aside"><div class="panel sticky-panel"><span class="eyebrow">本领域学习路径</span><h3>${c.name}</h3><nav class="reading-unit-list">${ls.map((x,i)=>link('lesson/'+x.id,`<span class="tiny-status ${state.done.includes(x.id)?'done':''}">${state.done.includes(x.id)?'✓':i+1}</span>${x.title}`,`reading-nav ${x.id===l.id?'active':''}`)).join('')}</nav><hr><span class="side-label">本节导航</span><a class="toc-link" href="#beginner" data-anchor="beginner">入门推演</a>${BEGINNER_GUIDES[l.id]?.apis?.length?'<a class="toc-link" href="#api-reference" data-anchor="api-reference">常用函数速查</a>':''}<a class="toc-link" href="#concepts" data-anchor="concepts">01　理解概念</a><a class="toc-link" href="#implementation" data-anchor="implementation">02　双语言实现</a><a class="toc-link" href="#exercises" data-anchor="exercises">03　分级练习</a><div class="aside-progress"><span>领域进度</span><strong>${percent(c.id)}%</strong></div>${progress(percent(c.id))}</div></aside></div>`;}
function availableQuestions(){return allQuestions.filter(q=>assessmentUnits.has(q.lesson)&&(assessmentDifficulty==='all'||q.difficulty===Number(assessmentDifficulty)));}
function assessment(){const count=availableQuestions().length;return `<div class="page-heading"><div class="eyebrow">PRACTICE WITH PURPOSE</div><h1>让每一次练习，都有方向<span class="heading-dot">.</span></h1><p>选择知识范围，定制一份属于你的测评。</p></div>${state.exam?`<div class="resume-exam"><span>${icon('test',22)} ${state.exam.submitted?'上一次测评结果已保存':'你有一份尚未提交的测评'} · ${state.exam.questions.length} 道题</span>${link('exam',state.exam.submitted?'查看结果 →':'继续作答 →','button small outline')}</div>`:''}<div class="assessment-layout"><div><section class="panel selection-panel"><div class="section-head"><h2><span class="step-badge">1</span> 选择知识范围</h2><button class="text-button" data-action="select-all">${assessmentUnits.size===LESSONS.length?'取消全选':'选择全部'}</button></div><p class="muted">可按领域选择，也可展开后精确到某一个知识点。</p><div class="scope-list">${CATEGORIES.map(c=>`<details class="scope-group" ${assessmentCats.size===1&&assessmentCats.has(c.id)?'open':''}><summary><span>${catBadge(c)} <strong>${c.name}</strong><small>${units(c.id).filter(l=>assessmentUnits.has(l.id)).length} / ${units(c.id).length} 单元</small></span>${icon('chevron',16)}</summary><div class="scope-body"><label class="scope-all"><input type="checkbox" data-select-cat="${c.id}" ${units(c.id).every(l=>assessmentUnits.has(l.id))?'checked':''}> 选择本领域全部单元</label>${groupsFor(c.id).map(g=>`<div class="scope-chapter-label">${esc(g)}</div>${units(c.id).filter(l=>l.group===g).map(l=>`<label><input type="checkbox" data-select-unit="${l.id}" ${assessmentUnits.has(l.id)?'checked':''}> ${esc(l.title)}</label>`).join('')}`).join('')}</div></details>`).join('')}</div></section><section class="panel settings-panel"><h2><span class="step-badge">2</span> 设置练习方式</h2><div class="settings-grid"><label>题目数量<select id="question-count">${[3,5,10,20,30,50].map(n=>`<option value="${n}" ${assessmentCount===n?'selected':''}>${n} 道题</option>`).join('')}</select></label><label>难度范围<select id="question-difficulty">${[['all','混合难度 · 由易到难'],['1','基础理解'],['2','进阶推演'],['3','编程实践']].map(([v,t])=>`<option value="${v}" ${assessmentDifficulty===v?'selected':''}>${t}</option>`).join('')}</select></label></div></section></div><aside><section class="exam-summary panel"><div class="summary-symbol">${icon('test',34)}</div><span class="eyebrow">YOUR PRACTICE PLAN</span><h2>准备好，检验你的理解</h2><dl><div><dt>已选知识点</dt><dd id="selected-count">${assessmentUnits.size}</dd></div><div><dt>可用题目</dt><dd id="available-count">${count}</dd></div><div><dt>本次题量</dt><dd id="actual-count">${Math.min(count,assessmentCount)}</dd></div></dl><button id="generate-exam" class="button primary full" data-action="generate" ${count?'':'disabled'}>生成专项测评 ${icon('arrow',17)}</button><p>题目从本站原创题库中随机抽取，不重复。选择题自动评分，编程题对照答案自评；生成新测评会替换当前试卷。</p></section><p class="quiet-note">测评不是终点。找到还不熟悉的地方，就是下一次进步的起点。</p></aside></div>`;}
function exam(){if(!state.exam)return `<div class="empty-state"><h1>先选择你的测评范围</h1><p>一份有针对性的练习，从选择知识点开始。</p>${link('assessment','定制测评','button primary')}</div>`;const e=state.exam,qs=e.questions.map(getQuestion),choice=qs.filter(q=>q.type==='choice'),correct=choice.filter(q=>e.answers[q.id]===q.answer).length,answered=choice.filter(q=>e.answers[q.id]!==undefined).length;return `<div class="small-breadcrumb">${link('assessment','专项测评')} ${icon('chevron',14)} ${e.submitted?'测评结果':'正在作答'}</div><div class="page-heading"><div class="eyebrow">${e.submitted?'REFLECT & IMPROVE':'FOCUS ON ONE QUESTION AT A TIME'}</div><h1>${e.submitted?'练习完成，看看你的收获。':'专注思考，慢慢靠近答案。'}</h1><p>${qs.length} 道题 · ${choice.length} 道选择题 · ${qs.length-choice.length} 道编程题 <span class="muted"> / 草稿自动保存在本机</span></p></div>${e.submitted?`<section class="result-banner"><div class="result-score">${choice.length?Math.round(correct/choice.length*100):'—'}<small>${choice.length?'分':'自评'}</small></div><div><h2>${choice.length?'选择题答对 '+correct+' / '+choice.length+' 道':'本次为纯编程练习'}</h2><p>编程题不计入自动分数，请展开参考答案后自评。未作答的选择题按错误计分。</p><div class="result-links">${[...new Set(qs.filter(q=>q.type==='choice'&&e.answers[q.id]!==q.answer).map(q=>q.lesson))].map(id=>link('lesson/'+id,'复习 '+byId(id).title)).join('')}</div></div></section>`:`<div class="exam-progress"><span>选择题已作答 <strong id="answered-count">${answered}</strong> / ${choice.length}</span><span>${icon('clock',16)} 自定节奏，不限时</span></div>`}<div class="exam-paper">${qs.map((q,i)=>questionCard(q,i,'exam')).join('')}</div><div class="exam-bottom">${link('assessment','← 返回测评设置','button outline')}${!e.submitted?`<button class="button primary" data-action="submit-exam">提交测评 ${icon('arrow',17)}</button>`:link('assessment','再练一组 →','button primary')}</div>`;}
function favorites(){const ls=state.favorites.map(byId);return `<div class="page-heading"><div class="eyebrow">YOUR PERSONAL COLLECTION</div><h1>值得再读一遍的知识<span class="heading-dot">.</span></h1><p>在课程页点击书签，把想复习的内容留在这里。</p></div>${ls.length?`<div class="saved-grid">${ls.map(l=>`<div class="saved-card">${catBadge(byCat(l.cat))}<span class="eyebrow">${byCat(l.cat).name}</span><h2>${l.title}</h2><p>${l.subtitle}</p><div>${link('lesson/'+l.id,'继续学习 →','text-button')}<button class="icon-button saved" data-action="favorite" data-id="${l.id}" aria-label="取消收藏 ${l.title}">${icon('bookmark')}</button></div></div>`).join('')}</div>`:`<div class="empty-state">${icon('bookmark',40)}<h2>把好奇的知识点收藏起来</h2><p>你的第一份收藏，会从一次探索开始。</p>${link('home','探索学习地图','button primary')}</div>`}`;}
function progressPage(){return `<div class="page-heading"><div class="eyebrow">SMALL STEPS, REAL PROGRESS</div><h1>每一步，都算数<span class="heading-dot">.</span></h1><p>不必急着走完所有路，保持理解与实践的节奏。</p></div><div class="stat-grid"><div class="stat-card"><span>已完成单元</span><strong>${state.done.length}<small> / ${LESSONS.length}</small></strong></div><div class="stat-card"><span>整体学习进度</span><strong>${percent()}<small>%</small></strong></div><div class="stat-card"><span>已完成测评</span><strong>${state.history.length}<small> 次</small></strong></div><div class="stat-card"><span>收藏知识点</span><strong>${state.favorites.length}<small> 个</small></strong></div></div><div class="progress-layout"><section class="panel"><h2>领域进度</h2>${CATEGORIES.map(c=>`<a class="domain-progress" href="#/category/${c.id}">${catBadge(c)}<div><div><strong>${c.name}</strong><span>${units(c.id).filter(l=>state.done.includes(l.id)).length} / ${units(c.id).length}</span></div>${progress(percent(c.id))}</div>${icon('arrow',18)}</a>`).join('')}</section><section class="panel"><h2>测评足迹</h2>${state.history.length?state.history.slice().reverse().slice(0,10).map(h=>`<div class="history-row"><span class="history-icon">${icon('test',20)}</span><div><strong>${h.total} 道专项练习</strong><small>${new Date(h.date).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} · 选择题 ${h.correct}/${h.choices}</small></div><b>${h.choices?Math.round(h.correct/h.choices*100)+'分':'自评'}</b></div>`).join(''):`<div class="empty-state compact">${icon('chart',32)}<p>第一次练习，就会留下足迹。</p>${link('assessment','开始专项测评 →','text-button')}</div>`}<p class="quiet-note">完成标记由你自行确认，不代表已经通过考试。进度、收藏与草稿仅保存在当前浏览器，不跨设备同步。</p><button class="button small outline" data-action="export">导出学习记录</button><label class="button small outline import-label">导入记录<input type="file" accept="application/json,.json" id="import-progress" hidden></label></section></div>`;}
function render(keepScroll=false){const y=scrollY;codeStore={};codeCounter=0;const parts=(location.hash||'#/home').replace(/^#\/?/,'').split('/');let [page,id]=parts;let body,nav=page,breadcrumb='学习地图';
 if(page==='category'&&byCat(id)){body=category(byCat(id));nav=id;breadcrumb=byCat(id).name;}
 else if(page==='lesson'&&byId(id)){const l=byId(id);state.last=id;save();body=lessonPage(l);nav=l.cat;breadcrumb=byCat(l.cat).name+' / '+l.title;}
 else if(page==='syllabus'){body=syllabus();breadcrumb='课程总纲';}
 else if(page==='assessment'){body=assessment();breadcrumb='专项测评';}
 else if(page==='exam'){body=exam();nav='assessment';breadcrumb='专项测评 / 练习';}
 else if(page==='favorites'){body=favorites();breadcrumb='我的收藏';}
 else if(page==='progress'){body=progressPage();breadcrumb='学习进度';}
 else if(page==='home'||!page){body=home();nav='home';}
 else{body=`<div class="empty-state"><h1>这个知识点还没有收录</h1>${link('home','返回学习地图','button primary')}</div>`;}
 currentRoute=page;shell(body,nav,breadcrumb);document.title=breadcrumb+' · 知序';if(keepScroll)scrollTo(0,y);else scrollTo(0,0);
}
function renderSearch(value){const box=$('#search-results');if(!value.trim()){box.hidden=true;return;}let term=value.toLowerCase().trim();const ls=LESSONS.filter(l=>[l.title,l.subtitle,l.group,l.id,byCat(l.cat).name,...(BEGINNER_GUIDES[l.id]?.apis||[]).map(a=>a.name)].join(' ').toLowerCase().includes(term)).sort((a,b)=>Number(b.title.toLowerCase().includes(term))-Number(a.title.toLowerCase().includes(term)));box.hidden=false;box.innerHTML=`<div class="search-heading">找到 ${ls.length} 个学习单元</div>${ls.map(l=>link('lesson/'+l.id,`<span>${icon(catIcon[l.cat],17)}</span><div><strong>${esc(l.title)}</strong><small>${byCat(l.cat).name} · ${l.group}</small></div>${icon('arrow',16)}`,'search-result')).join('')||'<p class="search-empty">换个关键词试试，例如「二分」或「TCP」。</p>'}`;}
function updateScope(){assessmentCats=new Set(LESSONS.filter(l=>assessmentUnits.has(l.id)).map(l=>l.cat));const count=availableQuestions().length;$('#selected-count').textContent=assessmentUnits.size;$('#available-count').textContent=count;$('#actual-count').textContent=Math.min(count,assessmentCount);$('#generate-exam').disabled=!count;document.querySelectorAll('[data-select-cat]').forEach(el=>{const ls=units(el.dataset.selectCat),n=ls.filter(l=>assessmentUnits.has(l.id)).length;el.checked=n===ls.length;el.indeterminate=n>0&&n<ls.length;el.closest('details').querySelector('summary small').textContent=`${n} / ${ls.length} 单元`;});document.querySelector('[data-action="select-all"]').textContent=assessmentUnits.size===LESSONS.length?'取消全选':'选择全部';}
function shuffled(items){let a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateExam(){let pool=availableQuestions(),n=Math.min(assessmentCount,pool.length),picked=[];if(!n)return; if(assessmentDifficulty==='all'&&n>=3){for(let d=1;d<=3;d++){const bucket=shuffled(pool.filter(q=>q.difficulty===d));if(bucket.length)picked.push(bucket[0]);}}picked.push(...shuffled(pool.filter(q=>!picked.some(x=>x.id===q.id))).slice(0,n-picked.length));picked.sort((a,b)=>a.difficulty-b.difficulty);state.exam={id:Date.now(),questions:picked.map(q=>q.id),answers:{},submitted:false};save();location.hash='#/exam';}
document.addEventListener('click',async e=>{const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor)?.scrollIntoView({behavior:'smooth'});return;}const el=e.target.closest('[data-action]');if(!el){if(!e.target.closest('.search-wrap'))$('#search-results')?.setAttribute('hidden','');return;}const a=el.dataset.action,id=el.dataset.id;
 if(a==='expand-chapters'||a==='collapse-chapters')document.querySelectorAll('.chapter-fold').forEach(d=>d.open=a==='expand-chapters');
 if(a==='expand-domains'||a==='collapse-domains')document.querySelectorAll('.syllabus-domain').forEach(d=>d.open=a==='expand-domains');
 if(a==='menu'){$('#sidebar').classList.toggle('mobile-open');}
 if(a==='filter'){filter=el.dataset.value;render(true);}
 if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render(true);toast(state.favorites.includes(id)?'已加入我的收藏':'已取消收藏');}
 if(a==='complete'){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render(true);toast(state.done.includes(id)?'已记录这一节的进步':'已取消完成标记');}
 if(a==='language'){const block=el.closest('.code-block'),data=codeStore[block.dataset.code],lang=el.dataset.lang;block.querySelectorAll('[role="tab"]').forEach(b=>{b.classList.toggle('selected',b===el);b.setAttribute('aria-selected',b===el);});block.querySelector('code').innerHTML=highlight(data[lang]);if(lang!=='sql'){state.language=lang;save();}}
 if(a==='copy'){const block=el.closest('.code-block'),lang=block.querySelector('[aria-selected="true"]').dataset.lang,text=codeStore[block.dataset.code][lang];try{await navigator.clipboard.writeText(text);toast('代码已复制');}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'代码已复制':'请手动选择代码复制');}}
 if(a==='check-answer'){const qid=el.dataset.question;if(state.practice[qid]===undefined){toast('请先选择一个答案');return;}state.practice[qid+'_checked']=true;save();const card=el.closest('.question-card');card.outerHTML=questionCard(getQuestion(qid),Number(qid.split(':')[1]));}
 if(a==='rate'){state.practice[el.dataset.question+'_rating']=el.dataset.value;save();el.closest('.self-rating').querySelectorAll('button').forEach(b=>{b.classList.toggle('primary',b===el);b.classList.toggle('outline',b!==el);});toast(el.dataset.value==='done'?'已记录：独立完成':'已记录：还需复习');}
 if(a==='category-exam'){assessmentCats=new Set([id]);assessmentUnits=new Set(units(id).map(l=>l.id));location.hash='#/assessment';}
 if(a==='select-all'){assessmentUnits=assessmentUnits.size===LESSONS.length?new Set():new Set(LESSONS.map(l=>l.id));document.querySelectorAll('[data-select-unit]').forEach(x=>x.checked=assessmentUnits.has(x.dataset.selectUnit));updateScope();}
 if(a==='generate')generateExam();
 if(a==='submit-exam'){const ex=state.exam;if(ex.submitted)return;ex.submitted=true;const qs=ex.questions.map(getQuestion),choice=qs.filter(q=>q.type==='choice');state.history.push({date:Date.now(),total:qs.length,choices:choice.length,correct:choice.filter(q=>ex.answers[q.id]===q.answer).length});save();render();toast('测评已提交，参考答案现在可以展开');}
 if(a==='export'){const blob=new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='知序-学习记录.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
});
document.addEventListener('input',e=>{if(e.target.id==='global-search')renderSearch(e.target.value);if(e.target.id==='catalog-search')$('#chapter-list').innerHTML=chapterList(byCat(e.target.dataset.cat),e.target.value);if(e.target.id==='syllabus-search')$('#syllabus-contents').innerHTML=syllabusContents(e.target.value);if(e.target.dataset.draft){state.drafts[e.target.dataset.draft]=e.target.value;save();}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.mode){const id=t.dataset.question,value=Number(t.value);if(t.dataset.mode==='exam'){state.exam.answers[id]=value;const qs=state.exam.questions.map(getQuestion).filter(q=>q.type==='choice');$('#answered-count').textContent=qs.filter(q=>state.exam.answers[q.id]!==undefined).length;}else{state.practice[id]=value;state.practice[id+'_checked']=false;}save();t.closest('.options').querySelectorAll('.option').forEach(x=>{x.classList.toggle('chosen',x.contains(t));x.classList.remove('correct','incorrect');});t.closest('.question-card').querySelector('.answer-status')?.remove();}
 if(t.dataset.selectCat){units(t.dataset.selectCat).forEach(l=>t.checked?assessmentUnits.add(l.id):assessmentUnits.delete(l.id));document.querySelectorAll('[data-select-unit]').forEach(x=>x.checked=assessmentUnits.has(x.dataset.selectUnit));updateScope();}
 if(t.dataset.selectUnit){t.checked?assessmentUnits.add(t.dataset.selectUnit):assessmentUnits.delete(t.dataset.selectUnit);updateScope();}
 if(t.id==='question-count'){assessmentCount=Number(t.value);updateScope();}
 if(t.id==='question-difficulty'){assessmentDifficulty=t.value;updateScope();}
 if(t.id==='import-progress'){try{const raw=JSON.parse(await t.files[0].text());if(raw.version!==1||!raw.state||!Array.isArray(raw.state.done)||!Array.isArray(raw.state.favorites))throw Error();const s=raw.state;state.done=[...new Set([...state.done,...s.done.filter(id=>byId(id))])];state.favorites=[...new Set([...state.favorites,...s.favorites.filter(id=>byId(id))])];for(const [k,v]of Object.entries(s.drafts||{})){if(typeof v==='string'&&v.length<=100000)state.drafts[k]=v;}if(Array.isArray(s.history))state.history=[...new Map([...state.history,...s.history.filter(h=>Number.isFinite(h.date)&&Number.isInteger(h.total)&&Number.isInteger(h.choices)&&Number.isInteger(h.correct)&&h.correct>=0&&h.correct<=h.choices&&h.choices<=h.total)].map(h=>[h.date,h])).values()];save();render(true);toast('已合并导入学习记录');}catch{toast('文件格式不正确，请选择本站导出的 JSON 记录');}}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#global-search')?.focus();}if(e.key==='Escape'){$('#search-results').hidden=true;$('#sidebar').classList.remove('mobile-open');}if(e.key==='Enter'&&e.target.id==='global-search')$('#search-results a')?.click();});
window.addEventListener('hashchange',()=>render());
render();
</script></body>
</html>
