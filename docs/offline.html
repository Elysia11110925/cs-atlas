 return CATEGORIES.map(c=>{const ls=units(c.id).filter(l=>catalogMatches(l,term));if(!ls.length)return '';const meta=CURRICULUM[c.id];return `<details class="syllabus-domain" ${term?'open':''}><summary><span>${catBadge(c)}<span><strong>${c.name}</strong><small>${meta.title}</small></span></span><span>${ls.length} 个单元 ${icon('chevron',18)}</span></summary><div class="syllabus-domain-body"><p>${meta.overview}</p><div class="syllabus-groups">${groupsFor(c.id).map(g=>{const group=ls.filter(l=>l.group===g);return group.length?`<section><h3>${esc(g)}</h3>${group.map(l=>link('lesson/'+l.id,`<span>${state.done.includes(l.id)?'✓':'·'}</span>${esc(l.title)} ${l.cppStandard!=='C++17'?`<small>${esc(l.cppStandard)}</small>`:''}`)).join('')}</section>`:''}).join('')}</div><div class="coverage-note"><strong>覆盖边界</strong><p>${meta.scope}</p></div><div class="syllabus-source-links">${meta.sources.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join('')}</div>${link('category/'+c.id,'进入这一领域 →','button outline small')}</div></details>`;}).join('')||`<div class="empty-state"><h3>没有匹配的课程</h3><p>试试「索引」「图」「迭代器」「语法」等关键词。</p></div>`;
}
function syllabus(){return `<div class="page-heading"><div class="eyebrow">THE BIG PICTURE, ONE TOPIC AT A TIME</div><h1>先看全貌，再深入每一个知识点<span class="heading-dot">.</span></h1><p>参考标准文档、官方手册和大学课程整理。展开领域，即可查看所有已收录单元。</p></div><div class="syllabus-stats"><span><strong>${CATEGORIES.length}</strong> 大领域</span><span><strong>${CATEGORIES.reduce((n,c)=>n+groupsFor(c.id).length,0)}</strong> 组主题</span><span><strong>${LESSONS.length}</strong> 个学习单元</span><span><strong>${allQuestions.length}</strong> 道原创练习</span></div><div class="curriculum-intro"><strong>覆盖主要知识体系，也说明学习深度</strong><p>每个单元都包含讲解、双语言示例与练习。高级结构和协议可能通过关键操作或简化模型讲解，具体边界在课内说明；“全景目录”不意味着穷尽所有 API 重载、研究分支或生产系统实现。</p></div><div class="catalog-tools"><label class="catalog-search">${icon('search',18)}<input id="syllabus-search" placeholder="搜索整个课程体系，例如 AVL、MVCC、SSA" aria-label="搜索全部课程"></label><button class="text-button" data-action="expand-domains">展开全部</button><button class="text-button" data-action="collapse-domains">收起全部</button></div><div id="syllabus-contents">${syllabusContents()}</div><p class="syllabus-footnote">大纲核对日期：2026-11-17 · C++ 示例以 C++17 为主，新特性单独标注 · MySQL 以 8.4 为语义基线。</p>`;}

function highlight(code){const re=/(\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:const|int|long|bool|void|return|for|while|if|else|class|struct|def|import|from|in|not|and|or|True|False|None|auto|std|try|catch|throw|raise|public|private|using|namespace|SELECT|FROM|WHERE|ORDER|BY|LEFT|JOIN|ON|GROUP|HAVING|UPDATE|SET|COMMIT|TRANSACTION|START)\b|\b\d+\b)/g;let out='',last=0;for(const m of code.matchAll(re)){out+=esc(code.slice(last,m.index));let cls=m[0].startsWith('//')||m[0].startsWith('#')?'comment':/^["']/.test(m[0])?'string':/^\d/.test(m[0])?'number':'keyword';out+=`<span class="syntax-${cls}">${esc(m[0])}</span>`;last=m.index+m[0].length;}return out+esc(code.slice(last));}
function codeBlock(cpp,python,sql='',id='',standard='C++17'){const key='code'+(++codeCounter);let lang=state.language==='python'?'python':'cpp';codeStore[key]={cpp,python,sql};return `<div class="code-block" data-code="${key}" ${id?`id="${id}"`:''}><div class="code-toolbar"><div class="code-tabs" role="tablist" aria-label="代码语言">${[['cpp',standard],['python','Python 3'],...(sql?[['sql','SQL']]:[])].map(([v,t])=>`<button role="tab" aria-selected="${lang===v}" data-action="language" data-lang="${v}" class="${lang===v?'selected':''}">${t}</button>`).join('')}</div><button class="copy-button" data-action="copy" aria-label="复制代码">${icon('copy',14)} 复制</button></div><pre tabindex="0"><code>${highlight(codeStore[key][lang])}</code></pre></div>`;}
function questionCard(q,index,mode='practice'){
 const exam=mode==='exam',answer=exam?state.exam.answers[q.id]:state.practice[q.id],submitted=exam&&state.exam.submitted;
 const locked=exam&&!submitted,canReveal=!exam||submitted;
 const checked=exam?submitted:state.practice[q.id+'_checked'];
 const draftKey=(exam?'exam:':'practice:')+q.id;
 return `<article class="question-card" data-question="${q.id}"><div class="question-meta"><span>练习 ${String(index+1).padStart(2,'0')}</span><span class="difficulty d${q.difficulty}">${['','基础理解','进阶推演','编程实践'][q.difficulty]}</span>${exam?`<span>${esc(q.title)}</span>`:''}</div><h3>${esc(q.prompt)}</h3>${q.type==='choice'?`<fieldset class="options" ${submitted?'disabled':''}><legend class="sr-only">选择你的答案</legend>${q.options.map((o,i)=>`<label class="option ${answer===i?'chosen':''} ${checked&&i===q.answer?'correct':''} ${checked&&answer===i&&i!==q.answer?'incorrect':''}"><input type="radio" name="${mode}-${q.id}" value="${i}" data-mode="${mode}" data-question="${q.id}" ${answer===i?'checked':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset>${!exam?`<button class="button small outline" data-action="check-answer" data-question="${q.id}">检查答案</button>`:''}${checked?`<p class="answer-status ${answer===q.answer?'good':'bad'}">${answer===q.answer?'✓ 回答正确':answer===undefined?'未作答':'再想一想'} · 正确答案 ${String.fromCharCode(65+q.answer)}</p>`:''}`:`<label class="draft-label">你的解题草稿 <span>在本地编辑器运行代码后，对照参考解答</span><textarea spellcheck="false" data-draft="${draftKey}" placeholder="先写思路，再写代码…">${esc(state.drafts[draftKey]||'')}</textarea></label>`}${canReveal?`<details class="answer-details"><summary><span>${icon('book',16)} 查看参考答案与解析</span>${icon('chevron',16)}</summary><div class="answer-body">${q.type==='choice'?`<strong>正确答案：${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><p>${q.explanation}</p>`:`<p>${q.explanation}</p>${codeBlock(q.cpp,q.python,q.sql,'',q.cppStandard)}<div class="self-rating"><span>对照后，我的完成情况：</span>${[['done','已独立完成'],['review','还需复习']].map(([v,t])=>`<button class="button small ${state.practice[q.id+'_rating']===v?'primary':'outline'}" data-action="rate" data-question="${q.id}" data-value="${v}">${t}</button>`).join('')}</div>`}</div></details>`:`<p class="locked-note">提交测评后可展开参考答案${q.type==='code'?'，编程题由你对照自评':''}。</p>`}</article>`;
}
function lessonPage(l){const c=byCat(l.cat),ls=units(l.cat),idx=ls.indexOf(l);return `<div class="small-breadcrumb">${link('home','学习地图')} ${icon('chevron',14)} ${link('category/'+l.cat,c.name)} ${icon('chevron',14)} <span>${l.title}</span></div><div class="reading-layout"><article class="lesson-article"><div class="eyebrow">${c.name} / ${l.group} / ${String(idx+1).padStart(2,'0')}</div><div class="lesson-title-line"><h1>${l.title}</h1><button class="icon-button favorite-button ${state.favorites.includes(l.id)?'saved':''}" data-action="favorite" data-id="${l.id}" aria-label="${state.favorites.includes(l.id)?'取消收藏':'收藏本节'}" aria-pressed="${state.favorites.includes(l.id)}">${icon('bookmark',22)}</button></div><p class="lesson-subtitle">${l.subtitle}</p><div class="lesson-info"><span>${icon('clock',15)} 约 ${l.minutes} 分钟</span><span>${icon('code',16)} 双语言实现</span><span>${icon('test',15)} 3 道分级练习</span></div><div class="learning-goal"><span>${icon('spark',20)}</span><div><strong>这一节，你会学到</strong><p>${l.concepts.map(x=>esc(x[0])).join('；')}。</p></div></div><section id="concepts"><div class="article-section-label">01 / UNDERSTAND</div><h2>先把概念想清楚</h2>${l.concepts.map(([h,p],i)=>`<div class="concept"><span class="concept-index">${i+1}</span><div><h3>${esc(h)}</h3><p>${esc(p)}</p></div></div>`).join('')}<aside class="pitfall"><strong>容易忽略的细节</strong><p>${esc(l.pitfall)}</p></aside></section><section id="implementation"><div class="article-section-label">02 / IMPLEMENT</div><h2>看懂代码，再亲手写一遍</h2><p class="section-intro">${l.codeKind==='simulation'?'本节用简化模型演示关键机制，具体假设与实现范围见讲解；完整系统还需要处理更多状态与边界。':l.cat==='sql'?'SQL 展示数据库操作；两个语言版本展示如何连接 MySQL 并执行。请先准备本节专用练习数据。':'两个版本实现同一思路。Python 使用对应语言的数据结构；代码版本与简化条件以本节说明为准。'}</p>${l.cat==='sql'&&l.codeKind!=='simulation'?`<details class="setup-details"><summary>运行前：准备 MySQL 练习数据库与连接器</summary><div><p>建议使用 MySQL 8.4，先执行下面的初始化 SQL。Python 安装 mysql-connector-python；C++ 安装 MySQL Connector/C++ 的 JDBC API 头文件及 mysqlcppconn 链接库。两种语言均从 MYSQL_PASSWORD 环境变量读取密码，请按本机配置调整连接地址和用户名。</p><pre><code>${esc(l.sqlSetup||SQL_SETUP)}</code></pre><p>INSERT IGNORE 不会重置已有数据；事务例子每运行一次都会修改余额。不要在业务数据库练习。这里没有连接在线数据库，也不会在网页内执行 SQL。</p></div></details>`:''}${codeBlock(l.cpp,l.python,l.sql,'',l.cppStandard)}<div class="output-box"><span>预期输出</span><pre>${esc(l.output)}</pre></div><div class="complexity"><strong>复杂度 / 执行成本</strong><p>${esc(l.complexity)}</p></div></section><section id="exercises"><div class="article-section-label">03 / PRACTICE</div><h2>把理解变成自己的答案 <span class="count-pill">03</span></h2><p class="section-intro">由易到难，先尝试再展开答案。选择题可检查结果，编程题对照双语言实现自评。</p>${allQuestions.filter(q=>q.lesson===l.id).map((q,i)=>questionCard(q,i)).join('')}</section><section class="references"><h3>继续阅读</h3>${(l.sources||REFERENCES[l.cat]||[]).map(([t,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${esc(t)} ↗</a>`).join('')}<p>本节讲解与练习为本站原创；以上链接用于进一步查阅语言或协议细节。</p></section><div class="lesson-finish"><div><strong>${state.done.includes(l.id)?'这一节，已经留下了你的足迹。':'完成一小步，知识向前一步。'}</strong><p>完成标记可随时取消，按自己的节奏学习。</p></div><button class="button ${state.done.includes(l.id)?'outline':'primary'}" data-action="complete" data-id="${l.id}">${icon('check',17)} ${state.done.includes(l.id)?'已完成 · 点击取消':'标记本节已完成'}</button></div><div class="prev-next">${idx>0?link('lesson/'+ls[idx-1].id,'← '+ls[idx-1].title):link('category/'+c.id,'← 返回课程目录')}${idx<ls.length-1?link('lesson/'+ls[idx+1].id,ls[idx+1].title+' →'):link('assessment','进入专项测评 →')}</div></article><aside class="reading-aside"><div class="panel sticky-panel"><span class="eyebrow">本领域学习路径</span><h3>${c.name}</h3><nav class="reading-unit-list">${ls.map((x,i)=>link('lesson/'+x.id,`<span class="tiny-status ${state.done.includes(x.id)?'done':''}">${state.done.includes(x.id)?'✓':i+1}</span>${x.title}`,`reading-nav ${x.id===l.id?'active':''}`)).join('')}</nav><hr><span class="side-label">本节导航</span><a class="toc-link" href="#concepts" data-anchor="concepts">01　理解概念</a><a class="toc-link" href="#implementation" data-anchor="implementation">02　双语言实现</a><a class="toc-link" href="#exercises" data-anchor="exercises">03　分级练习</a><div class="aside-progress"><span>领域进度</span><strong>${percent(c.id)}%</strong></div>${progress(percent(c.id))}</div></aside></div>`;}
function availableQuestions(){return allQuestions.filter(q=>assessmentUnits.has(q.lesson)&&(assessmentDifficulty==='all'||q.difficulty===Number(assessmentDifficulty)));}
function assessment(){const count=availableQuestions().length;return `<div class="page-heading"><div class="eyebrow">PRACTICE WITH PURPOSE</div><h1>让每一次练习，都有方向<span class="heading-dot">.</span></h1><p>选择知识范围，定制一份属于你的测评。</p></div>${state.exam?`<div class="resume-exam"><span>${icon('test',22)} ${state.exam.submitted?'上一次测评结果已保存':'你有一份尚未提交的测评'} · ${state.exam.questions.length} 道题</span>${link('exam',state.exam.submitted?'查看结果 →':'继续作答 →','button small outline')}</div>`:''}<div class="assessment-layout"><div><section class="panel selection-panel"><div class="section-head"><h2><span class="step-badge">1</span> 选择知识范围</h2><button class="text-button" data-action="select-all">${assessmentUnits.size===LESSONS.length?'取消全选':'选择全部'}</button></div><p class="muted">可按领域选择，也可展开后精确到某一个知识点。</p><div class="scope-list">${CATEGORIES.map(c=>`<details class="scope-group" ${assessmentCats.size===1&&assessmentCats.has(c.id)?'open':''}><summary><span>${catBadge(c)} <strong>${c.name}</strong><small>${units(c.id).filter(l=>assessmentUnits.has(l.id)).length} / ${units(c.id).length} 单元</small></span>${icon('chevron',16)}</summary><div class="scope-body"><label class="scope-all"><input type="checkbox" data-select-cat="${c.id}" ${units(c.id).every(l=>assessmentUnits.has(l.id))?'checked':''}> 选择本领域全部单元</label>${groupsFor(c.id).map(g=>`<div class="scope-chapter-label">${esc(g)}</div>${units(c.id).filter(l=>l.group===g).map(l=>`<label><input type="checkbox" data-select-unit="${l.id}" ${assessmentUnits.has(l.id)?'checked':''}> ${esc(l.title)}</label>`).join('')}`).join('')}</div></details>`).join('')}</div></section><section class="panel settings-panel"><h2><span class="step-badge">2</span> 设置练习方式</h2><div class="settings-grid"><label>题目数量<select id="question-count">${[3,5,10,20,30,50].map(n=>`<option value="${n}" ${assessmentCount===n?'selected':''}>${n} 道题</option>`).join('')}</select></label><label>难度范围<select id="question-difficulty">${[['all','混合难度 · 由易到难'],['1','基础理解'],['2','进阶推演'],['3','编程实践']].map(([v,t])=>`<option value="${v}" ${assessmentDifficulty===v?'selected':''}>${t}</option>`).join('')}</select></label></div></section></div><aside><section class="exam-summary panel"><div class="summary-symbol">${icon('test',34)}</div><span class="eyebrow">YOUR PRACTICE PLAN</span><h2>准备好，检验你的理解</h2><dl><div><dt>已选知识点</dt><dd id="selected-count">${assessmentUnits.size}</dd></div><div><dt>可用题目</dt><dd id="available-count">${count}</dd></div><div><dt>本次题量</dt><dd id="actual-count">${Math.min(count,assessmentCount)}</dd></div></dl><button id="generate-exam" class="button primary full" data-action="generate" ${count?'':'disabled'}>生成专项测评 ${icon('arrow',17)}</button><p>题目从本站原创题库中随机抽取，不重复。选择题自动评分，编程题对照答案自评；生成新测评会替换当前试卷。</p></section><p class="quiet-note">测评不是终点。找到还不熟悉的地方，就是下一次进步的起点。</p></aside></div>`;}
function exam(){if(!state.exam)return `<div class="empty-state"><h1>先选择你的测评范围</h1><p>一份有针对性的练习，从选择知识点开始。</p>${link('assessment','定制测评','button primary')}</div>`;const e=state.exam,qs=e.questions.map(getQuestion),choice=qs.filter(q=>q.type==='choice'),correct=choice.filter(q=>e.answers[q.id]===q.answer).length,answered=choice.filter(q=>e.answers[q.id]!==undefined).length;return `<div class="small-breadcrumb">${link('assessment','专项测评')} ${icon('chevron',14)} ${e.submitted?'测评结果':'正在作答'}</div><div class="page-heading"><div class="eyebrow">${e.submitted?'REFLECT & IMPROVE':'FOCUS ON ONE QUESTION AT A TIME'}</div><h1>${e.submitted?'练习完成，看看你的收获。':'专注思考，慢慢靠近答案。'}</h1><p>${qs.length} 道题 · ${choice.length} 道选择题 · ${qs.length-choice.length} 道编程题 <span class="muted"> / 草稿自动保存在本机</span></p></div>${e.submitted?`<section class="result-banner"><div class="result-score">${choice.length?Math.round(correct/choice.length*100):'—'}<small>${choice.length?'分':'自评'}</small></div><div><h2>${choice.length?'选择题答对 '+correct+' / '+choice.length+' 道':'本次为纯编程练习'}</h2><p>编程题不计入自动分数，请展开参考答案后自评。未作答的选择题按错误计分。</p><div class="result-links">${[...new Set(qs.filter(q=>q.type==='choice'&&e.answers[q.id]!==q.answer).map(q=>q.lesson))].map(id=>link('lesson/'+id,'复习 '+byId(id).title)).join('')}</div></div></section>`:`<div class="exam-progress"><span>选择题已作答 <strong id="answered-count">${answered}</strong> / ${choice.length}</span><span>${icon('clock',16)} 自定节奏，不限时</span></div>`}<div class="exam-paper">${qs.map((q,i)=>questionCard(q,i,'exam')).join('')}</div><div class="exam-bottom">${link('assessment','← 返回测评设置','button outline')}${!e.submitted?`<button class="button primary" data-action="submit-exam">提交测评 ${icon('arrow',17)}</button>`:link('assessment','再练一组 →','button primary')}</div>`;}
function favorites(){const ls=state.favorites.map(byId);return `<div class="page-heading"><div class="eyebrow">YOUR PERSONAL COLLECTION</div><h1>值得再读一遍的知识<span class="heading-dot">.</span></h1><p>在课程页点击书签，把想复习的内容留在这里。</p></div>${ls.length?`<div class="saved-grid">${ls.map(l=>`<div class="saved-card">${catBadge(byCat(l.cat))}<span class="eyebrow">${byCat(l.cat).name}</span><h2>${l.title}</h2><p>${l.subtitle}</p><div>${link('lesson/'+l.id,'继续学习 →','text-button')}<button class="icon-button saved" data-action="favorite" data-id="${l.id}" aria-label="取消收藏 ${l.title}">${icon('bookmark')}</button></div></div>`).join('')}</div>`:`<div class="empty-state">${icon('bookmark',40)}<h2>把好奇的知识点收藏起来</h2><p>你的第一份收藏，会从一次探索开始。</p>${link('home','探索学习地图','button primary')}</div>`}`;}
function progressPage(){return `<div class="page-heading"><div class="eyebrow">SMALL STEPS, REAL PROGRESS</div><h1>每一步，都算数<span class="heading-dot">.</span></h1><p>不必急着走完所有路，保持理解与实践的节奏。</p></div><div class="stat-grid"><div class="stat-card"><span>已完成单元</span><strong>${state.done.length}<small> / ${LESSONS.length}</small></strong></div><div class="stat-card"><span>整体学习进度</span><strong>${percent()}<small>%</small></strong></div><div class="stat-card"><span>已完成测评</span><strong>${state.history.length}<small> 次</small></strong></div><div class="stat-card"><span>收藏知识点</span><strong>${state.favorites.length}<small> 个</small></strong></div></div><div class="progress-layout"><section class="panel"><h2>领域进度</h2>${CATEGORIES.map(c=>`<a class="domain-progress" href="#/category/${c.id}">${catBadge(c)}<div><div><strong>${c.name}</strong><span>${units(c.id).filter(l=>state.done.includes(l.id)).length} / ${units(c.id).length}</span></div>${progress(percent(c.id))}</div>${icon('arrow',18)}</a>`).join('')}</section><section class="panel"><h2>测评足迹</h2>${state.history.length?state.history.slice().reverse().slice(0,10).map(h=>`<div class="history-row"><span class="history-icon">${icon('test',20)}</span><div><strong>${h.total} 道专项练习</strong><small>${new Date(h.date).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} · 选择题 ${h.correct}/${h.choices}</small></div><b>${h.choices?Math.round(h.correct/h.choices*100)+'分':'自评'}</b></div>`).join(''):`<div class="empty-state compact">${icon('chart',32)}<p>第一次练习，就会留下足迹。</p>${link('assessment','开始专项测评 →','text-button')}</div>`}<p class="quiet-note">完成标记由你自行确认，不代表已经通过考试。进度、收藏与草稿仅保存在当前浏览器，不跨设备同步。</p><button class="button small outline" data-action="export">导出学习记录</button><label class="button small outline import-label">导入记录<input type="file" accept="application/json,.json" id="import-progress" hidden></label></section></div>`;}
function render(keepScroll=false){const y=scrollY;codeStore={};codeCounter=0;const parts=(location.hash||'#/home').replace(/^#\/?/,'').split('/');let [page,id]=parts;let body,nav=page,breadcrumb='学习地图';
 if(page==='category'&&byCat(id)){body=category(byCat(id));nav=id;breadcrumb=byCat(id).name;}
 else if(page==='lesson'&&byId(id)){const l=byId(id);state.last=id;save();body=lessonPage(l);nav=l.cat;breadcrumb=byCat(l.cat).name+' / '+l.title;}
 else if(page==='syllabus'){body=syllabus();breadcrumb='课程总纲';}
 else if(page==='assessment'){body=assessment();breadcrumb='专项测评';}
 else if(page==='exam'){body=exam();nav='assessment';breadcrumb='专项测评 / 练习';}
 else if(page==='favorites'){body=favorites();breadcrumb='我的收藏';}
 else if(page==='progress'){body=progressPage();breadcrumb='学习进度';}
 else if(page==='home'||!page){body=home();nav='home';}
 else{body=`<div class="empty-state"><h1>这个知识点还没有收录</h1>${link('home','返回学习地图','button primary')}</div>`;}
 currentRoute=page;shell(body,nav,breadcrumb);document.title=breadcrumb+' · 知序';if(keepScroll)scrollTo(0,y);else scrollTo(0,0);
}
function renderSearch(value){const box=$('#search-results');if(!value.trim()){box.hidden=true;return;}let term=value.toLowerCase().trim();const ls=LESSONS.filter(l=>[l.title,l.subtitle,l.group,l.id,byCat(l.cat).name].join(' ').toLowerCase().includes(term)).sort((a,b)=>Number(b.title.toLowerCase().includes(term))-Number(a.title.toLowerCase().includes(term)));box.hidden=false;box.innerHTML=`<div class="search-heading">找到 ${ls.length} 个学习单元</div>${ls.map(l=>link('lesson/'+l.id,`<span>${icon(catIcon[l.cat],17)}</span><div><strong>${esc(l.title)}</strong><small>${byCat(l.cat).name} · ${l.group}</small></div>${icon('arrow',16)}`,'search-result')).join('')||'<p class="search-empty">换个关键词试试，例如「二分」或「TCP」。</p>'}`;}
function updateScope(){assessmentCats=new Set(LESSONS.filter(l=>assessmentUnits.has(l.id)).map(l=>l.cat));const count=availableQuestions().length;$('#selected-count').textContent=assessmentUnits.size;$('#available-count').textContent=count;$('#actual-count').textContent=Math.min(count,assessmentCount);$('#generate-exam').disabled=!count;document.querySelectorAll('[data-select-cat]').forEach(el=>{const ls=units(el.dataset.selectCat),n=ls.filter(l=>assessmentUnits.has(l.id)).length;el.checked=n===ls.length;el.indeterminate=n>0&&n<ls.length;el.closest('details').querySelector('summary small').textContent=`${n} / ${ls.length} 单元`;});document.querySelector('[data-action="select-all"]').textContent=assessmentUnits.size===LESSONS.length?'取消全选':'选择全部';}
function shuffled(items){let a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateExam(){let pool=availableQuestions(),n=Math.min(assessmentCount,pool.length),picked=[];if(!n)return; if(assessmentDifficulty==='all'&&n>=3){for(let d=1;d<=3;d++){const bucket=shuffled(pool.filter(q=>q.difficulty===d));if(bucket.length)picked.push(bucket[0]);}}picked.push(...shuffled(pool.filter(q=>!picked.some(x=>x.id===q.id))).slice(0,n-picked.length));picked.sort((a,b)=>a.difficulty-b.difficulty);state.exam={id:Date.now(),questions:picked.map(q=>q.id),answers:{},submitted:false};save();location.hash='#/exam';}
document.addEventListener('click',async e=>{const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor)?.scrollIntoView({behavior:'smooth'});return;}const el=e.target.closest('[data-action]');if(!el){if(!e.target.closest('.search-wrap'))$('#search-results')?.setAttribute('hidden','');return;}const a=el.dataset.action,id=el.dataset.id;
 if(a==='expand-chapters'||a==='collapse-chapters')document.querySelectorAll('.chapter-fold').forEach(d=>d.open=a==='expand-chapters');
 if(a==='expand-domains'||a==='collapse-domains')document.querySelectorAll('.syllabus-domain').forEach(d=>d.open=a==='expand-domains');
 if(a==='menu'){$('#sidebar').classList.toggle('mobile-open');}
 if(a==='filter'){filter=el.dataset.value;render(true);}
 if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render(true);toast(state.favorites.includes(id)?'已加入我的收藏':'已取消收藏');}
 if(a==='complete'){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render(true);toast(state.done.includes(id)?'已记录这一节的进步':'已取消完成标记');}
 if(a==='language'){const block=el.closest('.code-block'),data=codeStore[block.dataset.code],lang=el.dataset.lang;block.querySelectorAll('[role="tab"]').forEach(b=>{b.classList.toggle('selected',b===el);b.setAttribute('aria-selected',b===el);});block.querySelector('code').innerHTML=highlight(data[lang]);if(lang!=='sql'){state.language=lang;save();}}
 if(a==='copy'){const block=el.closest('.code-block'),lang=block.querySelector('[aria-selected="true"]').dataset.lang,text=codeStore[block.dataset.code][lang];try{await navigator.clipboard.writeText(text);toast('代码已复制');}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'代码已复制':'请手动选择代码复制');}}
 if(a==='check-answer'){const qid=el.dataset.question;if(state.practice[qid]===undefined){toast('请先选择一个答案');return;}state.practice[qid+'_checked']=true;save();const card=el.closest('.question-card');card.outerHTML=questionCard(getQuestion(qid),Number(qid.split(':')[1]));}
 if(a==='rate'){state.practice[el.dataset.question+'_rating']=el.dataset.value;save();el.closest('.self-rating').querySelectorAll('button').forEach(b=>{b.classList.toggle('primary',b===el);b.classList.toggle('outline',b!==el);});toast(el.dataset.value==='done'?'已记录：独立完成':'已记录：还需复习');}
 if(a==='category-exam'){assessmentCats=new Set([id]);assessmentUnits=new Set(units(id).map(l=>l.id));location.hash='#/assessment';}
 if(a==='select-all'){assessmentUnits=assessmentUnits.size===LESSONS.length?new Set():new Set(LESSONS.map(l=>l.id));document.querySelectorAll('[data-select-unit]').forEach(x=>x.checked=assessmentUnits.has(x.dataset.selectUnit));updateScope();}
 if(a==='generate')generateExam();
 if(a==='submit-exam'){const ex=state.exam;if(ex.submitted)return;ex.submitted=true;const qs=ex.questions.map(getQuestion),choice=qs.filter(q=>q.type==='choice');state.history.push({date:Date.now(),total:qs.length,choices:choice.length,correct:choice.filter(q=>ex.answers[q.id]===q.answer).length});save();render();toast('测评已提交，参考答案现在可以展开');}
 if(a==='export'){const blob=new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='知序-学习记录.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
});
document.addEventListener('input',e=>{if(e.target.id==='global-search')renderSearch(e.target.value);if(e.target.id==='catalog-search')$('#chapter-list').innerHTML=chapterList(byCat(e.target.dataset.cat),e.target.value);if(e.target.id==='syllabus-search')$('#syllabus-contents').innerHTML=syllabusContents(e.target.value);if(e.target.dataset.draft){state.drafts[e.target.dataset.draft]=e.target.value;save();}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.mode){const id=t.dataset.question,value=Number(t.value);if(t.dataset.mode==='exam'){state.exam.answers[id]=value;const qs=state.exam.questions.map(getQuestion).filter(q=>q.type==='choice');$('#answered-count').textContent=qs.filter(q=>state.exam.answers[q.id]!==undefined).length;}else{state.practice[id]=value;state.practice[id+'_checked']=false;}save();t.closest('.options').querySelectorAll('.option').forEach(x=>{x.classList.toggle('chosen',x.contains(t));x.classList.remove('correct','incorrect');});t.closest('.question-card').querySelector('.answer-status')?.remove();}
 if(t.dataset.selectCat){units(t.dataset.selectCat).forEach(l=>t.checked?assessmentUnits.add(l.id):assessmentUnits.delete(l.id));document.querySelectorAll('[data-select-unit]').forEach(x=>x.checked=assessmentUnits.has(x.dataset.selectUnit));updateScope();}
 if(t.dataset.selectUnit){t.checked?assessmentUnits.add(t.dataset.selectUnit):assessmentUnits.delete(t.dataset.selectUnit);updateScope();}
 if(t.id==='question-count'){assessmentCount=Number(t.value);updateScope();}
 if(t.id==='question-difficulty'){assessmentDifficulty=t.value;updateScope();}
 if(t.id==='import-progress'){try{const raw=JSON.parse(await t.files[0].text());if(raw.version!==1||!raw.state||!Array.isArray(raw.state.done)||!Array.isArray(raw.state.favorites))throw Error();const s=raw.state;state.done=[...new Set([...state.done,...s.done.filter(id=>byId(id))])];state.favorites=[...new Set([...state.favorites,...s.favorites.filter(id=>byId(id))])];for(const [k,v]of Object.entries(s.drafts||{})){if(typeof v==='string'&&v.length<=100000)state.drafts[k]=v;}if(Array.isArray(s.history))state.history=[...new Map([...state.history,...s.history.filter(h=>Number.isFinite(h.date)&&Number.isInteger(h.total)&&Number.isInteger(h.choices)&&Number.isInteger(h.correct)&&h.correct>=0&&h.correct<=h.choices&&h.choices<=h.total)].map(h=>[h.date,h])).values()];save();render(true);toast('已合并导入学习记录');}catch{toast('文件格式不正确，请选择本站导出的 JSON 记录');}}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#global-search')?.focus();}if(e.key==='Escape'){$('#search-results').hidden=true;$('#sidebar').classList.remove('mobile-open');}if(e.key==='Enter'&&e.target.id==='global-search')$('#search-results a')?.click();});
window.addEventListener('hashchange',()=>render());
render();

</script></body>
</html>
